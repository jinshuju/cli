      in: path
      required: true
      description: 对外查询 token（也接受 id）
      schema:
        type: string
    get:
      tags:
      - OpenSearch
      summary: 获取对外查询
      description: 返回对外查询详情，含查询字段规则与展示字段规则。只能读取调用者自己创建的查询，其他用户的查询返回 404（opensearch query cannot be found）。 OAuth 令牌需要 scope：forms。
      operationId: getOpensearchQuery
      responses:
        '200':
          description: 对外查询详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - OpenSearch
      summary: 更新对外查询
      description: 更新调用者自己创建的对外查询，也接受 PUT，只更新请求中出现的键。所属表单已被删除时返回 400。 字段规则校验与创建相同：引用了不可查询 / 不可展示的字段、规则为空数组、name 为空等均返回 400。 更新不再检查表单管理权限与对外查询套餐功能。 OAuth 令牌需要 scope：forms。
      operationId: updateOpensearchQuery
      requestBody:
        required: true
        content:
