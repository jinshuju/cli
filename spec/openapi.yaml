    SingleSelectInput:
      type: object
      title: SingleSelectInput
      description: SingleSelect question, stored as RadioButton; only when scene is exam / evaluation
      additionalProperties: false
      required:
      - type
      - label
      - choices
      - answers
      properties:
        type:
          const: SingleSelect
        label:
          type: string
          description: Field label
        cid:
          type: string
          description: Temporary id within this request, for formulas and the like to refer to
        notes:
          type: string
          description: Field notes
        private:
          type: boolean
          description: 'Hidden field: fillers do not see it, it is not checked for required, and an exam or evaluation does not score it'
        required:
          type: boolean
          description: Required
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        other_choice_required:
          type: boolean
          description: Choosing the "Other" choice requires the extra text
        choices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChoiceInput'
          description: Choices
        calculable:
          type: boolean
          description: Give each choice a numeric value; when on, every (leaf) choice must carry operand_value
        choices_layout:
          type: string
          description: How the choices are laid out
        random_choices:
          type: boolean
          description: Shuffle the choices each time the form opens
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnswerInput'
          description: Correct answers and their scores; for a choice question, value is the choice label
        answer_setting_mode:
          type: string
          enum:
          - absolute
          - relative
          description: Scoring mode; absolute by default (scores only when fully correct)
        answer_explanation:
          type: string
          description: Explanation of the answer
      allOf:
      - description: With calculable=true, every choice needs an operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
      - description: absolute mode takes a single answer
        if:
          anyOf:
          - not:
              required:
              - answer_setting_mode
          - properties:
              answer_setting_mode:
                const: absolute
        then:
          properties:
            answers:
              maxItems: 1
