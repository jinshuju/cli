      - field_label
      - has_data
      properties:
        field_api_code:
          type: string
          description: Field api_code
        field_label:
          type: string
          description: Field label
        has_data:
          type: boolean
          description: Whether the field (or that choice, when `choice_value` was passed) already has submitted entries
        choice_value:
          type: string
          description: The `choice_value` passed in the request; omitted when not passed
    FieldCheckUnavailable:
      type: object
      description: An item that cannot be checked / previewed
      required:
      - field_api_code
      - unavailable
      properties:
        field_api_code:
          type:
          - string
          - 'null'
          description: The `field_api_code` passed in the request
        unavailable:
          type: string
          description: Why it cannot be checked
          examples:
          - 'Field not found: field_9. Read the form''s fields to see the current ones.'
    FieldTypeChangePreviewResponse:
      type: object
      required:
      - form_token
      - results
      properties:
        form_token:
          type: string
          description: Form (or table) token
        results:
          type: array
          description: Preview results, one per item of `checks` in the request, in the same order
          items:
            oneOf:
            - $ref: '#/components/schemas/FieldTypeChangePreviewResult'
            - $ref: '#/components/schemas/FieldCheckUnavailable'
    FieldTypeChangePreviewResult:
      type: object
      required:
      - field_api_code
      - field_label
      - source_type
      - target_type
      - supported
      properties:
        field_api_code:
          type: string
          description: Field api_code
        field_label:
          type: string
          description: Field label
        source_type:
          type: string
          description: The field's current type
          examples:
          - TextField
        target_type:
          type: string
          description: Target type
          examples:
          - RadioButton
        supported:
          type: boolean
          description: Whether the conversion is supported. When `false`, the counts below are not returned and the actual edit is rejected too
        retained_count:
          type: integer
          description: Number of entries that keep their value after the conversion (returned when `supported=true`)
        cleared_count:
          type: integer
          description: Number of entries whose value is cleared by the conversion (returned when `supported=true`); 0 means the conversion is lossless
        choice_count:
          type: integer
          description: For a multi-line text to choice field conversion, the number of choices that will be generated from existing entries; not returned for other conversions
        choice_limit_exceeded:
          type: boolean
          description: For a multi-line text to choice field conversion, whether the number of generated choices exceeds the limit (the conversion is rejected when it does); not returned for other conversions
    ConditionTriggerableFieldListResponse:
      type: object
      required:
      - condition_triggerable_fields
      properties:
        condition_triggerable_fields:
          type: array
          items:
            $ref: '#/components/schemas/ConditionTriggerableField'
    ConditionTriggerableField:
      type: object
      description: A field a filter condition can name, and the operators it takes
      required:
      - trigger
      - label
      - type
      - scope_attr
      - operators
      properties:
        trigger:
          type: string
          description: The condition's `trigger`; a table column is `<table api_code>.<column api_code>`
          examples:
          - field_1
          - field_7.field_2
        label:
          type: string
          description: Field label; a table column's is `<table label> - <column label>`
        type:
          type: string
          description: Field type, named as `GET /field_types` names it
          examples:
          - GoodsField
        scope_attr:
          type:
          - string
          - 'null'
          description: The condition's `scope_attr`, left out when null. A reservation field is listed twice with the same `trigger`, for its items (null) and for its date (`date_time`)
        operators:
          type: array
          items:
            type: object
            required:
            - operator
            - value_format
            - value_description
            - examples
            properties:
              operator:
                type: string
                description: The condition's `operator`
              value_format:
                type: string
                description: Name of the shape `value` takes; operators with the same name take the same shape
                examples:
                - choices
                - goods_items
                - blank
              value_description:
                type: string
                description: What `value` holds
              examples:
                type: array
                description: Values to write as `value`, made of the field's own codes; `null` means leave `value` out, and an empty array means the field has nothing to build one from yet, such as no choices
                items: {}
    FieldTypeListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FieldTypeDescription'
    FieldTypeDescription:
      type: object
      required:
      - type
      - takes_choices
      - flags
      - settings
      properties:
        type:
          type: string
          description: Field type name, i.e. a value of `fields[].type`
          examples:
          - RadioButton
        base_type:
          type: string
          description: The base field type this type builds on (e.g. the exam question type `SingleSelect` builds on `RadioButton` and has the same capabilities); omitted when it equals `type`
          examples:
          - RadioButton
        scorable:
          type: boolean
          const: true
          description: "`true` for scored exam question types; omitted for other types"
        takes_choices:
          type: boolean
          description: Whether it takes `choices`
        flags:
          type: array
          description: Supported validation flags, i.e. the boolean keys usable in `fields[]`
          items:
            type: string
            enum:
            - required
            - unique
            - other_choice_required
        settings:
          type: array
          description: Setting keys specific to this type (set on `fields[]`)
          items:
            type: string
          examples:
          - - calculable
            - choices_layout
        setting_specs:
          type: object
          description: What each key of `settings` may hold, keyed by setting, as the JSON Schema the create request validates it against (the setting's schema in `<Type>Input`). An attachment's `media_type` also carries `x-groups`, the extensions of each preset group. Omitted when the type has no settings
          additionalProperties:
            type: object
          examples:
          - media_type:
              type: object
              x-groups:
                audio:
                - mp3
                - wav
              properties:
                type:
                  type: string
                  enum:
                  - unlimited
                  - audio
                  - custom
                value:
                  type: array
                  items:
                    type: string
        summary:
          type: string
          description: A short explanation of what this field is and how to write it. Omitted when `kind=table`
        field_example:
          type: object
          description: A complete example to put in `fields[]`. Returned only by `GET /field_types/{type}`; omitted when `kind=table`
        note:
          type: string
          description: What the example cannot show and is easy to get wrong. Returned only by `GET /field_types/{type}`; omitted when there is none
    EntryCountResponse:
      type: object
      required:
      - matched_entries
      properties:
        matched_entries:
          type: integer
          description: Number of entries matching the conditions
      examples:
      - matched_entries: 1284
    EntryAggregateColumn:
      type: object
      description: Describes a result column. Group columns come first (`kind` is `dimension`), metric columns after (`kind` is `metric`), in the order of the request.
      required:
      - kind
      - field
      - label
      properties:
        kind:
          type: string
          enum:
          - dimension
          - metric
        field:
          type: string
          description: Field api_code
        label:
          type: string
          description: Field label
        func:
          type: string
          description: Aggregate function (metric columns only)
        bucket:
          type: string
          enum:
          - day
          - week
          - month
          description: Date bucket granularity (columns grouped by date only)
    EntryAggregateResponse:
      type: object
      required:
      - columns
      - rows
      - matched_entries
      - row_count
      - truncated
      - tz
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/EntryAggregateColumn'
        rows:
          type: array
          description: |
            Each row's values match `columns` one to one.
            - Group columns: `{"api_code", "label"}` for choice fields, a string otherwise (for a date group, the identifier of that period); entries with that field empty form a group of their own, with the value `null`.
            - Metric columns: numbers; `min` / `max` of a date field are ISO 8601 times in Beijing time (UTC+8); `null` when there is no value.
          items:
            type: array
            items:
              type:
              - number
              - string
              - object
              - 'null'
              properties:
                api_code:
                  type: string
                label:
                  type: string
        matched_entries:
          type: integer
          description: Number of entries counted (entries matching the filters, not the number of groups)
        row_count:
          type: integer
          description: Total number of groups (1 when not grouped); may exceed the number of `rows`
        truncated:
          type: boolean
          description: The number of groups exceeds `limit`; `rows` holds only some of the groups
        tz:
          type: string
          description: Time zone used for date groups and time values
          examples:
          - Asia/Shanghai
      examples:
      - columns:
        - kind: dimension
          field: field_3
          label: 城市
        - kind: metric
          func: sum
          field: field_5
          label: 金额
        rows:
        - - api_code: bj
            label: 北京
          - 1520.5
        - -
          - 300
        matched_entries: 42
        row_count: 2
        truncated: false
        tz: Asia/Shanghai
    EntrySummaryBucket:
      type: object
      required:
      - api_code
      - label
      - count
      - ratio
      properties:
        api_code:
          type:
          - string
          - 'null'
          description: Choice api_code; null for fields grouped by value that have no matching choice (such as address, goods, NPS)
        label:
          type: string
          description: Choice label or group value
        count:
          type: integer
        ratio:
          type: number
          description: Share of the entries that answered the field (0 to 1, 4 decimal places)
    EntrySummaryField:
      type: object
      description: |
        Profile of one field. Every field has `api_code` / `label` / `kind` / `answered` / `null_count`; the other properties depend on `kind`:
        | kind | Properties |
        |---|---|
        | `choice` | `buckets` |
        | `matrix` | `series` |
        | `number` | `stats` |
        | `date` | `earliest` / `latest` |
        | `text` | `count_unique` |
        | `geo` | none |
      required:
      - api_code
      - label
      - kind
      - answered
      - null_count
      properties:
        api_code:
          type: string
        label:
          type: string
        kind:
          type: string
          enum:
          - choice
          - matrix
          - number
          - date
          - text
          - geo
        answered:
          type: integer
          description: Number of entries that filled in this field
        null_count:
          type: integer
          description: Number of entries that left this field empty
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/EntrySummaryBucket'
        series:
          type: array
          description: Distribution per question, for matrix fields
          items:
            type: object
            required:
            - api_code
            - label
            - answered
            - buckets
            properties:
              api_code:
                type: string
                description: Statement api_code
              label:
                type: string
              answered:
                type: integer
              buckets:
                type: array
                items:
                  $ref: '#/components/schemas/EntrySummaryBucket'
        stats:
          type: object
          description: Numeric statistics; an empty object when there are no entries
          properties:
            min:
              type: number
            max:
              type: number
            sum:
              type: number
            avg:
              type: number
        earliest:
          type:
          - string
          - 'null'
          format: date-time
          description: Earliest date value (ISO 8601, Beijing time, UTC+8)
        latest:
          type:
          - string
          - 'null'
          format: date-time
          description: Latest date value (ISO 8601, Beijing time, UTC+8)
        count_unique:
          type:
          - integer
          - 'null'
          description: Number of distinct values
    EntrySummaryResponse:
      type: object
      required:
      - fields
      - truncated
      - omitted_fields
      - tz
      properties:
        overview:
          type: object
          description: Overview; omitted when `include_overview=false`
          required:
          - matched_entries
          - today_entries
          properties:
            matched_entries:
              type: integer
              description: Number of entries matching the filters
            today_entries:
              type: integer
              description: How many of them were created today (Beijing time, UTC+8)
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EntrySummaryField'
        truncated:
          type: boolean
          description: More than 60 analysable fields; some fields are not returned
        omitted_fields:
          type: array
          description: api_codes of the fields left out by the 60-field cap
          items:
            type: string
        tz:
          type: string
          description: Time zone used for date values and for "today"
          examples:
          - Asia/Shanghai
      examples:
      - overview:
          matched_entries: 42
          today_entries: 3
        fields:
        - api_code: field_3
          label: 城市
          kind: choice
          answered: 40
          null_count: 2
          buckets:
          - api_code: bj
            label: 北京
            count: 25
            ratio: 0.625
          - api_code: sh
            label: 上海
            count: 15
            ratio: 0.375
        - api_code: field_5
          label: 金额
          kind: number
          answered: 42
          null_count: 0
          stats:
            min: 10
            max: 200
            sum: 1820.5
            avg: 43.35
        truncated: false
        omitted_fields: []
        tz: Asia/Shanghai
    EntryFormUnavailable:
      type: object
      description: A form that could not be counted / searched
      required:
      - form_token
      - unavailable
      properties:
        form_token:
          type: string
          description: The token from the request, or the form token
        unavailable:
          type: string
          description: Why it could not be counted / searched
    EntryCountBatchResponse:
      type: object
      required:
      - matched_entries
      - forms
      properties:
        matched_entries:
          type: integer
          description: Sum of the counts of the forms that could be counted
        forms:
          type: array
          description: One item per token, in the request's order (after deduplication)
          items:
            oneOf:
            - type: object
              required:
              - form_token
              - name
              - matched_entries
              properties:
                form_token:
                  type: string
                name:
                  type: string
                matched_entries:
                  type: integer
            - $ref: '#/components/schemas/EntryFormUnavailable'
      examples:
      - matched_entries: 130
        forms:
        - form_token: abc123
          name: 报名表
          matched_entries: 130
        - form_token: zzz999
          unavailable: Form not found or access denied — check the token, and note it may belong to a different account than the one this credential belongs to.
    EntrySearchResponse:
      type: object
      required:
      - total
      - forms
      properties:
        total:
          type: integer
          description: Total matches across the forms
        forms:
          type: array
          description: Forms with matches, and forms that could not be searched; forms without matches are not listed
          items:
            oneOf:
            - type: object
              required:
              - form_token
              - name
              - matched
              - serial_numbers
              - folder_token
              properties:
                form_token:
                  type: string
                name:
                  type: string
                matched:
                  type: integer
                  description: Number of matching entries
                serial_numbers:
                  type: array
                  description: Serial numbers of some matching entries, at most 50
                  items:
                    type: integer
                folder_token:
                  type:
                  - string
                  - 'null'
                  description: Token of the folder the current identity put this form in (for an account token, the account owner's); null when the form is not in a folder
            - $ref: '#/components/schemas/EntryFormUnavailable'
      examples:
      - total: 3
        forms:
        - form_token: abc123
          name: 报名表
          matched: 3
          serial_numbers:
          - 12
          - 57
          - 88
          folder_token:
    EntryStatsResponse:
      type: object
      required:
      - from
      - to
      - tz
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        tz:
          type: string
          examples:
          - Asia/Shanghai
        total:
          type: integer
          description: Total submissions across all forms in the range
        forms_with_data:
          type: integer
          description: Number of forms with submissions in the range
        count:
          type: integer
          description: Number of rows in `data`
        data:
          type: array
          description: Forms with submissions, most submissions first
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
          description: More forms have submissions than `limit`; `data` holds only the first `limit`
        buckets:
          type: array
          description: Present only when `by` is passed; one item per period in the range, oldest first
          items:
            $ref: '#/components/schemas/EntryStatsBucket'
      examples:
      - from: '2026-09-01'
        to: '2026-09-07'
        tz: Asia/Shanghai
        total: 210
        forms_with_data: 2
        count: 2
        data:
        - token: abc123
          name: 报名表
          kind: form
          fill_count: 180
        - token: def456
          name: 客户台账
          kind: table
          fill_count: 30
        truncated: false
    EntryStatsFormRow:
      type: object
      required:
      - token
      - name
      - kind
      - fill_count
      properties:
        token:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - form
          - table
        fill_count:
          type: integer
          description: Submissions in the period
    EntryStatsBucket:
      type: object
      description: Submission counts for one period, shaped like the overall statistics
      required:
      - from
      - to
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
          description: First day of the period, inclusive; the first period is clipped to the range
        to:
          type: string
          format: date
          description: Last day of the period, inclusive; the last period is clipped to the range
        total:
          type: integer
        forms_with_data:
          type: integer
        count:
          type: integer
        data:
          type: array
          description: Forms with submissions in this period, most submissions first, at most `limit` rows
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
    FieldAnalytics:
      type: object
      description: Statistics the field supports; present on analysable fields only when `include_analytics=true`
      required:
      - agg_funcs
      - summary_kind
      - groupable
      - buckets
      - default_agg
      - summarisable
      properties:
        agg_funcs:
          type: array
          description: Functions the aggregate endpoint's `metrics` can apply to this field
          items:
            type: string
        summary_kind:
          type: string
          description: This field's `kind` in the data summary
          enum:
          - choice
          - matrix
          - number
          - date
          - text
          - geo
        groupable:
          type: boolean
          description: Whether it can be used in the aggregate endpoint's `dimensions`
        buckets:
          type: array
          description: The `bucket` values usable when grouping by this field (non-empty for date fields only)
          items:
            type: string
            enum:
            - day
            - week
            - month
        default_agg:
          type: string
          description: Suggested default aggregate function (`sum` for numbers, `count` otherwise)
        summarisable:
          type: boolean
          description: Whether the data summary includes this field
    MyFilledForm:
      type: object
      required:
      - token
      - name
      - description
      - kind
      - scene
      - submitted_entries_count
      - last_submitted_at
      properties:
        token:
          type: string
          description: Form token
        name:
          type: string
          description: Form name (the public name)
        description:
          type:
          - string
          - 'null'
          description: Form description (may be HTML rich text)
        kind:
          type: string
          description: Form kind, `form` or `table`
          examples:
          - form
        scene:
          type:
          - string
          - 'null'
          description: Form scene
        submitted_entries_count:
          type: integer
          description: Number of entries the current user submitted to this form
        last_submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the current user last submitted (UTC)
    MyFilledFormListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: Total number of forms filled in
        count:
          type: integer
          description: Number of items on this page
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyFilledForm'
        next:
          type:
          - integer
          - 'null'
          description: Row offset of the next page; null on the last page
    MySubmittedEntryListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: Total number of the current user's own entries matching the conditions
        count:
          type: integer
          description: Number of items on this page
        data:
          type: array
          description: Entries the current user submitted, with only the fields the form shows to submitters; see `EntryData` for value shapes
          items:
            $ref: '#/components/schemas/EntryData'
        next:
          type:
          - integer
          - 'null'
          description: Row offset of the next page; null on the last page
    FillPage:
      type: object
      required:
      - kind
      - token
      - title
      - fill_url
      - status
      - blockers
      - fields
      properties:
        kind:
          type: string
          enum:
          - form
          - form_view
          description: "`form` for a `/f/` link, `form_view` for a `/v/` link (a form view of a table)"
        token:
          type: string
          description: The token in the link
        title:
          type: string
          description: Fill page title; the view title for a form view
        description:
          type:
          - string
          - 'null'
        fill_url:
          type: string
          description: Fill page URL
        status:
          type: object
          required:
          - key
          properties:
            key:
              type: string
              description: "`open` means the current user can submit; any other value says why not, explained in `message`"
            message:
              type:
              - string
              - 'null'
              description: Message to show the user when they cannot submit
            open_info:
              type: array
              description: Opening times, when the page is not open yet or closed by schedule
              items:
                type: string
        blockers:
          type: array
          description: Requirements only the submitter can complete on the page; when not empty, the page can only be filled in a browser
          items:
            type: object
            required:
            - key
            - message
            properties:
              key:
                type: string
                enum:
                - captcha
                - sms_verification
                - weixin
                - ip_or_device_limit
                - region_limit
                - payment
                - portal
                - exam
                - required_attachment
              message:
                type: string
        fields:
          type: array
          description: Fields on the fill page, in fill order; for a form view, labels, descriptions and required flags follow the view
          items:
            $ref: '#/components/schemas/FieldMap'
        manageable:
          type: object
          description: Returned only when the current user can already read the form or table behind the page
          properties:
            kind:
              type: string
              enum:
              - form
              - table
            token:
              type: string
            name:
              type: string
    FillEntryRequest:
      type: object
      required:
      - entry
      properties:
        entry:
          type: object
          description: Map of field api_code to value, values written as when creating entries; fields not visible on the fill page are ignored
        password:
          type: string
          description: The password the submitter provides when the fill page has an access password
    FillEntryCreated:
      type: object
      required:
      - serial_number
      properties:
        serial_number:
          type: integer
          description: Entry serial number
        entry_token:
          type: string
        created_at:
          type: string
          format: date-time
    MySearchFormResult:
      type: object
      required:
      - form_token
      properties:
        form_token:
          type: string
          description: Form token
        name:
          type:
          - string
          - 'null'
          description: Form name; omitted when `unavailable`
        matched:
          type: integer
          description: Number of the current user's own entries in this form that match; omitted when `unavailable`
        serial_numbers:
          type: array
          maxItems: 50
          description: Serial numbers of matching entries, at most 50; omitted when `unavailable`
          items:
            type: integer
        unavailable:
          type: string
          description: Why this form cannot be searched; when present, `name` / `matched` / `serial_numbers` are absent
    MySearchResponse:
      type: object
      required:
      - total
      - forms
      properties:
        total:
          type: integer
          description: Total matches across all forms
        forms:
          type: array
          description: Forms with matches or that cannot be searched; forms without matches are left out
          items:
            $ref: '#/components/schemas/MySearchFormResult'
    TableFolderMoveResult:
      type: object
      required:
      - table_token
      - folder_token
      properties:
        table_token:
          type: string
        folder_token:
          type:
          - string
          - 'null'
          description: Token of the folder it is in after the move; null when moved out of folders
    FormTransactions:
      type: object
      description: |
        Payment statistics, grouped by transaction status (present when `include_transactions=true` and the form is bound to a payment account). Only the `paid` group exists for now:
        entries whose transaction status is paid or refunding, summed by order total (refunds not deducted); refunded and partially refunded entries are not counted. This is not a net income report.
        An amount of 0 does not mean the form is not a payment form.
      required:
      - paid
      properties:
        paid:
          type: object
          required:
          - amount
          - count
          properties:
            amount:
              type: number
              description: Sum of the order totals of this group's entries, in yuan (CNY)
            count:
              type: integer
              description: Number of entries in this group
    FormDetail:
      description: Form structure, plus what the `include_*` parameters add
      allOf:
      - $ref: '#/components/schemas/Form'
      - type: object
        required:
        - folder_token
        - billing_account_id
        properties:
          folder_token:
            type:
            - string
            - 'null'
            description: Token of the folder the current identity put this form in (for an account token, the account owner's); null when the form is not in a folder
          billing_account_id:
            type: string
            description: ID of the account the form belongs to, as `id` in `GET /billing_account`; a form shared from another account carries that account's
          theme:
            type: object
            description: Form theme (present when `include_theme=true`); same shape as `FormTheme`, but without `form_token`. An empty object when the form has no theme
            additionalProperties: true
          field_rules:
            type: array
            description: Field display rules (present when `include_field_rules=true`), same as `data` of `GET /forms/{form_token}/field_rules`
            items:
              $ref: '#/components/schemas/FieldRule'
          extended_attributes:
            type: array
            description: Source-tracking links (present when `include_extended_attributes=true`), same as `data` of `GET /forms/{form_token}/extended_attributes`
            items:
              $ref: '#/components/schemas/ExtendedAttribute'
          transactions:
            $ref: '#/components/schemas/FormTransactions'
    FormViewFillItem:
      type: object
      description: One fill item on a form view's fill page (effective values)
      required:
      - api_code
      - label
      - notes
      - required
      properties:
        api_code:
          type: string
          description: The column's api_code
        label:
          type:
          - string
          - 'null'
          description: Label shown on the fill page (the column label unless set separately)
        notes:
          type:
          - string
          - 'null'
          description: Notes shown on the fill page (the column notes unless set separately)
        required:
          type: boolean
          description: Whether it is required
    FormViewFieldOverrideInput:
      type: object
      description: Configuration of one fill item of a form view
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: The column's api_code; the column must exist and be usable as a fill item, and cannot repeat within one request
        label:
          type:
          - string
          - 'null'
          description: Label on the fill page; falls back to the column label when empty
        notes:
          type:
          - string
          - 'null'
          description: Notes on the fill page; falls back to the column notes when empty
        private:
          type:
          - boolean
          - 'null'
          description: When true, hidden from the fill page; when not passed, follows the column's own setting
        position:
          type:
          - integer
          - 'null'
          description: Position on the fill page; when not passed, the array order
        validations:
          type: array
          description: Validations of this fill item; currently `presence` marks it required. Each must be a validation the column type supports (e.g. yes/no and formula columns cannot be made required); otherwise returns 422
          items:
            type: string
            examples:
            - presence
      additionalProperties: false
    EntryImportInput:
      type: object
      description: Request body of POST /forms/{form_token}/entry_imports
      required:
      - attachment_id
      - columns
      properties:
        attachment_id:
          type: string
          description: The import attachment `id` returned by "Upload an import file" for this form
        columns:
