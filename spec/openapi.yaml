      - $ref: '#/components/parameters/TradeEndDate'
      - $ref: '#/components/parameters/TradePaidStatus'
      - $ref: '#/components/parameters/TradePaymentChannel'
      - $ref: '#/components/parameters/TradeFormToken'
      - name: order_no
        in: query
        required: false
        description: Exact lookup by order number, matching one of the transaction number (`trade_no`), the merchant order number (`merchant_out_trade_no`) or the Jinshuju order number (`out_trade_no`). Without dates, there is no time limit.
        schema:
          type: string
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      - $ref: '#/components/parameters/TradePage'
      responses:
        '200':
          description: Payment orders
          content:
            application/json:
              schema:
