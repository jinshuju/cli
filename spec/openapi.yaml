          enum:
          - choice
          - matrix
          - number
          - date
          - text
          - geo
        answered:
          type: integer
          description: 已填写该字段的数据条数
        null_count:
          type: integer
          description: 未填写该字段的数据条数
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/EntrySummaryBucket'
        series:
          type: array
          description: 矩阵类字段按题目给出的分布
          items:
            type: object
            required:
            - api_code
            - label
            - answered
            - buckets
            properties:
              api_code:
                type: string
                description: 题目 api_code
              label:
                type: string
              answered:
                type: integer
              buckets:
                type: array
                items:
                  $ref: '#/components/schemas/EntrySummaryBucket'
        stats:
          type: object
          description: 数值统计；没有数据时为空对象
          properties:
            min:
              type: number
            max:
              type: number
            sum:
              type: number
            avg:
              type: number
        earliest:
          type:
          - string
          - 'null'
          format: date-time
          description: 最早的日期值（北京时间 ISO 8601）
        latest:
          type:
          - string
          - 'null'
          format: date-time
          description: 最晚的日期值（北京时间 ISO 8601）
        count_unique:
          type:
          - integer
          - 'null'
          description: 不同取值的个数
    EntrySummaryResponse:
      type: object
      required:
      - fields
      - truncated
      - omitted_fields
      - tz
      properties:
        overview:
          type: object
          description: 总览；`include_overview=false` 时不返回
          required:
          - matched_entries
          - today_entries
          properties:
            matched_entries:
              type: integer
              description: 满足筛选条件的数据条数
            today_entries:
              type: integer
              description: 其中今天（北京时间）创建的数据条数
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EntrySummaryField'
        truncated:
          type: boolean
          description: 可分析字段超过 60 个，部分字段未返回
        omitted_fields:
          type: array
          description: 因超过 60 个上限而未返回的字段 api_code
          items:
            type: string
        tz:
          type: string
          description: 日期值与「今天」使用的时区
          examples:
          - Asia/Shanghai
      examples:
      - overview:
          matched_entries: 42
          today_entries: 3
        fields:
        - api_code: field_3
          label: 城市
          kind: choice
          answered: 40
          null_count: 2
          buckets:
          - api_code: bj
            label: 北京
            count: 25
            ratio: 0.625
          - api_code: sh
            label: 上海
            count: 15
            ratio: 0.375
        - api_code: field_5
          label: 金额
          kind: number
          answered: 42
          null_count: 0
          stats:
            min: 10
            max: 200
            sum: 1820.5
            avg: 43.35
        truncated: false
        omitted_fields: []
        tz: Asia/Shanghai
    EntryFormUnavailable:
      type: object
      description: 未能统计 / 搜索的表单
