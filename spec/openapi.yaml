      if:
        properties:
          time_range_mode:
            const: different_by_wday
        required:
        - time_range_mode
      then:
        properties:
          daily_time_range_quotas:
            items:
              required:
              - for_wday
    WidgetImageInput:
      type: object
      title: WidgetImageInput
      additionalProperties: false
      anyOf:
      - required:
        - image_url
      - required:
        - image_base64
      - required:
        - image_upload_token
      properties:
        image_url:
          type: string
          format: uri
        image_base64:
          type: string
        image_upload_token:
          type: string
    FormCreateConstraints:
      title: FormCreateConstraints
      description: Constraints between fields and scene / layout when creating a form
      allOf:
      - description: The card layout cannot hold field types the paged layout cannot render
        if:
          properties:
            layout:
              const: card
          required:
          - layout
        then:
          properties:
            fields:
              items:
                properties:
                  type:
                    not:
                      enum:
                      - PageBreak
                      - MultipleBlanksField
                      - WidgetContact
                      - WidgetVideo
                      - WidgetButton
      - description: SingleSelect / MultiSelect / ImageSingleSelect / ImageMultiSelect / DropDownSelect can only be used when scene is exam / evaluation
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - SingleSelect
                    - MultiSelect
                    - ImageSingleSelect
                    - ImageMultiSelect
                    - DropDownSelect
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - exam
              - evaluation
          required:
          - scene
      - description: TrueOrFalse / FillInBlank / ShortAnswer / FillInNumber can only be used when scene is exam
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - TrueOrFalse
                    - FillInBlank
                    - ShortAnswer
                    - FillInNumber
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - exam
          required:
          - scene
      - description: Rating / Nps can only be used when scene is evaluation
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - Rating
                    - Nps
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - evaluation
          required:
          - scene
    WidgetButtonItemInput:
