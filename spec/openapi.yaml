          required:
          - settleable_amount
          - unsettled_amount
          properties:
            settleable_amount:
              type:
              - number
              - 'null'
              description: Amount available for payout, in yuan (CNY)
            unsettled_amount:
              type:
              - number
              - 'null'
              description: Amount awaiting settlement, in yuan (CNY)
        settlement:
          type:
          - object
          - 'null'
          description: Settlement details; null when there is no 小金商户
          required:
          - fee_rate
          - method
          - bank_name
          - bank_account_name
          - bank_card_no
          - latest_settleable_date
          properties:
            fee_rate:
              type: number
              description: Fee rate as a percentage (1.49 means 1.49%)
            method:
              type: string
              description: Settlement method, e.g. `D+1 自助结算`
            bank_name:
              type:
              - string
              - 'null'
              description: Settlement bank
            bank_account_name:
              type:
              - string
              - 'null'
              description: Settlement account name (the entity name)
            bank_card_no:
              type:
              - string
              - 'null'
              description: Settlement bank card number (masked)
            latest_settleable_date:
              type:
              - string
              - 'null'
              format: date
              description: Latest settlement date a payout can cover now
        channels:
          type: array
          description: Payment channels the merchant has, and their authorization; an empty array when there is no 小金商户
          items:
            type: object
            required:
            - channel
            - authorized
            - authorize_state
            - channel_merchant_no
            properties:
              channel:
                type:
                - string
                - 'null'
                enum:
                - wxpay
                - alipay
                -
                description: Payment channel
              authorized:
                type: boolean
                description: Whether the channel is authorized; an unauthorized WeChat channel cannot receive WeChat Pay payments
              authorize_state:
                type:
                - string
                - 'null'
                enum:
                - AUTHORIZE_STATE_UNAUTHORIZED
                - AUTHORIZE_STATE_AUTHORIZED
                - CLOSED
                - SMID_NOT_EXIST
                -
                description: Channel authorization state code
              channel_merchant_no:
                type:
                - string
                - 'null'
                description: Merchant number on the channel
        freeze:
          type:
          - object
          - 'null'
          description: Freeze state; null when there is no 小金商户
          required:
          - pay_frozen
          - pay_frozen_reason
          - payout_frozen
          - payout_frozen_reason
          - yeepay_status
          - yeepay_status_reasons
          properties:
            pay_frozen:
              type: boolean
              description: Whether payment collection is frozen
            pay_frozen_reason:
              type:
              - string
              - 'null'
              description: Explanation of the payment collection freeze / unfreeze
            payout_frozen:
              type: boolean
              description: Whether payouts are frozen
            payout_frozen_reason:
              type:
              - string
              - 'null'
              description: Explanation of the payout freeze / unfreeze
            yeepay_status:
              type:
              - string
              - 'null'
              enum:
              - ACTIVE
              - FROZEN
              - OPERATION_EXCEPTION
              -
              description: 'Merchant status at the payment provider: ACTIVE (normal), FROZEN (frozen), OPERATION_EXCEPTION (abnormal operation)'
            yeepay_status_reasons:
              type: array
              description: Status reason codes from the payment provider (e.g. `SILENT_MERCHANT`, dormant merchant)
              items:
                type: string
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the onboarding application was submitted; null when there is no application
        merchant_stage:
          type: string
          enum:
          - no_application
          - processing
          - rejected
          - pay_frozen
          - silent
          - approved_no_form
          - has_form_no_income
          - payout_frozen
          - receiving
          description: |
            Onboarding progress: `no_application` not applied yet; `processing` application submitted and under review (merchant not activated yet); `rejected` application rejected (see `rejected_reason`);
            `pay_frozen` payment collection frozen; `silent` flagged by the payment provider as a dormant merchant with abnormal operation, cannot collect payments until unfrozen; `approved_no_form` merchant activated but no payment form bound yet;
            `has_form_no_income` payment form bound but no successful payment yet; `payout_frozen` can collect payments but payouts are frozen; `receiving` collecting payments normally.
        payment_form_tokens:
          type: array
          description: Tokens of the payment forms bound to this merchant that the current identity can access (quick payment forms included)
          items:
            type: string
        transactions_amount:
          type: number
          description: 'Lifetime transaction amount, in yuan (CNY): the amount of paid-type orders over all time minus successful refunds. For totals by date range or by group, use `GET /trade/transactions/aggregate`'
        rejected_reason:
          type:
          - string
          - 'null'
          description: Why the onboarding application was rejected; set only when `merchant_stage` is `rejected`
        guidance:
          type: object
