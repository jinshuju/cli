        closed:
          type: boolean
          description: Whether collection has been closed manually
    FormManuallyCloseRuleInput:
      type: object
      required:
      - open
      properties:
        open:
          description: true opens collection, false closes it; accepts a boolean or the string "true" / "false"
          oneOf:
          - type: boolean
          - type: string
            enum:
            - 'true'
            - 'false'
      additionalProperties: false
    FormFillFrequency:
      type: object
      description: Fill frequency limit (read)
      required:
      - fill_type
      - condition
      - cycle_period
      - cycles_per_period
      - limited_time
      - limited_field_api_codes
      properties:
        fill_type:
          type: string
          description: Limit type; may be an empty string on legacy data
          enum:
          - unlimited
          - once
          - repeatable
          - repeatable_by_day
          - custom_repeatable
          - ''
        condition:
          type: string
          description: What identifies the same submitter; an empty string when there is no limit. When unset, the server goes by the signed-in user
          enum:
          - by_weixin
          - by_ip
          - by_device
          - by_fields
          - ''
        cycle_period:
          type: string
          description: Period unit; set only for repeatable / custom_repeatable, otherwise an empty string
          enum:
          - every_hour
          - every_day
          - every_week
          - every_month
          - ''
        cycles_per_period:
          type: integer
          description: Every N periods (takes effect only for custom_repeatable, 1 to 1000)
        limited_time:
          type:
          - integer
          - 'null'
          description: Fills allowed per period
        limited_field_api_codes:
          type: array
          description: Fields that identify the submitter when condition is by_fields
          items:
            type: string
    FormFillFrequencyInput:
      type: object
      description: Fill frequency limit (write)
      properties:
        fill_type:
          type: string
          enum:
          - unlimited
          - once
          - repeatable
          - repeatable_by_day
          - custom_repeatable
          description: Limit type; custom_repeatable is a paid feature
        condition:
          type: string
          enum:
          - by_weixin
          - by_ip
          - by_device
          - by_fields
          description: What identifies the same submitter; by_fields is a paid feature. Cleared when fill_type is unlimited. With by_weixin only submissions made in WeChat are accepted, and a form that collects no WeChat info starts collecting the submitter's openid through Jinshuju's official account; changing condition later does not stop that
        cycle_period:
          type: string
          enum:
          - every_hour
          - every_day
          - every_week
          - every_month
          description: Period unit; kept only for repeatable / custom_repeatable
        cycles_per_period:
          type: integer
          minimum: 1
          maximum: 1000
          description: Every N periods; kept only for custom_repeatable, reset to 1 for the other types
        limited_time:
          type: integer
          minimum: 1
          description: Fills allowed per period; must be greater than 0 for repeatable / custom_repeatable
        limited_field_api_codes:
          type: array
          description: Required and cannot be empty when condition is by_fields
          items:
            type: string
      additionalProperties: false
    FormSetting:
