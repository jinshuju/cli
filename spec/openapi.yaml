    ReservationByTimeRangeQuotaInput:
      type: object
      title: ReservationByTimeRangeQuotaInput
      additionalProperties: false
      required:
      - type
      properties:
        type:
          const: by_time_range_repeat_daily
        available_days_of_week:
          type: array
          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: Days of the week that can be booked, as lowercase English day names
        show_left_quota:
          type: boolean
          description: Show the places left
        start_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking opens
        end_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking closes
        daily_time_range_quotas:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - start_time
            - end_time
            properties:
              for_wday:
                type: string
                enum:
                - sunday
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
                description: Day of the week, as a lowercase English day name
              quota:
                type: integer
                minimum: 0
                description: Places
              price:
                type: number
                minimum: 0
                description: Price when payable
              position:
                type: integer
                minimum: 0
              daily_time_range_token:
                type: string
              start_time:
                type: object
                additionalProperties: false
                properties:
                  hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minute:
                    type: integer
                    minimum: 0
                    maximum: 59
                description: Start time
              end_time:
                type: object
                additionalProperties: false
                properties:
                  hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minute:
                    type: integer
                    minimum: 0
                    maximum: 59
                description: End time
          description: Places per time slot
        non_reservable_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              start_time:
                type: string
              end_time:
                type: string
