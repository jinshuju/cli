  "/forms/{form_token}/entries/batch":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    post:
      tags:
      - Entries
      summary: Create entries in batch
      operationId: createEntriesBatch
      description: |
        Submits up to 200 entries at a time. Each entry is validated on its own; valid ones are written in bulk, invalid ones are recorded in `errors` (`index` is the position in the request array).
        Returns 201 when at least one succeeds and 422 when all fail; returns 400 when `entries` is empty or has over 200 entries.
        Before writing, the entry count limit is checked against the number of entries submitted; over the limit returns 403. A batch write does not trigger the callbacks of a single create, but creates one "import" activity record and backfills calculated fields.

        OAuth scope: write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entries
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/EntryInput'
              additionalProperties: false
      responses:
        '201':
          description: At least one entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: The form's entry count has reached its limit, or the OAuth scope is insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: All entries failed to be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - Entries
      summary: Update entries in batch
      operationId: patchEntriesBatch
      description: |
        Partially updates entries in batch by serial number, up to 200 rows at a time. Each row requires `serial_number`; `entry` holds the fields to change (fields not mentioned stay unchanged).
        Each row is validated on its own; failed rows are recorded in `failed_rows` (`reason` is `invalid_serial_number` / `invalid_attributes`, etc.).
        Returns 200 when at least one row succeeds and 422 when all fail; returns 400 when `entries` is empty or has over 200 rows.
        Batch update does not handle the attachment lifecycle, so it **cannot write attachment fields** (including attachment columns inside table fields); update those one entry at a time.

        OAuth scope: write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entries
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                    - serial_number
                    - entry
                    properties:
                      serial_number:
                        type: integer
                        description: Serial number of the entry to update
                      entry:
                        $ref: '#/components/schemas/EntryInput'
                    additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: At least one row updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: All rows failed to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPatchResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries/{serial_number}":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    - $ref: '#/components/parameters/SerialNumber'
    get:
      tags:
      - Entries
      summary: Show an entry
      operationId: getEntry
      description: |
        Returns one entry by serial number. `fields` limits the fields returned.

        OAuth scope: read_entries
      parameters:
      - $ref: '#/components/parameters/EntriesFields'
