      required:
      - errors
      - status_code
      properties:
        errors:
          description: Freeze reason; an array of strings when the form is frozen, a string when the creator's account is disabled
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        status_code:
          type: string
          enum:
          - form_forbidden
    ManuallyCloseRule:
      type: object
