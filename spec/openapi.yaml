        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormManuallyCloseRuleInput'
      responses:
        '200':
          description: 更新后的手动关闭规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManuallyCloseRule'
        '400':
          $ref: '#/components/responses/FormSettingBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
