  "/artifacts/{artifact_id}/published_artifact":
    parameters:
    - name: artifact_id
      in: path
      required: true
      description: Artifact id from the list (its latest version), artifact version id or token, or the URL-encoded artifact address from Jinshuju (`.../artifacts/{token}`)
      schema:
        type: string
    get:
      tags:
      - Artifacts
      summary: Show how an artifact is shared
      operationId: getPublishedArtifact
      description: |
        Returns the artifact's share link and who can open it; the first call creates the link, open to its owner only. Only an HTML artifact has a share link; other files can only be downloaded (`download_url` in the list).
        OAuth scope: artifacts
      responses:
        '200':
          description: The share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifact'
        '400':
          description: An account access token has no user to share for
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The current plan does not include API v1, or has no online links for artifacts (`paid_plan_required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The artifact does not exist or is not the current user's in the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '422':
          description: The artifact is not HTML (`not_html`), its file is gone, or the version is banned (`version_banned`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - Artifacts
      summary: Change who can open an artifact's share link
      operationId: updatePublishedArtifact
      description: |
        Sets who can open the share link and which version it shows.
        OAuth scope: artifacts
        - `version_id` is required unless `allowed_audience` is `private`; without it the request is refused (`version_required`) and nothing is published
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishedArtifactInput'
      responses:
        '200':
          description: The share after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifact'
        '400':
          description: The body is invalid, `version_id` is missing while `allowed_audience` is not `private` (`version_required`), or an account access token has no user to share for
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The current plan does not include API v1, has no online links for artifacts (`paid_plan_required`; only setting `allowed_audience` to `private` goes through), or `internal` needs a plan with members-only sharing (`internal_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '403':
          description: Sharing beyond `private` is not open to this account, or the OAuth token lacks its scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '404':
          description: The artifact or `version_id` does not exist, or is not the current user's in the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '422':
          description: The version is not HTML (`not_html`), its file is gone, or it is banned (`version_banned`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArtifactError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/template_usages":
    post:
      tags:
      - Templates
      summary: Create a form from a template
      operationId: createTemplateUsage
      description: |
        Uses a template from the template market as the current user, copies it into a new form, and returns the new form's token and edit page URL.
        OAuth scope: forms
        The template is given by `id` (or `template_id`), which takes a template token or a 24-character hexadecimal ID. Optional parameters: `tags` (tags, an array or a comma-separated string), `tag_id` / `folder_id` (the tag / folder the new form goes into), `scene` (target scene; falls back to form when the template has fields the scene does not allow), `frm` (source marker; affects the recorded created_from), `create_source`, `group_id`.
        Payment-related branches:
        - Paid template the current user has not bought: returns 200 with the body `{ template_url }` (the template purchase page URL), and no form is created.
        - Template uses paid features the current plan does not offer: returns 403 `{ error: "CAN_FEATURE_TRIAL", target_plan, target_trial_type, ... }` when the caller is an admin and a feature trial can be started; otherwise returns 403 `{ error: "PAID_FEATURE_REQUIRED", target_plan, template_url }`; an account from a channel partner gets 403 `{ error: "UNAVAILABLE_TO_TRIAL_OR_UPGRADE" }`.
        - With `form_app_trial_alert` passed and the template bound to form apps that must be bought / tried: returns 200 `{ error: "CANNOT_FORM_APP_TRIAL" | "FORM_APP_TRIAL_REQUIRED", ... }`; confirm with `confirm_unbind_form_app` / `confirm_form_app_trial` and retry.
        When form creation fails (failing the content risk check included), returns 400 `{ error }`. When the template does not exist, returns 404 with an HTML page, not JSON.
        `mobile_editor_forbidden` appears only on a mobile request when the new form has the card layout and the current plan cannot use the mobile editor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUsageInput'
      responses:
        '200':
          description: Created; or not created because of a payment / form app restriction, in which case the body has `template_url` or `error`
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - success_url
                  - form_token
                  properties:
                    success_url:
                      type: string
                      description: Site path of the new form's edit page (e.g. `/forms/{token}/edit`)
                    form_token:
                      type: string
                      description: Token of the new form
                    mobile_editor_forbidden:
                      type: boolean
                      description: true on a mobile request when the current plan cannot use the mobile editor to edit a card-layout form
                - type: object
                  required:
                  - template_url
                  properties:
                    template_url:
                      type: string
                      description: Template purchase page URL, when a paid template has not been bought
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - CANNOT_FORM_APP_TRIAL
                      - FORM_APP_TRIAL_REQUIRED
                    cannot_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: Names of the form apps that must be bought
                    need_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: Names of the form apps that need a trial
                    expire_days:
                      type: integer
                      description: Days left in the form app trial
                    template_url:
                      type: string
        '400':
          description: Form creation failed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    description: Failure reason (e.g. `模板选用失败！...`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: The template has paid features the current plan does not offer, or the OAuth scope is insufficient
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - PAID_FEATURE_REQUIRED
                      - CAN_FEATURE_TRIAL
                      - UNAVAILABLE_TO_TRIAL_OR_UPGRADE
                    target_plan:
                      type: string
                      description: Code of the lowest plan that can use this template
                    target_trial_type:
                      type: string
                      description: Type of feature trial that can be started
                    in_trial_form_apps:
                      type: array
                      items:
                        type: string
                    current_trial_type:
                      type: string
                    current_trial_end_date:
                      type: string
                    template_url:
                      type: string
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: Template does not exist (an HTML page is returned)
          content:
            text/html:
              schema:
                type: string
