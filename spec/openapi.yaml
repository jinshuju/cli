              schema:
                $ref: '#/components/schemas/FormWebhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The plan does not support API v1 access (returns error_description), or the plan does not support Webhook (empty body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_description:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Form Settings
