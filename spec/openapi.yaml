  "/fill/f/{form_token}/entries":
    post:
      tags:
      - Fill
      summary: Submit an entry through a form's fill page
      operationId: createFillFormEntry
      description: |
        Submits one entry through the fill page as the current user, the same as clicking "Submit" on the page: only fields visible on the fill page are accepted, required fields are checked as the fill page sets them,
        the submitter is recorded as the current user (the entry shows up in "My submissions"), and an entry submitted through a form view records which view it came from.
        - Returns 403 when the fill page is not open, with the reason in `status`; returns 422 listing the reasons when `blockers` is not empty.
        - Returns 422 when a field value is invalid, with `errors` explaining each by field api_code.
        - Each user can submit at most 30 times per hour; beyond that returns 429.
        - An account access token has no "current user"; calling with one returns 400.

        OAuth scope: submit_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: The token in the fill link `/f/<token>`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillEntryRequest'
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillEntryCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: The fill page is not open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The fill page does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The fill page has requirements the API cannot fulfil, or a field value is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
