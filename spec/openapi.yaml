  "/forms/{form_token}/views":
    get:
      tags:
      - Views
      summary: 列出表单视图
      description: 返回当前调用者在该表单上可见的视图：自己创建的视图，以及其他协作者设为 cooperators 可见的视图； 其他用户的 personal 视图不会返回。排序遵循调用者自己保存的视图顺序，未排序的视图按 position、created_at 追加在后。 OAuth 令牌需要 scope：forms。
      operationId: listFormViews
