            expired:
              type: boolean
              description: Whether the current paid plan has expired; false for accounts that have never paid
        usage:
          type:
          - object
          - 'null'
          description: Usage this month; keys are add-on service codes (sms, active_mail, entry_quota, storage_quota, ai_points, audio_quota, entry_transaction_quota, merchant_entry_transaction_quota)
          required:
          - next_reset_date
