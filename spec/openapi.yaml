          minItems: 1
          description: Column mapping; each item writes one spreadsheet column into one field
          items:
            $ref: '#/components/schemas/EntryImportColumnInput'
        header_row_index:
          type:
          - integer
          - string
          - 'null'
          pattern: "^[0-9]+$"
          description: Row number of the header row (as numbered in the spreadsheet, starting at 1); defaults to the first row of the spreadsheet, and data rows must follow below it
          examples:
          - 1
        unique_field_code:
          type:
          - string
          - 'null'
          description: api_code of the dedup field; a row is skipped when the file's value for this field already exists in the form's entries
      additionalProperties: false
    EntryImportColumnInput:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: api_code of the target field; must be a field of this form that accepts imports
        column_label:
          type: string
          description: Header text of the source column, matched exactly after trimming leading and trailing spaces; give at least one of this and `sheet_column_index`
        sheet_column_index:
          type:
          - integer
          - string
          pattern: "^[0-9]+$"
          description: Column number of the source column (as numbered in the spreadsheet, starting at 1); for a missing or duplicate header. Takes precedence over `column_label`
      additionalProperties: false
      examples:
      - field_api_code: field_1
        column_label: 姓名
      - field_api_code: field_2
        sheet_column_index: 3
    EntryImportCreated:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          description: Import job ID, for "Show an entry import job"
        status:
          type: string
          description: Job status; `pending` right after creation
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
    EntryImportJob:
      type: object
      required:
      - job_id
      - status
      - total_rows
      - processed_rows
      - imported_count
      - skip_count
      - invalid_count
      - warnings
      - error_message
      - started_at
      - finished_at
      properties:
        job_id:
          type: string
        status:
          type: string
          description: "`pending` queued, `running` in progress; `success` / `failed` / `cancelled` are final"
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
        total_rows:
          type:
          - integer
          - 'null'
          description: Number of data rows to import; null before the job starts
        processed_rows:
          type: integer
          description: Rows processed
        imported_count:
          type:
          - integer
          - 'null'
          description: Rows written successfully; may be null before the job finishes
        skip_count:
          type:
          - integer
          - 'null'
          description: Rows skipped (e.g. deduplicated by `unique_field_code`)
        invalid_count:
          type:
          - integer
          - 'null'
          description: Rows that failed field validation
        warnings:
          type: array
          description: Per-row messages
          items:
            type: string
        error_message:
          type:
          - string
          - 'null'
          description: Why the job failed
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the job started (UTC)
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the job finished (UTC)
    SMSTaskCreateInput:
      type: object
      title: SMSTaskCreateInput
      description: Request body of POST /forms/{form_token}/sms_tasks
      required:
      - entry_field
      - sms_template_id
      properties:
        entry_field:
          type: string
          description: api_code of the mobile field to send to, or `<table api_code>.<column api_code>` for a column of a table / matrix field
        filters:
          description: The same as `filters` of `GET /forms/{form_token}/sms_tasks/estimate`, as JSON text or the array itself
          oneOf:
          - type: string
          - type: array
            items:
              type: object
        keyword:
          type: string
          maxLength: 200
          description: The same as `keyword` of `GET /forms/{form_token}/sms_tasks/estimate`
        view_token:
          type: string
          description: The same as `view_token` of `GET /forms/{form_token}/sms_tasks/estimate`
        select_all:
          type: boolean
          description: Must be true to pick every entry of the form when no filter, keyword or view with filters narrows the entries; otherwise 400
        sms_template_id:
          type: string
          description: SMS template to send with (`id` from `GET /sms/templates`)
        placeholder_keys:
          type: array
          description: Field api_code filling each template variable, in order, with blank items dropped; a variable left without one is filled from the field whose api_code is its name
          items:
            type: string
        send_at:
          type: string
          format: date-time
          description: When to send, a future time in ISO 8601 with a time zone offset like `2026-10-21T09:00:00+08:00`; omitted, right away
        auto_send:
          type: boolean
          default: true
          description: false makes the task wait to be sent with `PATCH /forms/{form_token}/sms_tasks/{id}/auto_send` once it has passed review, even when the template has already passed review
      additionalProperties: false
      examples:
      - entry_field: field_2
        filters: '[{"field":"field_3","operator":"any_in","value":["选项 A"]}]'
        sms_template_id: 6512a3f0c1d2e3f4a5b6c7d8
      - entry_field: field_2
        sms_template_id: 6512a3f0c1d2e3f4a5b6c7d8
        send_at: '2026-10-21T09:00:00+08:00'
    EmailTaskCreateInput:
      type: object
      title: EmailTaskCreateInput
      description: Request body of POST /forms/{form_token}/email_tasks
      required:
      - entry_field
      - subject
      - content
      properties:
        entry_field:
          type: string
          description: api_code of the email field to send to, or `<table api_code>.<column api_code>` for a column of a table / matrix field
        filters:
          description: The same as `filters` of `GET /forms/{form_token}/email_tasks/estimate`, as JSON text or the array itself
          oneOf:
          - type: string
          - type: array
            items:
              type: object
        keyword:
          type: string
          maxLength: 200
          description: The same as `keyword` of `GET /forms/{form_token}/email_tasks/estimate`
        view_token:
          type: string
          description: The same as `view_token` of `GET /forms/{form_token}/email_tasks/estimate`
        select_all:
          type: boolean
          description: Must be true to pick every entry of the form when no filter, keyword or view with filters narrows the entries; otherwise 400
        smtp_account_id:
          type: string
          description: Custom SMTP account to send through (`id` from `GET /smtp_accounts`), using no email quota
        subject:
          type: string
          description: Email subject
        content:
          type: string
          description: Email body in HTML; insert an entry's field value with `$(field_x)`
      additionalProperties: false
      examples:
      - entry_field: field_5
        view_token: Xk3pQa
        subject: 活动通知
        content: "<p>$(field_1) 您好，活动将于明天 9:00 开始。</p>"
    SMSTaskEstimate:
      type: object
      required:
      - matched_entries
      - recipient_entries
      - missing_recipient_entries
      - recipients_count
      - billed_sms_count
      - at_least
      - can_send
      - within_quota_count
      - over_quota_count
      - over_quota_amount
      properties:
        matched_entries:
          type: integer
          description: Number of entries the selection matches, counted as by `GET /forms/{form_token}/entries/count`
        recipient_entries:
          type: integer
          description: Matched entries whose `entry_field` holds a valid mobile number, which go into the task. For a table column, entries whose column is empty are included and get no message, as in the web app
        missing_recipient_entries:
          type: integer
          description: Matched entries left out because `entry_field` is empty or not a valid mobile number; for a table column, those holding a value that is not a valid mobile number
        recipients_count:
          type:
          - integer
          - 'null'
          description: 'Number of mobile numbers; one entry can hold several when `entry_field` is a table column. null when `entry_field` is a table column and either `recipient_entries` is over 20000 or a change of a task is estimated: the numbers are then read only as the task sends, as in the web app, which stops when the quota and balance run out'
        billed_sms_count:
          type:
          - integer
          - 'null'
          description: 'Messages to be charged with each entry''s values filled in, counted as the SMS provider charges: up to 70 characters including `【signature】` is one, longer bodies one per 67; null when `recipients_count` is null'
        at_least:
          type:
          - boolean
          - 'null'
          description: 'true when `billed_sms_count` is a lower bound: content with variables picked for over 20000 entries or estimated for a change of a task, or a variable filled from an associated form''s field; null when `recipients_count` is null'
        can_send:
          type:
          - boolean
          - 'null'
          description: Whether the quota, and the balance where the plan allows paying for what the quota does not cover, covers `billed_sms_count`; null when `recipients_count` is null
        within_quota_count:
          type:
          - integer
          - 'null'
          description: Messages of `billed_sms_count` the remaining quota (plan and purchased packages) covers; null when `recipients_count` is null
        over_quota_count:
          type:
          - integer
          - 'null'
          description: Messages of `billed_sms_count` beyond the remaining quota, paid from the account balance where the plan allows it; null when `recipients_count` is null
        over_quota_amount:
          type:
          - number
          - 'null'
          description: What `over_quota_count` costs from the account balance, in CNY; the remaining quota and balance are in `GET /billing_account`; null when `recipients_count` is null
      examples:
      - matched_entries: 130
        recipient_entries: 128
        missing_recipient_entries: 2
        recipients_count: 128
        billed_sms_count: 256
        at_least: false
        can_send: true
        within_quota_count: 200
        over_quota_count: 56
        over_quota_amount: 3.36
    EmailTaskEstimate:
      type: object
      required:
      - matched_entries
      - recipient_entries
      - missing_recipient_entries
      - recipients_count
      - can_send
      - within_quota_count
      - over_quota_count
      - over_quota_amount
      properties:
        matched_entries:
          type: integer
          description: Number of entries the selection matches, counted as by `GET /forms/{form_token}/entries/count`
        recipient_entries:
          type: integer
          description: Matched entries whose `entry_field` holds a valid email address, which go into the task. For a table column, entries whose column is empty are included and get no email, as in the web app
        missing_recipient_entries:
          type: integer
          description: Matched entries left out because `entry_field` is empty or not a valid email address; for a table column, those holding a value that is not a valid email address
        recipients_count:
          type:
          - integer
          - 'null'
          description: 'Number of email addresses, one email each; one entry can hold several when `entry_field` is a table column. null when `entry_field` is a table column and `recipient_entries` is over 20000: the addresses are then read only as the task sends, as in the web app, which stops when the quota and balance run out'
        within_quota_count:
          type:
          - integer
          - 'null'
          description: Emails of `recipients_count` the remaining quota (plan and purchased packages) covers; 0 with a custom SMTP account, which uses no quota; null when `recipients_count` is null
        over_quota_count:
          type:
          - integer
          - 'null'
          description: Emails of `recipients_count` beyond the remaining quota, paid from the account balance where the plan allows it; 0 with a custom SMTP account; null when `recipients_count` is null
        over_quota_amount:
          type:
          - number
          - 'null'
          description: What `over_quota_count` costs from the account balance, in CNY; the remaining quota and balance are in `GET /billing_account`; null when `recipients_count` is null
        can_send:
          type:
          - boolean
          - 'null'
          description: Whether the quota, or balance where the plan allows, covers `recipients_count` within the daily limit of 200 (none on organization plans); null when `recipients_count` is null, otherwise always true with custom SMTP
      examples:
      - matched_entries: 45
        recipient_entries: 42
        missing_recipient_entries: 3
        recipients_count: 42
        can_send: true
        within_quota_count: 42
        over_quota_count: 0
        over_quota_amount: 0.0
    EntryTask:
      type: object
      description: An SMS or email task sending to entries of a form
      required:
      - id
      - status
      - recipient_entries
      - failed_reason
      - created_at
      - sent_at
      properties:
        id:
          type: string
          description: Task id
        status:
          type: string
          description: Task status, where a `template_fail` SMS task can be changed and sent again, and a `waiting_for_send` or `content_auditing` one revoked, with PATCH
          enum:
          - template_checking
          - content_auditing
          - approved
          - rejected
          - waiting_for_send
          - sending
          - all_sent
          - partial_sent
          - none_sent
          - template_fail
          - revoked
          - template_deleted
        recipient_entries:
          type: integer
          description: Number of entries in the task
        succeeded:
          type: integer
          description: Entries sent successfully so far; returned when listing or reading tasks
        failed:
          type: integer
          description: Entries that failed so far; returned when listing or reading tasks
        failed_reason:
          type:
          - string
          - 'null'
          description: Why sending failed, e.g. the quota ran out; null when there is none
        created_at:
          type: string
          format: date-time
          description: When the task was created (UTC)
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When sending started (UTC); null before it starts
        auto_send:
          type: boolean
          description: SMS tasks only; false while a task created with `auto_send` false waits to be sent with `PATCH /forms/{form_token}/sms_tasks/{id}/auto_send`
      examples:
      - id: 6716f2a8c1d2e3f4a5b6c7d9
        status: sending
        recipient_entries: 128
        succeeded: 100
        failed: 0
        failed_reason:
        created_at: '2026-10-20T08:00:00Z'
        sent_at: '2026-10-20T08:00:02Z'
    EntryTaskListResponse:
      type: object
      required:
      - count
      - data
      - next
      properties:
        count:
          type: integer
          description: Number of items on this page
        data:
          type: array
          description: Tasks, newest first
          items:
            $ref: '#/components/schemas/EntryTask'
        next:
          type:
          - integer
          - 'null'
          description: Row offset of the next page; null on the last page
    EntryTaskResendInput:
      type: object
      title: EntryTaskResendInput
      description: Request body of POST /forms/{form_token}/sms_tasks/{id}/resend and POST /forms/{form_token}/email_tasks/{id}/resend
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - FAILED
          - SUCCESS
          - ALL
          description: The same as `status` of the resend estimate
        filters:
          description: The same as `filters` of the resend estimate, as JSON text or the array itself
          oneOf:
          - type: string
          - type: array
            items:
              type: object
        keyword:
          type: string
          maxLength: 200
          description: The same as `keyword` of the resend estimate
        view_token:
          type: string
          description: The same as `view_token` of the resend estimate
      additionalProperties: false
      examples:
      - status: FAILED
      - status: FAILED
        filters: '[{"field":"serial_number","operator":"none_in","value":[3,8]}]'
    SMSTaskUpdateInput:
      type: object
      title: SMSTaskUpdateInput
      description: 'Request body of PATCH /forms/{form_token}/sms_tasks/{id}; `revoked: true` alone revokes the task, the other fields change a `template_fail` task and send it again, taking `sms_template_id`; the entries stay those of the task'
      properties:
        revoked:
          type: boolean
          description: true revokes a `waiting_for_send` or `content_auditing` task so it never sends
        entry_field:
          type: string
          description: api_code of the mobile field to send to, or `<table api_code>.<column api_code>` for a mobile column of a table field; omitted, the task's current `entry_field`
        sms_template_id:
          type: string
          description: SMS template to send with (`id` from `GET /sms/templates`)
        placeholder_keys:
          type: array
          description: Field api_code filling each template variable, in order, with blank items dropped; a variable left without one is filled from the field whose api_code is its name; omitted, the task's current `placeholder_keys`
          items:
            type: string
        send_at:
          type: string
          format: date-time
          description: When to send once review passes, a future time in ISO 8601 with a time zone offset like `2026-10-21T09:00:00+08:00`; omitted, right away
        auto_send:
          type: boolean
          default: true
          description: false makes the task wait to be sent with `PATCH /forms/{form_token}/sms_tasks/{id}/auto_send` once it has passed review, even when the template has already passed review
      additionalProperties: false
      examples:
      - revoked: true
      - sms_template_id: 6512a3f0c1d2e3f4a5b6c7d8
      - sms_template_id: 6512a3f0c1d2e3f4a5b6c7d8
        send_at: '2026-10-21T09:00:00+08:00'
        auto_send: false
    SMSTaskActivity:
