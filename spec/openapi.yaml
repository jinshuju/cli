        OAuth 令牌需要 scope：form_setting。
        保存成功返回 `{ "status": "ok" }`；校验失败返回 400，响应体为 `{ "errors": "...", "status": "failed" }`（与通用错误结构不同）。
      operationId: updateAccessPolicy
      parameters:
      - $ref: '#/components/parameters/FormToken'
