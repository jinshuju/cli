            - mch_id
            - mch_name
            properties:
              id:
                type: string
              mch_id:
                type:
                - string
                - 'null'
              mch_name:
                type:
                - string
                - 'null'
        alipay_accounts:
          type: array
          description: Bound Alipay accounts
          items:
            type: object
            required:
