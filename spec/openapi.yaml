        forms:
          type: array
          description: 按请求中 token 的顺序（去重后）逐个返回
          items:
            oneOf:
            - type: object
              required:
              - form_token
              - name
              - matched_entries
              properties:
                form_token:
                  type: string
                name:
                  type: string
                matched_entries:
                  type: integer
            - $ref: '#/components/schemas/EntryFormUnavailable'
      examples:
      - matched_entries: 130
        forms:
        - form_token: abc123
          name: 报名表
          matched_entries: 130
        - form_token: zzz999
          unavailable: Form not found or access denied — check the token, and note it may belong to a different account than the one this credential belongs to.
    EntrySearchResponse:
      type: object
      required:
      - total
      - forms
      properties:
        total:
          type: integer
          description: 各表单匹配条数合计
        forms:
          type: array
          description: 有匹配的表单，以及未能搜索的表单；没有匹配的表单不列出
          items:
            oneOf:
            - type: object
              required:
              - form_token
              - name
              - matched
              - serial_numbers
              properties:
                form_token:
                  type: string
                name:
                  type: string
                matched:
                  type: integer
                  description: 匹配的数据条数
                serial_numbers:
                  type: array
                  description: 部分匹配数据的序号，最多 50 个
                  items:
                    type: integer
            - $ref: '#/components/schemas/EntryFormUnavailable'
      examples:
      - total: 3
        forms:
        - form_token: abc123
          name: 报名表
          matched: 3
          serial_numbers:
          - 12
          - 57
          - 88
    EntryStatsResponse:
      type: object
      required:
      - from
      - to
      - tz
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        tz:
          type: string
          examples:
          - Asia/Shanghai
        total:
          type: integer
          description: 范围内全部表单的提交次数合计
        forms_with_data:
          type: integer
          description: 范围内有提交的表单数
        count:
          type: integer
          description: "`data` 的行数"
        data:
          type: array
          description: 有提交的表单，按提交次数降序
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
          description: 有提交的表单多于 `limit`，`data` 只含前 `limit` 个
        buckets:
          type: array
          description: 只在传 `by` 时出现；范围内每个时间段一项，按时间升序
          items:
            $ref: '#/components/schemas/EntryStatsBucket'
      examples:
      - from: '2026-09-01'
        to: '2026-09-07'
        tz: Asia/Shanghai
        total: 210
        forms_with_data: 2
        count: 2
        data:
        - token: abc123
          name: 报名表
          kind: form
          fill_count: 180
        - token: def456
          name: 客户台账
          kind: table
          fill_count: 30
        truncated: false
    EntryStatsFormRow:
      type: object
      required:
      - token
      - name
      - kind
      - fill_count
      properties:
        token:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - form
          - table
        fill_count:
          type: integer
          description: 时间段内的提交次数
    EntryStatsBucket:
      type: object
      description: 一个时间段的提交量统计，结构与总体统计相同
      required:
      - from
      - to
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
          description: 时间段起始日（含），首段按范围裁剪
        to:
          type: string
          format: date
          description: 时间段结束日（含），末段按范围裁剪
        total:
          type: integer
        forms_with_data:
          type: integer
        count:
          type: integer
        data:
          type: array
          description: 该时间段内有提交的表单，按提交次数降序，最多 `limit` 行
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
    FieldAnalytics:
      type: object
      description: 字段可做的统计分析，仅在 `include_analytics=true` 时出现在可分析字段上
      required:
      - agg_funcs
      - summary_kind
      - groupable
      - buckets
      - default_agg
      - summarisable
      properties:
        agg_funcs:
          type: array
          description: 聚合统计接口的 `metrics` 可对该字段使用的函数
          items:
            type: string
        summary_kind:
          type: string
          description: 数据概况中该字段的 `kind`
          enum:
          - choice
          - matrix
          - number
          - date
          - text
          - geo
        groupable:
          type: boolean
          description: 能否作为聚合统计的 `dimensions`
        buckets:
          type: array
          description: 作为分组字段时可用的 `bucket`（仅日期字段非空）
          items:
            type: string
            enum:
            - day
            - week
            - month
        default_agg:
          type: string
          description: 建议的默认聚合函数（数字为 `sum`，其他为 `count`）
        summarisable:
          type: boolean
          description: 数据概况是否包含该字段
    MyFilledForm:
      type: object
      required:
      - token
      - name
      - description
      - kind
      - scene
      - submitted_entries_count
      - last_submitted_at
      properties:
        token:
          type: string
          description: 表单 token
        name:
          type: string
          description: 表单名称（对外名称）
        description:
          type:
          - string
          - 'null'
          description: 表单描述（可能是 HTML 富文本）
        kind:
          type: string
          description: 表单类型，`form` 或 `table`
          examples:
          - form
        scene:
          type:
          - string
          - 'null'
          description: 表单场景
        submitted_entries_count:
          type: integer
          description: 当前用户在该表单提交的数据条数
        last_submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 当前用户最近一次提交的时间（UTC）
    MyFilledFormListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: 填写过的表单总数
        count:
          type: integer
          description: 本页条数
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyFilledForm'
        next:
          type:
          - integer
          - 'null'
          description: 下一页的行偏移量；末页为 null
    MySubmittedEntryListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: 满足条件的本人数据总数
        count:
          type: integer
          description: 本页条数
        data:
          type: array
          description: 本人提交的数据，只含表单对填写者公开的字段；值的形态见 `EntryData`
          items:
            $ref: '#/components/schemas/EntryData'
        next:
          type:
          - integer
          - 'null'
          description: 下一页的行偏移量；末页为 null
    FillPage:
      type: object
      required:
      - kind
      - token
      - title
      - fill_url
      - status
      - blockers
      - fields
      properties:
        kind:
          type: string
          enum:
          - form
          - form_view
          description: "`form` 来自 `/f/` 链接，`form_view` 来自 `/v/` 链接（表格的表单视图）"
        token:
          type: string
          description: 链接中的 token
        title:
          type: string
          description: 填写页标题；表单视图为视图标题
        description:
          type:
          - string
          - 'null'
        fill_url:
          type: string
          description: 填写页地址
        status:
          type: object
          required:
          - key
          properties:
            key:
              type: string
              description: "`open` 表示当前用户可以提交"
            message:
              type:
              - string
              - 'null'
              description: 不能提交时给用户看的说明
            open_info:
              type: array
              description: 未开放或按时间关闭时的开放时间说明
              items:
                type: string
        blockers:
          type: array
          description: 只有填写者本人在页面上才能完成的要求；不为空时只能在浏览器中填写
          items:
            type: object
            required:
            - key
            - message
            properties:
              key:
                type: string
                enum:
                - captcha
                - sms_verification
                - weixin
                - ip_or_device_limit
                - region_limit
                - payment
                - portal
                - exam
                - required_attachment
              message:
                type: string
        fields:
          type: array
          description: 填写页上的字段，按填写顺序
          items:
            $ref: '#/components/schemas/FieldMap'
        manageable:
          type: object
          description: 仅当当前用户本来就能读取背后的表单或表格时返回
          properties:
            kind:
              type: string
              enum:
              - form
              - table
            token:
              type: string
            name:
              type: string
    FillEntryRequest:
      type: object
      required:
      - entry
      properties:
        entry:
          type: object
          description: 字段 api_code 到值的映射，值的写法同新增数据；填写页上不可见的字段会被忽略
        password:
          type: string
          description: 填写页设置了访问密码时，由填写者提供的密码
    FillEntryCreated:
      type: object
      required:
      - serial_number
      properties:
        serial_number:
          type: integer
          description: 数据序号
        entry_token:
          type: string
        created_at:
          type: string
          format: date-time
    MySearchFormResult:
      type: object
      required:
      - form_token
      properties:
        form_token:
          type: string
          description: 表单 token
        name:
          type:
          - string
          - 'null'
          description: 表单名称；`unavailable` 时不返回
        matched:
          type: integer
          description: 该表单中命中的本人数据条数；`unavailable` 时不返回
        serial_numbers:
          type: array
          maxItems: 50
          description: 命中数据的序号，最多 50 个；`unavailable` 时不返回
          items:
            type: integer
        unavailable:
          type: string
          description: 该表单无法搜索的原因；出现时没有 `name` / `matched` / `serial_numbers`
    MySearchResponse:
      type: object
      required:
      - total
      - forms
      properties:
        total:
          type: integer
          description: 所有表单的命中总数
        forms:
          type: array
          description: 有命中或无法搜索的表单；没有命中的表单不出现
          items:
            $ref: '#/components/schemas/MySearchFormResult'
    TableFolderMoveResult:
      type: object
      required:
      - table_token
      - folder_token
      properties:
        table_token:
          type: string
        folder_token:
          type:
          - string
          - 'null'
          description: 移动后所在文件夹 token；移出时为 null
    FormTransactions:
      type: object
      description: |
        收款统计，按交易状态分组（`include_transactions=true` 且表单绑定了收款账户时出现）。目前只有 `paid` 一组：
        交易状态为已支付或退款中的数据，按订单总额累计（不扣除退款）；已退款与部分退款的数据不计入。这不是净收入报表。
        金额为 0 不代表不是收款表单。
      required:
      - paid
      properties:
        paid:
          type: object
          required:
          - amount
          - count
          properties:
            amount:
              type: number
              description: 该组数据的订单总额之和（元）
            count:
              type: integer
              description: 该组数据的条数
    FormDetail:
      description: 表单结构，以及按 `include_*` 参数附带的内容
      allOf:
      - $ref: '#/components/schemas/Form'
      - type: object
        properties:
          theme:
            type: object
            description: 表单主题（`include_theme=true` 时出现）；结构同 `FormTheme`，但不含 `form_token`。表单没有主题时为空对象
            additionalProperties: true
          field_rules:
            type: array
            description: 字段显示规则（`include_field_rules=true` 时出现），同 `GET /forms/{form_token}/field_rules` 的 `data`
            items:
              $ref: '#/components/schemas/FieldRule'
          extended_attributes:
            type: array
            description: 数据来源链接（`include_extended_attributes=true` 时出现），同 `GET /forms/{form_token}/extended_attributes` 的 `data`
            items:
              $ref: '#/components/schemas/ExtendedAttribute'
          transactions:
            $ref: '#/components/schemas/FormTransactions'
    FormViewFillItem:
      type: object
      description: 表单视图填写页上的一个填写项（生效值）
      required:
      - api_code
      - label
      - notes
      - required
      properties:
        api_code:
          type: string
          description: 列的 api_code
        label:
          type:
          - string
          - 'null'
          description: 填写页上显示的标题（未单独设置时为列标题）
        notes:
          type:
          - string
          - 'null'
          description: 填写页上显示的说明（未单独设置时为列说明）
        required:
          type: boolean
          description: 是否必填
    FormViewFieldOverrideInput:
      type: object
      description: 表单视图的一个填写项配置
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: 列的 api_code；列必须存在且可作为填写项，同一请求中不能重复
        label:
          type:
          - string
          - 'null'
          description: 填写页上的标题；为空时沿用列标题
        notes:
          type:
          - string
          - 'null'
          description: 填写页上的说明；为空时沿用列说明
        private:
          type:
          - boolean
          - 'null'
          description: 为 true 时不出现在填写页；不传时沿用列自身设置
        position:
          type:
          - integer
          - 'null'
          description: 在填写页中的顺序；不传时按数组顺序
        validations:
          type: array
          description: 该填写项的校验，目前用 `presence` 表示必填；必须是该列类型支持的校验（如是否列、计算列不能设为必填），否则 422
          items:
            type: string
            examples:
            - presence
      additionalProperties: false
    EntryImportInput:
      type: object
      description: POST /forms/{form_token}/entry_imports 的请求体
      required:
      - attachment_id
      - columns
      properties:
        attachment_id:
          type: string
          description: "「上传导入文件」返回的导入附件 `id`"
        columns:
          type: array
          minItems: 1
          description: 列映射；每项把表格中的一列写入一个字段
          items:
            $ref: '#/components/schemas/EntryImportColumnInput'
        header_row_index:
          type:
          - integer
          - string
          - 'null'
          pattern: "^[0-9]+$"
          description: 表头所在行号（与表格行号一致，从 1 起）；缺省为表格第一行，其下方必须还有数据行
          examples:
          - 1
        unique_field_code:
          type:
          - string
          - 'null'
          description: 去重字段的 api_code；文件中该字段的值已存在于表单数据时跳过这一行
      additionalProperties: false
    EntryImportColumnInput:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: 目标字段的 api_code，必须是该表单可导入的字段
        column_label:
          type: string
          description: 来源列的表头文字，按去掉首尾空格后完全相等匹配；与 `sheet_column_index` 至少给一个
        sheet_column_index:
          type:
          - integer
          - string
          pattern: "^[0-9]+$"
          description: 来源列的列号（与表格列号一致，从 1 起）；表头缺失或重名时使用，优先于 `column_label`
      additionalProperties: false
      examples:
      - field_api_code: field_1
        column_label: 姓名
      - field_api_code: field_2
        sheet_column_index: 3
    EntryImportCreated:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          description: 导入任务 ID，用于「获取数据导入任务」
        status:
          type: string
          description: 任务状态；刚创建时为 `pending`
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
    EntryImportJob:
      type: object
      required:
      - job_id
      - status
      - total_rows
      - processed_rows
      - imported_count
      - skip_count
      - invalid_count
      - warnings
      - error_message
      - started_at
      - finished_at
      properties:
        job_id:
          type: string
        status:
          type: string
          description: "`pending` 排队中、`running` 进行中；`success` / `failed` / `cancelled` 为终态"
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
        total_rows:
          type:
          - integer
          - 'null'
          description: 待导入的数据行数；开始执行前为 null
        processed_rows:
          type: integer
          description: 已处理的行数
        imported_count:
          type:
          - integer
          - 'null'
          description: 成功写入的行数；完成前可能为 null
        skip_count:
          type:
          - integer
          - 'null'
          description: 被跳过的行数（如按 `unique_field_code` 去重）
        invalid_count:
          type:
          - integer
          - 'null'
          description: 未通过字段校验的行数
        warnings:
          type: array
          description: 逐行提示信息
          items:
            type: string
        error_message:
          type:
          - string
          - 'null'
          description: 任务失败原因
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 开始执行时间（UTC）
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 结束时间（UTC）
    TimeOfDay:
      type: object
      required:
      - hour
      - minute
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
      additionalProperties: false
    DailyRepeatCloseRuleInput:
      type:
      - object
      - 'null'
      description: |
        每日开放填写时间：表单每天只在这些时间段内接受提交（如 11:00-12:40、17:00-18:30），可与 `by_time_range_close_rule`、`by_entries_close_rule` 同时存在。
        传 `time_periods` 整体替换现有时间段；传 `{ "enabled": false }` 删除该规则。每个时间段的 `end_time` 不能早于 `start_time`，否则返回 400。
      properties:
        enabled:
          type: boolean
          description: 传 false 删除该规则；传 `time_periods` 时省略
        time_periods:
          type: array
          description: 每项一个每日开放时间段
          items:
            type: object
            required:
            - start_time
            - end_time
            properties:
              start_time:
                $ref: '#/components/schemas/TimeOfDay'
              end_time:
                $ref: '#/components/schemas/TimeOfDay'
            additionalProperties: false
      additionalProperties: false
      examples:
      - time_periods:
        - start_time:
            hour: 11
            minute: 0
          end_time:
            hour: 12
            minute: 40
      - enabled: false
    DailyRepeatCloseRule:
      type:
      - object
      - 'null'
      description: 每日开放填写时间；未设置时为 null
      required:
      - time_periods
      properties:
