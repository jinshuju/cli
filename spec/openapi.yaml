    FillPage:
      type: object
      required:
      - kind
      - token
      - title
      - fill_url
      - status
      - blockers
      - fields
      properties:
        kind:
          type: string
          enum:
          - form
          - form_view
          description: "`form` for a `/f/` link, `form_view` for a `/v/` link (a form view of a table)"
        token:
          type: string
          description: The token in the link
        title:
          type: string
          description: Fill page title; the view title for a form view
        description:
          type:
          - string
          - 'null'
        fill_url:
          type: string
          description: Fill page URL
        status:
          type: object
          required:
          - key
          properties:
            key:
              type: string
              description: "`open` means the current user can submit"
            message:
              type:
              - string
              - 'null'
              description: Message to show the user when they cannot submit
            open_info:
              type: array
              description: Opening times, when the page is not open yet or closed by schedule
              items:
                type: string
        blockers:
          type: array
          description: Requirements only the submitter can complete on the page; when not empty, the page can only be filled in a browser
          items:
            type: object
            required:
            - key
            - message
            properties:
              key:
                type: string
