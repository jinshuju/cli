    TimeOfDay:
      type: object
      required:
      - hour
      - minute
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
      additionalProperties: false
    DailyRepeatCloseRuleInput:
      type:
      - object
      - 'null'
      description: |
        Daily open hours: the form accepts submissions only within these periods each day (e.g. 11:00-12:40, 17:00-18:30). It can coexist with `by_time_range_close_rule` and `by_entries_close_rule`.
        Passing `time_periods` replaces all existing periods; passing `{ "enabled": false }` deletes the rule. The `end_time` of each period must not be earlier than its `start_time`; otherwise returns 400.
      properties:
        enabled:
          type: boolean
          description: Pass false to delete the rule; omit it when passing `time_periods`
        time_periods:
          type: array
          description: One daily open period per item
          items:
            type: object
            required:
            - start_time
            - end_time
            properties:
              start_time:
                $ref: '#/components/schemas/TimeOfDay'
              end_time:
                $ref: '#/components/schemas/TimeOfDay'
            additionalProperties: false
      additionalProperties: false
      examples:
      - time_periods:
        - start_time:
            hour: 11
            minute: 0
          end_time:
            hour: 12
            minute: 40
      - enabled: false
    DailyRepeatCloseRule:
      type:
      - object
      - 'null'
      description: Daily open hours; null when not set
      required:
      - time_periods
      properties:
        time_periods:
          type: array
          items:
            type: object
            required:
            - start_time
            - end_time
            properties:
              start_time:
                type: object
                properties:
                  hour:
                    type: integer
                  minute:
                    type: integer
              end_time:
                type: object
                properties:
                  hour:
                    type: integer
                  minute:
                    type: integer
    TradePageInfo:
      type: object
      required:
      - total
      - page
      - per_page
      - total_pages
      properties:
        total:
          type: integer
          description: Total matching records (not just this page)
        page:
          type: integer
          description: Current page number (starting at 1)
        per_page:
          type: integer
          description: Records per page
        total_pages:
          type: integer
          description: Total pages
    TradeQueriedRange:
      type: object
      description: The date range actually used (Beijing time, UTC+8, both end days inclusive). Both ends are null when the query has no time limit.
      required:
      - start_date
      - end_date
      properties:
        start_date:
          type:
          - string
          - 'null'
          format: date
        end_date:
          type:
