      summary: 获取表单视图
      description: 返回单个视图。只能读取调用者可见的视图（自己创建的或 cooperators 可见的），其他用户的 personal 视图返回 404（View cannot be found）。 OAuth 令牌需要 scope：forms。
      operationId: getFormView
