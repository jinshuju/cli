      operationId: listTables
      description: |
        Returns the tables (`kind=table`) visible to the current caller. Pagination, `q`, `filters`, `sort`, `next`, `page`, `skip` and `limit` mean the same as in the form list; 50 per page by default, up to 1000.

        OAuth scope: forms
