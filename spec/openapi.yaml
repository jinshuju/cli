                $ref: '#/components/schemas/Error'
              example:
                error_description: Fill page not found — check the link.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/fill/v/{view_token}/entries":
    post:
      tags:
      - Fill
      summary: 按表单视图填写页提交数据
      operationId: createFillViewEntry
      description: |
        以当前用户的身份，按填写页提交一条数据，与在页面上点「提交」一致：只接受填写页上可见的字段，按填写页的必填设置校验，
        提交人记为当前用户（会出现在「我提交的」里），表单视图提交的数据记录来自哪个视图。
        - 填写页未开放返回 403，`status` 为原因；`blockers` 不为空返回 422 并列出原因。
        - 字段值不合法返回 422，`errors` 按字段 api_code 给出说明。
        - 每个用户每小时最多提交 30 次，超出返回 429。
        - 企业 Access Token 没有「当前用户」，调用返回 400。

        OAuth 令牌需要 scope：submit_entries
      parameters:
      - name: view_token
        in: path
        required: true
        description: 填写链接 `/v/<token>` 中的 token。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillEntryRequest'
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillEntryCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 填写页未开放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 填写页不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 填写页有 API 代替不了的要求，或字段值不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/tables/{table_token}/folder":
    patch:
      tags:
      - Tables
      summary: 移动表格到文件夹
      description: |
        将表格移入指定文件夹，或移出文件夹（`folder_token` 传 null）；同时接受 PUT。移动仅影响当前调用用户的文件夹归属。
        OAuth 令牌需要 scope：forms。
        - 请求体必须包含 `folder_token` 键（值可为 null），否则 400。
        - `folder_token` 只接受文件夹 token（不接受 id）；文件夹不存在或当前用户无管理权限返回 404。
        - 目标文件夹的 kind 必须是 table，否则 400。
        - token 对应的不是表格时返回 404 `table cannot be found`。
      operationId: moveTableToFolder
      parameters:
      - $ref: '#/components/parameters/TableToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormFolderMoveInput'
      responses:
        '200':
          description: 移动结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableFolderMoveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer ACCESS_TOKEN`。接受个人 Access Token、企业 Access Token（企业版）以及 OAuth 2.0 访问令牌。
        OAuth 令牌按 scope 限制可用接口：`forms`（表单 / 表格 / 视图 / 文件夹 / 对外查询 / 模板）、`form_setting`（表单设置类、预置选项集）、
        `read_entries` / `write_entries`（数据、评论、附件上传、微信授权会话）、`read_contacts`（联系人）、`users`（当前用户 / 企业账户及其成员、发票、消费记录 / 小金商户与交易 / 短信签名审核状态）、`public`（其余）。
    basicAuth:
      type: http
      scheme: basic
      description: '旧版认证：`api_key:api_secret` 经 Base64 编码后放入 `Authorization: Basic ...`。不再向新账号发放，后续下线。'
  parameters:
    FormToken:
      name: form_token
      in: path
      required: true
      description: 表单 token（`GET /forms` 返回的 `token`），也接受 24 位十六进制的表单 id。
      schema:
        type: string
    TableToken:
      name: table_token
      in: path
      required: true
      description: 表格 token（`GET /tables` 返回的 `token`），也接受 24 位十六进制的表格 id。
      schema:
        type: string
    ViewToken:
      name: view_token
      in: path
      required: true
      description: 视图 token（`GET /forms/{form_token}/views` 返回的 `token`）
      schema:
        type: string
    SerialNumber:
      name: serial_number
      in: path
      required: true
      description: 数据序号
      schema:
        type: integer
    FormsQ:
      name: q
      in: query
      required: false
      description: 按名称模糊匹配（不区分大小写，同时匹配对外名称与站内名称）。可传多个值（`q[]=A&q[]=B`），匹配名称包含其中任一的表单。等价于 `filters=[{"field":"form_name","operator":"like","value":...}]`。
      schema:
        type: string
    FormsFilters:
      name: filters
      in: query
      required: false
      description: |
        筛选条件，JSON 数组，多个条件为「且」关系。可筛选字段与操作符：
        | field | 类型 | 操作符 |
        |---|---|---|
        | `form_name` | 文本 | `eq` `ne` `any_in` `none_in` `like` `not_like` |
        | `created_at` | 时间 | `eq` `ne` `gte` `gt` `lte` `lt` `within_last` |
        | `last_entry_created_at` | 时间 | 同上（从未收到数据的表单没有该值） |
        | `entries_count` | 整数 | `eq` `ne` `gte` `gt` `lte` `lt` |

        `within_last` 的值形如 `{"unit":"day","n":30}`（unit 可为 minute / day / week / month），表示从现在起往前的窗口。
        示例：`[{"field":"last_entry_created_at","operator":"within_last","value":{"unit":"day","n":7}}]`
      schema:
        type: string
      example: '[{"field":"entries_count","operator":"gte","value":1}]'
    FormsNext:
      name: next
      in: query
      required: false
      description: 上一页响应中的 `next`，原样回传以取下一页。不能与 `skip` 同时传。
      schema:
        type: string
    FormsSkip:
      name: skip
      in: query
      required: false
      description: 起始行偏移（0 起，最大 10000），用于并行切片读取；返回的 `next` 仍可继续翻页。不能与 `next` 同时传。
      schema:
        type: integer
        minimum: 0
        maximum: 10000
    EntriesFields:
      name: fields
      in: query
      required: false
      description: 只返回指定字段。JSON 数组、逗号分隔字符串或重复参数均可，值为字段 api_code；序号始终返回。含未知 api_code 时返回 400 并列出可用字段。
      schema:
        type: string
      example: field_1,field_2
    EntriesFilters:
      name: filters
      in: query
      required: false
      description: |
        筛选条件，JSON 数组，每项为 `{"field": "<api_code>", "operator": "<op>", "value": ...}`（`field` 也可写作 `api_code` / `trigger`），多个条件为「且」关系。
        - 操作符全集：`eq` `ne` `any_in` `none_in` `between` `not_between` `null` `not_null` `gte` `gt` `lte` `lt` `like` `not_like` `within_last`，
          别名 `equal` / `not_equal` / `start`（=gte）/ `end`（=lte）。每种字段类型只接受其中一部分，不支持时返回 400 并列出可用操作符。
        - 选项类字段（单选 / 多选 / 下拉 / 多级下拉）的 `value` 可以是选项 api_code 或选项显示值；多级下拉可用 `一级-二级` 路径。
        - `between` / `not_between` 的 `value` 为二元数组 `[min, max]`；矩阵 / 表格字段需写成 `{"<列 api_code>": [min, max]}`。
        - `within_last` 仅日期字段可用，`value` 形如 `{"unit":"day","n":30}`（unit 可为 minute / day / week / month）。
        - `creator_id` 可作为特殊字段用 `eq` 筛选提交人（值为用户 id），且只能出现一次。
        - `serial_number` 可作为特殊字段用 `eq` / `any_in` 按序号筛选，多个条件取交集。
        - 关联字段（RelationField）的 `any_in` / `none_in` 的 `value` 为关联表格中的数据序号；序号不存在时返回 400。
        - 含 `created_at` 条件时结果改为按创建时间排序。
      schema:
        type: string
      example: '[{"field":"field_3","operator":"any_in","value":["选项 A","选项 B"]}]'
    EntriesKeyword:
      name: keyword
      in: query
      required: false
      description: 全文关键字（最长 200 字符），在所有可搜索字段中模糊匹配。数据量超过 99999 条且未启用分析引擎的表单不支持全文搜索（返回 400），除非同时用 `creator_id` 限定提交人。
      schema:
        type: string
        maxLength: 200
    EntriesSort:
      name: sort
      in: query
      required: false
      description: |
        排序规则，JSON 数组，每项 `{"api_code": "<api_code>", "order": "asc"|"desc"}`，按顺序生效，末尾自动追加按序号升序。
        只有可排序字段可用，否则返回 400 并列出可排序字段。传 `sort` 后 `next` 变为行偏移量。
      schema:
        type: string
      example: '[{"api_code":"created_at","order":"desc"}]'
    EntriesCreatedAt:
      name: created_at
      in: query
      required: false
      description: 只返回在该时间及之后创建的数据（按北京时间解析，如 `2024-01-01` 或 `2024-01-01 08:00:00`），并改为按创建时间升序。格式无法解析时返回 400。与 `filters` / `keyword` 同时传时忽略。
      schema:
        type: string
    EntriesNext:
      name: next
      in: query
      required: false
      description: 上一页响应中的 `next`。默认排序下是序号游标（返回序号 ≥ 该值的数据）；条件查询 / 按创建时间 / 显式排序时是行偏移量。不能与 `skip` 同时传。也接受字符串：以整数开头时取该整数，否则视为 0，即从第一页开始。
      schema:
        type:
        - integer
        - string
    EntriesSkip:
      name: skip
      in: query
      required: false
      description: 起始行偏移（0 起，最大 10000），用于并行切片读取。不能与 `next` 同时传。
      schema:
        type: integer
        minimum: 0
        maximum: 10000
    FieldDataChecks:
      name: checks
      in: query
      required: true
      description: |
        要检查的目标，JSON 数组（1～100 项），每项一个字段或一个选项：
        | 键 | 类型 | 说明 |
        |---|---|---|
        | `field_api_code` | string | 必填。要检查的字段 api_code；检查表格字段 / 矩阵字段的某一列时传该列的 api_code，并同时传 `parent_field` |
        | `choice_value` | string | 可选。只检查某个选项时传该选项的 api_code；不传则检查整个字段是否有数据 |
        | `choice_type` | string | 可选，配合 `choice_value` 使用：`choice`（默认）、矩阵字段的 `statement` / `dimension`、多级下拉的 `level_1` ～ `level_4` |
        | `parent_field` | string | 可选。检查矩阵 / 表格字段的某一列时，父字段的 api_code |
        | `check_extended_text` | boolean | 可选。为 `true` 时检查该选项的「其他」补充填写内容是否有数据 |
        | `goods_item_dimension_options` | object | 可选。检查商品字段某个规格时，传规格维度与选项的对应关系 |
      schema:
        type: string
      example: '[{"field_api_code":"field_1"},{"field_api_code":"field_3","choice_value":"Yb2d"}]'
    FieldTypeChangeChecks:
      name: checks
      in: query
      required: true
      description: |
        要预览的类型转换，JSON 数组（1～20 项），每项一个字段：
        | 键 | 类型 | 说明 |
        |---|---|---|
        | `field_api_code` | string | 必填。要转换的字段 api_code |
        | `target_type` | string | 必填。目标字段类型，取值见 `GET /field_types`（表格见 `GET /field_types?kind=table`） |
        | `target_precision` | string | 可选。目标为 `DateTimeField` 时，编辑将使用的日期精度（`month` / `day` / `minute` / `second`），使预览与实际转换一致；其他情况忽略 |
      schema:
        type: string
      example: '[{"field_api_code":"field_1","target_type":"RadioButton"}]'
    FieldTypeKind:
      name: kind
      in: query
      required: false
      description: 传 `table` 时按数据表格可用的列类型回答；不传或其他值按表单可用的字段类型回答。
      schema:
        type: string
      example: table
    AggregateMetrics:
      name: metrics
      in: query
      required: false
      description: |
        必填。要计算的指标，JSON 数组，1～20 项，每项 `{"func": "<函数>", "field": "<api_code>"}`，缺失或为空返回 400。
        可用函数随字段而定（以字段的 `analytics.agg_funcs` 为准）：
        | 字段 | 函数 |
        |---|---|
        | 全部字段 | `count` `count_non_empty` `count_empty` |
        | 文本类 | 另加 `count_unique` |
        | 数字类 | 另加 `count_unique` `sum` `avg` `min` `max` `stddev` `median` `p25` `p75` `p90` |
        | 日期类 | 另加 `count_unique` `min` `max` |
      schema:
        type: string
      example: '[{"func":"sum","field":"field_5"},{"func":"count","field":"field_1"}]'
    AggregateDimensions:
      name: dimensions
      in: query
      required: false
      description: |
        分组字段，JSON 数组，最多 2 项，每项 `{"field": "<api_code>", "bucket": "<粒度>"}`。
        只有 `analytics.groupable` 为 true 的字段可以分组；日期字段必须带 `bucket`（`day` / `week` / `month`，按北京时间），非日期字段不能带 `bucket`。
      schema:
        type: string
      example: '[{"field":"field_3"},{"field":"created_at","bucket":"month"}]'
    AggregateLimit:
      name: limit
      in: query
      required: false
      description: 分组时最多返回的组数，缺省 20，最大 200（超过按 200 处理，小于 1 按缺省处理）。不分组时忽略。
      schema:
        type: integer
        default: 20
    SummaryFields:
      name: fields
      in: query
      required: false
      description: 只概括指定字段，值为字段 api_code，逗号分隔（或 `fields[]=` 重复传），按传入顺序返回。缺省为全部可分析字段。字段不可分析或无权读取时返回 400 并列出可分析字段。
      schema:
        type: string
      example: field_1,field_3
    SummaryIncludeOverview:
      name: include_overview
      in: query
      required: false
      description: 是否返回 `overview`（匹配条数与今日新增），缺省为 true。
      schema:
        type: boolean
        default: true
    EntriesIncludeLabels:
      name: include_labels
      in: query
      required: false
      description: |
        为 true 时，每条数据中表单字段的值改为 `{"label": "<字段标题>", "value": <原值>}`，免去再读一次表单结构。
        系统键（如 `serial_number`、`creator_id`、`token`）与考试 / 测评的 `<api_code>_extra_value` 保持原样。缺省为 false。
      schema:
        type: boolean
        default: false
    PageLimit:
      name: limit
      in: query
      required: false
      description: 每页条数，缺省 50，最大 1000（超过按 1000 处理）。传 0 时只返回 `total`，`data` 为空。
      schema:
        type: integer
        default: 50
    OffsetNext:
      name: next
      in: query
      required: false
      description: 上一页响应中的 `next`（行偏移量，从 0 开始），原样回传以取下一页。不能与 `skip` 同时传。
      schema:
        type: integer
        minimum: 0
    FormsSort:
      name: sort
      in: query
      required: false
      description: |
        排序规则，JSON 数组，每项 `{"field": "<字段>", "order": "asc"|"desc"}`（order 缺省 asc），按顺序生效。
        可排序字段：`created_at`、`last_entry_created_at`、`entries_count`；其他字段、非法 order 或无法解析的 JSON 返回 400。
        传 `sort` 后 `next` 变为 `row:<偏移量>` 形式的游标，只能用于同样 `sort` 的请求；值相同的行在翻页间可能出现顺序变化。
      schema:
        type: string
      example: '[{"field":"last_entry_created_at","order":"desc"}]'
    IncludeTransactions:
      name: include_transactions
      in: query
      required: false
      description: 为 `true` 时，已绑定收款账户（商户号 / 微信支付 / 支付宝）的表单附带 `transactions` 收款统计；未绑定的表单没有该键。缺省不附带。
      schema:
        type: boolean
        default: false
    EntryImportId:
      name: id
      in: path
      required: true
      description: 导入任务 ID（创建导入时返回的 `job_id`）
      schema:
        type: string
    TradeStartDate:
      name: start_date
      in: query
      required: false
      description: 起始日期（含），`YYYY-MM-DD`，按北京时间计。必须与 `end_date` 同时传，且不能晚于 `end_date`；只传其中一个或无法解析时返回 400。缺省范围见各接口说明。
      schema:
        type: string
      example: '2026-09-01'
    TradeEndDate:
      name: end_date
      in: query
      required: false
      description: 结束日期（含），`YYYY-MM-DD`，按北京时间计。必须与 `start_date` 同时传。
      schema:
        type: string
      example: '2026-09-30'
    TradePaidStatus:
      name: paid_status
      in: query
      required: false
      description: 只保留这些支付状态的订单，逗号分隔（或 `paid_status[]=` 重复传）：`paid`（已支付）、`unpaid`（未支付）、`refunded`（已退款）、`refunding`（退款中）、`partial_refunded`（部分退款）。含未知取值时返回 400；缺省不限状态（含未支付）。
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - paid
          - unpaid
          - refunded
          - refunding
          - partial_refunded
      example:
      - paid
      - refunding
    TradePaymentChannel:
      name: payment_channel
      in: query
      required: false
      description: 只保留通过该渠道支付的订单：`wxpay`（微信支付）、`alipay`（支付宝）。其他取值返回 400。
      schema:
        type: string
        enum:
        - wxpay
        - alipay
    TradeFormToken:
      name: form_token
      in: query
      required: false
      description: 只保留该收款表单的订单。表单 token（也接受 24 位十六进制的表单 id），可从 `GET /trade/merchant` 的 `payment_form_tokens` 取得；表单不存在或当前身份不可访问时返回 400。
      schema:
        type: string
    TradeInclude:
      name: include
      in: query
      required: false
      description: 返回内容：`both`（缺省）统计与记录都返回，`stats` 只返回统计，`records` 只返回记录。其他取值返回 400。
      schema:
        type: string
        enum:
        - both
        - stats
        - records
        default: both
    TradePageLimit:
      name: limit
      in: query
      required: false
      description: 每页条数，缺省且最大为 50（超过按 50 处理，小于 1 按缺省处理）。
      schema:
        type: integer
        default: 50
    TradePageNext:
      name: next
      in: query
      required: false
      description: 上一页响应中的 `next`（页码，从 1 开始），原样回传以取下一页；缺省取第 1 页。
      schema:
        type: integer
  responses:
    BadRequest:
      description: 请求参数或数据不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FormSettingBadRequest:
      description: 请求不符合本文档时为通用 error_description 结构；模型校验失败时为 errors/status 结构
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/FormSettingSaveFailed'
    Unauthorized:
      description: 未认证：令牌无效或已撤销，或 Basic 凭据错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: Invalid or revoked token
    PaymentRequired:
      description: 当前套餐不包含 API v1 能力
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权限：OAuth 令牌 scope 不足，或操作被业务规则拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: OAuth token scope is insufficient
    NotFound:
      description: 资源不存在或当前身份不可访问（个人令牌只能访问自己创建或被共享的表单）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: form cannot be found
    TooManyRequests:
      description: 超过速率限制
      headers:
        Retry-After:
          description: 多少秒后可重试
          schema:
            type: integer
        X-RateLimit-Limit:
          description: 当前周期（1 小时）额度
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: 当前周期剩余次数
          schema:
            type: integer
        X-RateLimit-Reset:
          description: 额度重置的 Unix 时间戳
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    EntryValidationFailed:
      description: '数据校验失败或参数不合法。字段校验失败时 `error_description` 是 `{ "<api_code>": ["错误信息"] }` 序列化后的 JSON 字符串'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: '{"field_2":["不能为空"]}'
    MerchantNotFound:
      description: 当前账号没有小金商户，因此没有小金商户的订单、退款与提现；入驻进度见 `GET /trade/merchant`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error_description
      properties:
        error_description:
          type: string
          description: 人可读的错误说明
    RateLimitError:
      type: object
      properties:
        error:
          type: string
          examples:
          - rate_limit_exceeded
        error_description:
          type: string
        retry_after:
          type: integer
          description: 多少秒后可重试
        limit:
          type: integer
        remaining:
          type: integer
        reset_at:
          type: string
          format: date-time
        plan:
          type: string
          description: 当前套餐代码
        upgrade_url:
          type: string
          format: uri
    Creator:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: 创建者姓名（无姓名时为昵称）
    FormSummary:
      type: object
      required:
      - name
      - token
      - tags
      - created_at
      - entries_count
      - last_entry_created_at
      - creator
      properties:
        name:
          type: string
          description: 表单名称（对外名称）
        token:
          type: string
        tags:
          type: array
          items:
            type: string
          description: 当前身份为该表单打的标签（企业令牌为所有成员的标签合集）
        created_at:
          type: string
          format: date-time
        entries_count:
          type: integer
          description: 表单数据量
        last_entry_created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 最近一次收到数据的时间（UTC）；从未收到数据时为 null
        creator:
          $ref: '#/components/schemas/Creator'
        transactions:
          $ref: '#/components/schemas/FormTransactions'
    FormListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: 满足条件的表单总数
        count:
          type: integer
          description: 本页条数
        data:
          type: array
          items:
            $ref: '#/components/schemas/FormSummary'
        next:
          type:
          - string
          - 'null'
          description: 下一页游标：默认排序下为表单 id，传 `sort` 时为 `row:<偏移量>`；末页为 null
    Form:
      type: object
      required:
      - name
      - token
      - url
      - description
      - fields
      - setting
      properties:
        name:
          type: string
        token:
          type: string
        url:
          type: string
          format: uri
          description: 表单对外填写地址（按企业账户的自定义域名 / 子域名生成，不能由 token 推算）
        description:
          type:
          - string
          - 'null'
          description: 表单描述（可能是 HTML 富文本）
        fields:
          type: array
          description: 字段列表，按表单中的顺序排列；每个元素是以字段 api_code 为唯一键的对象
          items:
            $ref: '#/components/schemas/FieldMap'
        setting:
          description: 表单设置；表单尚无设置时为空对象
          allOf:
          - $ref: '#/components/schemas/FormSetting'
    FieldMap:
      type: object
      description: 单键对象：键为字段 api_code，值为字段定义
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        $ref: '#/components/schemas/FieldDefinition'
      examples:
      - field_1:
          label: 姓名
          api_code_alias:
          type: single_line_text
          notes: ''
          private: false
          validation:
            required: true
    FieldDefinition:
      type: object
      description: |
        字段定义。所有字段都有 `label` / `api_code_alias` / `type` / `notes` / `private` / `validation`，其余属性按 `type` 出现。

        `type` 取值与字段的对应关系：
        | type | 字段 |
        |---|---|
        | `single_line_text` | 单行文字 |
        | `paragraph_text` | 多行文字 |
        | `name` / `id_card` / `mobile` / `email` / `phone` / `link` / `address` / `geo_location` | 姓名 / 身份证 / 手机 / 邮箱 / 电话 / 网址 / 地址 / 地理位置 |
        | `single_choice` / `multiple_choice` / `drop_down` / `cascade_drop_down` | 单选 / 多选 / 下拉 / 多级下拉（颜色标记也是 `drop_down`） |
        | `image_radio_button` / `image_check_box` | 图片单选 / 图片多选 |
        | `number` / `formula` / `rating` / `nps` / `boolean` | 数字 / 计算 / 评分 / NPS / 是否 |
        | `date_time` / `date` / `time` | 日期 / 日期（旧）/ 时间 |
        | `attachment` / `audio` / `e_signature` | 上传文件 / 语音 / 电子签名 |
        | `likert` / `matrix` / `matrix_scale` / `table` / `multiple_blanks` / `sort` | 矩阵单选 / 矩阵填空 / 矩阵量表 / 表格 / 横向填空 / 排序 |
        | `goods` / `reservation` | 商品 / 预约 |
        | `form_association` / `reversed_association` | 表单关联 / 反向关联 |
      required:
      - label
      - type
      - notes
      - private
      - validation
      properties:
        label:
          type: string
          description: 字段标题
        api_code_alias:
          type:
          - string
          - 'null'
          description: 字段 api_code 别名；配置后数据读写都以别名为键
        type:
          type: string
          description: 字段类型，取值见上表
        notes:
          type:
          - string
          - 'null'
          description: 字段说明（可能是 HTML 富文本）
        private:
          type: boolean
          description: 是否为隐藏字段
        validation:
          $ref: '#/components/schemas/FieldValidation'
        choices:
          type: array
          description: 选项（单选 / 多选 / 下拉 / 多级下拉 / 图片选择 / 矩阵单选 / 排序）
          items:
            $ref: '#/components/schemas/Choice'
        allow_other:
          type: boolean
          description: 是否含「其他」选项（选项类字段）
        statements:
          type: array
          description: 题目（矩阵单选 / 矩阵填空 / 矩阵量表）
          items:
            $ref: '#/components/schemas/Statement'
        dimensions:
          type: array
          description: 子字段（矩阵填空 / 矩阵量表 / 表格 / 横向填空），每项是以子字段 api_code 为键的单键对象，子字段只含通用属性
          items:
            $ref: '#/components/schemas/FieldMap'
        placeholder:
          type:
          - string
          - 'null'
          description: 横向填空的题干，空格以 `${field_x}$` 占位
        max_file_quantity:
          type: integer
          description: 附件字段：最多上传的文件数
        media_type:
          type: object
          description: 附件字段：允许的文件类型
          properties:
            type:
              type: string
              description: "`unlimited` 或具体类型分组"
            value:
              type: array
              items:
                type: string
        max_duration:
          type:
          - integer
          - 'null'
          description: 语音字段：最长时长（秒）
        precision:
          description: 日期字段为精度枚举（`month` / `day` / `minute` / `second` 等）；数字 / 计算字段为小数位数
          oneOf:
          - type: string
          - type: integer
        display_precision:
          type: integer
          description: 数字 / 计算字段：显示用小数位数
        display_as_percentage:
          type: boolean
        thousands_separator:
          type: boolean
        currency_symbol:
          type: string
        currency_symbol_position:
          type: string
          enum:
          - prefix
          - suffix
        formula:
          type:
          - string
          - 'null'
          description: 计算字段：服务端计算用的公式
        formula_display:
          type:
          - string
          - 'null'
          description: 计算字段：管理员可读的公式
        goods_items:
          type: array
          description: 商品字段：商品项目
          items:
            $ref: '#/components/schemas/GoodsItem'
        reservation_items:
          type: array
          description: 预约字段：预约项目
          items:
            $ref: '#/components/schemas/ReservationItem'
        associated_form_token:
          type:
          - string
          - 'null'
          description: 表单关联：被关联表单的 token
        associated_field_api_code:
          type: string
          description: 表单关联：只有一个关联键时给出
        associated_field_api_codes:
          type: array
          items:
            type: string
          description: 表单关联：全部关联键 api_code
        display_field_settings:
          type: array
          description: 表单关联：展示字段设置
          items:
            $ref: '#/components/schemas/DisplayFieldSetting'
        allow_reverse_association:
          type: boolean
          description: 表单关联：是否在被关联表单上显示反向关联
        reverse_display_field_api_codes:
          type: array
          items:
            type: string
          description: 表单关联：反向关联展示的字段 api_code，开启反向关联时给出
        rating_type:
          type: string
          description: 评分字段：外观（如 `star`）
        rating_max:
          type: integer
          description: 评分字段：量级
        range_max:
          type:
          - integer
          - 'null'
        minimum_ratings_display_text:
          type:
          - string
          - 'null'
          description: NPS 字段：最低分文案
        maximum_ratings_display_text:
          type:
          - string
          - 'null'
          description: NPS 字段：最高分文案
        highlight_color:
          type:
          - string
          - 'null'
          description: NPS 字段：高亮颜色
        include_second:
          type: boolean
          description: 时间字段：是否精确到秒（仅为 true 时出现）
        analytics:
          $ref: '#/components/schemas/FieldAnalytics'
      additionalProperties: true
    FieldValidation:
      type: object
      description: 字段校验规则，只有生效的规则才会出现
      properties:
        required:
          type: boolean
          description: 必填
        unique:
          type: boolean
          description: 不能与已有数据重复
        white_list_limit:
          type: boolean
          description: 开启了白名单限制
        access_control_list_limit:
          type: boolean
          description: 开启了白名单 / 黑名单限制
        access_control_type:
          type: string
          enum:
          - white
          - black
          description: 名单类型
        white_list_values:
          type: array
          items:
            type: string
          description: 白名单取值（单行文字 / 手机）
        acl_values:
          type: array
          items:
            type: string
          description: 名单取值（单行文字 / 手机）
        min_selected:
          type: integer
          description: 最少选几项（多选 / 图片多选 / 排序）
        max_selected:
          type: integer
          description: 最多选几项（多选 / 图片多选 / 排序）
        minimum_length:
          type: integer
          description: 最少字数（文本类）
        maximum_length:
          type: integer
          description: 最多字数（文本类）
        min:
          type: number
          description: 最小值（数字）
        max:
          type: number
          description: 最大值（数字）
        start:
          type: string
          description: 起始日期（日期字段）
        end:
          type: string
          description: 结束日期（日期字段）
      additionalProperties: true
    Choice:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: 选项显示值
        value:
          type: string
          description: 选项 api_code（写入数据时可用它或显示值）
        hidden:
          type: boolean
        quota:
          type:
          - integer
          - 'null'
          description: 选项名额（未设置或设置了隐藏名额时不出现）
        operand_value:
          type: number
          description: 选项赋值
        allow_extended_text:
          type: boolean
          description: 选中后可补充文本
        extended_text_required:
          type: boolean
        is_other:
          type: boolean
          description: 是否为「其他」选项
        image_url:
          type:
          - string
          - 'null'
          description: 图片选项的图片地址
        large_path:
          type:
          - string
          - 'null'
          description: 图片选项的大图地址
        sub_choices:
          type: array
          description: 下级选项（多级下拉）
          items:
            $ref: '#/components/schemas/Choice'
      additionalProperties: true
    Statement:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: 题目文字
        value:
          type: string
          description: 题目 api_code
    GoodsItem:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
          description: 商品 api_code
        description:
          type:
          - string
          - 'null'
        inventory:
          type:
          - integer
          - 'null'
        hidden:
          type: boolean
        price:
          type:
          - number
          - 'null'
          description: 无规格时的价格；有规格时为 null
        original_price:
          type:
          - number
          - 'null'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/GoodsSku'
    GoodsSku:
      type: object
      properties:
        spec:
          type: object
          additionalProperties:
            type: string
          description: 规格，键为规格维度名、值为规格选项
        price:
          type:
          - number
          - 'null'
        original_price:
          type:
          - number
          - 'null'
        inventory:
          type:
          - integer
          - 'null'
    ReservationItem:
      type: object
      required:
      - name
      - value
      - hidden
      properties:
        name:
          type: string
        value:
          type: string
          description: 预约项目 api_code
        hidden:
          type: boolean
    DisplayFieldSetting:
      type: object
      properties:
        api_code:
          type: string
        public_display:
          type: boolean
        privacy_safe:
          type: boolean
      additionalProperties: true
    EntryData:
      type: object
      description: |
        一条数据。键为字段 api_code（配置了 api_code_alias 的字段以别名为键），另有以下系统键：
        `token`、`serial_number`、`created_at`、`updated_at`、`creator_name`（提交人姓名）、`color_mark`（颜色标记）、
        `info_filling_duration`（填写时长，秒）、`info_platform`、`info_os`、`info_browser`、`info_region`（`{country, province, city}`）、`info_remote_ip`，
        以及按表单能力出现的 `gen_code`（确认码）、`total_price` / `preferential_price`（有商品时）、`x_field_weixin_*`（微信信息）、`referral_link` 等。
        考试 / 测评题目还会多出 `<api_code>_extra_value: { correct_answer, score }`；反向关联字段多出 `<api_code>_entries`，关联字段多出 `<api_code>_related_entries`。

        各类型字段值的形态：
        | 字段 | 值 |
        |---|---|
        | 单行 / 多行文字、姓名、手机、邮箱、电话、网址、身份证 | 字符串 |
        | 单选、下拉、图片单选 | 选项显示值（字符串） |
        | 多选、图片多选 | 选项显示值数组 |
        | 多级下拉 | `{"level_1": "...", "level_2": "..."}` |
        | 数字、评分、NPS、计算 | 数字（评分可能为字符串） |
        | 是否 | 布尔 |
        | 日期 | 按精度格式化的北京时间字符串，如 `2021-09-23` |
        | 时间 | `HH:MM` 或 `HH:MM:SS` |
        | 上传文件 | 下载地址数组（带签名，10 年有效） |
        | 电子签名 | 下载地址字符串 |
        | 语音 | `{"url": "...", "audio_text": "..."}` |
        | 地址 | `{"province","city","district","street"}` |
        | 地理位置 | `{"longitude","latitude","address"}` |
        | 商品 | `[{"name","number","price","original_price","inventory","layout","spec"?}]` |
        | 矩阵填空 / 矩阵量表 | `[{"statement": "题目", "dimensions": {"列名": 值}}]` |
        | 矩阵单选 | `[{"statement": "题目", "choice": "选项"}]`（多选样式为 `choices` 数组） |
        | 表格 | `[{"列名": 值}]`（每行一个对象，空值省略） |
        | 横向填空 | `{"<子字段 api_code>": "..."}` |
        | 排序 | `[{"rank": 1, "choice": "选项"}]` |
        | 预约 | `[{"item_name","scheduled_label","number", ...}]` |
        | 表单关联 | 关联数据的显示值字符串 |
        | 关联（表格） | 关联表格中被关联数据的序号数组，如 `[1, 3]`；另附 `<api_code>_related_entries`：`[{"serial_number": 1, "value": "..."}]`，value 为该数据第一列的值 |
        请求带 `include_labels=true` 时，表单字段的值包装为 `{label, value}`。
      required:
      - token
      - serial_number
      properties:
        token:
          type: string
          description: 数据唯一标识
        serial_number:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        creator_name:
          type: string
        color_mark:
          type: string
        info_filling_duration:
          type: number
        info_platform:
          type: string
        info_os:
          type: string
        info_browser:
          type: string
        info_region:
          type: object
          properties:
            country:
              type: string
            province:
              type: string
            city:
              type: string
        info_remote_ip:
          type: string
      additionalProperties: true
      examples:
      - token: kjFelJqi
        serial_number: 36
        field_1: 张三
        field_3:
        - 选项 A
        - 选项 B
        field_9: 198
        field_12: '2021-09-23'
        creator_name: ''
        created_at: '2021-09-28T02:59:42.539Z'
        updated_at: '2021-09-28T02:59:42.539Z'
        info_filling_duration: 193.51
        info_remote_ip: 127.0.0.1
    Entry:
      type: object
      required:
      - form
      - form_name
      - entry
      properties:
        form:
          type: string
          description: 表单 token
        form_name:
          type: string
        entry:
          $ref: '#/components/schemas/EntryData'
        url:
          type: string
          format: uri
          description: 该条数据在金数据数据页中的打开地址（表单为数据页、表格为表格页，定位到该条序号），给用户核对用。只在获取、新增、更新单条数据的响应中出现；列表与批量接口不返回；快捷收款表单的数据没有该键。
      examples:
      - form: kjFelJqi
        form_name: 报名表
        entry:
          token: kjFelJqi
          serial_number: 36
          field_1: 张三
        url: https://next.jinshuju.net/forms/kjFelJqi/entries?serial_number=36
    EntryListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: 满足条件的数据总数
        count:
          type: integer
          description: 本页条数
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntryData'
        next:
          type:
          - integer
          - 'null'
          description: 下一页游标（默认排序下为序号，其他情况为行偏移量）；末页为 null
    EntryInput:
      type: object
      description: |
        写入数据时的字段值，键为字段 api_code 或 api_code_alias。未知键与不可写字段（签名、计算）被忽略。
        选项类字段可传选项 api_code 或显示值，多级下拉与选项补充文本见下表；数字字段接受数字或数字字符串。

        | 字段 | 写法 |
        |---|---|
        | 单行 / 多行文字、姓名、手机、邮箱、电话、网址、身份证 | 字符串 |
        | 单选、下拉 | `"选项 api_code"` 或 `"选项显示值"`；补充文本用 `"<api_code>_extended_text": {"<选项>": "补充"}`，「其他」文本用 `"<api_code>_other": "..."` |
        | 多选 | 数组，元素同上 |
        | 图片单选 / 图片多选 | 选项 api_code（字符串 / 数组） |
        | 多级下拉 | `{"level_1": "...", "level_2": "..."}`（api_code 或显示值） |
        | 数字、评分、NPS | 数字 |
        | 是否 | 布尔 |
        | 日期 | `"2012-12-25"` 或 `"2012-12-25 12:13:15"`（北京时间） |
        | 时间 | `{"hour": "12", "minute": "15"}` |
        | 地址 | `{"province","city","district","street"}` |
        | 地理位置 | `{"longitude","latitude","address"}` |
        | 上传文件（可多个） | 数组，元素可为：已上传附件的 id；本表单已有附件的下载地址（用于保留）；`{"base64": "...", "file_name": "a.png", "content_type": "image/png"}`（≤ 5MB，`base64` 也可为 data URI）；`{"attachment_token": "..."}`（预上传令牌） |
        | 商品 | `[{"value": "商品 api_code", "number": 2, "specification": {"规格维度": "选项"}?}]` |
        | 矩阵填空 / 矩阵量表 | `{"<题目 api_code>": {"<列 api_code>": 值}}` |
        | 矩阵单选 | `{"<题目 api_code>": "选项 api_code"}` |
        | 表格 | `[{"<列 api_code>": 值}, ...]`，附件列写法同上传文件 |
        | 横向填空 | `{"<子字段 api_code>": "..."}` |
        | 排序 | 有序数组 `["选项 api_code", ...]` |
        | 表单关联 | 关联数据的 token / id，或用关联键匹配的显示值（多个关联键传数组） |
        | 预约 | `[{"api_code": "项目", "scheduled_at": "2021-04-26", "end_at"?: "...", "number": 1}]` |
        | 颜色标记 | `"color_mark": "<颜色 api_code 或名称>"` |
        | 国际手机号 | 另传 `"<api_code>_country_id"` / `"<api_code>_country_code"` |
      additionalProperties: true
      examples:
      - field_1: 张三
        field_2: '13800000000'
        field_3:
        - 选项 A
        - 选项 B
        field_4: '2024-05-01'
        field_5:
        - 5f3a1b2c4d5e6f7a8b9c0d1e
        - base64: iVBORw0KGgo...
          file_name: photo.png
          content_type: image/png
