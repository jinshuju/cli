            type:
              type: string
              enum:
              - by_day_repeat_weekly
              - by_time_range_repeat_daily
          discriminator:
            propertyName: type
            mapping:
              by_day_repeat_weekly: "#/components/schemas/ReservationByDayQuotaInput"
              by_time_range_repeat_daily: "#/components/schemas/ReservationByTimeRangeQuotaInput"
          oneOf:
          - $ref: '#/components/schemas/ReservationByDayQuotaInput'
          - $ref: '#/components/schemas/ReservationByTimeRangeQuotaInput'
    FormSettingWriteInput:
      type: object
      description: |
        创建 / 编辑表单时的 `setting`，只接受以下键，其他键忽略。写入的是「结果状态」：省略的键保持原值，传 `null` 表示清除。
        - 只传 `success_message` 会自动把 `success_message_style` 设为 `text`；只传 `success_message_rich_text` 则设为 `rich_text`。
        - `submission_region_limited=true` 需要套餐包含「填写地域限制」，且 `submission_regions` 至少一项。
        - `merchant_account_id`（小金商户）不能与 `wxpay_account_id` / `alipay_account_id` 同时绑定；新传入的支付账户必须属于当前企业账户，绑定后 `payment_way` 自动为 `third_party`。
        - `notification_rules` 整体替换由 API 创建的通知规则（传 `[]` 即清空），不影响桌面端创建的规则。
      properties:
        success_message:
          type: string
        success_message_rich_text:
          type: string
        success_message_style:
          type: string
          enum:
          - text
          - rich_text
        entry_submit_mode:
          type: string
        success_redirect_url:
          type: string
        success_redirect_fields:
          type: array
          items:
            type: string
        open_entry_action:
          type: string
        open_entry_message:
          type: string
        open_entry_cancel_reservation:
          type: boolean
        show_serial_number_on_success:
          type: boolean
        show_submit_again:
          type: boolean
        hide_login_and_signup:
          type: boolean
        show_close_count_down:
          type: boolean
        show_form_before_open:
          type: boolean
        manually_close_rule:
          type:
          - object
          - 'null'
          properties:
            closed:
              type: boolean
          additionalProperties: false
        by_time_range_close_rule:
          type:
          - object
          - 'null'
          properties:
            start_time:
              type: string
              format: date-time
            end_time:
              type: string
              format: date-time
          additionalProperties: false
        by_entries_close_rule:
          type:
          - object
          - 'null'
          properties:
            limit:
              type: integer
          additionalProperties: false
        fill_frequency:
          type:
          - object
          - 'null'
          description: 只接受 `condition` `fill_type` `cycle_period` `limited_time` `cycles_per_period` `limited_field_api_codes`
          properties:
            fill_type:
              type: string
              enum:
              - unlimited
              - once
              - repeatable
              - repeatable_by_day
              - custom_repeatable
            condition:
              type: string
              enum:
              - by_weixin
