      - api_code
      properties:
        api_code:
          type: string
          description: 要修改的字段 api_code
        type:
          type: string
          enum:
          - TextField
          - TextArea
          - NumberField
          - EmailField
          - MobileField
          - IdCardField
          - NameField
          - RadioButton
          - CheckBox
          - DropDown
          - DateTimeField
          - RatingField
          - TableField
          - TelephoneField
          - AddressField
          - AttachmentField
          - GeoField
          - LinkField
          - NpsField
          - TimeField
          - SortField
          - ESignatureField
          - AudioField
          - CascadeDropDown
          - LikertField
          - MatrixField
          - MatrixScaleField
          - GoodsField
          - FormulaField
          - ReservationField
          - FormAssociation
          - ImageRadioButton
          - ImageCheckBox
          - SectionBreak
          - PageBreak
          - WidgetButton
          - WidgetContact
          - WidgetMap
          - WidgetMarquee
