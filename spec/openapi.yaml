    TradeMerchant:
      type: object
      required:
      - merchant
      - subject
      - contact
      - balance
      - settlement
      - channels
      - freeze
      - applied_at
      - merchant_stage
      - payment_form_tokens
      - transactions_amount
      - rejected_reason
      - guidance
      properties:
        merchant:
          type:
          - object
          - 'null'
          description: Merchant profile; null when there is no 小金商户
          required:
          - merchant_no
          - merchant_name
          - merchant_type
          - created_at
          - industry
          - address
          - avatar_url
          properties:
            merchant_no:
              type:
              - string
              - 'null'
              description: Merchant number
            merchant_name:
              type:
              - string
              - 'null'
              description: Merchant name
            merchant_type:
              type: string
              enum:
              - business
              - micro
              description: 'Merchant type: business (enterprise), micro (micro merchant)'
            created_at:
              type:
              - string
              - 'null'
              format: date-time
              description: When the merchant was activated
            industry:
              type:
              - string
              - 'null'
              description: Business category
            address:
              type: string
              description: Business address (region joined with the detailed address)
            avatar_url:
              type:
              - string
              - 'null'
              description: Merchant avatar URL
        subject:
          type:
          - object
          - 'null'
          description: Legal entity details; null when there is no 小金商户
          required:
          - subject_type
          - subject_name
          - license_no
          - license_image_url
          - legal_name
          - legal_licence_no
          properties:
            subject_type:
              type:
              - string
              - 'null'
              description: Entity type code, e.g. `ENTERPRISE` (enterprise), `INDIVIDUAL` (individual business), `INSTITUTION` (public institution / government agency), `COMMUNITY` (social organization), `PEOPLE_RUN_NON_ENTERPRISE` (private non-enterprise unit), `PERSON` (individual, micro merchant)
            subject_name:
              type:
              - string
              - 'null'
              description: Entity name
            license_no:
              type:
              - string
              - 'null'
              description: Business license number
            license_image_url:
              type:
              - string
              - 'null'
              description: Business license image URL
            legal_name:
              type:
              - string
              - 'null'
              description: Legal representative's name
            legal_licence_no:
              type:
              - string
              - 'null'
              description: Legal representative's ID number (masked)
        contact:
          type:
          - object
          - 'null'
          description: Contact details; null when there is no 小金商户
          required:
          - customer_service_phone
          - customer_service_phone_under_review
          - manager_name
          - manager_email
          - manager_phone
          properties:
            customer_service_phone:
              type:
              - string
              - 'null'
              description: Customer service phone (masked)
            customer_service_phone_under_review:
              type: boolean
              description: Whether a change request for the customer service phone is still under review
            manager_name:
              type:
              - string
              - 'null'
              description: Contact name
            manager_email:
              type:
              - string
              - 'null'
              description: Contact email (masked)
            manager_phone:
              type:
              - string
              - 'null'
              description: Contact mobile number (masked)
        balance:
          type:
          - object
          - 'null'
          description: Balance; null when there is no 小金商户 or the balance lookup failed (a failed lookup does not mean the balance is 0)
          required:
          - settleable_amount
          - unsettled_amount
          properties:
            settleable_amount:
              type:
              - number
              - 'null'
              description: Amount available for payout, in yuan (CNY)
            unsettled_amount:
              type:
              - number
              - 'null'
              description: Amount awaiting settlement, in yuan (CNY)
        settlement:
          type:
          - object
          - 'null'
          description: Settlement details; null when there is no 小金商户
          required:
          - fee_rate
          - method
          - bank_name
          - bank_account_name
          - bank_card_no
          - latest_settleable_date
          properties:
            fee_rate:
              type: number
              description: Fee rate as a percentage (1.49 means 1.49%)
            method:
              type: string
              description: Settlement method, e.g. `D+1 自助结算`
            bank_name:
              type:
              - string
              - 'null'
              description: Settlement bank
            bank_account_name:
              type:
              - string
              - 'null'
              description: Settlement account name (the entity name)
            bank_card_no:
              type:
              - string
              - 'null'
              description: Settlement bank card number (masked)
            latest_settleable_date:
              type:
              - string
              - 'null'
              format: date
              description: Latest settlement date a payout can cover now
        channels:
          type: array
          description: Payment channels the merchant has, and their authorization; an empty array when there is no 小金商户
          items:
            type: object
            required:
            - channel
            - authorized
            - authorize_state
            - channel_merchant_no
            properties:
              channel:
                type:
                - string
                - 'null'
                enum:
                - wxpay
                - alipay
                -
                description: Payment channel
              authorized:
                type: boolean
                description: Whether the channel is authorized; an unauthorized WeChat channel cannot receive WeChat Pay payments
              authorize_state:
                type:
                - string
                - 'null'
                enum:
                - AUTHORIZE_STATE_UNAUTHORIZED
                - AUTHORIZE_STATE_AUTHORIZED
                - CLOSED
                - SMID_NOT_EXIST
                -
                description: Channel authorization state code
              channel_merchant_no:
                type:
                - string
                - 'null'
                description: Merchant number on the channel
        freeze:
          type:
          - object
          - 'null'
          description: Freeze state; null when there is no 小金商户
          required:
          - pay_frozen
          - pay_frozen_reason
          - payout_frozen
          - payout_frozen_reason
          - yeepay_status
          - yeepay_status_reasons
          properties:
            pay_frozen:
              type: boolean
              description: Whether payment collection is frozen
            pay_frozen_reason:
              type:
              - string
              - 'null'
              description: Explanation of the payment collection freeze / unfreeze
            payout_frozen:
              type: boolean
              description: Whether payouts are frozen
            payout_frozen_reason:
              type:
              - string
              - 'null'
              description: Explanation of the payout freeze / unfreeze
            yeepay_status:
              type:
              - string
              - 'null'
              enum:
              - ACTIVE
              - FROZEN
              - OPERATION_EXCEPTION
              -
              description: 'Merchant status at the payment provider: ACTIVE (normal), FROZEN (frozen), OPERATION_EXCEPTION (abnormal operation)'
            yeepay_status_reasons:
              type: array
              description: Status reason codes from the payment provider (e.g. `SILENT_MERCHANT`, dormant merchant)
              items:
                type: string
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the onboarding application was submitted; null when there is no application
        merchant_stage:
          type: string
          enum:
          - no_application
          - processing
          - rejected
          - pay_frozen
          - silent
          - approved_no_form
          - has_form_no_income
          - payout_frozen
          - receiving
          description: |
            Onboarding progress: `no_application` not applied yet; `processing` application submitted and under review (merchant not activated yet); `rejected` application rejected (see `rejected_reason`);
            `pay_frozen` payment collection frozen; `silent` flagged by the payment provider as a dormant merchant with abnormal operation, cannot collect payments until unfrozen; `approved_no_form` merchant activated but no payment form bound yet;
            `has_form_no_income` payment form bound but no successful payment yet; `payout_frozen` can collect payments but payouts are frozen; `receiving` collecting payments normally.
        payment_form_tokens:
          type: array
          description: Tokens of the payment forms bound to this merchant that the current identity can access (quick payment forms included)
          items:
            type: string
        transactions_amount:
          type: number
          description: 'Lifetime transaction amount, in yuan (CNY): the amount of paid-type orders over all time minus successful refunds. For totals by date range or by group, use `GET /trade/transactions/aggregate`'
        rejected_reason:
          type:
          - string
          - 'null'
          description: Why the onboarding application was rejected; set only when `merchant_stage` is `rejected`
        guidance:
          type: object
          description: URLs for the next step; null when not applicable
          required:
          - register_url
          - elec_sign_url
          - wechat_verify_qr_url
          properties:
            register_url:
              type:
              - string
              - 'null'
              format: uri
              description: URL of the page to apply for onboarding / resubmit after a rejection; set only when `merchant_stage` is `no_application` or `rejected`
            elec_sign_url:
              type:
              - string
              - 'null'
              description: E-signing URL; set only when the application has passed review and an enterprise entity is waiting to sign
            wechat_verify_qr_url:
              type:
              - string
              - 'null'
              description: QR code URL for WeChat real-name verification; set only when the channel is registered and waiting for WeChat verification
      examples:
      - merchant:
        subject:
        contact:
        balance:
        settlement:
        channels: []
        freeze:
        applied_at:
        merchant_stage: no_application
        payment_form_tokens: []
        transactions_amount: 0.0
        rejected_reason:
        guidance:
          register_url: https://jinshuju.net/trade?openRegister=true
          elec_sign_url:
          wechat_verify_qr_url:
