      operationId: listOpensearchQueries
      parameters:
      - name: form_token
        in: query
        required: false
        description: 按表单 token 过滤
        schema:
          type: string
      responses:
        '200':
          description: 对外查询列表
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: 返回的查询数量
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - OpenSearch
      summary: 创建对外查询
      description: 为 form_token 指定的表单创建对外查询，创建者为当前调用者。调用者必须能管理该表单：无权访问返回 404，能读取但不能管理返回 403； 当前套餐不含对外查询功能返回 402。 search_field_rules 中引用的字段必须是该表单可查询的字段，display_field_rules 中的必须是可展示的字段，否则返回 400 并列出可用的 api_code； search_field_rules / display_field_rules 传入时不能为空数组；scope_conditions 需要套餐支持限定可查询数据范围。 保存后异步生成预览图。 OAuth 令牌需要 scope：forms。
      operationId: createOpensearchQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OpensearchQueryInput'
              - type: object
                required:
                - form_token
                - name
                - display_field_rules
                properties:
                  form_token:
                    type: string
                    description: 所属表单的 token（也可作为 query 参数传递）
      responses:
        '201':
          description: 创建成功，返回对外查询详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
