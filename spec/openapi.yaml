          - object
          - 'null'
          description: 余额；没有小金商户或余额查询失败时为 null（查询失败不代表余额为 0）
          required:
          - settleable_amount
          - unsettled_amount
          properties:
            settleable_amount:
              type:
              - number
              - 'null'
              description: 可提现金额（元）
            unsettled_amount:
              type:
              - number
              - 'null'
              description: 待结算金额（元）
        settlement:
          type:
          - object
          - 'null'
          description: 结算信息；没有小金商户时为 null
          required:
          - fee_rate
          - method
          - bank_name
          - bank_account_name
          - bank_card_no
          - latest_settleable_date
          properties:
            fee_rate:
              type: number
              description: 手续费率，百分数（1.49 表示 1.49%）
            method:
              type: string
              description: 结算方式，如 `D+1 自助结算`
            bank_name:
              type:
              - string
              - 'null'
              description: 结算银行
            bank_account_name:
              type:
              - string
              - 'null'
              description: 结算账户名（即主体名称）
            bank_card_no:
              type:
              - string
              - 'null'
              description: 结算银行卡号（打码）
            latest_settleable_date:
              type:
              - string
              - 'null'
              format: date
              description: 当前提现最晚可覆盖到的结算日期
        channels:
          type: array
          description: 商户开通的支付渠道及授权情况；没有小金商户时为空数组
          items:
            type: object
            required:
            - channel
            - authorized
            - authorize_state
            - channel_merchant_no
            properties:
              channel:
                type:
                - string
                - 'null'
                enum:
                - wxpay
                - alipay
                -
                description: 支付渠道
              authorized:
                type: boolean
                description: 渠道是否已授权；未授权的微信渠道收不到微信支付的款
              authorize_state:
                type:
                - string
                - 'null'
                enum:
                - AUTHORIZE_STATE_UNAUTHORIZED
                - AUTHORIZE_STATE_AUTHORIZED
                - CLOSED
                - SMID_NOT_EXIST
                -
                description: 渠道授权状态代码
              channel_merchant_no:
                type:
                - string
                - 'null'
                description: 渠道商户号
        freeze:
          type:
          - object
          - 'null'
          description: 冻结状态；没有小金商户时为 null
          required:
          - pay_frozen
          - pay_frozen_reason
          - payout_frozen
          - payout_frozen_reason
          - yeepay_status
          - yeepay_status_reasons
          properties:
            pay_frozen:
              type: boolean
              description: 收款是否被冻结
            pay_frozen_reason:
              type:
              - string
              - 'null'
              description: 收款冻结 / 解冻的说明
            payout_frozen:
              type: boolean
              description: 提现是否被冻结
            payout_frozen_reason:
              type:
              - string
              - 'null'
              description: 提现冻结 / 解冻的说明
            yeepay_status:
              type:
              - string
              - 'null'
              enum:
              - ACTIVE
              - FROZEN
              - OPERATION_EXCEPTION
              -
              description: 支付服务商侧的商户状态：ACTIVE 正常、FROZEN 冻结、OPERATION_EXCEPTION 经营异常
            yeepay_status_reasons:
              type: array
              description: 支付服务商给出的状态原因代码（如 `SILENT_MERCHANT` 沉默商户）
              items:
                type: string
        applied_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 入驻申请的提交时间；没有申请时为 null
        merchant_stage:
          type: string
          enum:
          - no_application
          - processing
          - rejected
          - pay_frozen
          - silent
          - approved_no_form
          - has_form_no_income
          - payout_frozen
          - receiving
          description: |
            入驻进度：`no_application` 尚未申请；`processing` 已提交申请、审核中（商户尚未开通）；`rejected` 申请被驳回（见 `rejected_reason`）；
            `pay_frozen` 收款被冻结；`silent` 被支付服务商判定为沉默商户、经营异常，完成解冻前不能收款；`approved_no_form` 商户已开通但还没有绑定收款表单；
            `has_form_no_income` 已绑定收款表单但还没有成功收款；`payout_frozen` 可以收款但提现被冻结；`receiving` 正常收款中。
        payment_form_tokens:
          type: array
          description: 绑定到该商户、且当前身份可访问的收款表单 token（含快速支付）
          items:
            type: string
        transactions_amount:
          type: number
          description: 累计交易金额（元）：全部时间内已支付类订单的金额减去成功退款。按日期范围或分组统计请用 `GET /trade/transactions/aggregate`
        rejected_reason:
          type:
          - string
          - 'null'
          description: 入驻申请被驳回的原因；`merchant_stage` 为 `rejected` 时才有值
        guidance:
          type: object
          description: 下一步操作的入口地址，不适用时为 null
          required:
          - register_url
          - elec_sign_url
          - wechat_verify_qr_url
          properties:
            register_url:
              type:
              - string
              - 'null'
              format: uri
              description: 申请入驻 / 驳回后重新提交的页面地址；`merchant_stage` 为 `no_application` 或 `rejected` 时才有值
            elec_sign_url:
              type:
              - string
              - 'null'
              description: 电子签约地址；申请已通过审核、企业主体等待签约时才有值
            wechat_verify_qr_url:
              type:
              - string
              - 'null'
              description: 微信实名认证二维码地址；渠道已登记、等待微信认证时才有值
      examples:
      - merchant:
        subject:
        contact:
        balance:
        settlement:
        channels: []
        freeze:
        applied_at:
        merchant_stage: no_application
        payment_form_tokens: []
        transactions_amount: 0.0
        rejected_reason:
        guidance:
          register_url: https://jinshuju.net/trade?openRegister=true
          elec_sign_url:
          wechat_verify_qr_url:
    SMSAuditStatusResponse:
      type: object
      required:
      - signatures
      properties:
        signatures:
          type: array
          description: 当前用户的短信签名，按创建时间倒序
          items:
            $ref: '#/components/schemas/SMSSignatureAuditStatus'
      examples:
      - signatures:
        - signature: 金数据
          status: SUCCESS
          reason:
          templates:
          - content: 您的验证码是#code#，5 分钟内有效。
            status: SUCCESS
            reason:
          - content: 您报名的活动将于明天开始，请准时参加。
            status: FAIL
            reason: 模板内容缺少签名对应的主体信息
    SMSSignatureAuditStatus:
      type: object
      required:
      - signature
      - status
      - reason
      - templates
      properties:
        signature:
          type: string
          description: 签名内容
        status:
          type: string
          enum:
          - CHECKING
          - SUCCESS
          - FAIL
          description: 审核状态：CHECKING 审核中、SUCCESS 已通过、FAIL 未通过
        reason:
          type:
          - string
          - 'null'
          description: 审核说明，未通过时为原因
        templates:
          type: array
          description: 该签名下的短信模板
          items:
            $ref: '#/components/schemas/SMSTemplateAuditStatus'
    SMSTemplateAuditStatus:
      type: object
      required:
      - content
      - status
      - reason
      properties:
        content:
          type:
          - string
          - 'null'
          description: 模板内容
        status:
          type:
          - string
          - 'null'
          enum:
          - CHECKING
          - SUCCESS
          - FAIL
          -
          description: 审核状态：CHECKING 审核中、SUCCESS 已通过、FAIL 未通过；尚未提交审核时为 null
        reason:
          type:
          - string
          - 'null'
          description: 审核说明，未通过时为原因
    BillingAccountInvoice:
      type: object
      required:
      - created_at
      - amount
      - organization
      - dedicated_invoice
      properties:
        created_at:
          type: string
          format: date-time
          description: 申请开票时间，ISO 8601，带时区偏移（北京时间，如 `2024-03-08T14:12:41+08:00`）
        amount:
          type:
          - number
          - 'null'
          description: 开票金额（元，保留两位小数）
        organization:
          type:
          - string
          - 'null'
          description: 发票抬头（单位名称）；抬头已删除时为 null
        dedicated_invoice:
          type: boolean
          description: 是否增值税专用发票
      examples:
      - created_at: '2024-03-08T14:12:41+08:00'
        amount: 3600.0
        organization: 某某科技有限公司
        dedicated_invoice: false
    BillingAccountInvoicesResponse:
      type: object
      required:
      - invoices
      - uninvoiced_amount
      properties:
        invoices:
          type: object
          required:
          - count
          - records
          properties:
            count:
              type: integer
              description: 发票数量
            records:
              type: array
              description: 按申请时间倒序
              items:
                $ref: '#/components/schemas/BillingAccountInvoice'
        uninvoiced_amount:
          type: object
          description: 可开票但尚未开票的消费
          required:
          - total
          - transaction_count
          properties:
            total:
              type: number
              description: 未开票金额合计（元，保留两位小数）
            transaction_count:
              type: integer
              description: 未开票的消费笔数
    BillingAccountPaymentHistory:
      type: object
      required:
      - id
      - created_at
      - verb
      - description
      - amount
      - balance
      properties:
        id:
          type: string
          description: 记录 ID
        created_at:
          type: string
          format: date-time
          description: 发生时间，ISO 8601，带时区偏移（北京时间，如 `2024-03-13T17:20:11+08:00`）
        verb:
          type: string
          description: 记录类型，取值见 `verb` 参数
        description:
          type:
          - string
          - 'null'
          description: 记录说明，按记录类型生成（如所购套餐名称、短信条数、成员数量），没有说明时为 null
        amount:
          type:
          - number
          - 'null'
          description: 金额（元，保留两位小数），充值为正、消费为负
        balance:
          type:
          - number
          - 'null'
          description: 该笔发生后的账户余额（元，保留两位小数）
      examples:
      - id: 65f1c2a3b4c5d6e7f8a9b0c1
        created_at: '2024-03-13T17:20:11+08:00'
        verb: sms_charge
        description: 购买短信
        amount: -100.0
        balance: 900.0
    BillingAccountBalance:
      type: object
      description: 账户余额与各项配额的剩余量（套餐内 + 已购）
      required:
      - amount
      - entry_quota
      - sms_count
      - ai_points_count
      - active_mail_count
      - storage_quota_count
      - audio_quota_count
      - entry_transaction_quota_count
      properties:
        amount:
          type:
          - number
          - 'null'
          description: 账户余额（元，保留两位小数）
        entry_quota:
          type: integer
          description: 本月剩余数据条数
        sms_count:
          type: integer
          description: 剩余短信条数
        ai_points_count:
          type: integer
          description: 剩余 AI 点数
        active_mail_count:
          type: integer
          description: 剩余邮件条数
        storage_quota_count:
          type: number
          description: 剩余附件空间（MB，可能带小数）
        audio_quota_count:
          type: integer
          description: 剩余语音时长（分钟，按秒数四舍五入）
        entry_transaction_quota_count:
          type:
          - number
          - string
          description: 剩余收款额度（元，保留两位小数）；套餐不限额时为字符串 `无限额`
      examples:
      - amount: 900.0
        entry_quota: 9800
        sms_count: 1200
        ai_points_count: 500
        active_mail_count: 300
        storage_quota_count: 2048
        audio_quota_count: 60
        entry_transaction_quota_count: 无限额
    BillingAccountPaymentStatistics:
      type: object
      description: 对本次返回记录的汇总
      required:
      - total_consumption
      - total_recharge
      - verb_distribution
      properties:
        total_consumption:
          type: number
          description: 消费合计（元，正数）
        total_recharge:
          type: number
          description: 充值合计（元）
        verb_distribution:
          type: object
          description: 各类型的记录数，键为 `verb`
          additionalProperties:
            type: integer
      examples:
      - total_consumption: 200.0
        total_recharge: 1000.0
        verb_distribution:
          charge: 1
          sms_charge: 2
    BillingAccountPaymentHistoriesResponse:
      type: object
      required:
      - payment_history
      properties:
        payment_history:
          type: object
          required:
          - total_records
          - returned_records
          - records
          properties:
            total_records:
              type: integer
              description: 满足条件的记录总数
            returned_records:
              type: integer
              description: 本次返回的数量
            records:
              type: array
              description: 按发生时间倒序
              items:
                $ref: '#/components/schemas/BillingAccountPaymentHistory'
        current_balance:
          $ref: '#/components/schemas/BillingAccountBalance'
          description: 只在 `include_balance=true` 时出现
        statistics:
          $ref: '#/components/schemas/BillingAccountPaymentStatistics'
          description: 只在本次有返回记录时出现
    RelationFieldInput:
      type: object
      title: RelationFieldInput
      description: RelationField 字段
      additionalProperties: false
      required:
      - type
      - label
      properties:
        type:
          const: RelationField
        label:
          type: string
          description: 字段标题
        cid:
          type: string
          description: 本次请求内的临时标识，供公式等引用
        notes:
          type: string
          description: 字段说明
        private:
          type: boolean
          description: 隐藏字段；隐藏字段不加必填校验
        required:
          type: boolean
          description: 必填
        position:
          type: integer
          minimum: 0
          description: 字段在表单中的目标位置（0 起）；缺省追加到末尾
        related_form_token:
          type: string
          description: 关联的表格 token；只能是另一张表格，且需要它的管理权限
        paired:
          type: boolean
          description: 双向关联，缺省开启；开启时在关联的表格中自动创建反向列
        related_label:
          type: string
          description: 反向列名称，只在创建反向列时使用，缺省取本表格名称
