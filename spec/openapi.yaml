          - single
          - multiple
          description: 每个题目可选一项（single）或多项（multiple）
        minimum_length:
          type: integer
          minimum: 0
          description: likert_choice_style=multiple 时每题最少选几项
        maximum_length:
          type: integer
          minimum: 0
          description: likert_choice_style=multiple 时每题最多选几项
        calculable:
          type: boolean
          description: 选项赋值开关；开启后每个（叶子）选项必须带 operand_value
      allOf:
      - description: minimum_length / maximum_length 只在 likert_choice_style=multiple 时有意义
        if:
          not:
            properties:
              likert_choice_style:
                const: multiple
            required:
            - likert_choice_style
        then:
          not:
            anyOf:
            - required:
              - minimum_length
            - required:
              - maximum_length
      - description: calculable=true 时每个选项都要有 operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
