        choices_layout:
          type: string
          description: 选项排列方式
        predefined_value:
          description: 默认值；文本类为字符串，DateTimeField 为符合精度的日期字符串或 today / yesterday / tomorrow，TimeField 为 {"hour", "minute"} 对象，AddressField 为地址对象
        placeholder:
          type: string
          description: 占位提示文字
        sms_verification:
          type: boolean
          description: 开启短信验证（同时自动开启图形验证码）
        range_min:
          type: number
          description: 最小值（含）
        range_max:
          type: number
          description: 最大值（含）
        precision:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 14
          - type: string
            enum:
            - month
            - day
            - minute
            - second
          description: NumberField / FormulaField 为小数位数，DateTimeField 为精度枚举
        display_precision:
          type: integer
          minimum: 0
          description: 显示用小数位数
        display_as_percentage:
          type: boolean
