          description: 更新成功，返回对外查询详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/query_suggestions":
    get:
      tags:
      - OpenSearch
      summary: 对外查询字段建议
      description: 返回某表单上可用于对外查询的查询字段与展示字段，以及推荐的字段 api_code，用于构造 search_field_rules / display_field_rules。 调用者必须能管理该表单：无权访问返回 404，能读取但不能管理返回 403。不检查对外查询套餐功能。 OAuth 令牌需要 scope：forms。
      operationId: listOpensearchQuerySuggestions
      parameters:
      - name: form_token
        in: query
        required: true
        description: 表单 token
        schema:
          type: string
      responses:
        '200':
          description: 字段建议
          content:
            application/json:
              schema:
                type: object
                required:
                - form_token
                - search_fields
                - display_fields
                - recommend_search_fields
                - recommend_display_fields
                properties:
                  form_token:
                    type: string
                    description: 表单 token
                  search_fields:
                    type: array
                    description: 可作为查询条件的字段
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySuggestion'
                  display_fields:
                    type: array
                    description: 可作为展示字段的字段
                    items:
                      $ref: '#/components/schemas/OpensearchDisplayQuerySuggestion'
                  recommend_search_fields:
                    type: array
                    description: 推荐的查询字段 api_code（姓名 + 手机，无手机字段时为空）
                    items:
                      type: string
                  recommend_display_fields:
                    type: array
                    description: 推荐的展示字段 api_code（排除隐私字段、仅展示字段与微信字段）
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/folders":
    get:
      tags:
      - Folders
      summary: 获取文件夹列表
      operationId: listFolders
      description: |
        列出当前用户拥有管理权限的文件夹（表单文件夹与表格文件夹都在内，用 `kind` 区分），按创建时间倒序。使用账号级凭证时返回账号所有者的文件夹。
        `limit` 缺省 50，取值会被限定在 1 到 100 之间；不支持翻页，`total` 为全部数量，`count` 为本次返回数量。

        OAuth 令牌需要 scope：forms
      parameters:
      - name: limit
        in: query
        required: false
        description: 返回数量上限，缺省 50，最大 100
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 文件夹列表
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - count
                - data
                properties:
                  total:
                    type: integer
                    description: 可管理的文件夹总数
                  count:
                    type: integer
                    description: 本次返回的数量
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Folders
      summary: 创建文件夹
      operationId: createFolder
      description: |
        以当前用户身份创建一个文件夹，创建者自动成为文件夹管理者。`kind` 决定文件夹放表单（`form`，缺省）还是表格（`table`）。
        `name` 为空时返回 400 `Name cannot be empty`；`kind` 不是 form / table 时返回 400 `Kind must be one of: form, table`；模型校验失败时返回 400，`error_description` 为校验信息。

        OAuth 令牌需要 scope：forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/predefined_choices_sets":
    get:
      tags:
      - Predefined Choices Sets
      summary: 获取预置选项集
      operationId: listPredefinedChoicesSets
      description: |
        列出当前账号自定义（type 为 custom）的预置选项集，仅返回与当前请求语言一致的记录（以服务端实现为准）；系统内置的全局选项集不会返回。
        OAuth 令牌需要 scope：form_setting。
      responses:
        '200':
          description: 选项集数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PredefinedChoicesSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Predefined Choices Sets
      summary: 创建预置选项集
      operationId: createPredefinedChoicesSet
      description: |
        在当前账号下创建一个自定义预置选项集。按 `label` 查找：账号内已有同名选项集时会直接覆盖其 `choices`（相当于更新），否则新建。
        OAuth 令牌需要 scope：form_setting。
        请求体必须包裹在 `predefined_choices_set` 键下，缺少该键时返回 400。`choices` 中的空字符串会被过滤；`label` 与过滤后的 `choices` 都不能为空，否则返回 400，响应体为 `{ errors, status: "failed" }`。
        成功时返回 200（不是 201）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - predefined_choices_set
              properties:
                predefined_choices_set:
                  $ref: '#/components/schemas/PredefinedChoicesSetInput'
              additionalProperties: false
      responses:
        '200':
          description: 创建（或按 label 覆盖）成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSet'
        '400':
          description: 校验失败（label 或 choices 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/predefined_choices_sets/{id}":
    patch:
      tags:
      - Predefined Choices Sets
      summary: 更新预置选项集
      operationId: updatePredefinedChoicesSet
      description: |
        更新当前账号的一个自定义预置选项集的 `label` 和 / 或 `choices`。也接受 PUT 方法，行为相同。
        OAuth 令牌需要 scope：form_setting。
        只能更新 type 为 custom 且属于当前账号的选项集：全局选项集或其他账号的选项集返回 403 `{ errors: "forbidden", status: "failed" }`；ID 不存在返回 404 `{ errors: "not found", status: "failed" }`；校验失败返回 400 `{ errors, status: "failed" }`。
      parameters:
      - name: id
        in: path
        required: true
        description: 选项集 ID（24 位十六进制）
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - predefined_choices_set
              properties:
                predefined_choices_set:
                  $ref: '#/components/schemas/PredefinedChoicesSetInput'
              additionalProperties: false
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSet'
        '400':
          description: 校验失败（label 或 choices 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 无权操作该选项集（全局选项集或其他账号的选项集），或 OAuth scope 不足
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PredefinedChoicesSetError'
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: 选项集不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
    delete:
      tags:
      - Predefined Choices Sets
      summary: 删除预置选项集
      operationId: deletePredefinedChoicesSet
      description: |
        删除当前账号的一个自定义预置选项集，成功时返回 200 且无响应体。
        OAuth 令牌需要 scope：form_setting。
        只能删除 type 为 custom 且属于当前账号的选项集：全局选项集或其他账号的选项集返回 403 `{ errors: "forbidden", status: "failed" }`；ID 不存在返回 404 `{ errors: "not found", status: "failed" }`。
      parameters:
      - name: id
        in: path
        required: true
        description: 选项集 ID（24 位十六进制）
        schema:
          type: string
      responses:
        '200':
          description: 删除成功，无响应体
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 无权操作该选项集（全局选项集或其他账号的选项集），或 OAuth scope 不足
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PredefinedChoicesSetError'
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: 选项集不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
  "/template_usages":
    post:
      tags:
      - Templates
      summary: 用模板创建表单
      operationId: createTemplateUsage
      description: |
        以当前用户身份选用一个模板市场的模板，复制出一张新表单，返回新表单的 token 与编辑页地址。
        OAuth 令牌需要 scope：forms。
        模板通过 `id`（或 `template_id`）指定，接受模板 token 或 24 位十六进制 ID。可选参数：`tags`（标签，数组或逗号分隔字符串）、`tag_id` / `folder_id`（创建后归入的标签 / 文件夹）、`scene`（目标场景；模板字段超出该场景允许范围时回退为 form）、`frm`（来源标记，影响记录的 created_from）、`create_source`、`group_id`。
        付费相关的分支：
        - 付费模板且当前用户未购买：返回 200，响应体为 `{ template_url }`（模板购买页地址），不创建表单。
        - 模板使用了当前套餐不可用的付费功能：管理员且可开启功能试用时返回 403 `{ error: "CAN_FEATURE_TRIAL", target_plan, target_trial_type, ... }`；否则返回 403 `{ error: "PAID_FEATURE_REQUIRED", target_plan, template_url }`；来自渠道合作账号返回 403 `{ error: "UNAVAILABLE_TO_TRIAL_OR_UPGRADE" }`。
        - 传 `form_app_trial_alert` 且模板绑定了需购买 / 试用的表单应用时，返回 200 `{ error: "CANNOT_FORM_APP_TRIAL" | "FORM_APP_TRIAL_REQUIRED", ... }`，可用 `confirm_unbind_form_app` / `confirm_form_app_trial` 确认后重试。
        表单创建失败（含内容风控未通过）返回 400 `{ error }`。模板不存在时返回 404，响应为 HTML 页面而非 JSON。
        `mobile_editor_forbidden` 仅在移动端请求且新表单为卡片布局但当前套餐不能使用移动端编辑器时出现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUsageInput'
      responses:
        '200':
          description: 创建成功；或因付费 / 表单应用限制未创建，响应体含 `template_url` 或 `error`
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - success_url
                  - form_token
                  properties:
                    success_url:
                      type: string
                      description: 新表单编辑页的站内路径（如 `/forms/{token}/edit`）
                    form_token:
                      type: string
                      description: 新表单 token
                    mobile_editor_forbidden:
                      type: boolean
                      description: 移动端请求且当前套餐不能用移动端编辑器编辑卡片布局表单时为 true
                - type: object
                  required:
                  - template_url
                  properties:
                    template_url:
                      type: string
                      description: 付费模板未购买时的模板购买页地址
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - CANNOT_FORM_APP_TRIAL
                      - FORM_APP_TRIAL_REQUIRED
                    cannot_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: 需购买的表单应用名称
                    need_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: 需试用的表单应用名称
                    expire_days:
                      type: integer
                      description: 表单应用试用剩余天数
                    template_url:
                      type: string
        '400':
          description: 表单创建失败
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    description: 失败原因（如 `模板选用失败！...`）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 模板含当前套餐不可用的付费功能，或 OAuth scope 不足
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - PAID_FEATURE_REQUIRED
                      - CAN_FEATURE_TRIAL
                      - UNAVAILABLE_TO_TRIAL_OR_UPGRADE
                    target_plan:
                      type: string
                      description: 使用该模板所需的最低套餐代码
                    target_trial_type:
                      type: string
                      description: 可开启的功能试用类型
                    in_trial_form_apps:
                      type: array
                      items:
                        type: string
                    current_trial_type:
                      type: string
                    current_trial_end_date:
                      type: string
                    template_url:
                      type: string
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: 模板不存在（返回 HTML 页面）
          content:
            text/html:
              schema:
                type: string
  "/contacts":
    get:
      tags:
      - Contacts
      summary: 获取联系人列表
      operationId: listContacts
      description: |
        分页列出当前用户的联系人，按 ID 倒序，每页固定 50 条。使用账号级凭证时返回账号所有者的联系人。
        OAuth 令牌需要 scope：read_contacts。
        游标翻页：响应中的 `next` 为下一页第一条联系人的 ID，把它作为查询参数 `next` 传入即可获取下一页；没有更多数据时 `next` 为 null。
      parameters:
      - name: next
        in: query
        required: false
        description: 上一页响应返回的 `next` 游标（联系人 ID）
        schema:
          type: string
      responses:
        '200':
          description: 联系人列表
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - count
                - data
                - next
                properties:
                  total:
                    type: integer
                    description: 联系人总数
                  count:
                    type: integer
                    description: 本页数量
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  next:
                    type:
                    - string
                    - 'null'
                    description: 下一页游标，无更多数据时为 null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/me":
    get:
