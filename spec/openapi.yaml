                -
    BillingAccountUsageItem:
      type: object
      description: Quota and usage of one add-on service; when the quota is unlimited, only unit, unlimited, consumed_quota and available are present
      required:
      - unit
      - consumed_quota
      - available
      properties:
        available:
          type: boolean
          description: Whether the service can be used now; a paid account may keep using it past total_balance on its account balance
        unit:
          type: string
          enum:
          - item
          - mb
          - second
          - cent
          description: Unit of measure
        unlimited:
          type: boolean
          description: true when the quota is unlimited
        total_quota:
          type: integer
          description: Total quota this month (included in the plan + purchased)
        total_balance:
          type: integer
          description: Total remaining quota
        month_balance:
          type: integer
          description: Remaining part of this month's plan-included quota
        consumed_quota:
          type: integer
          description: Consumed this month
    ViewUnprocessableError:
      type: object
      required:
      - error_description
      properties:
        error_description:
          type: string
          description: Error description; multiple validation errors are joined with commas
    FormViewSortRule:
      type: object
      required:
      - api_code
      properties:
        api_code:
          type: string
          description: api_code of the sort field
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Sort direction
    FormViewFilterCondition:
      type: object
      required:
      - field
      - operator
      properties:
        field:
          type: string
          description: Field api_code (api_code / trigger are also accepted as the key name)
        operator:
          type: string
          description: 'Operator, the same as the entry list filters: eq, ne, any_in, none_in, between, not_between, null, not_null, gte, gt, lte, lt, like, not_like, match, within_last; the aliases start / end / equal / not_equal are equivalent to gte / lte / eq / ne respectively. The server decides which subset each field type supports. On choice fields, eq / ne are saved as any_in / none_in and the value is turned into an array.'
        value:
          description: 'Condition value; its type depends on the field and the operator: a two-element array for between; {"unit": "day", "n": 30} for within_last (unit can be minute / day / week / month); on choice fields, pass choice api_codes or choice texts, with "null" meaning not filled in; null / not_null take no value.'
    FormView:
      type: object
      required:
      - token
      - name
      - view_type
      - position
      - predefined
      - visibility
      - view_scope
      - prefer_columns
      - sorted_columns
      - kanban_group_by_api_code
      - kanban_card_title_api_code
      - kanban_group_order
      - kanban_hidden_groups
      - grid_frozen_boundary_api_code
      - sort
      - filter
      - created_at
      - updated_at
      properties:
        token:
          type: string
          description: View token
        name:
          type: string
          description: View name
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: View type; form is a form view (a public fill page, tables only)
        position:
          type: integer
          description: Position in the order of views
        predefined:
          type: boolean
          description: Whether it is a predefined view (cannot be deleted)
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: 'Visibility: cooperators means visible to all cooperators, personal means visible only to the creator'
        view_scope:
          type: string
          enum:
          - user
          - form
          description: What the view belongs to; form means it belongs to the form itself (cannot be deleted, and its visibility cannot be switched)
        prefer_columns:
          type: array
          description: api_codes of the fields shown
          items:
            type: string
        sorted_columns:
          type: array
          description: Column display order, by position ascending
          items:
            type: object
            required:
            - api_code
            - position
            properties:
              api_code:
                type: string
                description: Field api_code
              position:
                type: integer
                description: Column position, starting at 1
        kanban_group_by_api_code:
          type:
          - string
          - 'null'
          description: api_code of the kanban grouping field
        kanban_card_title_api_code:
          type:
          - string
          - 'null'
          description: api_code of the kanban card title field; when not set, the server derives it from prefer_columns
        kanban_group_order:
          type: array
          description: Display order of kanban groups (api_codes of the grouping choices; `__unset__` means no group set)
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: Hidden kanban groups (same values as kanban_group_order)
          items:
            type: string
        grid_frozen_boundary_api_code:
          type:
          - string
          - 'null'
          description: api_code of the field at the frozen-column boundary in a grid view
        sort:
          type: array
          description: Sort rules
          items:
            type: object
            required:
            - api_code
            - order
            properties:
              api_code:
                type: string
                description: api_code of the sort field
              order:
                type: string
                enum:
                - asc
                - desc
                description: Sort direction
        filter:
          type: array
          description: Filters; an empty array when there are none
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        title:
          type:
          - string
          - 'null'
          description: Fill page title (returned for form views only)
        description:
          type:
          - string
          - 'null'
          description: Fill page description (returned for form views only)
        published:
          type: boolean
          description: Whether it is published; the fill link does not work while unpublished (returned for form views only)
        fill_url:
          type: string
          format: uri
          description: Public fill link (returned for form views only)
        fill_items:
          type: array
          description: Fill items checked on the fill page, in fill page order, with their effective values (returned for form views only)
          items:
            $ref: '#/components/schemas/FormViewFillItem'
    FormViewInput:
      type: object
      description: Request body to create / update a view; only the keys present are updated
      properties:
        name:
          type: string
          maxLength: 120
          description: View name, cannot be empty
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: View type, defaults to grid on create; form is a form view (a public fill page), supported by tables only
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: Visibility, defaults to cooperators on create; on update only the creator can switch it
        prefer_columns:
          type: array
          description: api_codes of the fields shown
          items:
            type: string
        kanban_group_by_api_code:
          type: string
          description: api_code of the kanban grouping field; must be a field that supports kanban grouping
        kanban_card_title_api_code:
          type: string
          description: api_code of the kanban card title field
        kanban_group_order:
          type: array
          description: Display order of kanban groups; elements must be non-empty, unique strings
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: Hidden kanban groups; elements must be non-empty, unique strings; an empty array shows all groups
          items:
            type: string
        sort:
          type: array
          description: Sort rules, replaced as a whole
          items:
            $ref: '#/components/schemas/FormViewSortRule'
        sorted_columns:
          type: array
          description: Column display order, replaced as a whole; position is generated from 1 in array order
          items:
            type: object
            required:
            - api_code
            properties:
              api_code:
                type: string
                description: Field api_code
            additionalProperties: false
        filter:
          type: array
          description: Array of filters, replaced as a whole; an empty array clears the filters; returns 422 when it is not an array
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        title:
          type: string
          maxLength: 120
          description: Fill page title, cannot be empty; defaults to the table name on create. Form views (view_type=form) only; on other view types it returns 422.
        description:
          type:
          - string
          - 'null'
          description: Fill page description. Form views (view_type=form) only; on other view types it returns 422.
        published:
          type: boolean
          description: Whether the fill page is published, defaults to false on create. Form views (view_type=form) only; on other view types it returns 422.
        field_overrides:
          type: array
          description: Fill item settings, replaced as a whole; when omitted on create, every fillable column is checked in the current column order. Form views (view_type=form) only; on other view types it returns 422.
          items:
            $ref: '#/components/schemas/FormViewFieldOverrideInput'
        cid:
          type: string
          description: Client identifier, passed through in the real-time change broadcast (defined by the server implementation)
      additionalProperties: false
    EntryCommentMention:
