    ThemeInput:
      type: object
      description: Request body of PATCH /forms/{form_token}/theme; contains at least one theme operation key
      properties:
        primary_color:
          type: string
          description: Primary color, e.g. "#FBBF24"
        secondary_color:
          type: string
          description: Secondary color
        wallpaper:
          type: object
          description: Page background
          properties:
            background_color:
              type: string
            background_image_url:
              type: string
              description: The server fetches this URL and uses it as the background image
            background_image_upload_token:
              type: string
              description: The `form_image_token` used by "Upload a form image"; the image purpose must be wallpaper; takes precedence over background_image_url
            background_image_attachment_id:
              type:
              - string
              - 'null'
              description: attachment_id returned by "Upload a form image" (image_type=wallpaper); an empty string removes the current background image. Lower priority than background_image_upload_token / background_image_url
          additionalProperties: false
        header:
          type: object
          description: Header
          properties:
            type:
              type: string
              enum:
              - none
              - text
              - image
              - carousel
            text:
              type: string
              description: Header text
            background_color:
              type: string
            text_style:
              type: object
              description: Text style; keys use underscores (e.g. font_size, text_align) and are merged into the existing style
              additionalProperties:
                type: string
            header_image_url:
              type: string
              description: The server fetches this URL and uses it as the header image
            header_image_base64:
              type: string
              description: Base64-encoded header image; takes precedence over header_image_url
            header_image_upload_token:
              type: string
              description: The `form_image_token` used by "Upload a form image"; the image purpose must be header; highest priority
            carousel_images:
              type: array
              minItems: 1
              maxItems: 5
              description: Carousel images; replaced as a whole and shown in array order
              items:
                type: object
                description: Provide one of image_upload_token / image_url / attachment_id
                properties:
                  image_upload_token:
                    type: string
                    description: The `form_image_token` used by "Upload a form image"; the image purpose must be carousel
                  image_url:
                    type: string
                  attachment_id:
                    type: string
                    description: Keeps an existing carousel image of this form
                additionalProperties: false
            header_image_attachment_id:
              type:
              - string
              - 'null'
              description: attachment_id returned by "Upload a form image" (image_type=header); an empty string removes the current header image. Lowest priority; header.type is set to image when not given
          additionalProperties: false
        typography:
          type: object
          description: Typography; keys use underscores and are merged into the existing style
          properties:
            form_header:
              type: object
              additionalProperties:
                type: string
            field_label:
              type: object
              additionalProperties:
                type: string
            choice_style:
              type: object
              additionalProperties:
                type: string
          additionalProperties: false
        form_container:
          type: object
          properties:
            background_color:
              type: string
            border_color:
              type: string
              description: Border color of the form container, e.g. "#E5E7EB"
            border_width:
              type: string
              description: Border width of the form container, e.g. "1px"
          additionalProperties: false
        submit_button:
          type: object
          properties:
            background_color:
              type: string
            color:
              type: string
            font_size:
              type: string
              description: e.g. "16px"
          additionalProperties: false
        generate_header_image:
          type: object
          description: Generates a header image with AI and sets it as the header image; uses AI points
          properties:
            prompt:
              type: string
              description: Prompt for the image; when omitted, AI writes one from the form's content
          additionalProperties: false
      additionalProperties: false
