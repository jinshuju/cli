  "/billing_account/payment_histories":
    get:
      tags:
      - Account
      summary: List account payment history
      operationId: listBillingAccountPaymentHistories
      description: |
        Lists the current account's top-ups and spending on Jinshuju (account balance transactions such as buying plans, SMS, AI points and attachment storage), newest first.
        This is what the account itself spent; money received through payment forms is not included.
        Only an account admin can read it: a non-admin member gets 403 (`Only an account admin can read this.`); an account-level credential (no specific user) is treated as the account owner.
        There is no paging: `limit` defaults to 50 and is clamped to 1 to 1000; `total_records` is the number of matching records, `returned_records` the number returned this time.
        With `include_balance=true`, `current_balance` is included (account balance and the remaining quota of each item); when records are returned, `statistics` is included (counting only the returned records).
        OAuth scope: users
      parameters:
      - name: start_date
        in: query
        required: false
        description: Start date, inclusive, parsed in Beijing time (UTC+8) as 00:00 of that day, e.g. `2024-01-01`
        schema:
          type: string
        examples:
          firstDay:
            value: '2024-01-01'
      - name: end_date
        in: query
        required: false
        description: End date, inclusive, parsed in Beijing time (UTC+8) as 23:59:59 of that day, e.g. `2024-12-31`
        schema:
          type: string
        examples:
          lastDay:
            value: '2024-12-31'
      - name: verb
        in: query
        required: false
        description: |
          Only records of this type; the value is the record's `verb`. Possible types:
          `charge` (top-up), `coupons` (voucher), `plan_charge` (buy a plan), `plan_convert` (convert a plan), `plan_for_free`, `convert_to_pro2`, `expand_entries_charge`,
          `sms_charge` (buy SMS), `active_mail_charge` (buy emails), `ai_points_charge` (buy AI points), `storage_quota_charge` (buy attachment storage), `audio_quota_charge` (buy audio duration),
          `sub_account_charge` / `sub_account_for_free` (account members), `submitter_charge` / `submitter_for_free`, `weixin_account_charge` (buy WeChat Official Accounts),
          `app_charge` / `app_upgrade_charge` / `app_package_charge` (apps), `template_charge` (templates), `form_application_charge` / `form_application_upgrade_charge`,
          `cname_protocol_charge`, `hide_report_form_charge`, `show_alipay_charge`, `gd_portal_charge` / `gd_portal_customer_charge`, `other_charge`.
          Any other value gives an empty result.
        schema:
          type: string
        examples:
          smsCharge:
            value: sms_charge
      - name: limit
        in: query
        required: false
        description: Maximum number to return; defaults to 50, at most 1000 (a larger value counts as 1000, a value below 1 as 1)
        schema:
          type: integer
          default: 50
      - name: include_balance
        in: query
        required: false
        description: When `true`, `current_balance` is included. Defaults to false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountPaymentHistoriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
