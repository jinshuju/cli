          required:
          - total
          - succeeded
          - failed
          - failed_reasons
          properties:
            total:
              type: integer
              description: Notifications matching the query
            succeeded:
              type: integer
              description: Notifications in `SUCCESS`
            failed:
              type: integer
              description: Notifications in `FAILED`
            failed_reasons:
              type: array
              description: The failed notifications grouped by reason, most frequent first
              items:
                type: object
                required:
                - reason
                - count
                properties:
                  reason:
                    type:
                    - string
                    - 'null'
