      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
        remove:
          type: array
          items:
            type: integer
        update:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
      additionalProperties: false
    FieldRuleWriteInput:
      type: object
      properties:
        index:
          type: integer
          description: 'Used by update only: index of the rule to change (0-based)'
