        '403':
          description: 'Forbidden: the OAuth token lacks the required scope, or the caller is not a manager of the form'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/notification_rules/{id}/notifications":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    - name: id
      in: path
      required: true
      description: Notification rule id
      schema:
        type: string
    get:
      tags:
      - Form Settings
      summary: List a notification rule's sending records
      operationId: listNotificationRuleNotifications
      description: |
        Lists the notifications a rule sent, newest first, with a summary of the matching records. Covers the last 180 days, as the form's notification log page does; notifications scheduled for later are not included.
        OAuth scope: form_setting
      parameters:
      - name: start_date
        in: query
        required: false
        description: Only notifications sent on or after this day, Beijing time (UTC+8)
        schema:
          type: string
          format: date
        example: '2026-10-01'
      - name: end_date
        in: query
        required: false
        description: Only notifications sent on or before this day, Beijing time (UTC+8)
        schema:
          type: string
          format: date
        example: '2026-10-31'
      - name: status
        in: query
        required: false
        description: Return only the notifications in this status
        schema:
          type: string
          enum:
          - SUCCESS
          - FAILED
          - WAITING
          - AUDITING
          - APPROVED
          - REJECTED
          - CANCELLED
          - REVOKED
      - name: limit
        in: query
        required: false
        description: Page size
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
      - $ref: '#/components/parameters/EntryTaskNext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: Sending records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The form, or the notification rule on this form, does not exist or is not accessible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
