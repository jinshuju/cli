                      $ref: '#/components/schemas/BillingAccountUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/billing_account/invoices":
    get:
      tags:
      - Account
      summary: 获取账号发票
      operationId: listBillingAccountInvoices
      description: |
        列出当前账号申请过的电子发票（按申请时间倒序，一次全部返回，不分页），以及可开票但尚未开票的消费金额。
        只有账号管理员可以读取：非管理员成员返回 403（`Only an account admin can read this.`）；使用账号级凭证（无具体用户）时视为账号所有者。
        OAuth 令牌需要 scope：users。
      responses:
        '200':
          description: 发票列表与未开票金额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountInvoicesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/billing_account/payment_histories":
    get:
      tags:
      - Account
      summary: 获取账号消费记录
      operationId: listBillingAccountPaymentHistories
      description: |
        列出当前账号在金数据的充值与消费记录（购买套餐、短信、AI 点数、附件空间等账户余额流水），按时间倒序。
        这里是账号自己花了什么，不含收款表单收到的款项。
        只有账号管理员可以读取：非管理员成员返回 403（`Only an account admin can read this.`）；使用账号级凭证（无具体用户）时视为账号所有者。
        不支持翻页：`limit` 缺省 50，取值会被限定在 1 到 1000 之间；`total_records` 为满足条件的记录总数，`returned_records` 为本次返回数量。
        `include_balance=true` 时附带 `current_balance`（账户余额与各项配额余量）；本次有返回记录时附带 `statistics`（只统计本次返回的记录）。
        OAuth 令牌需要 scope：users。
      parameters:
      - name: start_date
        in: query
        required: false
        description: 起始日期（含当天），按北京时间解析并取当天 00:00，如 `2024-01-01`
        schema:
          type: string
        examples:
          firstDay:
            value: '2024-01-01'
      - name: end_date
        in: query
        required: false
        description: 结束日期（含当天），按北京时间解析并取当天 23:59:59，如 `2024-12-31`
        schema:
          type: string
        examples:
          lastDay:
            value: '2024-12-31'
      - name: verb
        in: query
        required: false
        description: |
          只返回该类型的记录，值为记录的 `verb`。可能出现的类型：
          `charge`（充值）、`coupons`（代金券）、`plan_charge`（购买套餐）、`plan_convert`（转换套餐）、`plan_for_free`、`convert_to_pro2`、`expand_entries_charge`、
          `sms_charge`（购买短信）、`active_mail_charge`（购买邮件）、`ai_points_charge`（购买 AI 点数）、`storage_quota_charge`（购买附件空间）、`audio_quota_charge`（购买语音时长）、
          `sub_account_charge` / `sub_account_for_free`（企业成员）、`submitter_charge` / `submitter_for_free`、`weixin_account_charge`（购买微信公众号）、
          `app_charge` / `app_upgrade_charge` / `app_package_charge`（应用）、`template_charge`（模板）、`form_application_charge` / `form_application_upgrade_charge`、
          `cname_protocol_charge`、`hide_report_form_charge`、`show_alipay_charge`、`gd_portal_charge` / `gd_portal_customer_charge`、`other_charge`。
          传入其他值时结果为空。
        schema:
          type: string
        examples:
          smsCharge:
            value: sms_charge
      - name: limit
        in: query
        required: false
        description: 返回数量上限，缺省 50，最大 1000（超过按 1000 处理，小于 1 按 1 处理）
        schema:
          type: integer
          default: 50
      - name: include_balance
        in: query
        required: false
        description: 为 `true` 时附带 `current_balance`。缺省为 false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 消费记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountPaymentHistoriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/merchant":
    get:
      tags:
      - Trade
      summary: 获取小金商户信息
      operationId: getTradeMerchant
      description: |
        返回当前账号的小金商户（由金数据代收款的商户）及其入驻进度：商户资料、主体与联系信息、余额、结算信息、支付渠道授权情况、冻结状态、已绑定的收款表单，以及下一步操作的入口地址。
        - 账号还没有小金商户时同样返回 200：`merchant_stage` 说明入驻申请走到了哪一步，`merchant` / `subject` / `contact` / `balance` / `settlement` / `freeze` 为 null，`channels` 为空数组。
        - 通过自有微信支付 / 支付宝商户收款（直连）的账号在金数据没有费率、结算账户、余额和入驻状态，这里不会给出这些信息。
        - 银行卡号、手机号、邮箱、证件号等敏感字段按产品「资金账户信息」页的规则打码返回：保留首尾各 4 位（手机号保留前 3 位、后 4 位），中间以 `*` 代替。
        - `payment_form_tokens` 只含当前身份可访问的收款表单（含快速支付）；使用账号级凭证时按账号所有者计算。
        - `balance` 在余额查询失败时为 null，此时不代表余额为 0。

        OAuth 令牌需要 scope：users
      responses:
        '200':
          description: 小金商户信息与入驻进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeMerchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/transactions":
    get:
      tags:
      - Trade
      summary: 获取收款订单列表
      operationId: listTradeTransactions
      description: |
        列出小金商户的收款订单（客户在收款表单上支付产生的订单），按下单时间倒序。只含小金商户的订单：直连收款的订单、模拟支付的订单，以及快速支付中未支付的记录都不在其中。
        - 日期范围按下单时间筛选，按北京时间计，`start_date` / `end_date` 均包含当天且必须同时传。不传时默认最近 90 天；传了 `order_no` 且不传日期时不限时间。响应的 `queried_range` 给出实际使用的范围（不限时间时两端为 null）。
        - 明细上限：日期范围最多 90 天，且匹配的订单最多 200 条。超出任一上限时不返回明细：`transactions` 为 null，`detail_limit` 说明原因，`stats` 给出该范围的交易金额、成交量与订单量，请缩小范围后再查。
        - 分页：`limit` 为每页条数（缺省且最大 50），`next` 为页码。还有下一页时响应带 `next`（下一页的页码），原样回传即可；`page_info.total` 为匹配的订单总数。
        - 账号没有小金商户时返回 404。

        OAuth 令牌需要 scope：users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - $ref: '#/components/parameters/TradePaidStatus'
      - $ref: '#/components/parameters/TradePaymentChannel'
      - $ref: '#/components/parameters/TradeFormToken'
      - name: order_no
        in: query
        required: false
        description: 按单号精确查找，匹配交易单号（`trade_no`）、商户订单号（`merchant_out_trade_no`）或金数据单号（`out_trade_no`）之一。不传日期时不限时间。
        schema:
          type: string
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      responses:
        '200':
          description: 收款订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeTransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/transactions/aggregate":
    get:
      tags:
      - Trade
      summary: 统计收款订单
      operationId: aggregateTradeTransactions
      description: |
        统计一段日期范围内小金商户收款订单的交易金额、成交量与订单量，可按一个维度分组。口径与「获取收款订单列表」一致（只含小金商户的订单，不含模拟支付与快速支付中未支付的记录）；统计覆盖整个范围，不受明细上限约束。
        - 日期范围按下单时间筛选，按北京时间计，两端包含当天且必须同时传；不传时默认最近 30 天。范围最多 366 天，超出返回 400。
        - `transactions_amount`（交易金额）：已支付类订单的金额减去各自的成功退款，计入订单下单的那一天；已退款、未支付的订单贡献 0。`transactions_count`（成交量）：已支付、部分退款、退款中的订单数。`orders_count`（订单量）：全部匹配的订单数，含未支付。
        - `group_by=time` 按时间分组：范围不足 90 天按日、90 天及以上按周、365 天及以上按月，`granularity` 给出粒度，没有订单的时段补零。`paid_status` / `payment_channel` 每个取值一组，`payment_channel` 为 null 的一组是尚未发起支付的订单。各组在相同筛选下累加等于总计。
        - 账号没有小金商户时返回 404。

        OAuth 令牌需要 scope：users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - name: group_by
        in: query
        required: false
        description: 分组维度，一次只能按一个维度分组；缺省不分组，只返回总计。其他取值返回 400。
        schema:
          type: string
          enum:
          - time
          - paid_status
          - payment_channel
      - $ref: '#/components/parameters/TradePaidStatus'
      - $ref: '#/components/parameters/TradePaymentChannel'
      - $ref: '#/components/parameters/TradeFormToken'
      responses:
        '200':
          description: 收款订单统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeTransactionAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/refunds":
    get:
      tags:
      - Trade
      summary: 获取退款列表
      operationId: listTradeRefunds
      description: |
        列出小金商户向客户发起的退款，并给出统计。退款按发起时间筛选和倒序排列，而不是按订单的下单时间或退款到账时间。只有小金商户有退款记录，直连收款的账号在这里没有数据。
        - 日期范围按北京时间计，两端包含当天且必须同时传。不传时默认最近 90 天；传了 `refund_no` 且不传日期时不限时间。`queried_range` 给出实际使用的范围。
        - `include` 决定返回内容：`both`（缺省）同时返回 `stats` 与 `refunds`，`stats` 只返回统计，`records` 只返回记录。
        - 明细上限与「获取收款订单列表」相同（最多 90 天、200 条）：超出时 `refunds` 为 null，`detail_limit` 说明原因，`stats` 照常返回。
        - `stats`：全部匹配退款的条数与金额、按状态拆分的条数与金额、退款成功涉及的订单数（去重），以及按退款发起日期的趋势（有日期范围时才有；不足 90 天按日、90 天及以上按周、365 天及以上按月，无退款的时段补零）。趋势中每个时段的订单数在该时段内去重，各时段之和可能大于总的订单数。
        - 分页同「获取收款订单列表」；`include=stats` 时不返回 `next`。
        - 账号没有小金商户时返回 404。

        OAuth 令牌需要 scope：users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - name: status
        in: query
        required: false
        description: 只保留该状态的退款，记录、统计与趋势都按它筛选：`processing`（处理中）、`success`（退款成功）、`error`（退款失败）。其他取值返回 400。
        schema:
          type: string
          enum:
          - processing
          - success
          - error
      - name: refund_no
        in: query
        required: false
        description: 按退款流水号（`refund_no`）精确查找。不传日期时不限时间。
        schema:
          type: string
      - $ref: '#/components/parameters/TradeInclude'
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      responses:
        '200':
          description: 退款列表与统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRefundListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/payouts":
