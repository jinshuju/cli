      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: 视图列表
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: 返回的视图数量
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Views
      summary: 创建表单视图
      description: 为表单创建一个新视图，创建者为当前调用者，visibility 未传时默认为 cooperators，position 为当前可见视图的最大值加 1。 每个用户在同一表单最多 100 个视图，达到上限返回 422（View limit reached）。 view_type 为 kanban 且未传 kanban_group_by_api_code 时，服务端自动选择分组字段；未传 kanban_hidden_groups 时默认隐藏 __unset__ 分组； prefer_columns 为空时使用表单默认列（看板视图最多 5 列，含 serial_number）。 filter 不合法（不是数组、字段不存在、运算符不支持、值不合法）返回 422。模型校验失败（如 name 为空或超过 120 字、分组字段不支持看板分组）返回 422。 表单视图（view_type 为 form）：仅表格支持，否则 422；title 缺省为表格名称，未传 field_overrides 时按当前列顺序勾选全部可填写的列，published 缺省 false（未发布时填写链接不可用）。title / description / published / field_overrides 只适用于表单视图，用在其他类型上返回 422。创建、修改、删除表单视图（包括把视图切换为或切换出表单视图）需要调用者在该表格上拥有可新增数据的预置角色，否则 403；企业令牌不受此限制。填写项的列不存在、不能作为填写项或设置了该列类型不支持的校验时返回 422，错误信息带列 api_code。 OAuth 令牌需要 scope：forms。
      operationId: createFormView
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FormViewInput'
              - type: object
                required:
                - name
      responses:
        '201':
          description: 创建成功，返回视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 请求无法处理（视图数量达到上限、筛选条件不合法、模型校验失败、不允许删除等），响应体为 { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
  "/forms/{form_token}/views/{view_token}":
    parameters:
