                type: object
                properties:
                  total:
                    type: integer
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckinCampaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Plugins
      summary: Create a check-in campaign
      description: |
        Turns check-in on for a form. The caller must be able to reach the form.
        - Same limits as picking a form in the web app: returns 400 when the form has WeChat red envelope, lucky wheel, certificate or confirmation code on, is bound to a plugin that takes over the after-submit redirect (a check-in campaign with a check-in code included), or its after-submit action is not the default message. Turn that off first.
        - Only one check-in campaign is in effect on a form at a time; creating one turns off the one that was in effect.
        - Without `checkin_field_api_code`, the form's first mobile field is used, then its first name field; with neither, returns 400. The check-in field cannot be changed afterwards.
        - The campaign belongs to the caller, or to the account owner with an account-level credential. The caller is also added as a verifier.
        - `enable_checkin_code` (on by default) rewrites the form's after-submit redirect and data push URL to the check-in code page, and overrides any Webhook already on the form (and the other way round).
        OAuth scope: form_setting
      operationId: createCheckinCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCampaignCreateInput'
      responses:
        '201':
          description: The check-in campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCampaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/plugins/checkin/campaigns/{id}":
    get:
      tags:
      - Plugins
      summary: Get a check-in campaign
      description: |
        Returns the campaign's settings, how many have checked in, and its check-in, verifier invite and management links. Only campaigns the caller created.
        OAuth scope: form_setting
      operationId: getCheckinCampaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Check-in campaign id
      responses:
        '200':
          description: Check-in campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCampaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Plugins
      summary: Update a check-in campaign
      description: |
        Updates only the keys present in the body; PUT is accepted too. Only campaigns the caller created.
        Turning it back on with `enabled: true` turns off any other campaign in effect on the form.
        OAuth scope: form_setting
      operationId: updateCheckinCampaign
      parameters:
      - name: id
        in: path
        required: true
        schema:
