        success_redirect_fields:
          type: array
          description: api_codes of the fields appended to the redirect; how many is limited by the plan quota
          items:
            type: string
        show_entry_on_success:
          type: boolean
        show_entry_on_success_button_text:
          type: string
        edit_entry_on_success:
          type: boolean
        show_serial_number_on_success:
          type: boolean
        show_submit_again:
          type: boolean
        hide_login_and_signup:
          type: boolean
        show_close_count_down:
          type: boolean
        show_form_before_open:
