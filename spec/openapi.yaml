          - prefix
          - suffix
          description: 货币符号位置
        changeable:
          type: object
          description: AddressField 各级是否允许修改，键为 province / city / district / street，值为布尔
          additionalProperties:
            type: boolean
        enable_auto_position:
          type: boolean
          description: 首次打开时按设备定位自动填充地址
        max_size:
          type: integer
          minimum: 1
          maximum: 500
          description: 单文件大小上限（MB）
        max_file_quantity:
          type: integer
          minimum: 1
          description: 最多上传的文件数
        media_type:
          type: object
