          description: 允许的文件类型；type 为预设分组，type=custom 时必须用 value 列出扩展名
          properties:
            type:
              type: string
              enum:
              - unlimited
              - doc
              - image
              - video
              - audio
              - compress
              - custom
            value:
              type: array
              items:
                type: string
              description: 小写扩展名，不含点
          if:
            properties:
              type:
                const: custom
            required:
            - type
          then:
            required:
            - value
            properties:
              value:
                minItems: 1
        mobile_camera_only:
          type: boolean
          description: 移动端只能拍照上传，不能从相册选择
        minimum_ratings_display_text:
          type: string
          description: 最低分文案
        maximum_ratings_display_text:
          type: string
          description: 最高分文案
        include_second:
          type: boolean
          description: 精确到秒
        random_choices:
          type: boolean
          description: 每次打开随机排列选项
        max_duration:
          type: integer
          minimum: 1
          maximum: 5
          description: 最长录音时长（分钟）
        levels:
          type: integer
          minimum: 2
          description: 多级下拉的层级数，每条选项路径都必须到达该深度
        choice_filterable:
          type: boolean
          description: 允许筛选选项
        horizontal_on_mobile:
          type: boolean
          description: 移动端横向排列
        likert_choice_style:
          type: string
          enum:
          - single
          - multiple
          description: 每个题目可选一项（single）或多项（multiple）
        minimum_length:
          type: integer
          minimum: 0
          description: likert_choice_style=multiple 时每题最少选几项
        maximum_length:
          type: integer
          minimum: 0
          description: likert_choice_style=multiple 时每题最多选几项
        advanced_feature:
          type: boolean
          description: 开启高级功能
        unit:
          type: string
          maxLength: 2
          description: 数量单位，最多 2 个字
        collapse_on_mobile:
          type: boolean
          description: 移动端折叠商品列表
        columns_on_mobile:
          type: integer
          minimum: 1
          description: 移动端每行商品数
        formula_display:
          type: string
          description: 公式 HTML，字段引用写成 <gd-field data-cid="..."> 或 <gd-field data-api-code="...">
        result_display_type:
          type: string
          enum:
          - string
          - numeric
          - datetime
          description: 结果显示方式
        result_display_as_date:
          type: boolean
          description: result_display_type=datetime 的旧写法
        icon_type:
          type: string
          enum:
          - none
          - number-2
          - dollar1
          - cny1
          - formula-2
          - date-2
          - sum
          - text
          - text2
          description: 字段图标
        allow_multiple_items:
          type: boolean
          description: 一次提交可预约多个项目
        item_allow_multiple_reservations:
          type: boolean
          description: 同一项目可预约多个时段
        allow_multiple_number:
          type: boolean
          description: 每个时段可预约多个名额
        use_daily_time_range:
          type: boolean
          description: 启用按日时段表
        associated_form_token:
          type: string
          description: 被关联表单的 token
        associated_field_api_codes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
          description: 关联键字段的 api_code
        privacy_safe:
          type: boolean
          description: 关联字段全局开启隐私保护显示
        allow_reverse_association:
          type: boolean
          description: 在被关联表单上显示反向关联
        reverse_display_field_api_codes:
          type: array
          items:
            type: string
          description: 反向关联展示的字段 api_code
        related_form_token:
          type: string
          description: 关联的表格 token；只能是另一张表格，且需要它的管理权限
        paired:
          type: boolean
          description: 双向关联，缺省开启；开启时在关联的表格中自动创建反向列
        related_label:
          type: string
          description: 反向列名称，只在创建反向列时使用，缺省取本表格名称
        show_split_line:
          type: boolean
          description: 显示分割线
        show_part_description:
          type: boolean
          description: 描述过长时折叠显示
        disable_previous_page:
          type: boolean
          description: 隐藏「上一页」按钮
        previous_page_text:
          type: string
          description: "「上一页」按钮文字"
        next_page_text:
          type: string
          description: "「下一页」按钮文字"
        count_down:
          type: integer
          minimum: 0
          description: 锁定「下一页」的秒数，0 表示不锁
        buttons_number:
          type: integer
          minimum: 1
          description: 按钮数量，须与 buttons 数组长度一致
        fixed_to_bottom:
          type: boolean
          description: 按钮栏固定在页面底部
        widget_max_images_number:
          type: integer
          minimum: 1
          description: 最多展示的图片数，须不小于 widget_images 的长度
        phones:
          type: array
          description: 联系电话
          items:
            type: object
            required:
            - phone
            additionalProperties: false
            properties:
              phone:
                type: string
        nav_address:
          type: string
          description: 导航地址文字
        longitude:
          type: number
          description: 经度
        latitude:
          type: number
          description: 纬度
        value:
          type: string
          description: 显示值
        localizable_on_mobile:
          type: boolean
          description: 移动端允许跳转定位
        lines:
          type: integer
          minimum: 1
          description: 滚动行数
        entries_init_number:
          type: integer
          minimum: 0
          description: 起始展示的提交数
        entries_number_visible:
          type: boolean
          description: 显示提交数
        marquee_data_type:
          type: string
          enum:
          - fake
          - real
          description: 数据来源：fake 为生成，real 为真实数据
      allOf:
      - description: display_as_percentage 与 thousands_separator 不能同时为 true
        not:
          properties:
            display_as_percentage:
              const: true
            thousands_separator:
              const: true
          required:
          - display_as_percentage
          - thousands_separator
      - description: minimum_length / maximum_length 只在 likert_choice_style=multiple 时有意义
        if:
          not:
            properties:
              likert_choice_style:
                const: multiple
            required:
            - likert_choice_style
        then:
          not:
            anyOf:
            - required:
              - minimum_length
            - required:
              - maximum_length
      - description: calculable=true 时每个选项都要有 operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
    ChoiceUpdateInput:
      type: object
      required:
      - field_api_code
      description: 对某个选项类字段（或矩阵 / 表格中的选项列）的选项做增量修改；字段不存在或不支持选项时返回 400
      properties:
        field_api_code:
          type: string
        add:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceInput'
        remove:
          type: array
          description: '要删除的选项 api_code（或显示值），也可写成 `{"api_code": "..."}`'
          items:
            oneOf:
            - type: string
            - type: object
              properties:
                api_code:
                  type: string
        update:
          type: array
          items:
            type: object
            required:
            - api_code
            properties:
              api_code:
                type: string
              value:
                type: string
                description: 新显示值
              operand_value:
                type: number
              selected:
                type: boolean
            additionalProperties: false
      additionalProperties: false
    FieldRuleOperations:
      type: object
      description: 字段规则增量操作，`remove` / `update` 以 `GET /forms/{form_token}/field_rules` 返回的 0 起 `index` 定位；同一 index 不能同时删除和更新
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
        remove:
          type: array
          items:
            type: integer
        update:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
      additionalProperties: false
    FieldRuleWriteInput:
      type: object
      properties:
        index:
          type: integer
          description: 仅 update 操作使用：要修改的规则下标（0 起）
        targets:
          type: array
          items:
            type: string
          description: 受影响字段的 api_code；`targets_display_mode=abort` 时可省略
        targets_display_mode:
          type: string
          enum:
          - show
          - abort
          description: "`show` / `abort`，默认 show"
        operator:
          type: string
          enum:
          - or
          - and
          description: 条件之间的关系，默认 or
        conditions:
          type: array
          items:
            type: object
            required:
            - trigger
            properties:
              trigger:
                type: string
                description: 触发字段 api_code
              comparator:
                type: string
                description: 比较符，缺省取该字段支持的第一个；不支持时返回 400 并列出可用比较符
              value:
                description: 比较值
            additionalProperties: false
      additionalProperties: false
    FormSettingSaveOk:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    FormSettingSaveFailed:
      type: object
      description: 表单设置类接口保存失败时的响应体
      required:
      - errors
      - status
      properties:
        errors:
          type: string
          description: 校验错误信息，多条以逗号分隔
        status:
          type: string
          enum:
          - failed
    FormFrozenError:
      type: object
      description: 表单或其创建者被冻结时的 403 响应体
      required:
      - errors
      - status_code
      properties:
        errors:
          description: 冻结原因；表单被冻结时为字符串数组，创建者账号被禁用时为字符串
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        status_code:
          type: string
          enum:
          - form_forbidden
    ManuallyCloseRule:
      type: object
      required:
      - closed
      properties:
        closed:
          type: boolean
          description: 是否已手动关闭收集
    FormManuallyCloseRuleInput:
      type: object
      required:
      - open
      properties:
        open:
          description: true 开启收集，false 关闭收集；接受布尔值或 "true" / "false" 字符串
          oneOf:
          - type: boolean
          - type: string
            enum:
            - 'true'
            - 'false'
      additionalProperties: false
    FormFillFrequency:
      type: object
      description: 填写频率限制（读取）
      required:
      - fill_type
      - condition
      - cycle_period
      - cycles_per_period
      - limited_time
      - limited_field_api_codes
      properties:
        fill_type:
          type: string
          description: 限制类型；历史数据可能为空字符串
          enum:
          - unlimited
          - once
          - repeatable
          - repeatable_by_day
          - custom_repeatable
          - ''
        condition:
          type: string
          description: 判定同一填写者的依据；不限制时为空字符串。未设置时服务端按登录用户判定
          enum:
          - by_weixin
          - by_ip
          - by_device
          - by_fields
          - ''
        cycle_period:
          type: string
          description: 周期单位；仅 repeatable / custom_repeatable 有值，否则为空字符串
          enum:
          - every_hour
          - every_day
          - every_week
          - every_month
          - ''
        cycles_per_period:
          type: integer
          description: 每几个周期（仅 custom_repeatable 生效，1 ~ 1000）
        limited_time:
          type:
          - integer
          - 'null'
          description: 每周期允许填写次数
        limited_field_api_codes:
          type: array
          description: condition 为 by_fields 时按哪些字段判定
          items:
            type: string
    FormFillFrequencyInput:
      type: object
      description: 填写频率限制（写入）
      properties:
        fill_type:
          type: string
          enum:
          - unlimited
          - once
          - repeatable
          - repeatable_by_day
          - custom_repeatable
          description: 限制类型；custom_repeatable 为付费功能
        condition:
          type: string
          enum:
          - by_weixin
          - by_ip
          - by_device
          - by_fields
          description: 判定依据；by_fields 为付费功能。fill_type 为 unlimited 时会被清空
        cycle_period:
          type: string
          enum:
          - every_hour
          - every_day
          - every_week
          - every_month
          description: 周期单位；仅 repeatable / custom_repeatable 保留
        cycles_per_period:
          type: integer
          minimum: 1
          maximum: 1000
          description: 每几个周期；仅 custom_repeatable 保留，其余类型重置为 1
        limited_time:
          type: integer
          minimum: 1
          description: 每周期允许次数；repeatable / custom_repeatable 时必须大于 0
        limited_field_api_codes:
          type: array
          description: condition 为 by_fields 时必填且不能为空
          items:
            type: string
    FormSetting:
      type: object
      description: 表单设置（GET /forms/{form_token}/setting 的响应）
      required:
      - success_message
      - success_message_rich_text
      - success_message_style
      - entry_submit_mode
      - success_redirect_url
      - success_redirect_fields
      - show_entry_on_success
      - show_entry_on_success_button_text
      - edit_entry_on_success
      - show_serial_number_on_success
