          type: string
          description: 选项显示值
        name:
          type: string
          description: 与 value 等价
        api_code:
          type: string
          description: 指定选项 api_code；缺省由服务端生成，编辑时用于保留身份
        quota:
          type: integer
          minimum: 1
          description: 名额上限；不限名额时省略
        operand_value:
          type: number
          description: 选项赋值
        selected:
          type: boolean
          description: 默认选中
        is_other:
          type: boolean
          description: 设为其他选项（选中后出现填写框），文字照原样保留；文字正好是「其他」「其它」的不用设。只用于单选 / 多选 / 下拉
    DimensionInput:
