    GoodsItemInput:
      type: object
      title: GoodsItemInput
      additionalProperties: false
      description: 商品项目
      required:
      - name
      - layout
      properties:
        name:
          type: string
          description: 商品名
        layout:
          type: string
          enum:
          - without_images
          - price_only
          - images
          - text_options
          description: 布局
        api_code:
          type: string
          description: 编辑时用于保留身份；缺省按 name 匹配已有项目
        description:
          type: string
          description: 商品说明
        position:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        price:
          type: number
          minimum: 0
        original_price:
          type: number
          minimum: 0
          description: 划线价
        predefined_number:
          type: integer
          minimum: 0
          description: 默认数量
        fixed_number:
          type: boolean
          description: 数量不可修改
        inventory:
          type: integer
          minimum: 0
          description: 库存；有规格时写在各 sku 上
        inventory_reset:
          type: boolean
        min_purchase_quantity:
          type: integer
          minimum: 0
        max_purchase_quantity:
          type: integer
          minimum: 0
        dimensions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - options
            properties:
              api_code:
                type: string
                description: 编辑时用于保留身份
              label:
                type: string
                description: 维度名，如「尺寸」
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - label
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                      description: 缺省自动生成；customized 表示自定义金额选项
          description: 规格维度
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - specification
            properties:
              specification:
                type: object
                additionalProperties:
                  type: string
                description: 键为维度 api_code 或名称，值为选项 value 或名称
              price:
                type: number
                minimum: 0
              original_price:
                type: number
                minimum: 0
              inventory:
                type: integer
                minimum: 0
              inventory_reset:
                type: boolean
              min_purchase_quantity:
                type: integer
                minimum: 0
              max_purchase_quantity:
                type: integer
                minimum: 0
          description: 规格组合，specification 须为每个维度各指定一个选项
        image_urls:
          type: array
          items:
            type: string
            format: uri
          description: layout=images 的商品图地址
        image_base64s:
          type: array
          items:
            type: string
          description: layout=images 的 Base64 商品图
      dependentRequired:
        dimensions:
        - skus
        skus:
        - dimensions
      allOf:
      - description: price_only / text_options 布局必须带规格
        if:
          properties:
            layout:
              enum:
              - price_only
              - text_options
        then:
          required:
          - dimensions
          - skus
      - description: images 布局至少一张图
        if:
          properties:
            layout:
              const: images
        then:
          anyOf:
          - required:
            - image_urls
            properties:
              image_urls:
                minItems: 1
          - required:
            - image_base64s
            properties:
              image_base64s:
                minItems: 1
