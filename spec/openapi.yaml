    SMSTemplateCreateInput:
      type: object
      required:
      - signature
      - content
      properties:
        signature:
          type: string
          description: Signature text, without `【】`; a notification signature with `channel` normal
        content:
          type: string
          description: Template content, without the signature
        apply_description:
          type: string
          maxLength: 200
          description: What the SMS is used for, shown to the reviewer
        variables:
          type: array
          minItems: 1
          description: The variables the content uses as `$(var_1)`, `$(var_2)` and so on, each once
          items:
            $ref: '#/components/schemas/SMSTemplateVariableInput'
      additionalProperties: false
    SMSTemplateUpdateInput:
      type: object
      description: The keys of `POST /sms/templates`; only those present change
      properties:
        signature:
          type: string
          description: Signature text, without `【】`; a notification signature with `channel` normal
        content:
          type: string
          description: Template content, without the signature; keeps the template's `$(...)` variables unless `variables` declares new ones
        apply_description:
          type: string
          maxLength: 200
          description: What the SMS is used for, shown to the reviewer
        variables:
          type: array
          minItems: 1
          description: The variables the content uses as `$(var_1)`, `$(var_2)` and so on, each once; replaces the declared ones as a whole
          items:
            $ref: '#/components/schemas/SMSTemplateVariableInput'
      additionalProperties: false
    SMSTemplate:
      type: object
      required:
      - id
      - signature
      - content
      - variables
      - status
      - reason
      - scope
      - scene
      - channel
      properties:
        id:
          type: string
          description: Template ID
        signature:
          type:
          - string
          - 'null'
          description: Signature text; null for an early template without one, which needs `signature` when updated
        content:
          type: string
          description: Template content as saved
        variables:
          type: array
          description: The variables in the order the content uses them; when sending with the template, pass `placeholder_keys` with one field api_code per variable in this order
          items:
            $ref: '#/components/schemas/SMSTemplateVariable'
        status:
          type:
          - string
          - 'null'
          enum:
          - CHECKING
          - SUCCESS
          - FAIL
          -
          description: 'Review status: CHECKING (under review), SUCCESS (approved), FAIL (rejected)'
        reason:
          type:
          - string
          - 'null'
          description: The reason when rejected
        scope:
          type: string
          enum:
          - owned
          - shared
          - official
          description: owned can be changed or deleted; shared can only be sent; official templates are approved ones Jinshuju provides to every account, sendable right away without a review, and cannot be changed or deleted
        scene:
          type:
          - string
          - 'null'
          description: For an official template, the scene it is written for, one of a form's `scene` values; `form` ones are general-purpose and suit any form. In the product a form offers only the official templates of its own scene, while the API lets any form send with any of them. null for other templates
        channel:
          type: string
          enum:
          - normal
          - marketing
          description: marketing templates cannot be created through the API
      examples:
      - id: 6512a1c2d3e4f5a6b7c8d9e0
        signature: 小金培训
        content: "$(var_1)，你报名的课程将于 $(var_2) 开课，请准时参加。"
        variables:
        - key: var_1
          label: 姓名
          type: name
          example: 姓名，示例：张三
        - key: var_2
          label: 开课时间
          type: time
          example: 2026-10-27 09:00
        status: CHECKING
        reason:
        scope: owned
        scene:
        channel: normal
    SMSTemplateVariableInput:
