      tags:
      - Uploads
      summary: Upload a form image
      operationId: uploadFormImage
      description: |
        Uploads an image for a form; it takes effect once a form, theme or public query references it.
        - `description` returns a `url` for an `<img src>` in the form `description` or a field's `notes`, at most 30 per form; every other type returns an `attachment_id` for the property that names that `image_type`.
        - An `attachment_id` is taken only where its `image_type` goes, and only while the image is unused or already that form's; an image nothing uses within 7 days is deleted.

        OAuth scope: forms when `image_type` is field_choice, goods_item, contact_widget, opensearch_header or description; form_setting otherwise
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image_type
              - file
              properties:
                image_type:
                  type: string
                  enum:
                  - field_choice
                  - header
                  - wallpaper
                  - carousel
                  - opensearch_header
                  - description
                  - goods_item
                  - contact_widget
                  description: What the image is for
                file:
                  type: string
                  description: The image file
                  contentMediaType: application/octet-stream
              additionalProperties: false
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFormImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
