      summary: Delete a comment on an entry
      description: 'Deletes a comment. The comment''s author, the form''s creator, or a cooperator with the admin role can delete it; any other cooperator gets 400. Returns 404 (comment cannot be found) for a comment that is already deleted or does not belong to the entry. OAuth scope: read_entries'
      operationId: deleteEntryComment
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
