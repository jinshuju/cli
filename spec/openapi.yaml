    FormSettingWriteInput:
      type: object
      description: |
        The `setting` used when creating / editing a form. Only the keys below are accepted; other keys are ignored. A write describes the resulting state: omitted keys keep their current values, and `null` clears a key.
        - Passing only `success_message` automatically sets `success_message_style` to `text`; passing only `success_message_rich_text` sets it to `rich_text`.
        - `submission_region_limited=true` requires a plan that includes "Submission region limit" and at least one item in `submission_regions`.
        - `merchant_account_id` (小金商户) cannot be bound together with `wxpay_account_id` / `alipay_account_id`; a newly passed payment account must belong to the current account, and once bound, `payment_way` becomes `third_party` automatically and `payment_expirable` turns on unless passed or already `false`.
        - `notification_rules` replaces all notification rules created through the API as a whole (`[]` clears them); rules created in the desktop UI are not affected.
      properties:
        success_message:
          type: string
        success_message_rich_text:
          type: string
        success_message_style:
          type: string
          enum:
          - text
          - rich_text
        entry_submit_mode:
          type: string
          enum:
          - show_message
          - redirect
          - reports
          - exam_score
        success_redirect_url:
          type: string
        success_redirect_fields:
          type: array
          items:
            type: string
        open_entry_action:
          type: string
          enum:
          - hide
          - view
          - edit
        open_entry_message:
          type: string
        open_entry_cancel_reservation:
          type: boolean
        show_serial_number_on_success:
          type: boolean
        show_submit_again:
          type: boolean
        hide_login_and_signup:
          type: boolean
