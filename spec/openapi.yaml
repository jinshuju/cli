    FormCreateConstraints:
      title: FormCreateConstraints
      description: 创建表单时字段与场景 / 布局的组合约束
      allOf:
      - description: card 布局不能包含分页式无法渲染的字段类型
        if:
          properties:
            layout:
              const: card
          required:
          - layout
        then:
          properties:
            fields:
              items:
                properties:
                  type:
                    not:
                      enum:
                      - PageBreak
                      - GoodsField
                      - MultipleBlanksField
                      - WidgetContact
                      - WidgetVideo
                      - WidgetButton
      - description: SingleSelect / MultiSelect / ImageSingleSelect / ImageMultiSelect / DropDownSelect 只能用在 exam / evaluation 场景
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - SingleSelect
                    - MultiSelect
                    - ImageSingleSelect
                    - ImageMultiSelect
                    - DropDownSelect
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - exam
              - evaluation
          required:
          - scene
      - description: TrueOrFalse / FillInBlank / ShortAnswer / FillInNumber 只能用在 exam 场景
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - TrueOrFalse
                    - FillInBlank
                    - ShortAnswer
                    - FillInNumber
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - exam
          required:
          - scene
      - description: Rating / Nps 只能用在 evaluation 场景
        if:
          properties:
            fields:
              type: array
              contains:
                properties:
                  type:
                    enum:
                    - Rating
                    - Nps
                required:
                - type
          required:
          - fields
        then:
          properties:
            scene:
              enum:
              - evaluation
          required:
          - scene
