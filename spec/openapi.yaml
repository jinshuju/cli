    TableFolderMoveResult:
      type: object
      required:
      - table_token
      - folder_token
      properties:
        table_token:
          type: string
        folder_token:
          type:
          - string
          - 'null'
          description: Token of the folder it is in after the move; null when moved out of folders
    FormTransactions:
      type: object
      description: |
        Payment statistics, grouped by transaction status (present when `include_transactions=true` and the form is bound to a payment account). Only the `paid` group exists for now:
        entries whose transaction status is paid or refunding, summed by order total (refunds not deducted); refunded and partially refunded entries are not counted. This is not a net income report.
        An amount of 0 does not mean the form is not a payment form.
      required:
      - paid
      properties:
        paid:
          type: object
          required:
          - amount
          - count
          properties:
            amount:
              type: number
              description: Sum of the order totals of this group's entries, in yuan (CNY)
            count:
              type: integer
              description: Number of entries in this group
    FormDetail:
      description: Form structure, plus what the `include_*` parameters add
      allOf:
      - $ref: '#/components/schemas/Form'
      - type: object
        properties:
          theme:
            type: object
            description: Form theme (present when `include_theme=true`); same shape as `FormTheme`, but without `form_token`. An empty object when the form has no theme
            additionalProperties: true
          field_rules:
            type: array
            description: Field display rules (present when `include_field_rules=true`), same as `data` of `GET /forms/{form_token}/field_rules`
            items:
              $ref: '#/components/schemas/FieldRule'
          extended_attributes:
            type: array
            description: Source-tracking links (present when `include_extended_attributes=true`), same as `data` of `GET /forms/{form_token}/extended_attributes`
            items:
              $ref: '#/components/schemas/ExtendedAttribute'
          transactions:
            $ref: '#/components/schemas/FormTransactions'
    FormViewFillItem:
      type: object
      description: One fill item on a form view's fill page (effective values)
      required:
      - api_code
      - label
      - notes
      - required
      properties:
        api_code:
          type: string
          description: The column's api_code
        label:
          type:
          - string
          - 'null'
          description: Label shown on the fill page (the column label unless set separately)
        notes:
          type:
          - string
          - 'null'
          description: Notes shown on the fill page (the column notes unless set separately)
        required:
          type: boolean
          description: Whether it is required
    FormViewFieldOverrideInput:
      type: object
      description: Configuration of one fill item of a form view
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: The column's api_code; the column must exist and be usable as a fill item, and cannot repeat within one request
        label:
          type:
          - string
          - 'null'
          description: Label on the fill page; falls back to the column label when empty
        notes:
          type:
          - string
          - 'null'
          description: Notes on the fill page; falls back to the column notes when empty
        private:
          type:
          - boolean
          - 'null'
          description: When true, hidden from the fill page; when not passed, follows the column's own setting
        position:
          type:
          - integer
          - 'null'
          description: Position on the fill page; when not passed, the array order
        validations:
          type: array
          description: Validations of this fill item; currently `presence` marks it required. Each must be a validation the column type supports (e.g. yes/no and formula columns cannot be made required); otherwise returns 422
          items:
            type: string
            examples:
            - presence
      additionalProperties: false
    EntryImportInput:
      type: object
      description: Request body of POST /forms/{form_token}/entry_imports
      required:
      - attachment_id
      - columns
      properties:
        attachment_id:
          type: string
          description: The import attachment `id` returned by "Upload an import file"
        columns:
          type: array
          minItems: 1
          description: Column mapping; each item writes one spreadsheet column into one field
          items:
            $ref: '#/components/schemas/EntryImportColumnInput'
        header_row_index:
          type:
          - integer
          - string
          - 'null'
          pattern: "^[0-9]+$"
          description: Row number of the header row (as numbered in the spreadsheet, starting at 1); defaults to the first row of the spreadsheet, and data rows must follow below it
          examples:
          - 1
        unique_field_code:
          type:
          - string
          - 'null'
          description: api_code of the dedup field; a row is skipped when the file's value for this field already exists in the form's entries
      additionalProperties: false
    EntryImportColumnInput:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: api_code of the target field; must be a field of this form that accepts imports
        column_label:
          type: string
          description: Header text of the source column, matched exactly after trimming leading and trailing spaces; give at least one of this and `sheet_column_index`
        sheet_column_index:
          type:
          - integer
          - string
          pattern: "^[0-9]+$"
          description: Column number of the source column (as numbered in the spreadsheet, starting at 1); for a missing or duplicate header. Takes precedence over `column_label`
      additionalProperties: false
      examples:
      - field_api_code: field_1
        column_label: 姓名
      - field_api_code: field_2
        sheet_column_index: 3
    EntryImportCreated:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          description: Import job ID, for "Show an entry import job"
        status:
          type: string
          description: Job status; `pending` right after creation
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
    EntryImportJob:
      type: object
      required:
      - job_id
      - status
      - total_rows
      - processed_rows
      - imported_count
      - skip_count
      - invalid_count
      - warnings
      - error_message
      - started_at
      - finished_at
      properties:
        job_id:
          type: string
        status:
          type: string
          description: "`pending` queued, `running` in progress; `success` / `failed` / `cancelled` are final"
          enum:
          - pending
          - running
          - success
          - failed
          - cancelled
        total_rows:
          type:
          - integer
          - 'null'
          description: Number of data rows to import; null before the job starts
        processed_rows:
          type: integer
          description: Rows processed
        imported_count:
          type:
          - integer
          - 'null'
          description: Rows written successfully; may be null before the job finishes
        skip_count:
          type:
          - integer
          - 'null'
          description: Rows skipped (e.g. deduplicated by `unique_field_code`)
        invalid_count:
          type:
          - integer
          - 'null'
          description: Rows that failed field validation
        warnings:
          type: array
          description: Per-row messages
          items:
            type: string
        error_message:
          type:
          - string
          - 'null'
          description: Why the job failed
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the job started (UTC)
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the job finished (UTC)
    TimeOfDay:
      type: object
      required:
      - hour
      - minute
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
      additionalProperties: false
    DailyRepeatCloseRuleInput:
      type:
      - object
      - 'null'
      description: |
        Daily open hours: the form accepts submissions only within these periods each day (e.g. 11:00-12:40, 17:00-18:30). It can coexist with `by_time_range_close_rule` and `by_entries_close_rule`.
        Passing `time_periods` replaces all existing periods; passing `{ "enabled": false }` deletes the rule. The `end_time` of each period must not be earlier than its `start_time`; otherwise returns 400.
      properties:
        enabled:
          type: boolean
          description: Pass false to delete the rule; omit it when passing `time_periods`
        time_periods:
          type: array
          description: One daily open period per item
          items:
            type: object
            required:
            - start_time
            - end_time
            properties:
              start_time:
                $ref: '#/components/schemas/TimeOfDay'
              end_time:
                $ref: '#/components/schemas/TimeOfDay'
            additionalProperties: false
      additionalProperties: false
      examples:
      - time_periods:
        - start_time:
            hour: 11
            minute: 0
          end_time:
            hour: 12
            minute: 40
      - enabled: false
    DailyRepeatCloseRule:
      type:
      - object
      - 'null'
      description: Daily open hours; null when not set
      required:
      - time_periods
      properties:
        time_periods:
          type: array
          items:
            type: object
            required:
            - start_time
            - end_time
            properties:
              start_time:
                type: object
                properties:
                  hour:
                    type: integer
                  minute:
                    type: integer
              end_time:
                type: object
                properties:
                  hour:
                    type: integer
                  minute:
                    type: integer
    TradePageInfo:
