          description: Show the reverse association on the associated form
        reverse_display_field_api_codes:
          type: array
          items:
            type: string
          description: api_code of the fields the reverse association shows
        related_form_token:
          type: string
          description: Token of the related table; must be another table, and you need manage permission on it
        paired:
          type: boolean
          description: Two-way relation, on by default; when on, a reverse column is created in the related table
        related_label:
          type: string
          description: Name of the reverse column, used only when the reverse column is created; defaults to the name of this table
        show_split_line:
          type: boolean
          description: Show a divider line
        show_part_description:
          type: boolean
          description: Collapse the description when it is long
        disable_previous_page:
          type: boolean
          description: Hide the "Previous" button
        previous_page_text:
          type: string
          description: Text of the "Previous" button
        next_page_text:
          type: string
          description: Text of the "Next" button
        count_down:
          type: integer
          minimum: 0
          description: Seconds the "Next" button stays locked; 0 means not locked
        buttons_number:
          type: integer
          minimum: 1
          description: Number of buttons; must equal the length of buttons
        fixed_to_bottom:
          type: boolean
          description: Pin the button bar to the bottom of the page
        widget_max_images_number:
          type: integer
          minimum: 1
          description: Maximum number of images shown; at least the length of widget_images
        phones:
          type: array
          description: Contact phone numbers
          items:
            type: object
            required:
            - phone
            additionalProperties: false
            properties:
              phone:
                type: string
        nav_address:
          type: string
          description: Address text used for navigation
        longitude:
          type: number
          description: Longitude
        latitude:
          type: number
          description: Latitude
        value:
          type: string
          description: Value shown
        localizable_on_mobile:
          type: boolean
          description: On mobile, allow opening the location in a map
        lines:
          type: integer
          minimum: 1
          description: Number of scrolling lines
        entries_init_number:
          type: integer
          minimum: 0
          description: Submission count to start from
        entries_number_visible:
          type: boolean
          description: Show the submission count
        marquee_data_type:
          type: string
          enum:
          - fake
          - real
          description: 'Data source: fake for generated data, real for real entries'
      allOf:
      - description: display_as_percentage and thousands_separator cannot both be true
        not:
          properties:
            display_as_percentage:
              const: true
            thousands_separator:
              const: true
          required:
          - display_as_percentage
          - thousands_separator
      - description: With calculable=true, every choice needs an operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
    ChoiceUpdateInput:
      type: object
      required:
      - field_api_code
      description: Incremental changes to the choices of a choice field (or of a choice column in a matrix / table field); returns 400 when the field does not exist or does not support choices
      properties:
        field_api_code:
          type: string
        add:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceInput'
        remove:
          type: array
          description: 'api_code (or choice label) of a choice to remove; can also be written as `{"api_code": "..."}`'
          items:
            oneOf:
            - type: string
            - type: object
              properties:
                api_code:
                  type: string
        update:
          type: array
          items:
            type: object
            required:
            - api_code
            properties:
              api_code:
                type: string
              value:
                type: string
                description: New choice label
              operand_value:
                type: number
              selected:
                type: boolean
              quota:
                type:
                - integer
                - 'null'
                minimum: 0
                description: Maximum number of places, read back as `quota_setting`; 0 closes the choice. Changing a limit keeps the places already taken; null lifts the limit
              recover_quota:
                type: integer
                minimum: 1
                description: Places to give back to a single choice, multiple choice or drop-down choice with a limit, keeping the limit, as deleting an entry does; the places left stop at the limit
            additionalProperties: false
      additionalProperties: false
    FieldRuleOperations:
      type: object
      description: Incremental field display rule operations; `remove` / `update` target a rule by the 0-based `index` that `GET /forms/{form_token}/field_rules` returns; the same index cannot be both removed and updated
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
        remove:
          type: array
          items:
            type: integer
        update:
          type: array
          items:
            $ref: '#/components/schemas/FieldRuleWriteInput'
      additionalProperties: false
    FieldRuleWriteInput:
      type: object
      properties:
        index:
          type: integer
          description: 'Used by update only: index of the rule to change (0-based)'
        targets:
          type: array
          items:
            type: string
          description: api_codes of the affected fields; may be omitted when `targets_display_mode=abort`
        targets_display_mode:
          type: string
          enum:
          - show
          - abort
          description: 'show (default): the targets stay hidden, and anything written into them is dropped, until the conditions hold'
        operator:
          type: string
          enum:
          - or
          - and
          description: How the conditions are combined, defaults to or
        conditions:
          type: array
          items:
            type: object
            required:
            - trigger
            properties:
              trigger:
                type: string
                description: api_code of the trigger field
              comparator:
                type: string
                description: Comparator, defaults to the first one the field supports; an unsupported one returns 400 listing the available comparators
              value:
                description: Value to compare with
            additionalProperties: false
      additionalProperties: false
    FormSettingSaveOk:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    FormSettingSaveFailed:
