            province:
              type: string
            city:
              type: string
        info_remote_ip:
          type: string
      additionalProperties: true
      examples:
      - token: kjFelJqi
        serial_number: 36
        field_1: 张三
        field_3:
        - 选项 A
        - 选项 B
        field_9: 198
        field_12: '2021-09-23'
        creator_name: ''
        created_at: '2021-09-28T02:59:42.539Z'
