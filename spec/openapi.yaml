          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: Days of the week that can be booked, as lowercase English day names
        show_left_quota:
          type: boolean
          description: Show the places left
        start_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking opens
        end_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking closes
        daily_time_range_quotas:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              for_wday:
                type: string
                enum:
                - sunday
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
                description: Day of the week, as a lowercase English day name
              quota:
                type: integer
                minimum: 0
                description: Places
              price:
                type: number
                minimum: 0
                description: Price when payable
              position:
                type: integer
                minimum: 0
              daily_time_range_token:
                type: string
          description: Places per day of the week
        non_reservable_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              start_time:
                type: string
              end_time:
                type: string
          description: Time ranges that cannot be booked
    ReservationByTimeRangeQuotaInput:
      type: object
      title: ReservationByTimeRangeQuotaInput
      additionalProperties: false
      required:
      - type
      - available_days_of_week
      properties:
        type:
          const: by_time_range_repeat_daily
        available_days_of_week:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - sunday
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
          description: Days of the week that can be booked, as lowercase English day names
        show_left_quota:
          type: boolean
          description: Show the places left
        start_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking opens
        end_time_offset:
          type: object
          additionalProperties: false
          properties:
            offset_number:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - day
              - hour
          description: How far in advance booking closes
        daily_time_range_quotas:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - start_time
            - end_time
            properties:
              for_wday:
                type: string
                enum:
                - sunday
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
                description: Day of the week, as a lowercase English day name
              quota:
                type: integer
                minimum: 0
                description: Places
              price:
                type: number
                minimum: 0
                description: Price when payable
              position:
                type: integer
                minimum: 0
              daily_time_range_token:
                type: string
              start_time:
                type: object
                additionalProperties: false
                properties:
                  hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minute:
                    type: integer
                    minimum: 0
                    maximum: 59
                description: Start time
              end_time:
                type: object
                additionalProperties: false
                properties:
                  hour:
                    type: integer
                    minimum: 0
                    maximum: 23
                  minute:
                    type: integer
                    minimum: 0
                    maximum: 59
                description: End time
          description: Places per time slot
        non_reservable_rules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              start_time:
                type: string
              end_time:
                type: string
          description: Time ranges that cannot be booked
        time_range_mode:
          type: string
          enum:
          - same_by_wday
          - different_by_wday
          description: 'same_by_wday: the same time slots every day; different_by_wday: every slot must carry for_wday'
      if:
        properties:
          time_range_mode:
            const: different_by_wday
        required:
        - time_range_mode
      then:
        properties:
          daily_time_range_quotas:
            items:
              required:
              - for_wday
    WidgetImageInput:
      type: object
      title: WidgetImageInput
      additionalProperties: false
      anyOf:
      - required:
        - image_url
      - required:
        - image_base64
      - required:
        - attachment_id
      properties:
        image_url:
          type: string
          format: uri
        image_base64:
          type: string
        attachment_id:
          type: string
          description: The `attachment_id` of an image_type=contact_widget upload, or an image this form already has
    FormCreateConstraints:
      title: FormCreateConstraints
      description: Constraints between fields and scene / layout when creating a form
      allOf:
      - description: The card layout cannot hold field types the paged layout cannot render
        if:
          properties:
            layout:
              const: card
          required:
          - layout
        then:
          properties:
            fields:
              items:
                properties:
                  type:
                    not:
                      enum:
                      - PageBreak
                      - MultipleBlanksField
                      - WidgetContact
                      - WidgetVideo
                      - WidgetButton
      - description: scene=exam takes ExamFieldInput
        if:
          properties:
            scene:
              const: exam
          required:
          - scene
        then:
          properties:
            fields:
              items:
                $ref: '#/components/schemas/ExamFieldInput'
      - description: scene=evaluation takes EvaluationFieldInput
        if:
          properties:
            scene:
              const: evaluation
          required:
          - scene
        then:
          properties:
            fields:
              items:
                $ref: '#/components/schemas/EvaluationFieldInput'
      - description: Any other scene takes FieldInput
        if:
          properties:
            scene:
              enum:
              - exam
              - evaluation
          required:
          - scene
        else:
          properties:
            fields:
              items:
                $ref: '#/components/schemas/FieldInput'
