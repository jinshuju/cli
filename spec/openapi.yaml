        related_label:
          type: string
          description: Name of the reverse column, used only when the reverse column is created; defaults to the name of this table
    GoodsItemUpdateInput:
      type: object
      title: GoodsItemUpdateInput
      additionalProperties: false
      description: A goods item; one with api_code is an existing item and keeps whatever it leaves out
      properties:
        name:
          type: string
          description: Goods name
        layout:
          type: string
          enum:
          - without_images
          - price_only
          - images
          - text_options
          description: Layout
        api_code:
          type: string
          description: Keeps the identity of the item on edit; when left out, an existing item is matched by name
        description:
          type: string
          description: Goods description
        position:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        price:
          type: number
          minimum: 0
        original_price:
          type: number
          minimum: 0
          description: Original price, shown struck through
        predefined_number:
          type: integer
          minimum: 0
          description: Default quantity
        fixed_number:
          type: boolean
          description: The quantity cannot be changed
        inventory:
          type: integer
          minimum: 0
          description: Stock; with specifications, set it on each sku instead
        inventory_reset:
          type: boolean
        min_purchase_quantity:
          type: integer
          minimum: 0
        max_purchase_quantity:
          type: integer
          minimum: 0
        dimensions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - options
            properties:
              api_code:
                type: string
                description: Keeps the identity on edit
              label:
                type: string
                description: Dimension name, such as `尺寸`
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - label
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                      description: Generated when left out; customized marks a custom amount option
          description: Specification dimensions
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - specification
            properties:
              specification:
                type: object
                additionalProperties:
                  type: string
                description: Keyed by dimension api_code or name; each value is an option value or name
              price:
                type: number
                minimum: 0
              original_price:
                type: number
                minimum: 0
              inventory:
                type: integer
                minimum: 0
              inventory_reset:
                type: boolean
              min_purchase_quantity:
                type: integer
                minimum: 0
              max_purchase_quantity:
                type: integer
                minimum: 0
          description: Specification combinations; specification must name one option for every dimension
        image_urls:
          type: array
          items:
            type: string
            format: uri
          description: Goods image URLs for layout=images
        image_base64s:
          type: array
          items:
            type: string
          description: Base64 goods images for layout=images
        attachment_ids:
          type: array
          items:
            type: string
          description: Goods images for layout=images, by the `attachment_id` an image_type=goods_item upload returns, or an image this form already has
      dependentRequired:
        dimensions:
        - skus
        skus:
        - dimensions
      if:
        not:
          required:
          - api_code
      then:
        required:
        - name
        - layout
        allOf:
        - description: The price_only / text_options layouts require specifications
          if:
            properties:
              layout:
                enum:
                - price_only
                - text_options
          then:
            required:
            - dimensions
            - skus
        - description: The images layout needs at least one image
          if:
            properties:
              layout:
                const: images
          then:
            anyOf:
            - required:
              - image_urls
              properties:
                image_urls:
                  minItems: 1
            - required:
              - image_base64s
              properties:
                image_base64s:
                  minItems: 1
            - required:
              - attachment_ids
              properties:
                attachment_ids:
                  minItems: 1
    SequenceFieldInput:
      type: object
      title: SequenceFieldInput
      description: SequenceField field
      additionalProperties: false
      required:
      - type
      - label
      properties:
        type:
          const: SequenceField
        label:
          type: string
          description: Field label
        cid:
          type: string
          description: Temporary id within this request, for formulas and the like to refer to
        notes:
          type: string
          description: Field notes
        private:
          type: boolean
          description: 'Hidden field: fillers do not see it, it is not checked for required, and an exam or evaluation does not score it'
        required:
          type: boolean
          description: Required
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        segments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SequenceSegmentInput'
          description: Numbering rule, joined in order; exactly one sequence_number part. Defaults to a single 4-digit sequence number
    SequenceSegmentInput:
      type: object
      title: SequenceSegmentInput
      additionalProperties: false
      description: One part of a numbering rule
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - fixed_text
          - field_value
          - sequence_number
          description: 'fixed_text: fixed characters; field_value: the value of another field of the entry; sequence_number: the auto-increment number'
        value:
          type: string
          minLength: 1
          maxLength: 6
          description: 'fixed_text: the characters'
        api_code:
          type: string
          description: 'field_value: api_code of an existing text, name, email, mobile, ID card, number, single choice, drop-down or date field, created_at / updated_at included'
        cid:
          type: string
          description: 'field_value: cid of a field created in the same request, instead of api_code'
        digits:
          type: integer
          minimum: 1
          maximum: 12
          description: 'sequence_number: digits, zero-padded'
      allOf:
      - if:
          properties:
            kind:
              const: fixed_text
        then:
          required:
          - value
      - if:
          properties:
            kind:
              const: field_value
        then:
          anyOf:
          - required:
            - api_code
          - required:
            - cid
      - if:
          properties:
            kind:
              const: sequence_number
        then:
          required:
          - digits
    RoutineRefusal:
      type: object
      required:
      - error_description
      - errors
      properties:
        error_description:
          type: string
          description: The first reason's `message`
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                enum:
                - active_limit
                - once_passed
                - object_unavailable
                - field_unavailable
                - invalid
                - delete_authorization_page_only
                description: |
                  What kind of reason it is: `active_limit` 20 routines are enabled already; `once_passed` a one-off's time has passed; `object_unavailable` an object or the data trigger's source does not exist or you cannot reach it;
                  `field_unavailable` a trigger field does not exist, cannot be seen or cannot be watched (formula and association fields); `delete_authorization_page_only` the body named `delete_authorized`; `invalid` anything else.
              message:
                type: string
                description: The message the routines page shows, word for word
    RoutineInput:
      type: object
      description: |
        The same settings as the routines page. Creating needs `name` and `instruction`, and `trigger_kind` defaults to `schedule`; updating keeps what a key left out, or null, had.
        This schema only fixes each key's type: values against the rules (an incomplete schedule, a field that cannot be watched, a limit reached) return `422`, with the page's messages in `errors`.
        Keys not listed here, inside `schedule`, `event`, the objects and the conditions too, are ignored rather than refused, so a routine from `GET` can be sent back with a few keys changed.
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name, at most 60 characters
        name_set_by_user:
          type:
          - boolean
          - 'null'
          description: For Jiri, with `name`, when the user gave that name. Jiri's `name` without it leaves a name the user set as it is; from any other caller a changed `name` is the user's own.
        description:
          type:
          - string
          - 'null'
          description: One sentence on what the routine does, for people reading the routines list, at most 100 characters
        instruction:
          type:
          - string
          - 'null'
          description: What Jiri does on each run, at most 2000 characters
        objects:
          type:
          - array
          - 'null'
          description: The objects Jiri reads first, at most 10 and no duplicates; on update they replace the routine's. Only forms and tables you created or that are shared with you, their views you can see, and query pages you created.
          items:
            type: object
            properties:
              kind:
                type: string
                description: form, table, view or opensearch
              token:
                type: string
        trigger_kind:
          type:
          - string
          - 'null'
          description: "`schedule` (fill in `schedule`) or `event`, when data changes (fill in `event`)"
        schedule:
          oneOf:
          - $ref: '#/components/schemas/RoutineScheduleInput'
          - type: 'null'
        event:
          oneOf:
          - $ref: '#/components/schemas/RoutineEventInput'
          - type: 'null'
        delete_authorized:
          description: Not accepted. A body that names it, whatever its value, returns `422` `delete_authorization_page_only`.
    RoutineScheduleInput:
      type: object
      description: |
        A schedule, always in Beijing time. Each frequency reads only its own keys:
        `once` reads `at`; `hourly` reads `minute`; `daily` and `workdays` read `time`; `weekly` reads `weekdays` and `time`; `monthly` reads `month_days` and `time`.
      properties:
        freq:
          type: string
          description: once, hourly, daily, workdays (Monday to Friday, public holidays not considered), weekly or monthly
        at:
          type: string
          description: "`once`: when to run, Beijing time as `YYYY-MM-DDTHH:MM`, or ISO 8601 with an offset (e.g. `2026-10-08T10:00:00+08:00`); must be later than now"
        minute:
          type: integer
          description: "`hourly`: the minute of each hour"
        time:
          type: string
          description: "`daily`, `workdays`, `weekly` and `monthly`: the time of day, `HH:MM`"
        weekdays:
          type: array
          items:
            type: integer
          description: "`weekly`: 1 = Monday … 7 = Sunday"
        month_days:
          type: array
          items:
            type: integer
          description: "`monthly`: 1–31, or -1 for the last day; a month without the day (the 31st, say) is skipped"
    RoutineEventInput:
      type: object
      description: When data changes. The source must be a form or table you created, or whose data you can read; it is added to the objects on save.
      properties:
        source_kind:
          type: string
          description: form or table
        source_token:
          type: string
          description: The source's token
        'on':
          type: string
          description: "`created`, when there is new data (conditions optional); `updated`, when given fields are changed (fill in `field_codes`; conditions optional, judged on the changed data); `matched`, when data comes to meet the conditions (conditions required), once, new data that meets them included"
        field_codes:
          type: array
          items:
            type: string
          description: "`updated`: the api_codes of the fields watched, 1–10; fields the system computes (formula, association) cannot be watched"
        scope_conditions:
          type: array
          description: Data conditions, written as view filters are. Conditions with the same `group_index` are joined by AND or OR by its sign; groups are joined by OR. Each item reads only the keys below.
          items:
            type: object
            properties:
              trigger:
                type: string
                description: The field's api_code (a table column as `<field>.<column>`)
              operator:
                type: string
                description: The comparison, such as eq, ne, gt, lt, any_in, none_in, null, not_null, like or between
              value:
                description: The value compared with
              group_index:
                type: integer
                description: The condition's group
              scope_attr:
                type: string
                description: The attribute the condition applies to
        include_bulk:
          type: boolean
          default: false
          description: Imports and bulk edits trigger it too (one import or bulk edit is one run)
    Routine:
      type: object
      required:
      - id
      - name
      - name_set_by_user
      - description
      - instruction
      - state
      - paused_reason
      - trigger_kind
      - trigger_text
      - schedule
      - next_run_at
      - next_runs
      - event
      - objects
      - delete_authorized
      - runs_count
      - last_run
      - url
      - created_at
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        name_set_by_user:
          type: boolean
          description: Whether the user set the name (on the routines page, through the API, or by telling Jiri); Jiri no longer renames such a routine on its own
        description:
          type:
          - string
          - 'null'
        instruction:
          type: string
        state:
          type: string
          enum:
          - active
          - paused
          description: "`active` enabled, `paused` paused"
        paused_reason:
          type:
          - string
          - 'null'
          enum:
          - user
          - completed
          - failures
          - insufficient_points
          - lost_access
          - content_rejected
          - invalid_trigger
          -
          description: 'Why it is paused: by the user, a one-off that has run, failed runs in a row, AI points short in a row, access to an object lost, content that did not pass the safety check, or a data trigger whose fields no longer work. null when enabled.'
        trigger_kind:
          type: string
          enum:
          - schedule
          - event
        trigger_text:
          type:
          - string
          - 'null'
          description: When it runs, in the page's words, such as `每周一 09:00` or `表单《报名表》有新数据时`. null when the trigger is not complete, or the data trigger's source is gone.
        schedule:
          type:
          - object
          - 'null'
          description: The schedule, with only the keys its frequency uses (`at` in ISO 8601, Beijing time); null for a data trigger
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an enabled schedule runs next (Beijing time); null when paused or for a data trigger
        next_runs:
          type: array
          items:
            type: string
            format: date-time
          description: The next runs of an enabled schedule, at most 5 (Beijing time); empty otherwise
        event:
          type:
          - object
          - 'null'
          description: The data trigger; null for a schedule, or when its source is gone
          required:
          - source_kind
          - source_token
          - source_name
          - 'on'
          - fields
          - scope_conditions
          - conditions
          - include_bulk
          properties:
            source_kind:
              type: string
              enum:
              - form
              - table
            source_token:
              type: string
            source_name:
              type: string
            'on':
              type: string
              enum:
              - created
              - updated
              - matched
            fields:
              type: array
              description: The fields watched
              items:
                type: object
                required:
                - code
                - label
                properties:
                  code:
                    type: string
                  label:
                    type:
                    - string
                    - 'null'
                    description: The field's name; null when it is deleted or you can no longer see it
            scope_conditions:
              type: array
              description: The conditions as stored, in the shape `RoutineEventInput.scope_conditions` takes, so they can be sent back; empty when you can no longer read the source
              items:
                type: object
            conditions:
              type: array
              description: The conditions in words, one sentence per group, such as `「性别」包含任一「男」，且「人数」大于「2」`; groups after the first start with `或者`
              items:
                type: string
            include_bulk:
              type: boolean
        objects:
          type: array
          items:
            type: object
            required:
            - kind
            - token
            - name
            - parent_name
            properties:
              kind:
                type: string
                enum:
                - form
                - table
                - view
                - opensearch
              token:
                type: string
              name:
                type: string
                description: The name when the routine was saved
              parent_name:
                type:
                - string
                - 'null'
                description: The name of the form or table a view or query page belongs to; null otherwise
        delete_authorized:
          type: boolean
          description: Whether runs may delete data in the linked forms and tables
        runs_count:
          type: integer
          description: How many times it has run
        last_run:
          oneOf:
          - $ref: '#/components/schemas/RoutineRun'
          - type: 'null'
          description: The latest run whose planned time has come
        url:
          type: string
          description: The routine's page
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoutineDetail:
      allOf:
      - $ref: '#/components/schemas/Routine'
      - type: object
        required:
        - preview_condition_matches
        properties:
          preview_condition_matches:
            oneOf:
            - $ref: '#/components/schemas/RoutinePreviewConditionMatches'
            - type: 'null'
            description: How the data trigger's conditions meet your latest entries of its source; null for a schedule, a data trigger without conditions, or one whose fields no longer work
    RoutinePreviewConditionMatches:
      type: object
      description: Which entries meet the conditions as they are now, to check the conditions mean what the routine is for. Meeting them is not firing; `created` fires for new entries only, `updated` also needs a watched field changed, and `matched` only when an entry comes to meet them.
      required:
      - checked_serial_numbers
      - matched_count
      - groups
      properties:
        checked_serial_numbers:
          type: array
          items:
            type: integer
          description: The entries checked, the latest 20 of the source you can see, newest first; empty when there are none
        matched_count:
          type:
          - integer
          - 'null'
          description: How many entries meet any group, as a run decides; null when a group cannot be compared
        groups:
          type: array
          description: One per condition group, in the order of `event.conditions`
          items:
            type: object
            required:
            - group_index
            - matched_count
            - matched_serial_numbers
            - error
            properties:
              group_index:
                type: integer
              matched_count:
                type:
                - integer
                - 'null'
              matched_serial_numbers:
                type:
                - array
                - 'null'
                items:
                  type: integer
              error:
                type:
                - string
                - 'null'
                description: Why the group's values cannot be compared with the data, such as `条件的值格式不对，无法和数据比较`; its counts are then null
    RoutineRun:
      type: object
      required:
      - id
      - state
      - trigger_kind
      - scheduled_at
      - started_at
      - finished_at
      - error
      - title
      - summary
      - severity
      - url
      properties:
        id:
          type: string
        state:
          type: string
          enum:
          - queued
          - starting
          - running
          - completed
          - failed
          - skipped
          - cancelling
          - cancelled
        trigger_kind:
          type: string
          enum:
          - schedule
          - manual
          - event
          description: On schedule, run now, or when data changed
        scheduled_at:
          type: string
          format: date-time
          description: The planned time (Beijing time)
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
          enum:
          - timeout
          - jiri_error
          - start_failed
          - content_rejected
          - lost_access
          - invalid_trigger
          - insufficient_points
          - billing_unavailable
          -
          description: Why it failed
        title:
          type:
          - string
          - 'null'
          description: The run's result in a title; null until it has one
        summary:
          type:
          - string
          - 'null'
          description: The run's result in brief
        severity:
          type:
          - string
          - 'null'
          enum:
          - info
          - warning
          - critical
          -
        url:
          type: string
          description: The run's page
    RoutineListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: How many routines match
        count:
          type: integer
          description: How many are on this page
        data:
          type: array
          items:
            $ref: '#/components/schemas/Routine'
        next:
          type:
          - integer
          - 'null'
          description: The next page's row offset; null on the last page
    RoutineRunListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: How many runs the routine has
        count:
          type: integer
          description: How many are on this page
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoutineRun'
        next:
          type:
          - integer
          - 'null'
          description: The next page's row offset; null on the last page
    FormulaFunction:
      title: FormulaFunction
      type: string
      description: A function a formula can call, case-insensitive
      oneOf:
      - const: ABS
        description: 'ABS(number): Absolute value'
      - const: AND
        description: 'AND(condition, condition, ...): TRUE when every condition holds'
      - const: AVG
        description: 'AVG(number, number, ...): Average of the values, skipping blanks; also takes a table column'
      - const: CONCAT
        description: 'CONCAT(text, text, ...): Joins the values into one text, same as text & text'
      - const: COUNT
        description: 'COUNT(value, value, ...): Number of values; also takes a table column'
      - const: DATE
        description: 'DATE(text): The date written as YYYY-MM-DD, or "today", "yesterday" or "tomorrow"'
      - const: DATEADD
        description: 'DATEADD(date, amount, unit): The date moved by amount units; unit is "y", "M", "w", "d", "h", "m" or "s"'
      - const: DATEDIF
        description: 'DATEDIF(start_date, end_date, unit): Whole calendar years ("y"), months ("m") or days ("d") from start_date to end_date; blank when start_date is later'
      - const: DATETIME_DIFF
        description: 'DATETIME_DIFF(end_time, start_time, unit): Time from start_time to end_time in the unit, "y", "M", "w", "d", "h", "m" or "s", with decimals'
      - const: DAY
        description: 'DAY(date): Day of the month, 1 to 31'
      - const: DAYS
        description: 'DAYS(end_date, start_date): Whole days from start_date to end_date'
      - const: FIND
        description: 'FIND(text_to_find, within_text): Position of text_to_find in within_text counting from 1, case-sensitive; 0 when not found'
      - const: ID
        description: 'ID(id_card_number, part): From an 18-digit ID card number: the age when part is 0, the gender text when 1, the birth date when 2'
      - const: IF
        description: 'IF(condition, value_if_true, value_if_false): value_if_true when the condition holds, otherwise value_if_false'
      - const: IFS
        description: 'IFS(condition, value, condition, value, ...): The value paired with the first condition that holds; blank when none holds. Use TRUE as the last condition for a default'
      - const: INT
        description: 'INT(number): Rounds down to an integer, so INT(-1.5) is -2'
      - const: ISBLANK
        description: 'ISBLANK(value): TRUE when the value is blank; a blank number field reads as 0, so it is never blank'
      - const: LEFT
        description: 'LEFT(text, count): The first count characters'
      - const: LEN
        description: 'LEN(text): Number of characters'
      - const: LOG
        description: 'LOG(number, base): Logarithm of the number in the base; natural logarithm when base is left out'
      - const: LOWER
        description: 'LOWER(text): The text in lower case'
      - const: MAX
        description: 'MAX(value, value, ...): Largest number or latest date; also takes a table column'
      - const: MID
        description: 'MID(text, start, count): count characters starting at position start, counting from 1'
      - const: MIN
        description: 'MIN(value, value, ...): Smallest number or earliest date; also takes a table column'
      - const: MOD
        description: 'MOD(number, divisor): Remainder of the division, with the sign of the divisor; blank when divisor is 0'
      - const: MONTH
        description: 'MONTH(date): Month, 1 to 12'
      - const: NOT
        description: 'NOT(condition): TRUE when the condition does not hold'
      - const: NOW
        description: 'NOW(): The current time; formulas using it refresh at most every 15 minutes while the form is read'
      - const: OR
        description: 'OR(condition, condition, ...): TRUE when any condition holds'
      - const: RIGHT
        description: 'RIGHT(text, count): The last count characters'
      - const: ROUND
        description: 'ROUND(number, digits): Rounds to the given decimal places, 0 by default'
      - const: ROUNDDOWN
        description: 'ROUNDDOWN(number, digits): Rounds toward zero to the given decimal places, 0 by default'
      - const: ROUNDUP
        description: 'ROUNDUP(number, digits): Rounds away from zero to the given decimal places, 0 by default'
      - const: SEARCH
        description: 'SEARCH(text_to_find, within_text): Like FIND but ignoring case'
      - const: SUM
        description: 'SUM(number, number, ...): Sum of the values, skipping blanks; also takes a table column'
      - const: SWITCH
        description: 'SWITCH(value, match, result, match, result, ..., default): The result paired with the first match equal to value; the optional last argument is the default'
      - const: TODAY
        description: 'TODAY(): Today''s date; formulas using it refresh once a day when the form is read'
      - const: TRIM
        description: 'TRIM(text): The text without leading and trailing spaces, full-width spaces included'
      - const: UPPER
        description: 'UPPER(text): The text in upper case'
      - const: WEEKDAY
        description: 'WEEKDAY(date): Day of the week, 1 for Sunday to 7 for Saturday'
      - const: YEAR
        description: 'YEAR(date): Four-digit year'
