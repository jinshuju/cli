  "/routines":
    get:
      tags:
      - Routines
      summary: List routines
      operationId: listRoutines
      description: |
        The current user's own routines, newest first.
        OAuth scope: routines
        - Paging: `next` is a row offset; pass it back unchanged for the next page. Only one of `next`, `page` and `skip` can be passed. 50 per page by default, `limit` changes it (at most 1000).
        - Routines belong to a person: a credential with no current user (an account access token and the like) returns `403`, and so does an account that cannot use routines yet.
      parameters:
      - name: state
        in: query
        required: false
        description: 'Only routines in this state: `active` (enabled) or `paused`. Any other value returns `400`.'
        schema:
          type: string
          enum:
          - active
          - paused
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: Routine list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
    post:
      tags:
      - Routines
      summary: Create a routine
      operationId: createRoutine
      description: |
        Creates a routine, enabled from the start. The rules and messages are those of the routines page: a name of at most 60 characters, an instruction of at most 2000, only forms, tables, views and query pages you can reach as objects, at most 20 enabled routines per person, and a one-off time later than now. A data trigger's source is added to the objects.
        OAuth scope: routines
        - A routine against the rules returns `422`, and `errors` gives each reason with its `code` and the page's message.
        - Delete authorization (`delete_authorized`) cannot be set here: a body that names it, true or false, returns `422` `delete_authorization_page_only` and creates nothing.
        - The response's `preview_condition_matches` shows which of your latest entries of the source meet each condition group; if they are not the ones the routine is meant for, fix the conditions.
        - Jiri running a routine cannot create routines (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineInput'
      responses:
        '201':
          description: The routine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '422':
          $ref: '#/components/responses/RoutineRefused'
  "/routines/{id}":
    parameters:
    - $ref: '#/components/parameters/RoutineId'
    get:
      tags:
      - Routines
      summary: Get a routine
      operationId: getRoutine
      description: |
        One of your own routines. Someone else's, or one that does not exist, returns `404`.
        OAuth scope: routines
      responses:
        '200':
          description: The routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
    patch:
      tags:
      - Routines
      summary: Update a routine
      operationId: updateRoutine
      description: |
        Changes the name, instruction, objects, trigger kind, schedule or data trigger. A key left out, or null, keeps what the routine has; `objects` given replaces them all.
        OAuth scope: routines
        - The rules, messages and `preview_condition_matches` are those of creating. A changed schedule cancels the runs queued for the old one; a changed instruction or objects stops a run in progress.
        - A body that names `delete_authorized`, true or false, returns `422` `delete_authorization_page_only` and changes nothing.
        - Jiri running a routine cannot update routines (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineInput'
      responses:
        '200':
          description: The routine as updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
        '422':
          $ref: '#/components/responses/RoutineRefused'
    delete:
      tags:
      - Routines
      summary: Delete a routine
      operationId: deleteRoutine
      description: |
        Deletes the routine for good: it never runs again, and its queued and running runs are cancelled. The conversations of its past runs stay.
        OAuth scope: routines
        - Jiri running a routine cannot delete routines (`403`).
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - deleted
                properties:
                  id:
                    type: string
                    description: The ID of the routine deleted
                  deleted:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
  "/routines/{routine_id}/pause":
    parameters:
    - $ref: '#/components/parameters/RoutineIdNested'
    post:
      tags:
      - Routines
      summary: Pause a routine
      operationId: pauseRoutine
      description: |
        The routine stops running, and its queued and running runs are cancelled. Pausing a paused routine returns it as it is.
        OAuth scope: routines
        - Jiri running a routine cannot pause routines (`403`).
      responses:
        '200':
          description: The routine, paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
  "/routines/{routine_id}/resume":
    parameters:
    - $ref: '#/components/parameters/RoutineIdNested'
    post:
      tags:
      - Routines
      summary: Resume a routine
      operationId: resumeRoutine
      description: |
        Enables a paused routine, which runs again from its next time after now; times missed while it was paused are not made up. Resuming an enabled routine returns it as it is.
        OAuth scope: routines
        - As with creating, at most 20 routines can be enabled (`422` `active_limit`). A one-off whose time has passed returns `422` `once_passed`; a data trigger whose fields no longer work returns `422`.
        - Jiri running a routine cannot resume routines (`403`).
      responses:
        '200':
          description: The routine, enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
        '422':
          $ref: '#/components/responses/RoutineRefused'
  "/routines/{routine_id}/run":
    parameters:
    - $ref: '#/components/parameters/RoutineIdNested'
    post:
      tags:
      - Routines
      summary: Run a routine now
      operationId: runRoutine
      description: |
        Queues one run now, paused routines included, and returns it. When it starts it is checked as a scheduled run is: AI points, the daily run limit, and access to the objects. Its outcome shows in the routine's runs.
        OAuth scope: routines
        - A run still in progress returns `422` `invalid`; so does a data trigger whose fields no longer work.
        - Jiri running a routine cannot run routines (`403`).
      responses:
        '202':
          description: The run queued
          content:
            application/json:
              schema:
                type: object
                required:
                - run
                properties:
                  run:
                    $ref: '#/components/schemas/RoutineRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
        '422':
          $ref: '#/components/responses/RoutineRefused'
  "/routines/{routine_id}/runs":
    parameters:
    - $ref: '#/components/parameters/RoutineIdNested'
    get:
      tags:
      - Routines
      summary: List a routine's runs
      operationId: listRoutineRuns
      description: |
        The runs of one of your own routines, latest planned time first. Paged as `GET /routines` is.
        OAuth scope: routines
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineRunListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RoutineForbidden'
        '404':
          $ref: '#/components/responses/RoutineNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer ACCESS_TOKEN`. Accepts personal access tokens, account access tokens (Enterprise plan) and OAuth 2.0 tokens.
        OAuth tokens can call only the endpoints their scopes allow: `forms` (forms / tables / views / folders / public queries / templates), `form_setting` (form settings, predefined choice sets),
        `read_entries` / `write_entries` (entries, comments, attachment uploads, WeChat authorization sessions, SMS / email tasks), `submit_entries` (fill pages and submitting through them), `read_contacts` (contacts), `users` (current user / account and its members, e-invoices, payment history / 小金商户 and transactions / SMS signatures and templates, SMTP accounts, license image uploads), `routines` (routines and their runs), `artifacts` (Jiri's artifacts, and who can open an HTML artifact's share link), `public` (everything else).
  parameters:
    FormToken:
      name: form_token
      in: path
      required: true
      description: Form token (`token` from `GET /forms`); a 24-character hexadecimal form id is also accepted.
      schema:
        type: string
    TableToken:
      name: table_token
      in: path
      required: true
      description: Table token (`token` from `GET /tables`); a 24-character hexadecimal table id is also accepted.
      schema:
        type: string
    ViewToken:
      name: view_token
      in: path
      required: true
      description: View token (`token` from `GET /forms/{form_token}/views`)
      schema:
        type: string
    SerialNumber:
      name: serial_number
      in: path
      required: true
      description: Entry serial number
      schema:
        type: integer
    FormsQ:
      name: q
      in: query
      required: false
      description: Fuzzy match on name (case-insensitive; matches both the public name and the in-product name). Accepts several values (`q[]=A&q[]=B`), matching forms whose name contains any of them. Equivalent to `filters=[{"field":"form_name","operator":"like","value":...}]`.
      schema:
        type: string
    FormsFilters:
      name: filters
      in: query
      required: false
      description: |
        Filters, a JSON string holding an array of ScopeCondition objects (`JSON.stringify` the array; do not pass the array itself); conditions are combined with AND. Filterable fields and operators:
        | field | type | operators |
        |---|---|---|
        | `form_name` | text | `eq` `ne` `any_in` `none_in` `like` `not_like` |
        | `created_at` | time | `eq` `ne` `gte` `gt` `lte` `lt` `within_last` |
        | `last_entry_created_at` | time | same as above (forms that have never received an entry have no value) |
        | `entries_count` | integer | `eq` `ne` `gte` `gt` `lte` `lt` |

        The value of `within_last` looks like `{"unit":"day","n":30}` (unit can be minute / day / week / month), meaning the window going back from now.
        Example: `[{"field":"last_entry_created_at","operator":"within_last","value":{"unit":"day","n":7}}]`
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ScopeCondition'
          example:
          - field: entries_count
            operator: gte
            value: 1
    FormsNext:
      name: next
      in: query
      required: false
      description: "`next` from the previous page's response, passed back as is to get the next page. Cannot be combined with `page` or `skip`."
      schema:
        type: string
    FormsSkip:
      name: skip
      in: query
      required: false
      description: Deprecated, use `page`. Starting row offset (from 0, at most 10000); the returned `next` still pages onward. Cannot be combined with `next` or `page`.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
      deprecated: true
    EntriesFields:
      name: fields
      in: query
      required: false
      description: Return only these fields. A JSON array, a comma-separated string or a repeated parameter, of field api_codes; the serial number is always returned. Returns 400 listing the available fields when an api_code is unknown.
      explode: false
      schema:
        type: array
        items:
          type: string
      example:
      - field_1
      - field_2
    EntriesFilters:
      name: filters
      in: query
      required: false
      description: Filters, a JSON string holding an array of ScopeCondition objects (`JSON.stringify` the array; do not pass the array itself); conditions are combined with AND. Besides field api_codes, `creator_id` and `serial_number` can be filtered on.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ScopeCondition'
          example:
          - field: field_3
            operator: any_in
            value:
            - 选项 A
            - 选项 B
    EntriesKeyword:
      name: keyword
      in: query
      required: false
      description: Full-text keyword (at most 200 characters), fuzzy-matched across all searchable fields. Forms with more than 99999 entries and no analytics engine enabled do not support full-text search (returns 400), unless `creator_id` also restricts the submitter.
      schema:
        type: string
        maxLength: 200
    EntriesSort:
      name: sort
      in: query
      required: false
      description: |
        Sort rules, a JSON string holding an array of SortRule objects (`JSON.stringify` the array; do not pass the array itself), applied in order, with ascending serial number appended automatically at the end.
        Only sortable fields are allowed; otherwise returns 400 listing the sortable fields. With `sort`, `next` becomes a row offset. Without it, entries come by serial number, or by creation time when `filters` has a `created_at` condition.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SortRule'
          example:
          - api_code: created_at
            order: desc
    EntriesCreatedAt:
      name: created_at
      in: query
      required: false
      description: Return only entries created at or after this time (parsed in Beijing time, UTC+8, e.g. `2024-01-01` or `2024-01-01 08:00:00`), sorted by creation time ascending instead. Returns 400 when the format cannot be parsed. Ignored when given together with `filters` / `keyword`.
      schema:
        type: string
    EntriesNext:
      name: next
      in: query
      required: false
      description: "`next` from the previous page's response. Under the default sort it is a serial-number cursor (returns entries with serial number ≥ this value); with filters / creation-time ordering / an explicit sort it is a row offset. Cannot be combined with `page` or `skip`. Also accepts a string: one starting with an integer is read as that integer, anything else as 0, i.e. starting from the first page."
      schema:
        type:
        - integer
        - string
    EntriesSkip:
      name: skip
      in: query
      required: false
      description: Deprecated, use `page`. Starting row offset (from 0, max 10000). Cannot be combined with `next` or `page`.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
      deprecated: true
    FieldDataChecks:
      name: checks
      in: query
      required: true
      description: Targets to check, a JSON string holding an array of 1 to 100 FieldDataCheck objects (`JSON.stringify` the array; do not pass the array itself), each naming one field or one choice.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FieldDataCheck'
          example:
          - field_api_code: field_1
          - field_api_code: field_3
            choice_value: Yb2d
    FieldTypeChangeChecks:
      name: checks
      in: query
      required: true
      description: Type conversions to preview, a JSON string holding an array of 1 to 20 FieldTypeChangeCheck objects (`JSON.stringify` the array; do not pass the array itself), one field per item.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FieldTypeChangeCheck'
          example:
          - field_api_code: field_1
            target_type: RadioButton
    FieldTypeKind:
      name: kind
      in: query
      required: false
      description: With `table`, answers with the column types tables can use; omitted or any other value, answers with the field types forms can use.
      schema:
        type: string
      example: table
    AggregateMetrics:
      name: metrics
      in: query
      required: false
      description: |
        Required. Metrics to compute, a JSON string holding an array of 1 to 20 AggregateMetric objects (`JSON.stringify` the array; do not pass the array itself); returns 400 when missing or empty.
        `count` / `count_non_empty` / `count_empty` work on every field; the rest depend on its type (`sum`, `avg` and the percentiles on numbers), and a field's `analytics.agg_funcs` from `GET /forms/{form_token}?include_analytics=true` lists exactly what it takes.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AggregateMetric'
          example:
          - func: sum
            field: field_5
          - func: count
            field: field_1
    AggregateDimensions:
      name: dimensions
      in: query
      required: false
      description: |
        Fields to group by, a JSON string holding an array of at most 2 AggregateDimension objects (`JSON.stringify` the array; do not pass the array itself).
        Only fields whose `analytics.groupable` is true can be grouped by, such as single choice, multiple choice and date fields; a date field needs a `bucket`, in Beijing time (UTC+8).
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AggregateDimension'
          example:
          - field: field_3
          - field: created_at
            bucket: month
    AggregateLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of groups returned when grouping. Defaults to 20, max 200 (larger values are treated as 200; values below 1 use the default). Ignored without grouping.
      schema:
        type: integer
        default: 20
    SummaryFields:
      name: fields
      in: query
      required: false
      description: 'Summarize only these fields: field api_codes, comma-separated (or repeat `fields[]=`), returned in the order given. Defaults to every analyzable field. Returns 400, listing the analyzable fields, when a field is not analyzable or the caller has no permission to read it.'
      explode: false
      schema:
        type: array
        items:
          type: string
      example:
      - field_1
      - field_3
    SummaryIncludeOverview:
      name: include_overview
      in: query
      required: false
      description: Whether to return `overview` (matching count and entries added today). Defaults to true.
      schema:
        type: boolean
        default: true
    EntriesIncludeLabels:
      name: include_labels
      in: query
      required: false
      description: |
        When true, each form field value in an entry becomes `{"label": "<field label>", "value": <original value>}`, saving a second read of the form structure.
        System keys (such as `serial_number`, `creator_id`, `token`) and the exam / evaluation `<api_code>_extra_value` stay as they are. Defaults to false.
      schema:
        type: boolean
        default: false
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50, max 1000 (larger values are treated as 1000). With 0, returns only `total`, and `data` is empty.
      schema:
        type: integer
        default: 50
    OffsetNext:
      name: next
      in: query
      required: false
      description: "`next` from the previous page's response (a row offset, starting at 0); pass it back unchanged to get the next page. Cannot be combined with `page` or `skip`."
      schema:
        type: integer
        minimum: 0
    FormsSort:
      name: sort
      in: query
      required: false
      description: |
        Sort rules, a JSON string holding an array of FormSortRule objects (`JSON.stringify` the array; do not pass the array itself), applied in order.
        Sortable fields: `created_at`, `last_entry_created_at`, `entries_count`; any other field, an invalid order or unparseable JSON returns 400.
        With `sort`, `next` becomes a cursor of the form `row:<offset>`, usable only in requests with the same `sort`; rows with equal values may change order between pages.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FormSortRule'
          example:
          - field: last_entry_created_at
            order: desc
    IncludeTransactions:
      name: include_transactions
      in: query
      required: false
      description: When `true`, forms bound to a payment account (merchant account / WeChat Pay / Alipay) carry `transactions` payment statistics; unbound forms have no such key. Not included by default.
      schema:
        type: boolean
        default: false
    EntryImportId:
      name: id
      in: path
      required: true
      description: Import job ID (the `job_id` returned when the import was created)
      schema:
        type: string
    EntryTaskEntryField:
      name: entry_field
      in: query
      required: true
      description: api_code of the mobile field (SMS) or email field (email) to send to, or `<table api_code>.<column api_code>` for a column of a table / matrix field
      schema:
        type: string
      example: field_2
    EntryTaskViewToken:
      name: view_token
      in: query
      required: false
      description: Pick only from the entries this view selects (`token` from `GET /forms/{form_token}/views`), narrowed further by `filters` / `keyword`
      schema:
        type: string
    EntryTaskSelectAll:
      name: select_all
      in: query
      required: false
      description: Must be true to pick every entry of the form when no filter, keyword or view with filters narrows the entries; otherwise 400
      schema:
        type: boolean
    EntryTaskId:
      name: id
      in: path
      required: true
      description: Task id (the `id` returned when the task was created)
      schema:
        type: string
    EntryTaskLimit:
      name: limit
      in: query
      required: false
      description: Page size, at most 1000 (larger values are treated as 1000)
      schema:
        type: integer
        default: 50
    EntryTaskNext:
      name: next
      in: query
      required: false
      description: "`next` from the previous page's response (a row offset, starting at 0); pass it back unchanged to get the next page. Cannot be combined with `page` or `skip`."
      schema:
        type: integer
        minimum: 0
    EntryTaskListLimit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EntryTaskStartDate:
      name: start_date
      in: query
      required: false
      description: Only tasks created on or after this day, Beijing time (UTC+8)
      schema:
        type: string
        format: date
      example: '2026-10-01'
    EntryTaskEndDate:
      name: end_date
      in: query
      required: false
      description: Only tasks created on or before this day, Beijing time (UTC+8)
      schema:
        type: string
        format: date
      example: '2026-10-31'
    EntryTaskActivityStatus:
      name: status
      in: query
      required: false
      description: Return only the records with this result; omitted, both
      schema:
        type: string
        enum:
        - SUCCESS
        - FAILED
    EntryTaskResendStatus:
      name: status
      in: query
      required: true
      description: Send again to the task's entries with this result in its sending results, `ALL` meaning any result
      schema:
        type: string
        enum:
        - FAILED
        - SUCCESS
        - ALL
    SMTPAccountId:
      name: smtp_account_id
      in: query
      required: false
      description: Custom SMTP account to send through (`id` from `GET /smtp_accounts`), using no email quota
      schema:
        type: string
    TradeStartDate:
      name: start_date
      in: query
      required: false
      description: Start date, inclusive, `YYYY-MM-DD`, in Beijing time (UTC+8). Must be given together with `end_date` and must not be later than `end_date`; returns 400 when only one of them is given or it cannot be parsed.
      schema:
        type: string
      example: '2026-09-01'
    TradeEndDate:
      name: end_date
      in: query
      required: false
      description: End date, inclusive, `YYYY-MM-DD`, in Beijing time (UTC+8). Must be given together with `start_date`.
      schema:
        type: string
      example: '2026-09-30'
    TradePaidStatus:
      name: paid_status
      in: query
      required: false
      description: 'Keep only orders in these payment statuses, comma-separated (or repeat `paid_status[]=`): `paid`, `unpaid`, `refunded`, `refunding` (refund in progress), `partial_refunded` (partially refunded). Returns 400 when any value is unknown; by default every status is kept (unpaid included).'
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - paid
          - unpaid
          - refunded
          - refunding
          - partial_refunded
      example:
      - paid
      - refunding
    TradePaymentChannel:
      name: payment_channel
      in: query
      required: false
      description: 'Keep only orders paid through this channel: `wxpay` (WeChat Pay), `alipay` (Alipay). Any other value returns 400.'
      schema:
        type: string
        enum:
        - wxpay
        - alipay
    TradeFormToken:
      name: form_token
      in: query
      required: false
      description: Keep only orders of this payment form. The form token (a 24-character hex form id is also accepted), available from `payment_form_tokens` in `GET /trade/merchant`; returns 400 when the form does not exist or is not accessible to the current identity.
      schema:
        type: string
    TradeInclude:
      name: include
      in: query
      required: false
      description: 'What to return: `both` (default) returns statistics and records, `stats` returns statistics only, `records` returns records only. Any other value returns 400.'
      schema:
        type: string
        enum:
        - both
        - stats
        - records
        default: both
    TradePageLimit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 50, which is also the max (larger values are treated as 50; values below 1 use the default).
      schema:
        type: integer
        default: 50
    TradePageNext:
      name: next
      in: query
      required: false
      description: "`next` from the previous page's response (a page number, starting at 1); pass it back unchanged to get the next page. Defaults to page 1. Cannot be combined with `page`."
      schema:
        type: integer
    RoutineId:
      name: id
      in: path
      required: true
      description: The routine's ID (`id` from `GET /routines`)
      schema:
        type: string
    RoutineIdNested:
      name: routine_id
      in: path
      required: true
      description: The routine's ID (`id` from `GET /routines`)
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number from 1, for jumping to a page or reading pages in parallel; `(page - 1) × limit` can be at most 10000, and the returned `next` continues from there. Cannot be combined with `next` or `skip`.
      schema:
        type: integer
        minimum: 1
    TradePage:
      name: page
      in: query
      required: false
      description: Page number from 1, for jumping straight to a page; the same as passing it as `next`. Cannot be combined with `next`.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request parameters or data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FormSettingBadRequest:
      description: The generic error_description shape when the request does not follow this document; the errors/status shape when model validation fails
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/FormSettingSaveFailed'
    Unauthorized:
      description: 'Unauthenticated: the token is invalid or revoked'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: Invalid or revoked token
    PaymentRequired:
      description: The current plan does not include API v1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden: the OAuth token lacks the required scope, or a business rule refused the operation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: OAuth token scope is insufficient
    NotFound:
      description: The resource does not exist or is not accessible to the current identity (a personal token can access only the forms its user created or that were shared with that user)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: form cannot be found
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Quota for the current window (1 hour)
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests left in the current window
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp when the quota resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    EntryValidationFailed:
      description: 'Entry validation failed or a parameter is invalid. When field validation fails, `error_description` is a JSON string serialized from `{ "<api_code>": ["error message"] }`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: '{"field_2":["不能为空"]}'
    MerchantNotFound:
      description: The current account has no 小金商户, so it has no 小金商户 orders, refunds or payouts; see `GET /trade/merchant` for onboarding progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EntryTaskForbidden:
      description: Insufficient OAuth scope, a role without data read rights on the form, or, for sending, an external cooperator without the `send_sms_and_email` ability (error_description shape); or the form or its creator is frozen (errors + status_code shape)
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/FormFrozenError'
    RoutineForbidden:
      description: 'Forbidden: the OAuth token lacks the `routines` scope; the credential has no current user (an account access token and the like, as routines belong to a person); the account cannot use routines yet; or Jiri running a routine tried to create, update, pause, resume, delete or run one (it can only read them).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: 自动任务运行时不能管理自动任务
    RoutineNotFound:
      description: The routine does not exist or is not the current user's
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_description: 找不到这个自动任务
    RoutineRefused:
      description: Against the rules for routines; nothing was changed. `errors` gives each reason, and `error_description` is the first one's `message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoutineRefusal'
          example:
            error_description: 启用中的自动任务最多 20 条，请先暂停或删除一些
            errors:
            - code: active_limit
              message: 启用中的自动任务最多 20 条，请先暂停或删除一些
  schemas:
    ScopeCondition:
      type: object
      description: One filter condition. A `filters` parameter is the JSON text of an array of these, combined with AND; each endpoint says which fields and operators it takes.
      required:
      - operator
      properties:
        field:
          type: string
          description: What to filter on; a field api_code for entries, where `creator_id` (`eq` with a user id, at most once) and `serial_number` (`eq` / `any_in` / `none_in`, several intersected) also work, or a form attribute such as `created_at` for form lists. Required unless the deprecated `api_code` or `trigger` is given instead.
        api_code:
          type: string
          deprecated: true
          description: Deprecated alias of `field`; use `field`.
        trigger:
          type: string
          deprecated: true
          description: Deprecated alias of `field`; use `field`.
        operator:
          type: string
          enum:
          - eq
          - ne
          - any_in
          - none_in
          - between
          - not_between
          - 'null'
          - not_null
          - gte
          - gt
          - lte
          - lt
          - like
          - not_like
          - within_last
          - equal
          - not_equal
          - start
          - end
          description: Comparison; `equal` / `not_equal` / `start` / `end` are aliases of `eq` / `ne` / `gte` / `lte`. Each field type accepts only some operators, and an unsupported one returns 400 listing the available ones.
        value:
          description: 'Condition value; its type depends on the field and the operator: a two-element array `[min, max]` for `between` / `not_between` (`{"<column api_code>": [min, max]}` on a matrix or table field), `{"unit": "day", "n": 30}` for `within_last` (unit minute / day / week / month), no value for `null` / `not_null`, a choice api_code or label on a choice field (a cascading drop-down also takes a `level1-level2` path), and serial numbers of the related table for `any_in` / `none_in` on a relation field.'
    SortRule:
      type: object
      required:
      - api_code
      properties:
        api_code:
          type: string
          description: api_code of the field to sort by; only sortable fields are allowed
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Sort direction
    FormSortRule:
      type: object
      required:
      - field
      properties:
        field:
          type: string
          enum:
          - created_at
          - last_entry_created_at
          - entries_count
          description: Form attribute to sort by
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Sort direction
    AggregateMetric:
      type: object
      required:
      - func
      - field
      properties:
        func:
          type: string
          enum:
          - count
          - count_non_empty
          - count_empty
          - count_unique
          - sum
          - avg
          - min
          - max
          - stddev
          - median
          - p25
          - p75
          - p90
          description: Aggregate function; the field's `analytics.agg_funcs` says which ones it supports
        field:
          type: string
          description: api_code of the field to aggregate
    AggregateDimension:
      type: object
      required:
      - field
      properties:
        field:
          type: string
          description: api_code of the field to group by; only fields whose `analytics.groupable` is true
        bucket:
          type: string
          enum:
          - day
          - week
          - month
          description: Time granularity, required for a date field and not allowed on any other
    FieldDataCheck:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: api_code of the field to check; for a column of a table / matrix field, the table / matrix field's api_code
        choice_value:
          type: string
          description: The choice to check, by its value or its name as GET /forms/{form_token} shows them; omitted, checks whether the whole field has any data
        choice_type:
          type: string
          default: choice
          enum:
          - choice
          - statement
          - dimension
          - level_1
          - level_2
          - level_3
          - level_4
          description: What `choice_value` names; `statement` for a matrix row, `dimension` for a matrix, table or multiple-blank column, `level_1` to `level_4` for a cascading drop-down level
        parent_field:
          type: string
          description: api_code of the column, when checking a choice inside one column of a table / matrix field
        check_extended_text:
          type: boolean
          description: When true, checks whether the choice's "Other" extra text has any data
        goods_item_dimension_options:
          type: object
          description: When checking one spec of a goods field, the mapping of spec dimensions to options
    FieldTypeChangeCheck:
      type: object
      required:
      - field_api_code
      - target_type
      properties:
        field_api_code:
          type: string
          description: api_code of the field to convert
        target_type:
          type: string
          description: Target field type; see `GET /field_types` for the values (`GET /field_types?kind=table` for tables)
        target_precision:
          type: string
          enum:
          - month
          - day
          - minute
          - second
          description: When the target is `DateTimeField`, the date precision the edit will use, so the preview matches the actual conversion; ignored otherwise
    Error:
      type: object
      required:
      - error_description
      properties:
        error_description:
          type: string
          description: Human-readable error description
    RateLimitError:
      type: object
      properties:
        error:
          type: string
          examples:
          - rate_limit_exceeded
        error_description:
          type: string
        retry_after:
          type: integer
          description: Seconds to wait before retrying
        limit:
          type: integer
        remaining:
          type: integer
        reset_at:
          type: string
          format: date-time
        plan:
          type: string
          description: Code of the current plan
        upgrade_url:
          type: string
          format: uri
    Creator:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Creator's name (nickname when there is no name)
    FormSummary:
      type: object
      required:
      - name
      - token
      - kind
      - tags
      - created_at
      - entries_count
      - last_entry_created_at
      - creator
      - folder_token
      - billing_account_id
      properties:
        name:
          type: string
          description: Form name (the public name)
        token:
          type: string
        kind:
          type: string
          enum:
          - form
        tags:
          type: array
          items:
            type: string
          description: Tags the current identity put on this form (for an account token, the union of all members' tags)
        created_at:
          type: string
          format: date-time
        entries_count:
          type: integer
          description: Entry count of the form
        last_entry_created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the latest entry was received (UTC); null when the form has never received an entry
        creator:
          $ref: '#/components/schemas/Creator'
        folder_token:
          type:
          - string
          - 'null'
          description: Token of the folder the current identity put this form in (for an account token, the account owner's); null when the form is not in a folder
        billing_account_id:
          type: string
          description: ID of the account the form belongs to, as `id` in `GET /billing_account`; a form shared from another account carries that account's
        transactions:
          $ref: '#/components/schemas/FormTransactions'
    FormListResponse:
      type: object
      required:
      - total
      - count
      - data
      - next
      properties:
        total:
          type: integer
          description: Total number of forms matching the conditions
        count:
          type: integer
          description: Number of items on this page
        data:
          type: array
          items:
            $ref: '#/components/schemas/FormSummary'
        next:
          type:
          - string
          - 'null'
          description: 'Cursor for the next page: the form id under the default sort, `row:<offset>` when `sort` is given; null on the last page'
    Form:
      type: object
      required:
      - name
      - token
      - kind
      - scene
      - url
      - description
      - fields
      - setting
      properties:
        name:
          type: string
        token:
          type: string
        kind:
          type: string
          enum:
          - form
          - table
          - quickpay
          description: What the token is. A table's views are read with `GET /tables/{table_token}`
        scene:
          type: string
          enum:
          - form
          - survey
          - registry
          - vote
          - exam
          - reservation
          - customer_acquisition
          - evaluation
          - online_payment
          - quickpay
          description: Form scene, as set by `scene` on create
        url:
          type: string
          format: uri
          description: Public URL of the form (built from the account's custom domain / subdomain; cannot be derived from the token). A quick payment form's is its payment page; a table, which has no public page, gives its URL in the product, the same as `GET /tables/{table_token}`
        description:
          type:
          - string
          - 'null'
          description: Form description (may be HTML rich text)
        fields:
          type: array
          description: Fields in form order; each element is an object whose single key is the field's api_code
          items:
            $ref: '#/components/schemas/FieldMap'
        setting:
          description: Form settings; an empty object when the form has no settings yet
          allOf:
          - $ref: '#/components/schemas/FormSetting'
    FieldMap:
      type: object
      description: 'Single-key object: the key is the field''s api_code, the value is the field definition'
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        $ref: '#/components/schemas/FieldDefinition'
      examples:
      - field_1:
          label: 姓名
          api_code_alias:
          type: single_line_text
          notes: ''
          private: false
          validation:
            required: true
    FieldDefinition:
      type: object
      description: |
        Field definition. Every field has `label` / `api_code_alias` / `type` / `notes` / `private` / `validation`; the other properties appear according to `type`.

        How `type` values map to fields:
        | type | Field |
        |---|---|
        | `single_line_text` | Single-line text |
        | `paragraph_text` | Multi-line text |
        | `name` / `id_card` / `mobile` / `email` / `phone` / `link` / `address` / `geo_location` | Name / ID card / Mobile / Email / Phone / Website / Address / Geolocation |
        | `single_choice` / `multiple_choice` / `drop_down` / `cascade_drop_down` | Single choice / Multiple choice / Drop-down / Cascading drop-down (the color mark is also `drop_down`) |
        | `image_radio_button` / `image_check_box` | Image single choice / Image multiple choice |
        | `number` / `formula` / `rating` / `nps` / `boolean` | Number / Formula / Rating / NPS / Yes/No |
        | `date_time` / `date` / `time` | Date / Date (legacy) / Time |
        | `attachment` / `audio` / `e_signature` | File upload / Audio / E-signature |
        | `likert` / `matrix` / `matrix_scale` / `table` / `multiple_blanks` / `sort` | Matrix single choice / Matrix fill-in / Matrix scale / Table / Inline blanks / Ranking |
        | `goods` / `reservation` | Goods / Reservation |
        | `form_association` / `reversed_association` | Form association / Reverse association |
      required:
      - label
      - type
      - notes
      - private
      - validation
      properties:
        label:
          type: string
          description: Field label
        api_code_alias:
          type:
          - string
          - 'null'
          description: Alias for the field's api_code; once set, entries are read and written with the alias as the key
        type:
          type: string
          description: Field type; see the table above for values
        notes:
          type:
          - string
          - 'null'
          description: Field notes (may be HTML rich text)
        private:
          type: boolean
          description: Whether the field is hidden
        validation:
          $ref: '#/components/schemas/FieldValidation'
        choices:
          type: array
          description: Choices (single choice / multiple choice / drop-down / cascading drop-down / image choice / matrix single choice / ranking)
          items:
            $ref: '#/components/schemas/Choice'
        allow_other:
          type: boolean
          description: Whether there is an "Other" choice (choice fields)
        statements:
          type: array
          description: Statements (matrix single choice / matrix fill-in / matrix scale)
          items:
            $ref: '#/components/schemas/Statement'
        dimensions:
          type: array
          description: Sub-fields (matrix fill-in / matrix scale / table / inline blanks), each a single-key object keyed by the sub-field's api_code; a sub-field's validation.required comes from the field's own, and a required sub-field must be filled in every submitted row (or statement)
          items:
            $ref: '#/components/schemas/FieldMap'
        placeholder:
          type:
          - string
          - 'null'
          description: Prompt of an inline-blanks field, with each blank marked by the placeholder `${field_x}$`
        max_file_quantity:
          type: integer
          description: 'Attachment field: maximum number of files to upload'
        media_type:
          type: object
          description: 'Attachment field: allowed file types'
          properties:
            type:
              type: string
              description: "`unlimited` or a specific type group"
            value:
              type: array
              items:
                type: string
        max_duration:
          type:
          - integer
          - 'null'
          description: 'Audio field: maximum duration (seconds)'
        precision:
          description: For date fields, a precision enum (`month` / `day` / `minute` / `second`, etc.); for number / formula fields, the number of decimal places
          oneOf:
          - type: string
          - type: integer
        display_precision:
          type: integer
          description: 'Number / formula field: decimal places shown'
        display_as_percentage:
          type: boolean
        thousands_separator:
          type: boolean
        currency_symbol:
          type: string
        currency_symbol_position:
          type: string
          enum:
          - prefix
          - suffix
        formula:
          type:
          - string
          - 'null'
          description: 'Formula field: the formula the server evaluates'
        formula_display:
          type:
          - string
          - 'null'
          description: 'Formula field: the admin-readable formula'
        goods_items:
          type: array
          description: 'Goods field: goods items'
          items:
            $ref: '#/components/schemas/GoodsItem'
        reservation_items:
          type: array
          description: 'Reservation field: reservation items'
          items:
            $ref: '#/components/schemas/ReservationItem'
        associated_form_token:
          type:
          - string
          - 'null'
          description: 'Form association: token of the associated form'
        associated_field_api_code:
          type: string
          description: 'Form association: given only when there is a single association key'
        associated_field_api_codes:
          type: array
          items:
            type: string
          description: 'Form association: api_codes of all association keys'
        display_field_settings:
          type: array
          description: 'Form association: display field settings'
          items:
            $ref: '#/components/schemas/DisplayFieldSetting'
        allow_reverse_association:
          type: boolean
          description: 'Form association: whether the reverse association shows on the associated form'
        reverse_display_field_api_codes:
          type: array
          items:
            type: string
          description: 'Form association: api_codes of the fields the reverse association shows; given when reverse association is on'
        rating_type:
          type: string
          description: 'Rating field: appearance (e.g. `star`)'
        rating_max:
          type: integer
          description: 'Rating field: scale'
        range_max:
          type:
          - integer
          - 'null'
        minimum_ratings_display_text:
          type:
          - string
          - 'null'
          description: 'NPS field: text for the lowest score'
        maximum_ratings_display_text:
          type:
          - string
          - 'null'
          description: 'NPS field: text for the highest score'
        highlight_color:
          type:
          - string
          - 'null'
          description: 'NPS field: highlight color'
        include_second:
          type: boolean
          description: 'Time field: whether it is precise to the second (present only when true)'
        analytics:
          $ref: '#/components/schemas/FieldAnalytics'
      additionalProperties: true
    FieldValidation:
      type: object
      description: Field validation rules; only the rules in effect appear
      properties:
        required:
          type: boolean
          description: Required
        unique:
          type: boolean
          description: Must not repeat a value from an existing entry
        white_list_limit:
          type: boolean
          description: Whitelist limit is on
        access_control_list_limit:
          type: boolean
          description: Whitelist / blacklist limit is on
        access_control_type:
          type: string
          enum:
          - white
          - black
          description: List type
        white_list_values:
          type: array
          items:
            type: string
          description: Whitelist values (single-line text / mobile)
        acl_values:
          type: array
          items:
            type: string
          description: List values (single-line text / mobile)
        min_selected:
          type: integer
          description: Minimum number of selections (multiple choice / image multiple choice / ranking)
        max_selected:
          type: integer
          description: Maximum number of selections (multiple choice / image multiple choice / ranking)
        minimum_length:
          type: integer
          description: Minimum number of characters (text fields)
        maximum_length:
          type: integer
          description: Maximum number of characters (text fields)
        min:
          type: number
          description: Minimum value (number)
        max:
          type: number
          description: Maximum value (number)
        start:
          type: string
          description: Start date (date field)
        end:
          type: string
          description: End date (date field)
      additionalProperties: true
    Choice:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Choice label
        value:
          type: string
          description: Choice api_code (either it or the choice label works when writing entries)
        hidden:
          type: boolean
        quota:
          type:
          - integer
          - 'null'
          description: 'Places left on the choice: an entry takes one when it picks the choice after the limit is set, and gives it back by switching away or, when the field recovers places, by being deleted; `recover_quota` gives places back by hand. Absent when the choice has no limit, and on a fill page also while the field hides places and some are left'
        quota_setting:
          type:
          - integer
          - 'null'
          description: 'Limit on the choice''s places, the value a write sends as `quota`, so the places used in the current cycle are `quota_setting - quota`. Only on form and table reads, and not on matrix choices'
        operand_value:
          type: number
          description: Value assigned to the choice
        allow_extended_text:
          type: boolean
          description: Extra text can be added when selected
        extended_text_required:
          type: boolean
        is_other:
          type: boolean
          description: Whether this is the "Other" choice
        image_url:
          type:
          - string
          - 'null'
          description: Image URL of an image choice
        large_path:
          type:
          - string
          - 'null'
          description: Large image URL of an image choice
        sub_choices:
          type: array
          description: Child choices (cascading drop-down)
          items:
            $ref: '#/components/schemas/Choice'
      additionalProperties: true
    Statement:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Statement text
        value:
          type: string
          description: Statement api_code
    GoodsItem:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
          description: Goods item api_code
        description:
          type:
          - string
          - 'null'
        inventory:
          type:
          - integer
          - 'null'
        hidden:
          type: boolean
        price:
          type:
          - number
          - 'null'
          description: Price when there are no specs; null when there are specs
        original_price:
          type:
          - number
          - 'null'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/GoodsSku'
    GoodsSku:
      type: object
      properties:
        spec:
          type: object
          additionalProperties:
            type: string
          description: 'Spec: keys are spec dimension names, values are spec options'
        price:
          type:
          - number
          - 'null'
        original_price:
          type:
          - number
          - 'null'
        inventory:
          type:
          - integer
          - 'null'
    ReservationItem:
      type: object
      required:
      - name
      - value
      - hidden
      properties:
        name:
          type: string
        value:
          type: string
          description: Reservation item api_code
        hidden:
          type: boolean
    DisplayFieldSetting:
      type: object
      properties:
        api_code:
          type: string
        public_display:
          type: boolean
        privacy_safe:
          type: boolean
      additionalProperties: true
    EntryData:
      type: object
      description: |
        One entry. Keys are field api_codes (a field with an api_code_alias is keyed by the alias), plus these system keys:
        `token`, `serial_number`, `created_at`, `updated_at`, `creator_name` (submitter's name), `color_mark` (color mark),
        `info_filling_duration` (time spent filling in, seconds), `info_platform`, `info_os`, `info_browser`, `info_region` (`{country, province, city}`), `info_remote_ip`,
        and, depending on the form's features, `gen_code` (confirmation code), `total_price` / `preferential_price` (when there are goods), `x_field_weixin_*` (WeChat info), `referral_link` and others.
        Exam / evaluation questions also add `<api_code>_extra_value: { correct_answer, score }`; reverse association fields add `<api_code>_entries`, and association fields add `<api_code>_related_entries`.

        Value shape by field type:
        | Field | Value |
        |---|---|
        | Single-line / multi-line text, name, mobile, email, phone, website, ID card | String |
        | Single choice, drop-down, image single choice | Choice label (string) |
        | Multiple choice, image multiple choice | Array of choice labels |
        | Cascading drop-down | `{"level_1": "...", "level_2": "..."}` |
        | Number, rating, NPS, formula | Number (a rating may be a string) |
        | Yes/No | Boolean |
        | Date | Beijing time (UTC+8) string formatted to the field's precision, e.g. `2021-09-23` |
        | Time | `HH:MM` or `HH:MM:SS` |
        | File upload | Array of download URLs (signed, valid for 10 years) |
        | E-signature | Download URL string |
        | Audio | `{"url": "...", "audio_text": "..."}` |
        | Address | `{"province","city","district","street"}` |
        | Geolocation | `{"longitude","latitude","address"}` |
        | Goods | `[{"name","number","price","original_price","inventory","layout","spec"?}]` |
        | Matrix fill-in / matrix scale | `[{"statement": "statement label", "dimensions": {"column name": value}}]` |
        | Matrix single choice | `[{"statement": "statement label", "choice": "choice label"}]` (the multiple-choice style has a `choices` array) |
        | Table | `[{"column name": value}]` (one object per row, empty values omitted) |
        | Inline blanks | `{"<sub-field api_code>": "..."}` |
        | Ranking | `[{"rank": 1, "choice": "choice label"}]` |
        | Reservation | `[{"item_name","scheduled_label","number", ...}]` |
        | Form association | Display value string of the associated entry |
        | Association (table) | Array of serial numbers of the linked entries in the associated table, e.g. `[1, 3]`; plus `<api_code>_related_entries`: `[{"serial_number": 1, "value": "..."}]`, where value is that entry's first-column value |
        When the request has `include_labels=true`, form field values are wrapped as `{label, value}`.
