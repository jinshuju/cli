        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/queries":
    get:
      tags:
      - OpenSearch
      summary: List public queries
      description: 'Returns the public queries created by the current caller (an account access token counts as the account owner), newest first, with summary fields only. With form_token, returns only the queries under that form; returns 404 when form_token does not exist or the caller cannot access it, instead of ignoring the parameter. OAuth scope: forms'
      operationId: listOpensearchQueries
      parameters:
      - name: form_token
        in: query
        required: false
        description: Filter by form token
        schema:
          type: string
      responses:
        '200':
          description: Public query list
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: Number of queries returned
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - OpenSearch
      summary: Create a public query
      description: 'Creates a public query on the form given by form_token, with the current caller as its creator. The caller must be able to manage the form: no access returns 404, read but not manage returns 403; a plan without the public query feature returns 402. Fields referenced in search_field_rules must be searchable fields of the form, and those in display_field_rules must be displayable fields; otherwise returns 400 listing the available api_code values. search_field_rules / display_field_rules, when passed, cannot be empty arrays; scope_conditions requires a plan that supports limiting the range of searchable entries. A preview image is generated asynchronously after saving. OAuth scope: forms'
      operationId: createOpensearchQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OpensearchQueryInput'
              - type: object
                required:
                - form_token
                - name
                - display_field_rules
                properties:
                  form_token:
                    type: string
                    description: Token of the form the query belongs to (can also be passed as a query parameter)
      responses:
        '201':
          description: Created; returns the public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/queries/{query_token}":
    parameters:
    - name: query_token
      in: path
      required: true
      description: Public query token (an id is also accepted)
      schema:
        type: string
    get:
      tags:
      - OpenSearch
      summary: Show a public query
      description: 'Returns the public query details, including the search field rules and display field rules. The caller can read only queries it created; another user''s query returns 404 (opensearch query cannot be found). OAuth scope: forms'
      operationId: getOpensearchQuery
      responses:
        '200':
          description: Public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - OpenSearch
      summary: Update a public query
      description: 'Updates a public query the caller created; PUT is also accepted. Only the keys present in the request are updated. Returns 400 when the query''s form has been deleted. Field rules are validated as on create: referencing a field that cannot be searched / displayed, an empty rule array, an empty name and the like all return 400. An update does not check form manage permission or whether the plan includes public queries. OAuth scope: forms'
      operationId: updateOpensearchQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpensearchQueryInput'
      responses:
        '200':
          description: Updated; returns the public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/query_suggestions":
    get:
      tags:
      - OpenSearch
      summary: Suggest fields for a public query
      description: 'Returns the search fields and display fields a form offers for public queries, plus the recommended field api_code values, for building search_field_rules / display_field_rules. The caller must be able to manage the form: no access returns 404, read but not manage returns 403. Whether the plan includes public queries is not checked. OAuth scope: forms'
      operationId: listOpensearchQuerySuggestions
      parameters:
      - name: form_token
        in: query
        required: true
        description: Form token
        schema:
          type: string
      responses:
        '200':
          description: Field suggestions
          content:
            application/json:
              schema:
                type: object
                required:
                - form_token
                - search_fields
                - display_fields
                - recommend_search_fields
                - recommend_display_fields
                properties:
                  form_token:
                    type: string
                    description: Form token
                  search_fields:
                    type: array
                    description: Fields usable as search conditions
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySuggestion'
                  display_fields:
                    type: array
                    description: Fields usable as display fields
                    items:
                      $ref: '#/components/schemas/OpensearchDisplayQuerySuggestion'
                  recommend_search_fields:
                    type: array
                    description: Recommended search field api_code values (name + mobile; empty when there is no mobile field)
                    items:
                      type: string
                  recommend_display_fields:
                    type: array
                    description: Recommended display field api_code values (excluding private fields, display-only fields and WeChat fields)
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/folders":
    get:
      tags:
      - Folders
      summary: List folders
      operationId: listFolders
      description: |
        Lists the folders the current user has manage permission on (form folders and table folders alike, told apart by `kind`), newest first. With an account-level credential, returns the account owner's folders.
        `limit` defaults to 50 and is clamped to 1 to 100; there is no paging: `total` is the full count, `count` the number returned this time.

        OAuth scope: forms
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum number to return; defaults to 50, at most 100
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Folder list
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - count
                - data
                properties:
                  total:
                    type: integer
                    description: Total number of folders the user can manage
                  count:
                    type: integer
                    description: Number returned this time
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Folders
      summary: Create a folder
      operationId: createFolder
      description: |
        Creates a folder as the current user; the creator becomes the folder's manager. `kind` decides whether the folder holds forms (`form`, the default) or tables (`table`).
        Returns 400 `Name cannot be empty` when `name` is empty; returns 400 `Kind must be one of: form, table` when `kind` is not form / table; returns 400 when model validation fails, with the validation message in `error_description`.

        OAuth scope: forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/predefined_choices_sets":
    get:
      tags:
      - Predefined Choices Sets
      summary: List predefined choice sets
      operationId: listPredefinedChoicesSets
      description: |
        Lists the current account's custom predefined choice sets (type custom), only those matching the locale of the current request (as the server implements it); the built-in global choice sets are not returned.
        OAuth scope: form_setting
      responses:
        '200':
          description: Array of choice sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PredefinedChoicesSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Predefined Choices Sets
      summary: Create a predefined choice set
      operationId: createPredefinedChoicesSet
      description: |
        Creates a custom predefined choice set in the current account. It looks up by `label`: when the account already has a set with the same label, that set's `choices` are overwritten (in effect an update); otherwise a new set is created.
        OAuth scope: form_setting
        The request body must be wrapped under the `predefined_choices_set` key; returns 400 when the key is missing. Empty strings in `choices` are dropped; neither `label` nor the remaining `choices` may be empty, otherwise returns 400 with the body `{ errors, status: "failed" }`.
        Returns 200 on success (not 201).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - predefined_choices_set
              properties:
                predefined_choices_set:
                  $ref: '#/components/schemas/PredefinedChoicesSetInput'
              additionalProperties: false
      responses:
        '200':
          description: Created (or overwritten by label)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSet'
        '400':
          description: Validation failed (label or choices is empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/predefined_choices_sets/{id}":
    patch:
      tags:
      - Predefined Choices Sets
      summary: Update a predefined choice set
      operationId: updatePredefinedChoicesSet
      description: |
        Updates the `label` and / or `choices` of one of the current account's custom predefined choice sets. PUT is also accepted and behaves the same.
        OAuth scope: form_setting
        Only a set of type custom that belongs to the current account can be updated: a global set or another account's set returns 403 `{ errors: "forbidden", status: "failed" }`; an ID that does not exist returns 404 `{ errors: "not found", status: "failed" }`; a validation failure returns 400 `{ errors, status: "failed" }`.
      parameters:
      - name: id
        in: path
        required: true
        description: Choice set ID (24 hexadecimal characters)
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - predefined_choices_set
              properties:
                predefined_choices_set:
                  $ref: '#/components/schemas/PredefinedChoicesSetInput'
              additionalProperties: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSet'
        '400':
          description: Validation failed (label or choices is empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: No permission on this choice set (a global set or another account's set), or insufficient OAuth scope
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PredefinedChoicesSetError'
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: Choice set does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
    delete:
      tags:
      - Predefined Choices Sets
      summary: Delete a predefined choice set
      operationId: deletePredefinedChoicesSet
      description: |
        Deletes one of the current account's custom predefined choice sets; returns 200 with no response body on success.
        OAuth scope: form_setting
        Only a set of type custom that belongs to the current account can be deleted: a global set or another account's set returns 403 `{ errors: "forbidden", status: "failed" }`; an ID that does not exist returns 404 `{ errors: "not found", status: "failed" }`.
      parameters:
      - name: id
        in: path
        required: true
        description: Choice set ID (24 hexadecimal characters)
        schema:
          type: string
      responses:
        '200':
          description: Deleted, no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: No permission on this choice set (a global set or another account's set), or insufficient OAuth scope
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PredefinedChoicesSetError'
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: Choice set does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredefinedChoicesSetError'
  "/template_usages":
    post:
      tags:
      - Templates
      summary: Create a form from a template
      operationId: createTemplateUsage
      description: |
        Uses a template from the template market as the current user, copies it into a new form, and returns the new form's token and edit page URL.
        OAuth scope: forms
        The template is given by `id` (or `template_id`), which takes a template token or a 24-character hexadecimal ID. Optional parameters: `tags` (tags, an array or a comma-separated string), `tag_id` / `folder_id` (the tag / folder the new form goes into), `scene` (target scene; falls back to form when the template has fields the scene does not allow), `frm` (source marker; affects the recorded created_from), `create_source`, `group_id`.
        Payment-related branches:
        - Paid template the current user has not bought: returns 200 with the body `{ template_url }` (the template purchase page URL), and no form is created.
        - Template uses paid features the current plan does not offer: returns 403 `{ error: "CAN_FEATURE_TRIAL", target_plan, target_trial_type, ... }` when the caller is an admin and a feature trial can be started; otherwise returns 403 `{ error: "PAID_FEATURE_REQUIRED", target_plan, template_url }`; an account from a channel partner gets 403 `{ error: "UNAVAILABLE_TO_TRIAL_OR_UPGRADE" }`.
        - With `form_app_trial_alert` passed and the template bound to form apps that must be bought / tried: returns 200 `{ error: "CANNOT_FORM_APP_TRIAL" | "FORM_APP_TRIAL_REQUIRED", ... }`; confirm with `confirm_unbind_form_app` / `confirm_form_app_trial` and retry.
        When form creation fails (failing the content risk check included), returns 400 `{ error }`. When the template does not exist, returns 404 with an HTML page, not JSON.
        `mobile_editor_forbidden` appears only on a mobile request when the new form has the card layout and the current plan cannot use the mobile editor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUsageInput'
      responses:
        '200':
          description: Created; or not created because of a payment / form app restriction, in which case the body has `template_url` or `error`
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  required:
                  - success_url
                  - form_token
                  properties:
                    success_url:
                      type: string
                      description: Site path of the new form's edit page (e.g. `/forms/{token}/edit`)
                    form_token:
                      type: string
                      description: Token of the new form
                    mobile_editor_forbidden:
                      type: boolean
                      description: true on a mobile request when the current plan cannot use the mobile editor to edit a card-layout form
                - type: object
                  required:
                  - template_url
                  properties:
                    template_url:
                      type: string
                      description: Template purchase page URL, when a paid template has not been bought
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - CANNOT_FORM_APP_TRIAL
                      - FORM_APP_TRIAL_REQUIRED
                    cannot_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: Names of the form apps that must be bought
                    need_trial_form_apps:
                      type: array
                      items:
                        type: string
                      description: Names of the form apps that need a trial
                    expire_days:
                      type: integer
                      description: Days left in the form app trial
                    template_url:
                      type: string
        '400':
          description: Form creation failed
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    description: Failure reason (e.g. `模板选用失败！...`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: The template has paid features the current plan does not offer, or the OAuth scope is insufficient
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - error
                  properties:
                    error:
                      type: string
                      enum:
                      - PAID_FEATURE_REQUIRED
                      - CAN_FEATURE_TRIAL
                      - UNAVAILABLE_TO_TRIAL_OR_UPGRADE
                    target_plan:
                      type: string
                      description: Code of the lowest plan that can use this template
                    target_trial_type:
                      type: string
                      description: Type of feature trial that can be started
                    in_trial_form_apps:
                      type: array
                      items:
                        type: string
                    current_trial_type:
                      type: string
                    current_trial_end_date:
                      type: string
                    template_url:
                      type: string
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
        '404':
          description: Template does not exist (an HTML page is returned)
          content:
            text/html:
              schema:
                type: string
  "/contacts":
    get:
      tags:
      - Contacts
      summary: List contacts
      operationId: listContacts
      description: |
        Lists the current user's contacts page by page, by ID descending, a fixed 50 per page. With an account-level credential, returns the account owner's contacts.
        OAuth scope: read_contacts
        Cursor paging: `next` in the response is the ID of the first contact on the next page; pass it as the query parameter `next` to get that page. `next` is null when there is no more data.
      parameters:
      - name: next
        in: query
        required: false
        description: The `next` cursor from the previous page's response (a contact ID)
        schema:
          type: string
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - count
                - data
                - next
                properties:
                  total:
                    type: integer
                    description: Total number of contacts
                  count:
                    type: integer
                    description: Number on this page
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  next:
                    type:
                    - string
                    - 'null'
