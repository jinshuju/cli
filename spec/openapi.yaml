openapi: 3.1.0
info:
  title: 金数据 API v1
  version: '1.0'
  description: |
    金数据（Jinshuju）对外开放接口 v1，用于读写表单、表格、数据、视图、评论、对外查询等资源。
    产品侧的说明见 [金数据开放平台](https://open.jinshuju.net/api_v1)。

    ## 请求约定
    - 基础地址：`https://jinshuju.net/api/v1`，所有路径都相对于它。
    - 请求头：`Content-Type: application/json`、`Accept: application/json`、`Authorization`（见下）。
    - 更新接口以 `PATCH` 为准（只修改出现的键），同路径的 `PUT` 是兼容别名，按 `PATCH` 处理和校验；「数据」资源的 `PUT`（整体覆盖）与 `PATCH`（增量更新）语义不同，已分别列出。
    - 响应统一为 JSON，并带 `Access-Control-Allow-Origin: *`。
    - 字段定义相关的 schema（`FieldInput` 及各 `<Type>Input`、`FieldUpdateInput`、`FormCreateInput`、`TableCreateInput` 等）按字段 `type` 分支并带条件约束。

    ## 认证
    - **Bearer Token（推荐）**：`Authorization: Bearer ACCESS_TOKEN`。支持三类令牌：
      - 个人 Access Token：以该用户身份访问其创建或被共享的表单；
      - 企业 Access Token（企业版套餐）：以企业账户范围访问全部表单，此时接口没有「当前用户」，创建类操作记在企业账户负责人名下；
      - OAuth 2.0 访问令牌：按令牌 scope 限制可调用的接口，scope 不足返回 `403`。每个接口的说明中标注了所需 scope
        （`forms` / `form_setting` / `read_entries` / `write_entries` / `read_contacts` / `users` / `public`）。
    - **HTTP Basic（旧版，将下线）**：`api_key:api_secret` 做 Base64 后放入 `Authorization: Basic ...`。
    - 令牌无效或已撤销返回 `401`；当前套餐不含 API v1 能力返回 `402`。

    ## 速率限制
    按企业账户（或令牌）每小时计数，额度由套餐决定（默认 120 次/小时）。超限返回 `429`，
    响应头带 `Retry-After`、`X-RateLimit-Limit`、`X-RateLimit-Remaining`、`X-RateLimit-Reset`。

    ## 错误格式
    业务错误统一返回 `{ "error_description": "..." }`，HTTP 状态码表达错误类别：
    `400` 参数或数据校验失败、`401` 未认证、`402` 套餐不支持、`403` 无权限 / 配额已满 / scope 不足、
    `404` 资源不存在或不可访问、`422` 批量操作全部失败、`429` 超过速率限制。

    ## 分页
    列表接口返回 `{ total, count, data, next }`。`next` 为 `null` 表示已到末页；把它原样回传即可取下一页。
    `skip` 可以指定起始行（0 起、最大 10000），用于并行切片读取；`skip` 与 `next` 不能同时传。
    表单、表格、数据列表以及「我填写的」列表可用 `limit` 指定每页条数（缺省 50，最大 1000）；视图数据列表固定每页 50 条。
    小金商户的订单 / 退款 / 提现列表按页码分页：返回 `page_info`（total、page、per_page、total_pages）与记录数组，`limit` 缺省且最大 50；还有下一页时才带 `next`（下一页页码），原样回传即可。

    ## 时间与时区
    `created_at` / `updated_at` 等系统时间以 UTC ISO 8601 返回（如 `2021-09-28T02:59:42.539Z`）；
    日期字段的值按字段精度以北京时间格式化（如 `2012-12-25` 或 `2012-12-25 12:13`），写入时同样按北京时间解析。

    ## 输入校验
    服务端按本文档校验每个请求的路径参数、查询参数和 JSON 请求体（上传接口的 multipart 请求体除外）。
    - 不合法的请求直接返回 `400`，请求体为 `{ error_description, errors: [{ pointer, message, code }] }`；非 `application/json` 的请求体返回 `415`。
    - 请求体 schema 中未列出的键视为错误（数据写入的字段值除外，由表单字段定义决定）。
servers:
- url: https://jinshuju.net/api/v1
  description: 生产环境
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Forms
  description: 表单：列表、结构、创建与编辑，以及字段规则、协作者、复制、移动等附属操作。
- name: Form Settings
  description: 表单设置：提交设置、访问策略、Webhook、主题、关闭规则、考试 / 测评场景设置。
- name: Entries
  description: 表单数据：列表、查询、新增、更新、删除与批量操作。
- name: Tables
  description: 数据表格（kind=table）：结构与数据，字段类型限于表格支持的列类型。
- name: Views
  description: 表单 / 表格视图（视图筛选、排序、列配置）及按视图读取数据。
- name: Comments
  description: 数据评论。
- name: Fill
  description: 填写链接：以填写者身份读取填写页（`/f/`、`/v/`）并按它提交数据。
- name: OpenSearch
  description: 对外查询。
- name: Folders
  description: 文件夹。
- name: Predefined Choices Sets
  description: 预置选项集。
- name: Templates
  description: 模板使用。
- name: Contacts
  description: 联系人。
- name: Account
  description: 当前用户与企业账户：成员、发票、消费记录、短信签名审核状态。
- name: Trade
  description: 小金商户：商户与入驻进度、收款订单、交易统计、退款与提现。
- name: Uploads
  description: 附件、表单图片、导入文件的上传。
- name: Utilities
  description: 工具类接口。
paths:
  "/forms":
    get:
      tags:
      - Forms
      summary: 获取表单列表
      operationId: listForms
      description: |
        返回当前身份可见的表单（`kind=form`，不含表格与快速支付）。个人令牌返回该用户创建及被共享的表单；企业令牌返回企业下全部表单。
        默认按 id 倒序（即创建时间倒序），`next` 是下一页第一条的 id；传 `sort` 时按指定字段排序，`next` 变为 `row:<偏移量>`。
        每页默认 50 条，可用 `limit` 调整（最大 1000）。
        - 每行带 `entries_count`（数据量）与 `last_entry_created_at`（最近一次收到数据的时间），可配合 `filters` / `sort` 使用。
        - `include_transactions=true` 时，已绑定收款账户的表单附带 `transactions` 收款统计。

        OAuth 令牌需要 scope：forms
      parameters:
      - $ref: '#/components/parameters/FormsQ'
      - $ref: '#/components/parameters/FormsFilters'
      - $ref: '#/components/parameters/FormsSort'
      - $ref: '#/components/parameters/FormsNext'
      - $ref: '#/components/parameters/FormsSkip'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/IncludeTransactions'
      responses:
        '200':
          description: 表单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Forms
      summary: 创建表单
      operationId: createForm
      description: |
        用字段定义列表创建一个表单，返回完整的表单结构。`name` 与 `fields` 必填。
        - `scene` 决定表单场景；考试 / 测评题型（如 `SingleSelect`、`FillInBlank`）只能在支持的场景下使用。
        - `layout=card`（分页式）不支持 PageBreak、Matrix*、TableField、GoodsField、ESignatureField、FormAssociation、MultipleBlanksField 及各类 Widget 字段。
        - `folder_token` 指定的文件夹必须可管理且 kind 为 form，否则分别返回 404 / 400。
        - `setting` 只接受白名单内的键（见 `FormSettingWriteInput`），`setting.notification_rules` 会整体替换由 API 创建的通知规则。
        - 返回的表单结构带 `url`（对外填写地址）。

        OAuth 令牌需要 scope：forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCreateInput'
      responses:
        '201':
          description: 创建成功，返回表单结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: folder_token 指定的文件夹不存在或不可管理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Forms
      summary: 获取表单结构
      operationId: getForm
      description: |
        返回表单名称、对外填写地址（`url`）、描述、字段定义与设置。`fields` 中每个元素是 `{ "<api_code>": {...} }` 的单键对象，按字段顺序排列。
        以下内容在对应参数为 `true` 时附带：
        - `include_analytics`：每个可分析字段的定义中附带 `analytics`；
        - `include_theme`：附带 `theme`（表单主题）；
        - `include_field_rules`：附带 `field_rules`（字段显示规则）；
        - `include_extended_attributes`：附带 `extended_attributes`（数据来源链接）；
        - `include_transactions`：表单绑定了收款账户时附带 `transactions`（收款统计）。

        OAuth 令牌需要 scope：forms
      responses:
        '200':
          description: 表单结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: include_analytics
        in: query
        required: false
        description: 是否在每个可分析字段上附带 `analytics`（可用的聚合函数、能否分组、数据概况形态），缺省为 false。
        schema:
          type: boolean
          default: false
      - name: include_theme
        in: query
        required: false
        description: 为 `true` 时附带 `theme`（表单主题）。
        schema:
          type: boolean
          default: false
      - name: include_field_rules
        in: query
        required: false
        description: 为 `true` 时附带 `field_rules`（字段显示规则，同 `GET /forms/{form_token}/field_rules` 的 `data`）。
        schema:
          type: boolean
          default: false
      - name: include_extended_attributes
        in: query
        required: false
        description: 为 `true` 时附带 `extended_attributes`（数据来源链接，同 `GET /forms/{form_token}/extended_attributes` 的 `data`）。
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/IncludeTransactions'
    patch:
      tags:
      - Forms
      summary: 编辑表单
      operationId: updateForm
      description: |
        增量编辑表单，也接受 `PUT`。请求体至少包含 `name` / `description` / `fields` / `setting` / `field_rules` 之一，否则返回 400。
        - `fields` 按 `add` / `remove` / `update` / `update_choices` 四类操作增量修改，未提及的字段、选项与 api_code 全部保留；
          `update[].type` 可原地切换字段类型，会清空数据的切换必须带 `confirm_data_loss: true`。
        - `field_rules` 以 `GET /forms/{form_token}/field_rules` 返回的 `index` 定位规则做 `add` / `remove` / `update`。
        - `setting` 与创建时相同，只接受白名单内的键。
        返回更新后的完整表单结构。

        OAuth 令牌需要 scope：forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormUpdateInput'
      responses:
        '200':
          description: 更新成功，返回表单结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Entries
      summary: 新增数据（旧路径）
      operationId: createEntryLegacy
      deprecated: true
      description: |
        `POST /forms/{form_token}/entries` 的旧别名，行为完全相同。新接入请使用新路径。

        OAuth 令牌需要 scope：write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/EntryValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/fields/check":
    get:
      tags:
      - Forms
      summary: 检查字段是否已有数据
      description: |
        删除字段或选项前使用：批量检查字段（或字段的单个选项）是否已有提交的数据。删除仍有数据的字段或选项会连同这些数据一起删除且无法恢复。
        与网页编辑器删除前的检查结果一致。
        - 一次编辑涉及的所有删除目标放在同一次调用的 `checks` 里（最多 100 个，可跨多个字段）；`results` 与 `checks` 顺序一一对应。
        - 某个目标无法检查（如字段不存在）时，该行返回 `unavailable` 说明原因，其余目标照常返回。
        - `checks` 缺失、为空、超过 100 个、不是 JSON 数组或其中某项不是对象时返回 400。

        OAuth 令牌需要 scope：forms。
      operationId: checkFormFieldData
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/FieldDataChecks'
      responses:
        '200':
          description: 逐项检查结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDataCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/fields/preview_convert":
    get:
      tags:
      - Forms
      summary: 预览字段类型转换
      description: |
        修改字段类型（PATCH /forms/{form_token} 中字段的 `type`）前使用：不修改任何数据，按字段当前的数据统计转换后保留与清空的条数。
        类型转换在原字段上进行（api_code 与数据列不变），因此受影响的只有数据；与网页编辑器转换前的预览结果一致。
        - 一次编辑涉及的所有转换放在同一次调用的 `checks` 里（最多 20 个）；`results` 与 `checks` 顺序一一对应。
        - `supported=false` 表示该字段不支持转换为目标类型，实际编辑也会被拒绝。
        - 多行文本转换为单选 / 多选等选择类字段时，额外返回将从已有数据生成的选项数 `choice_count`，以及是否超过选项上限 `choice_limit_exceeded`（超过时转换会被拒绝，而不是截断）。
        - 某项无法预览（字段不存在、`target_type` 不是该表单可用的类型等）时，该行返回 `unavailable` 说明原因，其余项照常返回。
        - `checks` 缺失、为空、超过 20 个、不是 JSON 数组或其中某项不是对象时返回 400。

        OAuth 令牌需要 scope：forms。
      operationId: previewFormFieldTypeChange
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/FieldTypeChangeChecks'
      responses:
        '200':
          description: 逐项预览结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeChangePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: 获取数据列表
      operationId: listEntries
      description: |
        分页返回表单数据，每页缺省 50 条，可用 `limit` 指定（最大 1000）。默认按序号升序，`next` 为下一页第一条的序号。
        - `filters` / `keyword` 触发条件查询，`created_at` 只返回该时间及之后创建的数据（并改为按创建时间排序）；
          这两种情况以及传 `sort` 时，`next` 变为行偏移量。
        - `fields` 只返回指定字段（序号始终返回）。
        - 每条数据的键为字段 api_code（配置了 api_code_alias 的字段以别名为键），值的形态见 `EntryData`。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - $ref: '#/components/parameters/EntriesFields'
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      - $ref: '#/components/parameters/EntriesSort'
      - $ref: '#/components/parameters/EntriesCreatedAt'
      - $ref: '#/components/parameters/EntriesNext'
      - $ref: '#/components/parameters/EntriesSkip'
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: 数据列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Entries
      summary: 新增数据
      operationId: createEntry
      description: |
        以字段 api_code（或 api_code_alias）为键提交一条数据。未知键被忽略；有效键为空时返回 400，`error_description` 以 `Entry attributes cannot be empty` 开头，并逐个说明被丢弃的键（不是该表单的字段，或是不可写入的签名 / 计算字段）。
        - 表单的「字段规则」与字段校验依然生效，校验失败返回 400，`error_description` 是 `{ "<api_code>": ["错误"] }` 序列化后的 JSON 字符串。
        - 手机字段跳过短信验证；签名字段、计算字段不可写入。
        - 表单数据量达到套餐上限时返回 403。
        - 附件字段接受多种写法，见 `EntryInput`。

        OAuth 令牌需要 scope：write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryInput'
            example:
              field_1: 张三
              field_2: '13800000000'
              field_3:
              - 选项 A
              - 选项 B
              field_4: '2024-05-01'
      responses:
        '201':
          description: 创建成功，返回该条数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/EntryValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 表单数据量已达上限（`Form has reached entries limit`），或 OAuth scope 不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
