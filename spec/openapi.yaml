        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/weixin_oauth_session":
    post:
      tags:
      - Forms
      summary: Exchange a WeChat authorization code for an openid
      description: |
        Exchanges the `code` returned by WeChat web authorization for the user's openid, through the WeChat Official Account the form has selected.
        When the form's WeChat authorization scope is userinfo, also returns `unionid` (when WeChat returns one) and `profile`.
        OAuth scope: write_entries
        - Returns 400 when the form has no WeChat Official Account configured or that account does not exist; returns 400 when `code` is missing.
        - Returns 502 when the exchange fails on the WeChat side (invalid code, etc.) or fetching the user info fails.
      operationId: createWeixinOauthSession
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormWeixinOauthSessionInput'
      responses:
        '200':
          description: Authorization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormWeixinOauthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The WeChat OAuth or user info call failed
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: The errmsg returned by WeChat, or "WeChat OAuth failed" / "WeChat userinfo failed"
  "/forms/{form_token}/views":
    get:
      tags:
      - Views
      summary: List a form's views
      description: 'Returns the views the caller can see on the form: views they created, and views whose visibility other cooperators set to cooperators; other users'' personal views are not returned. The order follows the caller''s own saved view order; views not in it are appended by position, then created_at. OAuth scope: forms'
      operationId: listFormViews
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: List of views
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: Number of views returned
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Views
      summary: Create a view on a form
      description: 'Creates a new view on the form, created by the caller; visibility defaults to cooperators when not passed, and position is the highest position among the currently visible views plus 1. Each user can have at most 100 views on one form; at the limit, returns 422 (View limit reached). When view_type is kanban and kanban_group_by_api_code is not passed, the server picks the grouping field; when kanban_hidden_groups is not passed, the __unset__ group is hidden by default; when prefer_columns is empty, the form''s default columns are used (at most 5 columns for a kanban view, serial_number included). Returns 422 when filter is invalid (not an array, unknown field, unsupported operator, invalid value). Returns 422 when model validation fails (e.g. name is empty or longer than 120 characters, or the grouping field does not support kanban grouping). Form views (view_type form): supported only on tables, otherwise 422; title defaults to the table name; without field_overrides, all fillable columns are selected in the current column order; published defaults to false (the fill link does not work while unpublished). title / description / published / field_overrides apply only to form views; using them on another type returns 422. Creating, updating or deleting a form view (including switching a view to or from a form view) requires the caller to hold a predefined role on the table that can add entries, otherwise 403; an account token is exempt. Returns 422 when a fill item''s column does not exist, cannot be a fill item, or sets a validation its column type does not support; the error message names the column''s api_code. OAuth scope: forms'
      operationId: createFormView
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FormViewInput'
              - type: object
                required:
                - name
      responses:
        '201':
          description: Created; returns the view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
  "/forms/{form_token}/views/{view_token}":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    - name: view_token
      in: path
      required: true
      description: View token
      schema:
        type: string
    get:
      tags:
      - Views
      summary: Show a view of a form
      description: 'Returns one view. Only views visible to the caller can be read (created by the caller or visible to cooperators); another user''s personal view returns 404 (View cannot be found). OAuth scope: forms'
      operationId: getFormView
      responses:
        '200':
          description: View details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Views
      summary: Update a view of a form
      description: 'Updates the view''s configuration; PUT is accepted too. Only the keys present in the request are updated: an empty array for filter clears the filters, and leaving filter out keeps them unchanged; when kanban_group_by_api_code changes and kanban_group_order / kanban_hidden_groups are not passed with it, those two lists reset to their defaults. Cooperators can change the configuration of a view visible to cooperators, but only the view''s creator can switch visibility, otherwise returns 403; a view whose view_scope is form cannot switch visibility. Returns 422 when filter is invalid or model validation fails. field_overrides replaces the fill item settings as a whole; form views have the same permission requirements and parameter limits as on create. OAuth scope: forms'
      operationId: updateFormView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormViewInput'
      responses:
        '200':
          description: Updated; returns the view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
    delete:
      tags:
      - Views
      summary: Delete a view of a form
      description: 'Deletes a view. Predefined views (predefined) and views whose view_scope is form cannot be deleted, and the deletion is also refused when it would leave the caller with no visible view; all of these return 422. Deleting a form view needs the same permission as creating one (otherwise 403); once it is deleted, its fill link stops working immediately, and this cannot be undone. OAuth scope: forms'
      operationId: deleteFormView
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: Token of the deleted view
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
  "/forms/{form_token}/views/{view_token}/entries":
    get:
      tags:
      - Views
      summary: List a view's entries
      description: 'Returns the form''s entries under the view''s filters and sort rules. The returned fields are limited to those in the view''s prefer_columns (serial_number always included); when prefer_columns is empty, all pushable fields are returned. Sorting follows the view''s sort rules, with serial_number ascending appended when they do not include serial_number. Returns 400 when the view''s filters use an operator the query engine does not support. Only views visible to the caller are accessible, otherwise 404 (View cannot be found). OAuth scope: read_entries'
      operationId: listFormViewEntries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - name: view_token
        in: path
        required: true
        description: View token
        schema:
          type: string
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      responses:
        '200':
          description: Entry list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/entry_attachments":
    post:
      tags:
      - Uploads
      summary: Upload an entry attachment
      operationId: uploadEntryAttachment
      description: |
        Uploads a file for an attachment field of the form, or for an attachment column of a table field.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - field_api_code
              properties:
                field_api_code:
                  type: string
                  description: api_code of the attachment field; for an attachment column in a table field, pass the table field's api_code
                dimension_api_code:
                  type: string
                  description: api_code of the attachment column in a table field; required when `field_api_code` is a table field
                file:
                  type: string
                  description: The file to upload; pass either this or `base64`
                  contentMediaType: application/octet-stream
                base64:
                  type: string
                  description: The file content as a Base64 string, optionally with a data URI prefix; pass either this or `file`
                file_name:
                  type: string
                  description: File name for a Base64 upload; defaults to `attachment`
                content_type:
                  type: string
                  description: MIME type for a Base64 upload; defaults to the one in the data URI prefix, otherwise `application/octet-stream`
              additionalProperties: false
          application/json:
            schema:
              $ref: '#/components/schemas/EntryAttachmentBase64Input'
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedEntryAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The attachment failed validation (for example, it exceeds the field's per-file size limit) or could not be stored
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: Why validation failed
  "/forms/{form_token}/entry_attachment_upload_urls":
    post:
      tags:
      - Uploads
      summary: Prepare an entry attachment upload
      operationId: prepareEntryAttachmentUpload
      description: |
        Issues a one-time link for uploading a local file to an attachment field, or to an attachment column of a table field, without sending its bytes in a request body.
        - With a shell that can read the file and reach the network, run `curl -F file=@<path> <upload_url>`, then put the returned `attachment_id` in the field when creating or updating an entry.
        - Without one, or when curl fails (for example under a sandbox's network limits), send small content as Base64 to "Upload an entry attachment".

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - field_api_code
              properties:
                field_api_code:
                  type: string
                  description: api_code of the attachment field; for an attachment column in a table field, pass the table field's api_code
                dimension_api_code:
                  type: string
                  description: api_code of the attachment column in a table field; required when `field_api_code` is a table field
              additionalProperties: false
      responses:
        '201':
          description: Upload link issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/import_files":
    post:
      tags:
      - Uploads
      summary: Upload an import file
      operationId: uploadImportFile
      description: |
        Uploads a spreadsheet (`.xlsx` / `.xls` / `.csv`) for importing entries into the form.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  description: The xlsx / xls / csv file to import
                  contentMediaType: application/octet-stream
              additionalProperties: false
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedImportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The file failed validation (it exceeds the plan's import limit, or its extension is not supported)
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: Why validation failed
  "/forms/{form_token}/import_file_upload_urls":
    post:
      tags:
      - Uploads
      summary: Prepare an import file upload
      operationId: prepareImportFileUpload
      description: |
        Issues a one-time link for uploading a local spreadsheet (`.xlsx` / `.xls` / `.csv`) to import into the form, without sending its bytes in a request body.
        - With a shell that can read the file and reach the network, run `curl -F file=@<path> <upload_url>`, then pass the returned `attachment_id` to "Import entries from an uploaded spreadsheet"; read the header row from your local copy.
        - Without one, or when curl fails, the file cannot be uploaded: spreadsheets have no Base64 route.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '201':
          description: Upload link issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/entry_imports":
    post:
      tags:
      - Entries
      summary: Import entries from an uploaded spreadsheet
      operationId: createEntryImport
      description: |
        Appends each row of a spreadsheet uploaded with "Upload an import file" as an entry of this form. Upload the file first to get the import attachment ID (`attachment_id`), then say here which column goes into which field.
        Once validation passes, returns `201` and the entries are written in the background: `201` means the job has started, not finished; poll "Show an entry import job" for the result.
        - Every required field of the form needs a column, and a field takes at most one column.
        - A refused import writes no entries, and its error shows the row and column range and the header of the spreadsheet, so fix the mapping from it and retry.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryImportInput'
      responses:
        '201':
          description: Import job created; entries are written in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryImportCreated'
        '400':
          description: The import was refused and no entry was written, for example the file is missing or not a readable xls / xlsx / csv, the import limit of the plan is reached, or the header row or column mapping does not fit; the message says why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entry_imports/{id}":
    get:
      tags:
      - Entries
      summary: Show an entry import job
      operationId: getEntryImport
      description: |
        Returns the progress and result of an entry import job. While `status` is `pending` / `running`, the job is still in progress, and `processed_rows` and `total_rows` can be used to show progress;
        `success` / `failed` / `cancelled` are final states; `imported_count` / `skip_count` / `invalid_count` are the numbers of rows written, skipped and failing validation, `warnings` holds per-row notices, and `error_message` is why the job failed.
        A job can be read only through the form it imports into: when the id does not exist, is not a valid id, or belongs to another form, returns 404 `Import job not found for this form — check the id, and that it belongs to this form.`.
        Returns 404 `form cannot be found` when the form does not exist or is not accessible to the current caller.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/EntryImportId'
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/sms_tasks/estimate":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: Estimate an SMS task
      operationId: estimateSmsTask
      description: |
        Picks the entries an SMS task would send to and counts the messages it would charge, without sending anything.
        OAuth scope: read_entries
        - `POST /forms/{form_token}/sms_tasks` with the same parameters picks the entries again when it runs, so its count changes if they changed in between.
        - A cooperator picks only the entries visible to their role.
      parameters:
      - $ref: '#/components/parameters/EntryTaskEntryField'
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      - $ref: '#/components/parameters/EntryTaskViewToken'
      - $ref: '#/components/parameters/EntryTaskSelectAll'
      - name: sms_template_id
        in: query
        required: true
        description: SMS template to send with (`id` from `GET /sms/templates`)
        schema:
          type: string
      - name: placeholder_keys
        in: query
        required: false
        description: The same as `placeholder_keys` of `POST /forms/{form_token}/sms_tasks`, one `placeholder_keys[]=` per variable
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: SMS task estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSTaskEstimate'
        '400':
          description: 'Invalid parameters, including: nothing narrows the entries and `select_all` is not true, `filters` has a `creator_id` condition or `serial_number` conditions matching no entry, `entry_field` is not a mobile field the caller can read, or the SMS template or its signature failed review'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/EntryTaskForbidden'
        '404':
          description: The form, the view or the SMS template does not exist or is not accessible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/sms_tasks":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: List SMS tasks
      operationId: listSmsTasks
      description: |
        Lists the SMS tasks of this form.
        OAuth scope: read_entries
      parameters:
      - name: status
        in: query
        required: false
        description: Return only the tasks in this status
        schema:
          type: string
          enum:
          - template_checking
          - content_auditing
          - approved
          - rejected
          - waiting_for_send
          - sending
          - all_sent
          - partial_sent
          - none_sent
          - template_fail
          - revoked
          - template_deleted
      - $ref: '#/components/parameters/EntryTaskStartDate'
      - $ref: '#/components/parameters/EntryTaskEndDate'
      - $ref: '#/components/parameters/EntryTaskListLimit'
      - $ref: '#/components/parameters/EntryTaskNext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: SMS tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/EntryTaskForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Entries
      summary: Send SMS to entries
      operationId: createSmsTask
      description: |
        Creates an SMS task that sends a template message to each entry picked.
        OAuth scope: write_entries
        - Estimate first with `GET /forms/{form_token}/sms_tasks/estimate` and send with the same parameters; the entries are picked again when this runs.
        - The task may wait in `template_checking` or `content_auditing` while the template or content is under review, and sends once approved.
        - When the estimate's `can_send` is false the task is still created, and when sending finds the quota and balance short it stops, ending `none_sent` or `partial_sent` with the reason in `failed_reason`.
        - Sent messages cannot be recalled, and retrying a request that succeeded sends again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSTaskCreateInput'
      responses:
        '201':
          description: Created; returns the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTask'
        '400':
          description: Any 400 case of the estimate, `send_at` not a future time, or no entry to send to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/EntryTaskForbidden'
        '404':
          description: The form, the view or the SMS template does not exist or is not accessible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
