          matched: 3
          serial_numbers:
          - 12
          - 57
          - 88
          folder_token: null
    EntryStatsResponse:
      type: object
      required:
      - from
      - to
      - tz
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        tz:
          type: string
          examples:
          - Asia/Shanghai
        total:
          type: integer
          description: Total submissions across all forms in the range
        forms_with_data:
          type: integer
          description: Number of forms with submissions in the range
        count:
          type: integer
          description: Number of rows in `data`
        data:
          type: array
          description: Forms with submissions, most submissions first
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
          description: More forms have submissions than `limit`; `data` holds only the first `limit`
        buckets:
          type: array
          description: Present only when `by` is passed; one item per period in the range, oldest first
          items:
            $ref: '#/components/schemas/EntryStatsBucket'
      examples:
      - from: '2026-09-01'
        to: '2026-09-07'
        tz: Asia/Shanghai
        total: 210
        forms_with_data: 2
        count: 2
        data:
        - token: abc123
          name: 报名表
          kind: form
          fill_count: 180
        - token: def456
          name: 客户台账
          kind: table
          fill_count: 30
        truncated: false
    EntryStatsFormRow:
      type: object
      required:
      - token
      - name
      - kind
      - fill_count
      properties:
        token:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - form
          - table
        fill_count:
          type: integer
          description: Submissions in the period
    EntryStatsBucket:
      type: object
      description: Submission counts for one period, shaped like the overall statistics
      required:
      - from
      - to
      - total
      - forms_with_data
      - count
      - data
      - truncated
      properties:
        from:
          type: string
          format: date
          description: First day of the period, inclusive; the first period is clipped to the range
        to:
          type: string
          format: date
          description: Last day of the period, inclusive; the last period is clipped to the range
        total:
          type: integer
        forms_with_data:
          type: integer
        count:
          type: integer
        data:
          type: array
          description: Forms with submissions in this period, most submissions first, at most `limit` rows
          items:
            $ref: '#/components/schemas/EntryStatsFormRow'
        truncated:
          type: boolean
    FieldAnalytics:
      type: object
      description: Statistics the field supports; present on analysable fields only when `include_analytics=true`
      required:
      - agg_funcs
      - summary_kind
      - groupable
      - buckets
      - default_agg
      - summarisable
      properties:
        agg_funcs:
          type: array
          description: Functions the aggregate endpoint's `metrics` can apply to this field
          items:
            type: string
        summary_kind:
          type: string
          description: This field's `kind` in the data summary
          enum:
          - choice
          - matrix
          - number
          - date
          - text
          - geo
        groupable:
          type: boolean
          description: Whether it can be used in the aggregate endpoint's `dimensions`
        buckets:
          type: array
          description: The `bucket` values usable when grouping by this field (non-empty for date fields only)
          items:
            type: string
            enum:
            - day
            - week
            - month
        default_agg:
          type: string
          description: Suggested default aggregate function (`sum` for numbers, `count` otherwise)
        summarisable:
          type: boolean
          description: Whether the data summary includes this field
    MyFilledForm:
