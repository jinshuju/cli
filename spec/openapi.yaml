        OAuth 令牌需要 scope：form_setting。
      operationId: getExamSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: 考试设置（可能为空对象）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Form Settings
      summary: 更新考试设置
      description: |
        增量更新考试场景表单的设置；同时接受 PUT。仅考试场景表单可用，否则返回 400。
        OAuth 令牌需要 scope：form_setting。
        - 套餐不支持"提交后显示成绩"时，`notice_after_filling_mode` 会被强制写为 none，且 `success_message_rich_text` 被忽略。
        - `interval_comments` 整体替换现有区间评语；仅在（本次传入或已保存的）`notice_after_filling_mode` 为 grade / explaination / answer 时生效；传空数组不会关闭区间评语。
        - 区间评语需满足 end_point ≥ start_point 且互不重叠，否则 400。
        - 表单已有必填题目时传 `show_timeout: true` 返回 400；开启限时后题目字段不能再设必填（考生信息字段的必填不受影响），要开限时先取消题目必填。
        - `notice_after_filling_mode` 不为 none 时，服务端会清空表单设置中的 success_redirect_url / success_redirect_fields。
        - 请求体不含任何可识别键时视为无操作，直接返回当前设置。
      operationId: updateExamSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSettingInput'
      responses:
        '200':
          description: 保存后的考试设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
