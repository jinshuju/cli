    FieldRule:
      type: object
      description: One field display rule
      required:
      - index
      - targets
      - targets_display_mode
      - operator
      - conditions
      properties:
        index:
          type: integer
          description: 0-based position, used by PATCH /forms/{form_token} to update or remove the rule
        targets:
          type: array
          description: api_codes of the controlled fields; always ["DYNAMIC_TARGETS"] when targets_display_mode is abort
          items:
            type: string
        targets_display_mode:
          type: string
          enum:
          - show
          - abort
          description: 'show: show the target fields when the conditions are met; abort: end the fill when the conditions are met'
        operator:
          type: string
          enum:
          - or
          - and
          description: Logical relation between the conditions
        conditions:
          type: array
          items:
            type: object
            required:
            - trigger
            - comparator
            - value
            properties:
              trigger:
                type: string
                description: api_code of the trigger field
              comparator:
                type: string
                enum:
                - equal
                - none_in
                - between
                - like
                - not_like
                description: equal means "contains any of" (for historical reasons)
              value:
                description: 'Condition value: an array of choice api_codes, a numeric range [min, max] or text, depending on the trigger field''s type'
    ExtendedAttribute:
      type: object
      required:
      - value
      - url
      - cname
