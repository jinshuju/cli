          description: Aggregation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryAggregateResponse'
        '400':
          description: 'Invalid parameters, including: a field that does not exist or that the caller cannot read, or a function or grouping that does not apply to the field (the message lists the ones that do)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
