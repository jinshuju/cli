        Sets the form's entry push URL `entry_post_url` and turns on pushing new entries (post_new_entry = true).
        OAuth scope: form_setting
        The plan must support Webhook; otherwise returns 402 with an empty body.
        The server does not check the save result and echoes `entry_post_url` from the settings as is (whether an invalid URL was persisted depends on the server implementation).
      operationId: createFormWebhook
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: The current push URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormWebhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The plan does not support API v1 access (returns error_description), or the plan does not support Webhook (empty body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_description:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Form Settings
      summary: Delete the Webhook
      description: |
        Removes `entry_post_url` from the form's settings. Returns 200 with an empty body on success.
        OAuth scope: form_setting
      operationId: deleteFormWebhook
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: Deleted; the body is empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/theme":
    patch:
      tags:
      - Form Settings
      summary: Update a form's theme
      description: |
        Partially updates the form's theme (colors, background, header image, typography, form container, submit button); PUT is accepted too.
        - The request body must contain at least one of primary_color / secondary_color / wallpaper / header / typography / form_container / submit_button (`generate_header_image` is turned into header.header_image_url, so it counts too); otherwise 400.
        - Header image source precedence: header_image_upload_token > header_image_base64 > header_image_url > header_image_attachment_id; when a header image is set and header.type is not given, header.type is set to image.
        - Background image source precedence: background_image_upload_token > background_image_url > background_image_attachment_id. Setting or removing the background image also removes the preset background image that comes with the theme template; the background color is kept.
        - `header_image_attachment_id` / `background_image_attachment_id` take the `attachment_id` returned by "Upload a form image" (image_type header / wallpaper); pass an empty string `""` to remove the current image.
        - `header.carousel_images` replaces the carousel images as a whole: at most 5, not empty; each item gives one of image_upload_token / image_url / attachment_id, and an attachment_id must be a carousel image the form already has; when it is passed and header.type is not given, header.type is set to carousel.
        - Keys in `text_style` and `typography.*` use underscores (e.g. font_size); the server converts them to hyphenated CSS keys and merges them into the existing styles; the response uses the hyphenated keys.
        - `generate_header_image` has AI generate a header image and consumes AI points; returns 402 when points are insufficient, 400 when generation fails.
        - An image upload_token is the `form_image_token` used by "Upload a form image"; the image purpose it records must match (header / wallpaper / carousel), and its upload must be complete.

        OAuth scope: form_setting
      operationId: updateFormTheme
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeInput'
      responses:
        '200':
          description: The saved theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormTheme'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/exam_setting":
    get:
      tags:
      - Form Settings
      summary: Show a form's exam settings
      description: |
        Returns an exam form's settings for what is shown after the exam is submitted, the time limit, the pre-exam notice and score range comments.
        Only for forms in the exam scene (scene = exam); otherwise returns 400. Returns an empty object `{}` when the form has no exam settings record yet.
        OAuth scope: form_setting
      operationId: getExamSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: Exam settings (may be an empty object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Form Settings
      summary: Update a form's exam settings
      description: |
        Partially updates an exam form's settings; PUT is accepted too. Only for exam-scene forms; otherwise returns 400.
        OAuth scope: form_setting
        - When the plan does not support "show the score after submission", `notice_after_filling_mode` is forced to none and `success_message_rich_text` is ignored.
        - `interval_comments` replaces the existing range comments as a whole; it takes effect only when `notice_after_filling_mode` (passed in this request or already saved) is grade / explaination / answer; passing an empty array does not turn range comments off.
        - Range comments must have end_point ≥ start_point and must not overlap; otherwise 400.
        - Passing `show_timeout: true` returns 400 when the form already has required questions; once the time limit is on, question fields cannot be made required (required candidate info fields are not affected); to turn on the time limit, make the questions optional first.
        - When `notice_after_filling_mode` is not none, the server clears success_redirect_url / success_redirect_fields in the form's settings.
        - A request body with no recognized keys is a no-op and returns the current settings.
      operationId: updateExamSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSettingInput'
      responses:
        '200':
          description: The saved exam settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/evaluation_setting":
    get:
      tags:
      - Form Settings
      summary: Show a form's evaluation settings
      description: |
        Returns an evaluation form's report display, dimension (indicator) settings and total score range comments.
        Only for forms in the evaluation scene (scene = evaluation); otherwise returns 400. Returns an empty object `{}` when the form has no evaluation settings record yet.
        OAuth scope: form_setting
      operationId: getEvaluationSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: Evaluation settings (may be an empty object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Form Settings
      summary: Update a form's evaluation settings
      description: |
        Partially updates an evaluation form's settings; PUT is accepted too. Only for evaluation-scene forms; otherwise returns 400.
        OAuth scope: form_setting
        - When the plan does not support "show the evaluation report after submission", `notice_after_filling_mode` is forced to none.
        - `evaluation_comments` replaces the total score range comments as a whole, and an empty array turns range comments off; it takes effect only when `notice_after_filling_mode` (passed in this request or already saved) is reports / customize.
        - A comment by score range must give both start_point and end_point; comments written with conditions in the form editor read back as `id` + `conditions` and must be passed back with their original id when updating (only comment / retry may change; the conditions cannot be changed and no range can be added); leaving one out or changing it returns 400.
        - `indicator_setting.indicators` replaces the dimensions as a whole; pass `api_code` back to keep an existing dimension's identity. A dimension can bind only scorable questions visible on the form, referenced by `field_api_codes` or `field_cids`; referencing an unknown field returns 400.
        - When `notice_after_filling_mode` is not none, the server clears success_redirect_url / success_redirect_fields in the form's settings.
        - A request body with no recognized keys is a no-op and returns the current settings.
      operationId: updateEvaluationSetting
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationSettingInput'
      responses:
        '200':
          description: The saved evaluation settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/field_rules":
    get:
      tags:
