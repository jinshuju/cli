  "/forms/{form_token}/entries/batch":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    post:
      tags:
      - Entries
      summary: 批量新增数据
      operationId: createEntriesBatch
      description: |
        一次最多提交 200 条数据。逐条校验，合法的批量写入，非法的记录在 `errors` 中（`index` 为请求数组下标）。
        至少一条成功返回 201，全部失败返回 422；`entries` 为空或超过 200 条返回 400。
        提交前会按条数检查数据量上限，超限返回 403。批量写入不会触发单条新增的回调，但会创建一条「导入」活动记录并回填计算字段。

        OAuth 令牌需要 scope：write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entries
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/EntryInput'
              additionalProperties: false
      responses:
        '201':
          description: 至少一条创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 表单数据量已达上限，或 OAuth scope 不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 全部条目创建失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - Entries
      summary: 批量更新数据
      operationId: patchEntriesBatch
      description: |
        按序号批量增量更新，一次最多 200 行。每行 `serial_number` 必填，`entry` 为要修改的字段（未提及的字段保持不变）。
        逐行校验，失败的行记录在 `failed_rows`（`reason` 为 `invalid_serial_number` / `invalid_attributes` 等）。
        至少一行成功返回 200，全部失败返回 422；`entries` 为空或超过 200 行返回 400。
        批量更新不处理附件生命周期，因此**不能写附件字段**（含表格字段中的附件列），需要逐条更新。

        OAuth 令牌需要 scope：write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entries
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                    - serial_number
                    - entry
                    properties:
                      serial_number:
                        type: integer
                        description: 要更新的数据序号
                      entry:
                        $ref: '#/components/schemas/EntryInput'
                    additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: 至少一行更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 全部行更新失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPatchResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
