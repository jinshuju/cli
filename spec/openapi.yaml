    CheckinDateSetting:
      type: object
      description: A date range check-in is open in. Check-in works on the days within the range that fall on `periods`, inside the duration. For several durations, pass several date_settings
      required:
      - start_date
      - end_date
      - periods
      - durations
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        periods:
          type: array
          minItems: 1
          description: Weekdays check-in is open on; list all seven for every day
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
        durations:
          type: array
          minItems: 1
          maxItems: 1
          description: The time of day check-in is open; exactly one
          items:
            type: object
            required:
            - start
            - end
            properties:
              start:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                description: Start time, HH:MM
              end:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                description: End time, HH:MM
            additionalProperties: false
      additionalProperties: false
    CheckinGeoLocation:
      type: object
