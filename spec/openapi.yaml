        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/jamr_v":
    get:
      tags:
      - Utilities
      summary: 校验跳转参数
      operationId: verifyRedirectParams
      security: []
      description: |
        供「提交成功后跳转到外部地址」的接收方校验跳转参数未被篡改。此接口不需要任何 API 凭证。
        表单开启提交成功跳转并配置了「跳转时携带的字段」后，金数据在跳转 URL 中附加所选字段的值以及签名参数 `jamr_h`（对表单 token、数据 token 和 10 分钟有效期签名）。接收方把收到的 `jamr_h` 与全部字段参数原样转发到本接口：服务端解签后找到对应表单与数据，逐一比对配置中每个字段的当前值与传入参数值（数组值须整体相等，其他值按字符串比较）。
        全部一致返回 200 `{ status: "SUCCESS", message: "验证成功" }`；`jamr_h` 签名无效或已过期返回 400 `{ status: "FAIL", message: "无效Token或者过期" }`；表单 / 数据不存在、字段值不一致或缺少某个字段参数返回 400 `{ status: "FAIL", message: "验证失败" }`。文案随请求语言变化。
      parameters:
      - name: jamr_h
        in: query
        required: true
        description: 跳转 URL 中携带的签名参数
        schema:
          type: string
      - name: serial_number
        in: query
        required: false
        description: 跳转 URL 中携带的数据序号；仅当表单配置了携带该字段时出现
        schema:
          type: string
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: 如 `验证成功`
        '400':
          description: 签名无效 / 过期，或字段值不一致
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - FAIL
                  message:
                    type: string
                    description: "`无效Token或者过期` 或 `验证失败`"
  "/field_types":
    get:
      tags:
      - Forms
      summary: 获取字段类型列表
      description: |
        返回创建 / 编辑表单（或表格）时可用的全部字段类型，以及每种类型接受的校验开关与专属设置，用于构造 `fields` 中的 `type` 与类型专属参数。
        与创建接口实际接受的类型和参数保持一致。

        OAuth 令牌需要 scope：forms。
      operationId: listFieldTypes
      parameters:
      - $ref: '#/components/parameters/FieldTypeKind'
      responses:
        '200':
          description: 字段类型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/field_types/{type}":
    parameters:
    - name: type
      in: path
      required: true
      description: 字段类型名（区分大小写），取值见 `GET /field_types` 返回的 `type`，如 `TextField`、`RadioButton`。
      schema:
        type: string
        pattern: "^[A-Za-z]+$"
      example: NumberField
    get:
      tags:
      - Forms
      summary: 获取单个字段类型
      description: |
        返回一种字段类型接受的校验开关与专属设置，结构同 `GET /field_types` 列表中的一项。
        类型名不存在，或不属于 `kind` 对应的可用类型（如 `kind=table` 时查询表格不支持的类型）时返回 404，并在 `error_description` 中列出可用类型。

        OAuth 令牌需要 scope：forms。
      operationId: getFieldType
      parameters:
      - $ref: '#/components/parameters/FieldTypeKind'
      responses:
        '200':
          description: 字段类型说明
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeDescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 类型名不存在或不属于 `kind` 对应的可用类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_description: 'Invalid field type: Nope. Allowed types: TextField, TextArea, NumberField, ...'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/count":
    get:
      tags:
      - Entries
      summary: 批量统计多个表单的数据条数
      operationId: countEntriesAcrossForms
      description: |
        一次统计最多 10 个表单 / 表格各自满足条件的数据条数，以及它们的合计。
        - 无法访问的 token（不存在、不属于当前身份）不会让整个请求失败，而是在该行返回 `unavailable` 说明原因；合计只累加可统计的行。
        - 各表单的字段 api_code 含义不同，因此 `filters` 只能使用 `created_at` / `updated_at` / `creator_id` 三个与表单无关的条件，其他字段返回 400。
        - 不支持 `keyword`（传入返回 400）；需要按关键字查多个表单时使用 `GET /entries/search`。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - name: form_tokens
        in: query
        required: false
        description: '必填。要统计的表单或表格 token（也接受 id），逗号分隔（或 `form_tokens[]=` 重复传），去重后 1～10 个；为空返回 400，超过 10 个返回 400。

          '
        schema:
          type: string
        example: abc123,def456
      - name: filters
        in: query
        required: false
        description: '筛选条件，JSON 数组，写法同 `GET /forms/{form_token}/entries` 的 `filters`，但 `field` 只能是 `created_at` / `updated_at` / `creator_id`。对每个表单分别生效。

          '
        schema:
          type: string
        example: '[{"field":"created_at","operator":"within_last","value":{"unit":"day","n":7}}]'
      responses:
        '200':
          description: 各表单的数据条数与合计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryCountBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/search":
    get:
      tags:
      - Entries
      summary: 跨表单搜索数据
      operationId: searchEntriesAcrossForms
      description: |
        用同一个关键字在多个表单 / 表格中做全文搜索，按表单返回匹配条数与部分数据序号（每个表单最多 50 个），不返回数据内容。
        - 搜索范围：传 `form_tokens` 时为这些表单；不传时为当前身份可访问的全部表单与表格（企业 Access Token 为企业账户下全部表单与表格）。
          两种方式都再经 `filters` 过滤；未在 `filters` 中指定 `entries_count` 时默认只搜索有数据的表单（`entries_count > 0`）。
        - 范围内最多 10 个表单，超过时返回 400，需用 `filters` 缩小范围或直接指定 `form_tokens`。
        - 没有匹配的表单不出现在结果中；无法访问、角色不允许读取数据、搜索超时或搜索服务未响应的表单会列出并带 `unavailable` 说明原因（此时不代表没有匹配）。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - name: keyword
        in: query
        required: true
        description: 搜索关键字（最长 200 字符），为空返回 400。
        schema:
          type: string
          maxLength: 200
      - name: form_tokens
        in: query
        required: false
        description: 要搜索的表单或表格 token（也接受 id），逗号分隔（或 `form_tokens[]=` 重复传），去重后最多 10 个。不传时搜索全部可访问的表单。
        schema:
          type: string
        example: abc123,def456
      - name: filters
        in: query
        required: false
        description: |
          按表单属性筛选搜索范围，JSON 数组，写法与可用字段同 `GET /forms` 的 `filters`（`form_name` / `created_at` / `last_entry_created_at` / `entries_count`），多个条件为「且」关系。
          未指定 `entries_count` 条件时自动追加 `entries_count > 0`。
        schema:
          type: string
        example: '[{"field":"last_entry_created_at","operator":"within_last","value":{"unit":"day","n":30}}]'
      responses:
        '200':
          description: 各表单的匹配情况
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/stats":
    get:
      tags:
      - Entries
      summary: 按日期范围统计各表单提交量
      operationId: getEntryStats
      description: |
        统计当前身份可访问的全部表单 / 表格（企业 Access Token 为企业账户下全部表单与表格）在日期范围内收到的提交次数：返回总数，以及有提交的表单按提交次数降序排列的列表。
        - 日期按北京时间计，`from` / `to` 均包含当天。
        - 统计的是提交发生时的次数：导入的数据计在导入当天，删除的数据不会扣减，因此与按数据 `created_at` 统计的结果不一定一致。
        - 列表最多 `limit` 行，超出时 `truncated` 为 true，`total` 与 `forms_with_data` 仍覆盖全部表单。
        - 传 `by`（`day` / `week` / `month`）时响应另带 `buckets`：范围内每个时间段各一份同样结构的统计（没有提交的时间段也返回），周从周一起算，首尾两段按范围裁剪。范围最多覆盖 92 天 / 53 周 / 24 个月，超过返回 400 并提示改用更粗的粒度或去掉 `by`。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - name: from
        in: query
        required: true
        description: 起始日期（含），`YYYY-MM-DD`。缺失或无法解析时返回 400。
        schema:
          type: string
        example: '2026-09-01'
      - name: to
        in: query
        required: false
        description: 结束日期（含），`YYYY-MM-DD`，缺省为今天。早于 `from` 或无法解析时返回 400。
        schema:
          type: string
        example: '2026-09-07'
      - name: kind
        in: query
        required: false
        description: 只统计表单（`form`）或表格（`table`），缺省两者都统计。其他取值返回 400。
        schema:
          type: string
          enum:
          - form
          - table
      - name: by
        in: query
        required: false
        description: 按 `day` / `week` / `month` 拆分统计，响应带 `buckets`；其他取值返回 400。
        schema:
          type: string
          enum:
          - day
          - week
          - month
      - name: limit
        in: query
        required: false
        description: 列表最多返回的表单数，最大 100；缺省 100，传 `by` 时每个时间段缺省 10。超过 100 按 100 处理，小于 1 按缺省处理。
        schema:
          type: integer
      responses:
        '200':
          description: 提交量统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/forms":
    get:
      tags:
      - Forms
      summary: 获取我填写过的表单
      operationId: listMyFilledForms
      description: |
        返回当前用户作为填写者提交过数据的表单（不含快速支付），按最近一次提交时间倒序。这些表单不必是当前用户创建或被共享的；
        每行给出的是当前用户自己的提交次数与最近提交时间，而不是表单的全部数据量。已删除的表单不出现在 `data` 中（`total` 仍计入）。
        - 分页：`next` 为行偏移量，原样回传取下一页；`skip` 与 `next` 不能同时传。每页默认 50 条，可用 `limit` 调整（最大 1000）。
        - 企业 Access Token 没有「当前用户」，调用返回 400。

        OAuth 令牌需要 scope：forms
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: 填写过的表单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFilledFormListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/forms/{form_token}/entries":
    get:
      tags:
      - Entries
      summary: 获取我在某表单提交的数据
      operationId: listMySubmittedEntries
      description: |
        返回当前用户在指定表单中自己提交的数据，按提交时间倒序。表单不必是当前用户创建或被共享的：只返回本人提交的数据，
        且只包含表单对填写者公开的字段（隐藏字段既不返回，也不能用于筛选或搜索）。没有提交过时返回空列表。
        - `fields` 只保留指定的公开字段，未知或非公开的 api_code 直接略过（不报错）。
        - `filters` 语义与数据列表相同，但不能按 `creator_id` 筛选（结果已限定为本人），也不能筛选非公开字段，否则返回 400。
        - `keyword` 只在本人的数据中搜索，不受表单数据量上限限制。
        - 分页：`next` 为行偏移量；`skip` 与 `next` 不能同时传。每页默认 50 条，可用 `limit` 调整（最大 1000）。
        - 企业 Access Token 没有「当前用户」，调用返回 400；表单不存在返回 404。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: 表单 token（`GET /my/forms` 返回的 `token`），也接受 24 位十六进制的表单 id。
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: 只返回指定字段。逗号分隔字符串或数组参数（`fields[]=`），值为字段 api_code；未知或非公开字段被略过。序号始终返回。
        schema:
          type: string
        example: field_1,field_2
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: 本人提交的数据列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubmittedEntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 表单不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_description: Form not found — check the token.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/search":
    get:
      tags:
      - Entries
      summary: 在我提交的数据中搜索
      operationId: searchMySubmittedEntries
      description: |
        用同一个关键字搜索当前用户在各表单中自己提交的数据（只搜索表单对填写者公开的字段），返回每个命中表单的命中数与序号。
        - `keyword` 必填，为空返回 400。
        - 默认搜索当前用户填写过的全部表单（不含快速支付）；`form_tokens` 可限定为其中一部分，不在填写记录中的 token 会被忽略。
          参与搜索的表单超过 20 个时返回 400，需用 `form_tokens` 缩小范围。
        - 没有命中的表单不出现在结果中；某个表单无法搜索时（如关键字过长）该表单返回 `unavailable` 说明，其余表单照常返回。
        - 每个表单最多返回 50 个序号，`matched` 为该表单的实际命中总数。
        - 企业 Access Token 没有「当前用户」，调用返回 400。

        OAuth 令牌需要 scope：read_entries
      parameters:
      - name: keyword
        in: query
        required: true
        description: 搜索关键字（最长 200 字符），在表单公开的可搜索字段中模糊匹配。
        schema:
          type: string
          minLength: 1
      - name: form_tokens
        in: query
        required: false
        description: 只搜索这些表单。逗号分隔的表单 token，或数组参数（`form_tokens[]=`）。
        schema:
          type: string
        example: aBc123,dEf456
      responses:
        '200':
          description: 各表单的命中情况
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/fill/f/{form_token}":
    get:
      tags:
      - Fill
      summary: 读取表单填写页
      operationId: getFillFormPage
      description: |
        按填写链接（`/f/<token>`）读取填写页：标题、说明、要填的字段，以及当前用户此刻能不能提交。
        调用者以拿到链接的填写者身份读取，不要求对表单或表格有任何权限；返回的只有填写页上看得到的内容。
        - `fields` 按填写页顺序列出公开字段，形态同读取表单时的 `fields`；表单视图的列名、说明、必填已按视图设置生效。
        - `status.key` 为 `open` 才能提交；其他取值（如 `not_opened`、`closed`、`password_required`、`unauthorized`、`submission_prevented`、
          `fill_frequency_limited`：当前用户已填满填写页允许的次数）的说明在 `status.message`；未开放或按时间关闭时 `status.open_info` 给出开放时间。
        - `blockers` 列出只有填写者本人在页面上才能完成的要求（验证码、短信验证、微信身份、付款等）；不为空时提交会被拒绝，需在浏览器中填写。
        - `manageable` 只在当前用户本来就能读取背后的表单或表格时返回，给出它的 token 与名称。
        - 企业 Access Token 没有「当前用户」，调用返回 400。

        OAuth 令牌需要 scope：submit_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: 填写链接 `/f/<token>` 中的 token。
        schema:
          type: string
      responses:
        '200':
          description: 填写页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 填写页不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_description: Fill page not found — check the link.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/fill/f/{form_token}/entries":
    post:
      tags:
      - Fill
      summary: 按表单填写页提交数据
      operationId: createFillFormEntry
      description: |
        以当前用户的身份，按填写页提交一条数据，与在页面上点「提交」一致：只接受填写页上可见的字段，按填写页的必填设置校验，
        提交人记为当前用户（会出现在「我提交的」里），表单视图提交的数据记录来自哪个视图。
        - 填写页未开放返回 403，`status` 为原因；`blockers` 不为空返回 422 并列出原因。
        - 字段值不合法返回 422，`errors` 按字段 api_code 给出说明。
        - 每个用户每小时最多提交 30 次，超出返回 429。
        - 企业 Access Token 没有「当前用户」，调用返回 400。

        OAuth 令牌需要 scope：submit_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: 填写链接 `/f/<token>` 中的 token。
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FillEntryRequest'
      responses:
        '201':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillEntryCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: 填写页未开放
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 填写页不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 填写页有 API 代替不了的要求，或字段值不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/fill/v/{view_token}":
