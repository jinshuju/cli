          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSettingSaveOk'
        '400':
          $ref: '#/components/responses/FormSettingBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
