        date_settings:
          type: array
          description: Replaces the check-in times as a whole; an empty list means any time
          items:
            $ref: '#/components/schemas/CheckinDateSetting'
        geo_location:
          description: Sets the location limit; null lifts it
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckinGeoLocation'
      additionalProperties: false
    CheckinCampaignUpdateInput:
      type: object
      title: CheckinCampaignUpdateInput
      description: Request body of PATCH /plugins/checkin/campaigns/{id}; only the keys present are written
      properties:
        enabled:
          type: boolean
          description: false pauses check-in and unbinds it from the form; true turns it back on
        name:
          type: string
          minLength: 1
          description: Campaign name
        display_field_api_code:
          type:
          - string
          - 'null'
          description: Field shown when verifying, not the check-in field; null clears it
        enable_checkin_code:
          type: boolean
          description: After submitting, go on to the check-in code page; registrants show the code on site
        checkin_field_required_unique:
          type: boolean
          description: true makes the check-in field required and unique, so no registrant is left unable to check in
        date_settings:
          type: array
          description: Replaces the check-in times as a whole; an empty list means any time
          items:
            $ref: '#/components/schemas/CheckinDateSetting'
        geo_location:
          description: Sets the location limit; null lifts it
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckinGeoLocation'
      additionalProperties: false
    EvaluationComment:
      type: object
      description: |
        One total-score range comment. A comment written by score range returns start_point / end_point;
        a comment written by conditions in the form editor returns id and conditions instead (no start_point / end_point). Keys whose value is null are omitted
      properties:
        start_point:
          type: number
        end_point:
          type: number
        comment:
          type: string
        retry:
          type: boolean
        id:
          type: string
          description: id of a condition-based comment; pass this id back when updating
        conditions:
          type: array
          description: Conditions of a condition-based comment
          items:
            type: object
            properties:
              trigger:
                type: string
                description: api_code of the condition field
              operator:
                type: string
                description: Comparison operator
              value:
                description: Condition value
              group_index:
                type: integer
    FormEvaluationCommentInput:
      type: object
      description: A range-based comment needs both start_point and end_point; a condition-based comment is passed back by the id it was read with, and only comment / retry can change
      properties:
        id:
          type: string
          description: id of a condition-based comment
        conditions:
          type: array
          description: May be passed back as is; cannot be changed
          items:
            type: object
            properties:
              trigger:
                type: string
              operator:
                type: string
              value:
                description: Condition value
              group_index:
                type: integer
        start_point:
          type: number
        end_point:
          type: number
        comment:
          type: string
        retry:
          type: boolean
    EvaluationSetting:
      type: object
      description: Evaluation settings; an empty object when the form has no evaluation settings record yet. Keys whose value is null are omitted
      properties:
        notice_after_filling_mode:
          type: string
          enum:
          - reports
          - customize
          - none
          description: What to show after submission
        show_report_score:
          type: boolean
          description: Show the total score in the report
        show_report_radar:
          type: boolean
          description: Show the radar chart in the report
        show_indicator_comments:
          type: boolean
          description: Show the dimension comments in the report
        show_comments:
          type: boolean
          description: Show the total-score comments in the report
        need_attention:
          type: string
          description: Instructions shown before the evaluation
        evaluation_comments:
          type: array
          description: Total-score range comments; returned only when they are on
          items:
            $ref: '#/components/schemas/EvaluationComment'
        indicator_setting:
          type: object
          description: Dimension settings; returned only when dimensions exist
          properties:
            indicators_scoring_mode:
              type: string
              enum:
              - summation
              - average
              - customization
              description: How dimensions are scored
            indicators:
              type: array
              items:
                type: object
                properties:
                  api_code:
                    type: string
                    description: Dimension identifier; the dimension score in an entry is stored under indicator_<api_code>
                  name:
                    type: string
                  field_api_codes:
                    type: array
                    items:
                      type: string
                  standard_score:
                    type: number
                    description: Standard score; omitted when null
                  indicator_comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntervalComment'
    EvaluationSettingInput:
      type: object
      description: Request body of PATCH /forms/{form_token}/evaluation_setting; only the keys present are written
      properties:
        notice_after_filling_mode:
          type: string
          enum:
          - reports
          - customize
          - none
          description: Forced to none when the plan does not support evaluation reports
        show_report_score:
          type: boolean
        show_report_radar:
          type: boolean
        show_indicator_comments:
          type: boolean
        show_comments:
          type: boolean
        need_attention:
          type: string
        success_message_rich_text:
          type: string
        evaluation_comments:
          type: array
          description: Replaces the total-score range comments as a whole; an empty array turns range comments off. Ranges must not overlap
          items:
            $ref: '#/components/schemas/FormEvaluationCommentInput'
        indicator_setting:
          type: object
          description: Dimension settings; indicators is replaced as a whole
          properties:
            enabled:
              type: boolean
              default: true
            indicators_scoring_mode:
              type: string
              enum:
              - summation
              - average
              - customization
              default: summation
            indicators:
              type: array
              maxItems: 200
              items:
                type: object
                required:
                - name
                properties:
                  api_code:
                    type: string
                    description: Pass back an existing dimension's api_code to keep its identity; omit it for a new dimension
                  name:
                    type: string
                    maxLength: 20
                  standard_score:
                    type: number
                  field_api_codes:
                    type: array
                    description: api_codes of the bound questions; each must be a visible, scorable question on the form
                    items:
                      type: string
                  field_cids:
                    type: array
                    description: Questions can also be referenced by cid (a number or a string)
                    items:
                      oneOf:
                      - type: string
                      - type: integer
                  indicator_comments:
                    type: array
                    maxItems: 20
                    description: Dimension range comments (retry is not supported)
                    items:
                      type: object
                      properties:
                        start_point:
                          type: number
                        end_point:
                          type: number
                        comment:
                          type: string
                      additionalProperties: false
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    Cooperator:
