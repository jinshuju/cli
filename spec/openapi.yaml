        data:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        next:
          type:
          - integer
          - 'null'
          description: The next page's row offset; null on the last page
    Artifact:
      type: object
      required:
      - id
      - title
      - versions_count
      - latest_version
      - created_conversation_url
      - published_artifact
      properties:
        id:
          type: string
          description: The artifact's id; the share endpoints' path takes it to mean its latest version, `version_id` does not
        title:
          type: string
          description: The latest version's file name
        versions_count:
          type: integer
          description: How many versions it has
        latest_version:
          type: object
          required:
          - id
          - version
          - media_type
          - url
          - banned
          - created_at
          - conversation_url
          - download_url
          properties:
            id:
              type: string
              description: Pass it to the share endpoints to share this version
            version:
              type: integer
            media_type:
              type: string
              description: Its MIME type; only `text/html` has a share link, other types can only be downloaded
            url:
              type: string
              description: Opens this version in Jinshuju, for its owner only
            banned:
              type: boolean
              description: The version was banned for its content and cannot be shared
            created_at:
              type: string
              format: date-time
              description: When this version was delivered; the list is sorted by it
            conversation_url:
              type: string
              description: The Jiri conversation this version was delivered in, the last one to change the artifact
            download_url:
              type:
              - string
              - 'null'
              description: Downloads this version's file; signed, it expires ten minutes after the list was read. Null when the file is gone
        created_conversation_url:
          type: string
          description: The Jiri conversation the artifact was first delivered in
        published_artifact:
          type:
          - object
          - 'null'
          description: Who can open its share link, or null when it was never shared; the link itself comes from the share endpoint
          required:
          - allowed_audience
          - published_version
          properties:
            allowed_audience:
              type: string
              enum:
              - private
              - internal
              - public
            published_version:
              type: object
              description: The version visitors see
              required:
              - id
              - version
              - title
              properties:
                id:
                  type: string
                version:
                  type:
                  - integer
                  - 'null'
                title:
                  type: string
    PublishedArtifactInput:
      title: PublishedArtifactInput
      type: object
      additionalProperties: false
      properties:
        allowed_audience:
          type: string
          enum:
          - private
          - internal
          - public
          description: "`private` only the owner, `internal` members of the account, `public` anyone with the link"
        version_id:
          type: string
          description: Id or token of the version to publish, required unless `allowed_audience` is `private`. The artifact id is not taken here, since its latest version can change before the share is made
    PublishedArtifactError:
      type: object
      required:
      - error_description
      properties:
        error:
          type: string
          enum:
          - not_found
          - version_not_found
          - not_html
          - file_missing
          - invalid_audience
          - share_disabled
          - paid_plan_required
          - internal_unavailable
          - version_banned
          - version_required
          description: Why the share was refused; absent when an account access token is refused
        error_description:
          type: string
          description: Human-readable error description
    PublishedArtifact:
      type: object
      required:
      - allowed_audience
      - url
      - published_version
      - banned
      - can_use_internal
      - account_name
      - can_use_artifact_url
      properties:
        allowed_audience:
          type: string
          enum:
          - private
          - internal
          - public
        url:
          type: string
          description: The share link
        published_version:
          type: object
          description: The version visitors see
          required:
          - id
          - version
          - title
          properties:
            id:
              type: string
            version:
              type:
              - integer
              - 'null'
            title:
              type: string
        banned:
          type: boolean
          description: The published version was banned for its content, so the link opens to no one until another version is published
        can_use_internal:
          type: boolean
          description: The account's plan or trial includes members-only sharing (`artifact_sub_account_audience_only`); without it, `internal` cannot be set
        account_name:
          type:
          - string
          - 'null'
          description: Name of the account the share belongs to, whose members `internal` lets in
        can_use_artifact_url:
          type: boolean
          description: The account's plan or trial includes online links (`artifact_url`); without it, only `private` can be set and the link shows as expired
    Folder:
      type: object
      required:
      - token
      - name
      - kind
      - created_at
      properties:
        token:
          type: string
          description: Folder token
        name:
          type: string
          description: Folder name
        kind:
          type:
          - string
          - 'null'
          enum:
          - form
          - table
          - quickpay
          -
          description: 'Folder kind: `form` holds forms, `table` holds tables; form folders created early on may have null, which is treated as `form`'
        created_at:
          type: string
          format: date-time
          description: Created at (UTC)
    FolderInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: Folder name, cannot be empty
        kind:
          type:
          - string
          - 'null'
          enum:
          - form
          - table
          -
          default: form
          description: Folder kind; a folder holds one kind of content only, and tables go only into `table` folders. Defaults to `form`
      additionalProperties: false
    TemplateUsageInput:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Template token or 24-character hex ID; the `template_id` key also works
        template_id:
          type: string
          description: Alias of `id`
        tags:
          description: Tags for the new form, as an array or a comma-separated string
          oneOf:
          - type: array
            items:
              type: string
          - type: string
        tag_id:
          type: string
          description: ID of the tag to file the new form under
        folder_id:
          type: string
          description: ID of the folder to put the new form in
        scene:
          type: string
          description: Target scene key; falls back to form when the template's fields go beyond what that scene allows
        frm:
          type: string
          description: Source marker; when it starts with `spread` or is `scene_creation_modal`, it affects the recorded created_from
        create_source:
          type: string
          description: Creation source marker (defined by the server implementation)
        group_id:
          type: string
          description: Group parameter appended to `success_url`
        form_app_trial_alert:
          type: boolean
          description: When true, first checks whether the form app bound to the template needs a purchase / trial; if it does, returns 200 with `error`
        confirm_unbind_form_app:
          type: boolean
          description: Confirms unbinding the form app that needs a purchase, then goes on creating the form
        confirm_form_app_trial:
          type: boolean
          description: Confirms starting the form app trial, then goes on creating the form
    Contact:
