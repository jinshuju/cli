              - string
              - 'null'
            max_width:
              type:
              - string
              - 'null'
            border_color:
              type:
              - string
              - 'null'
            border_width:
              type:
              - string
              - 'null'
            shadow:
              type: boolean
            indent_on_large_phone:
              type: boolean
        submit_button:
          type: object
          properties:
            background_color:
              type:
              - string
              - 'null'
            color:
              type:
              - string
              - 'null'
            font_size:
              type:
              - string
              - 'null'
            shadow:
              type: boolean
