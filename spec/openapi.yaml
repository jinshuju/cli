                - create_direct_pay_by_user
                - create_partner_trade_by_buyer
                - trade_create_by_buyer
                - fast_instant_trade_pay
                -
    BillingAccountUsageItem:
      type: object
      description: Quota and usage of one add-on service; when the quota is unlimited, only unit, unlimited and consumed_quota are present
      required:
      - unit
      - consumed_quota
      properties:
        unit:
          type: string
          enum:
          - item
          - mb
          - second
          - cent
          description: Unit of measure
        unlimited:
          type: boolean
          description: true when the quota is unlimited
        total_quota:
          type: integer
          description: Total quota this month (included in the plan + purchased)
        total_balance:
          type: integer
          description: Total remaining quota
        month_balance:
          type: integer
          description: Remaining part of this month's plan-included quota
        consumed_quota:
          type: integer
          description: Consumed this month
    ViewUnprocessableError:
      type: object
      required:
      - error_description
      properties:
        error_description:
          type: string
          description: Error description; multiple validation errors are joined with commas
    FormViewSortRule:
      type: object
      required:
      - api_code
      properties:
        api_code:
          type: string
          description: api_code of the sort field
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Sort direction
    FormViewFilterCondition:
      type: object
      required:
      - field
      - operator
      properties:
        field:
          type: string
          description: Field api_code (api_code / trigger are also accepted as the key name)
        operator:
          type: string
          description: 'Operator, the same as the entry list filters: eq, ne, any_in, none_in, between, not_between, null, not_null, gte, gt, lte, lt, like, not_like, match, within_last; the aliases start / end / equal / not_equal are equivalent to gte / lte / eq / ne respectively. The server decides which subset each field type supports. On choice fields, eq / ne are saved as any_in / none_in and the value is turned into an array.'
        value:
          description: 'Condition value; its type depends on the field and the operator: a two-element array for between; {"unit": "day", "n": 30} for within_last (unit can be minute / day / week / month); on choice fields, pass choice api_codes or choice texts, with "null" meaning not filled in; null / not_null take no value.'
    FormView:
      type: object
      required:
      - token
      - name
      - view_type
      - position
      - predefined
      - visibility
      - view_scope
      - prefer_columns
      - sorted_columns
      - kanban_group_by_api_code
      - kanban_card_title_api_code
      - kanban_group_order
      - kanban_hidden_groups
      - grid_frozen_boundary_api_code
      - sort
      - filter
      - created_at
      - updated_at
      properties:
        token:
          type: string
          description: View token
        name:
          type: string
          description: View name
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: View type; form is a form view (a public fill page, tables only)
        position:
          type: integer
          description: Position in the order of views
        predefined:
          type: boolean
          description: Whether it is a predefined view (cannot be deleted)
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: 'Visibility: cooperators means visible to all cooperators, personal means visible only to the creator'
        view_scope:
          type: string
          enum:
          - user
          - form
          description: What the view belongs to; form means it belongs to the form itself (cannot be deleted, and its visibility cannot be switched)
        prefer_columns:
          type: array
          description: api_codes of the fields shown
          items:
            type: string
        sorted_columns:
          type: array
          description: Column display order, by position ascending
          items:
            type: object
            required:
            - api_code
            - position
            properties:
              api_code:
                type: string
                description: Field api_code
              position:
                type: integer
                description: Column position, starting at 1
        kanban_group_by_api_code:
          type:
          - string
          - 'null'
          description: api_code of the kanban grouping field
        kanban_card_title_api_code:
          type:
          - string
          - 'null'
          description: api_code of the kanban card title field; when not set, the server derives it from prefer_columns
        kanban_group_order:
          type: array
          description: Display order of kanban groups (api_codes of the grouping choices; `__unset__` means no group set)
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: Hidden kanban groups (same values as kanban_group_order)
          items:
            type: string
        grid_frozen_boundary_api_code:
          type:
          - string
          - 'null'
          description: api_code of the field at the frozen-column boundary in a grid view
        sort:
          type: array
          description: Sort rules
          items:
            type: object
            required:
            - api_code
            - order
            properties:
              api_code:
                type: string
                description: api_code of the sort field
              order:
                type: string
                enum:
                - asc
                - desc
                description: Sort direction
        filter:
          type: array
          description: Filters; an empty array when there are none
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        title:
          type:
          - string
          - 'null'
          description: Fill page title (returned for form views only)
        description:
          type:
          - string
          - 'null'
          description: Fill page description (returned for form views only)
        published:
          type: boolean
          description: Whether it is published; the fill link does not work while unpublished (returned for form views only)
        fill_url:
          type: string
          format: uri
          description: Public fill link (returned for form views only)
        fill_items:
          type: array
          description: Fill items checked on the fill page, in fill page order, with their effective values (returned for form views only)
          items:
            $ref: '#/components/schemas/FormViewFillItem'
    FormViewInput:
      type: object
      description: Request body to create / update a view; only the keys present are updated
      properties:
        name:
          type: string
          maxLength: 120
          description: View name, cannot be empty
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: View type, defaults to grid on create; form is a form view (a public fill page), supported by tables only
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: Visibility, defaults to cooperators on create; on update only the creator can switch it
        prefer_columns:
          type: array
          description: api_codes of the fields shown
          items:
            type: string
        kanban_group_by_api_code:
          type: string
          description: api_code of the kanban grouping field; must be a field that supports kanban grouping
        kanban_card_title_api_code:
          type: string
          description: api_code of the kanban card title field
        kanban_group_order:
          type: array
          description: Display order of kanban groups; elements must be non-empty, unique strings
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: Hidden kanban groups; elements must be non-empty, unique strings; an empty array shows all groups
          items:
            type: string
        sort:
          type: array
          description: Sort rules, replaced as a whole
          items:
            $ref: '#/components/schemas/FormViewSortRule'
        sorted_columns:
          type: array
          description: Column display order, replaced as a whole; position is generated from 1 in array order
          items:
            type: object
            required:
            - api_code
            properties:
              api_code:
                type: string
                description: Field api_code
            additionalProperties: false
        filter:
          type: array
          description: Array of filters, replaced as a whole; an empty array clears the filters; returns 422 when it is not an array
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        title:
          type: string
          maxLength: 120
          description: Fill page title, cannot be empty; defaults to the table name on create. Form views (view_type=form) only; on other view types it returns 422.
        description:
          type:
          - string
          - 'null'
          description: Fill page description. Form views (view_type=form) only; on other view types it returns 422.
        published:
          type: boolean
          description: Whether the fill page is published, defaults to false on create. Form views (view_type=form) only; on other view types it returns 422.
        field_overrides:
          type: array
          description: Fill item settings, replaced as a whole; when omitted on create, every fillable column is checked in the current column order. Form views (view_type=form) only; on other view types it returns 422.
          items:
            $ref: '#/components/schemas/FormViewFieldOverrideInput'
        cid:
          type: string
          description: Client identifier, passed through in the real-time change broadcast (defined by the server implementation)
      additionalProperties: false
    EntryCommentMention:
      type: object
      required:
      - user_id
      - user_name
      properties:
        user_id:
          type: string
          description: id of the mentioned user
        user_name:
          type: string
          description: Display name of the mentioned user at the time of the mention
    EntryCommentAttachment:
      type: object
      required:
      - id
      - file_name
      - content_type
      - file_size
      - url
      properties:
        id:
          type: string
          description: Attachment id
        file_name:
          type: string
          description: File name
        content_type:
          type:
          - string
          - 'null'
          description: MIME type
        file_size:
          type: integer
          description: File size in bytes
        url:
          type: string
          description: Download URL (a private link with an expiring signature)
    EntryComment:
      type: object
      description: 'Entry comment. Each comment takes at most 3 attachments, each at most 5 MB; allowed extensions: jpg, jpeg, png, bmp, webp, heic, doc, docx, xls, xlsx, csv, ppt, pptx, pdf, txt, mp4, mov.'
      required:
      - id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Comment id
        content:
          type: string
          description: Comment text, with mentions in the form @[<user_id>]; may be absent when the comment has only attachments
        creator:
          type: object
          description: Commenter; absent when the commenter's info is missing
          required:
          - id
          - name
          properties:
            id:
              type: string
              description: User id
            name:
              type: string
              description: User display name; when the account has been deleted, a placeholder such as `该账户已注销`
        parent_id:
          type: string
          description: id of the comment replied to; absent when not a reply
        created_at:
          type: string
          format: date-time
          description: Created at
        updated_at:
          type: string
          format: date-time
          description: Updated at
        mentions:
          type: array
          description: Mentioned cooperators; absent when there are no mentions
          items:
            $ref: '#/components/schemas/EntryCommentMention'
        attachments:
          type: array
          description: Attachments, by upload time ascending; absent when there are none
          items:
            $ref: '#/components/schemas/EntryCommentAttachment'
    EntryCommentInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
          description: Comment text, cannot be empty once leading and trailing whitespace is trimmed; mention a cooperator with @[<user_id>] (user_id is 24 hex characters)
        parent_id:
          type: string
          description: id of the parent comment being replied to; must belong to the same entry; read on create only
      additionalProperties: false
    OpensearchSearchFieldSetting:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: api_code of the search field; must be a field the form allows searching on
        field_label:
          type:
          - string
          - 'null'
          description: Field label shown to the public; the field's own label is used when empty
        fuzzy:
          type: boolean
          default: false
          description: Whether to use fuzzy matching
        sms_verification:
          type: boolean
          default: false
          description: Whether SMS verification is required (applies to mobile fields only)
    OpensearchSearchFieldRule:
      type: object
      required:
      - search_field_settings
      properties:
        operand:
          type: string
          enum:
          - and
          - or
          default: and
          description: How the search fields within the rule are combined
        search_field_settings:
          type: array
          minItems: 1
          description: Search field settings, cannot be empty
          items:
            $ref: '#/components/schemas/OpensearchSearchFieldSetting'
    OpensearchDisplayFieldRule:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: api_code of the display field; must be a field the form allows displaying
        field_label:
          type:
          - string
          - 'null'
          description: Field label shown to the public; the field's own label is used when empty
        editable:
          type: boolean
          default: false
          description: Whether the searcher can edit this field on the results page
        protected:
          type: boolean
          default: false
          description: Whether privacy protection is on (masked display; applies only to fields that support privacy protection)
        highlight:
          type:
          - object
          - 'null'
          description: Highlight settings; null when not set
          properties:
            color:
              type:
              - string
              - 'null'
              description: Highlight color
            position:
              type: integer
              default: 999
              description: Highlight sort position
    OpensearchQuerySummary:
      type: object
      required:
      - token
      - url
      - name
      - enabled
      - form_token
      - created_at
      - searches_count
      - views_count
      properties:
        token:
          type: string
          description: Public query token
        url:
          type: string
          description: Public URL of the public query (/os/{token}, on the account subdomain or a custom domain)
        name:
          type: string
          description: Name
        enabled:
          type: boolean
          description: Whether it is enabled
        form_token:
          type:
          - string
          - 'null'
          description: Token of the form it belongs to; null when the form has been deleted
        created_at:
          type: string
          format: date-time
          description: Created at
        searches_count:
          type: integer
          description: Total number of searches
        views_count:
          type: integer
          description: Total number of visits
    OpensearchQuery:
      allOf:
      - $ref: '#/components/schemas/OpensearchQuerySummary'
      - type: object
        required:
        - description
        - status
        - search_field_rules
        - display_field_rules
        - messages
        - default_messages
        - search_button
        - allow_to_export_results
        - header
        - updated_at
        properties:
          description:
            type:
            - string
            - 'null'
            description: Description text
          status:
            type: string
            enum:
            - active
            - entries_count_limited
            - form_not_found
            description: 'Status: active means usable; entries_count_limited means the form''s entry count exceeds the plan''s public query limit; form_not_found means the form has been deleted'
          search_field_rules:
            type: array
            description: Search field rules
            items:
              allOf:
              - $ref: '#/components/schemas/OpensearchSearchFieldRule'
              - type: object
                required:
                - operand
          display_field_rules:
            type: array
            description: Display field rules
            items:
              allOf:
              - $ref: '#/components/schemas/OpensearchDisplayFieldRule'
              - type: object
                required:
                - field_label
                - editable
                - protected
                - highlight
          messages:
            type:
            - object
            - 'null'
            description: Saved raw values of the prompt messages; an empty object or null when not customized
            properties:
              has_result:
                type: string
                description: Message shown when results are found
              no_result:
                type: string
                description: Message shown when no results are found
          default_messages:
            type: object
            description: Prompt messages with the product defaults merged in (in the form's language)
            required:
            - has_result
            - no_result
            properties:
              has_result:
                type: string
                description: Message shown when results are found
              no_result:
                type: string
                description: Message shown when no results are found
          search_button:
            type: object
            description: Search button settings; an empty object when not set
            properties:
              text:
                type: string
                description: Button text
              color:
                type: string
                description: Button color
          allow_to_export_results:
            type: boolean
            description: Whether the searcher may export results
          header:
            type: object
            description: Header settings
            required:
            - background_image
            properties:
              background_image:
                type:
                - object
                - 'null'
                description: Header background image; null when not set
                required:
                - attachment_id
                - position_x
                - position_y
                - image_url
                properties:
                  attachment_id:
                    type: string
                    description: Background image attachment id
                  position_x:
                    type:
                    - number
                    - 'null'
                    description: Horizontal position of the background image
                  position_y:
                    type:
                    - number
                    - 'null'
                    description: Vertical position of the background image
                  image_url:
                    type:
                    - string
                    - 'null'
                    description: Background image URL
          updated_at:
            type: string
            format: date-time
            description: Updated at
    OpensearchQueryInput:
      type: object
      description: Request body to create / update a public query; only the keys present are updated
      properties:
        form_token:
          type: string
          description: 'Used on create only: token of the form the query belongs to (can also be passed as a query parameter)'
        name:
          type: string
          description: Name, cannot be empty
        description:
          type: string
          description: Description text
        enabled:
          type: boolean
          description: Whether it is enabled
        search_field_rules:
          type: array
          minItems: 1
          description: Search field rules, replaced as a whole; when given, cannot be an empty array, and each rule's search_field_settings cannot be empty
          items:
            $ref: '#/components/schemas/OpensearchSearchFieldRule'
        display_field_rules:
          type: array
          minItems: 1
          description: Display field rules, replaced as a whole; when given, cannot be an empty array
          items:
            $ref: '#/components/schemas/OpensearchDisplayFieldRule'
        search_button:
          type: object
          description: Search button settings; only text and color are read
          properties:
            text:
              type: string
              description: Button text
            color:
              type: string
              description: Button color
          additionalProperties: false
        messages:
          type: object
          description: Prompt messages; only has_result and no_result are read; missing keys use the product defaults
          properties:
            has_result:
              type: string
              description: Message shown when results are found
            no_result:
              type: string
              description: Message shown when no results are found
          additionalProperties: false
        allow_to_export_results:
          type: boolean
          description: Whether the searcher may export results
        header:
          type: object
          description: Header settings; only attachment_id, image_upload_token, position_x and position_y of background_image are read (defined by the server implementation)
          properties:
            background_image:
              type: object
              properties:
                attachment_id:
                  type: string
                  description: Background image attachment id, returned by "Upload a form image" (`POST /form_image_attachments`, `image_type=opensearch_header`)
                image_upload_token:
                  type: string
                  description: 'Instead of attachment_id: after uploading with a `form_image_token` (purpose opensearch_header), pass that token directly. The token must be uploaded, unexpired, owned by the caller and have the purpose opensearch_header; otherwise returns 400'
                position_x:
                  type: number
                  description: Horizontal position of the background image
                position_y:
                  type: number
                  description: Vertical position of the background image
              additionalProperties: false
          additionalProperties: false
        extra_configurable_setting:
          type: object
          description: Extra settings (defined by the server implementation)
          properties:
            show_exam_correct_answer:
              type: boolean
              description: Whether to show the correct exam answers
            show_exam_explanation:
              type: boolean
              description: Whether to show the exam explanations
          additionalProperties: false
        scope_conditions:
          type: array
          description: Conditions that limit which entries can be searched; require plan support, otherwise returns 400; only trigger, operator, value, group_index and scope_attr are read from each item
          items:
            type: object
            properties:
              trigger:
                type: string
                description: api_code of the trigger field
              operator:
                type: string
                description: Operator (defined by the server implementation)
              value:
                description: Condition value
              group_index:
                type: integer
                description: Condition group index; conditions in the same group are combined with and, different groups with or
              scope_attr:
                type: string
                description: Attribute the condition applies to (defined by the server implementation)
