  "/forms/{form_token}/webhook":
    post:
      tags:
      - Form Settings
      summary: 设置 Webhook
      description: |
        设置表单的数据推送地址 `entry_post_url`，并同时开启新数据推送（post_new_entry = true）。
        OAuth 令牌需要 scope：form_setting。
        需要套餐支持 Webhook，否则返回 402 且响应体为空。
        服务端不检查保存结果，直接回显设置中的 `entry_post_url`（URL 格式不合法时是否已持久化以服务端实现为准）。
      operationId: createFormWebhook
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: 当前的推送地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormWebhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: 套餐不支持 API v1 访问（返回 error_description），或套餐不支持 Webhook（响应体为空）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_description:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Form Settings
      summary: 删除 Webhook
      description: |
        移除表单设置中的 `entry_post_url`。成功返回 200，响应体为空。
