          type: string
          format: date-time
          description: When it was sent (UTC)
      examples:
      - serial_number: 36
        mobile: '13800000001'
        status: SUCCESS
        error:
        created_at: '2026-10-20T08:00:03Z'
    EmailTaskActivity:
