        The caller reads it as a submitter holding the link and needs no permission on the form or table; only what the fill page shows is returned.
        - Submit through the API only when `status.key` is `open` and `blockers` is empty; otherwise `status.message` says why, and a non-empty `blockers` means the page must be filled in a browser.
        - An account access token has no "current user"; calling with one returns 400.

        OAuth scope: submit_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: The token in the fill link `/f/<token>`.
        schema:
          type: string
      responses:
        '200':
          description: Fill page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The fill page does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
