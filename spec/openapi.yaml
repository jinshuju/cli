          - appreciation
          - grade
          - explaination
          - none
          - answer
          description: What to show after the exam is handed in
        show_timeout:
          type: boolean
          description: Whether the exam is timed
        limited_time:
          type: integer
          description: Time limit in minutes
        need_attention:
          type: string
          description: Instructions shown before the exam
        interval_comments:
          type: array
          description: Score-range comments; returned only when score-range comments are on
          items:
            $ref: '#/components/schemas/IntervalComment'
    ExamSettingInput:
      type: object
      description: Request body of PATCH /forms/{form_token}/exam_setting; only the keys present are written
      properties:
        notice_after_filling_mode:
          type: string
          enum:
          - appreciation
          - grade
          - explaination
          - none
          - answer
          description: Forced to none when the plan does not support showing scores
        show_timeout:
          type: boolean
          description: 'Turns on the exam time limit. Mutually exclusive with required on exam question fields: passing true returns 400 when the form already has a required question; once on, question fields can no longer be set as required (required on examinee info fields is unaffected)'
        limited_time:
          type: integer
          minimum: 1
          maximum: 9999
          description: Time limit in minutes
        need_attention:
          type: string
        success_message_rich_text:
          type: string
          description: Rich-text message shown after the exam is handed in; written only when the plan supports showing scores
        interval_comments:
          type: array
          description: Replaces the score-range comments as a whole; ranges must not overlap. Takes effect only when notice_after_filling_mode is grade / explaination / answer; an empty array is ignored
          items:
            $ref: '#/components/schemas/FormIntervalCommentInput'
      additionalProperties: false
    CheckinDateSetting:
      type: object
      description: A date range check-in is open in. Check-in works on the days within the range that fall on `periods`, inside the duration. For several durations, pass several date_settings
      required:
      - start_date
      - end_date
      - periods
      - durations
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        periods:
          type: array
          minItems: 1
          description: Weekdays check-in is open on; list all seven for every day
          items:
            type: string
            enum:
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            - Sunday
        durations:
          type: array
          minItems: 1
          maxItems: 1
          description: The time of day check-in is open; exactly one
          items:
            type: object
            required:
            - start
            - end
            properties:
              start:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                description: Start time, HH:MM
              end:
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                description: End time, HH:MM
            additionalProperties: false
      additionalProperties: false
    CheckinGeoLocation:
      type: object
      description: Location limit; check-in works only within `range` meters of the coordinates
      required:
      - longitude
      - latitude
      - range
      properties:
        location_name:
          type: string
        address:
          type: string
        longitude:
          type: number
        latitude:
