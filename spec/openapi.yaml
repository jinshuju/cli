    LikertFieldInput:
      type: object
      title: LikertFieldInput
      description: LikertField field
      additionalProperties: false
      required:
      - type
      - label
      properties:
        type:
          const: LikertField
        label:
          type: string
          description: Field label
        cid:
          type: string
          description: Temporary id within this request, for formulas and the like to refer to
        notes:
          type: string
          description: Field notes
        private:
          type: boolean
          description: 'Hidden field: fillers do not see it, it is not checked for required, and an exam or evaluation does not score it'
        required:
          type: boolean
          description: Required
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        choices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChoiceInput'
          description: Choices
        statements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StatementInput'
          description: Statements
        horizontal_on_mobile:
          type: boolean
          description: Lay out horizontally on mobile
        likert_choice_style:
          type: string
          enum:
          - single
          - multiple
          description: One choice (single) or several (multiple) per statement
        minimum_length:
          type: integer
          minimum: 0
          description: Minimum number of choices; for a LikertField with likert_choice_style=multiple, the minimum per statement
        maximum_length:
          type: integer
          minimum: 0
          description: Maximum number of choices; for a LikertField with likert_choice_style=multiple, the maximum per statement
        calculable:
          type: boolean
          description: Give each choice a numeric value; when on, every (leaf) choice must carry operand_value
      allOf:
      - description: minimum_length / maximum_length apply only when likert_choice_style=multiple
        if:
          not:
            properties:
              likert_choice_style:
                const: multiple
            required:
            - likert_choice_style
        then:
          not:
            anyOf:
            - required:
              - minimum_length
            - required:
              - maximum_length
      - description: With calculable=true, every choice needs an operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
