                serial_numbers:
                  type: array
                  description: Serial numbers of some matching entries, at most 50
                  items:
                    type: integer
                folder_token:
                  type:
                  - string
                  - 'null'
                  description: Token of the folder the current identity put this form in (for an account token, the account owner's); null when the form is not in a folder
            - $ref: '#/components/schemas/EntryFormUnavailable'
