          - string
          - 'null'
          description: Record description, generated per record type (such as the name of the plan purchased, the number of SMS messages, the number of members); null when there is none
        amount:
          type:
          - number
          - 'null'
          description: Amount, in yuan (CNY) to 2 decimal places; positive for top-ups, negative for spending
        balance:
          type:
          - number
          - 'null'
          description: Account balance after this record, in yuan (CNY) to 2 decimal places
      examples:
      - id: 65f1c2a3b4c5d6e7f8a9b0c1
        created_at: '2024-03-13T17:20:11+08:00'
        verb: sms_charge
        description: 购买短信
        amount: -100.0
        balance: 900.0
    BillingAccountBalance:
      type: object
      description: Account balance and the remaining amount of each quota (plan + purchased)
      required:
      - amount
      - entry_quota
      - sms_count
      - ai_points_count
      - active_mail_count
      - storage_quota_count
      - audio_quota_count
      - entry_transaction_quota_count
      properties:
        amount:
          type:
          - number
          - 'null'
          description: Account balance, in yuan (CNY) to 2 decimal places
        entry_quota:
          type: integer
          description: Entries remaining this month
        sms_count:
          type: integer
          description: SMS messages remaining
        ai_points_count:
          type: integer
          description: AI points remaining
        active_mail_count:
          type: integer
          description: Emails remaining
        storage_quota_count:
          type: number
          description: Attachment storage remaining (MB, may be fractional)
        audio_quota_count:
          type: integer
          description: Voice time remaining (minutes, rounded from seconds)
        entry_transaction_quota_count:
          type:
          - number
          - string
          description: Payment collection quota remaining, in yuan (CNY) to 2 decimal places; the string `无限额` when the plan has no limit
      examples:
      - amount: 900.0
        entry_quota: 9800
        sms_count: 1200
        ai_points_count: 500
        active_mail_count: 300
        storage_quota_count: 2048
        audio_quota_count: 60
        entry_transaction_quota_count: 无限额
    BillingAccountPaymentStatistics:
      type: object
      description: Summary of the records returned in this response
      required:
      - total_consumption
      - total_recharge
      - verb_distribution
      properties:
        total_consumption:
          type: number
          description: Total spending, in yuan (CNY), as a positive number
        total_recharge:
          type: number
          description: Total top-ups, in yuan (CNY)
        verb_distribution:
          type: object
          description: Record count per type, keyed by `verb`
          additionalProperties:
            type: integer
      examples:
      - total_consumption: 200.0
        total_recharge: 1000.0
        verb_distribution:
          charge: 1
          sms_charge: 2
    BillingAccountPaymentHistoriesResponse:
      type: object
      required:
      - payment_history
      properties:
        payment_history:
          type: object
          required:
          - total_records
          - returned_records
          - records
          properties:
            total_records:
              type: integer
              description: Total records matching the conditions
            returned_records:
              type: integer
              description: Number returned this time
            records:
              type: array
              description: Latest first
              items:
                $ref: '#/components/schemas/BillingAccountPaymentHistory'
        current_balance:
          $ref: '#/components/schemas/BillingAccountBalance'
          description: Present only when `include_balance=true`
        statistics:
          $ref: '#/components/schemas/BillingAccountPaymentStatistics'
          description: Present only when this response returns records
    RelationFieldInput:
      type: object
      title: RelationFieldInput
      description: RelationField field
      additionalProperties: false
      required:
      - type
      - label
      properties:
        type:
          const: RelationField
        label:
          type: string
          description: Field label
        cid:
          type: string
          description: Temporary id within this request, for formulas and the like to refer to
        notes:
          type: string
          description: Field notes
        private:
          type: boolean
          description: Hidden field; a hidden field is not checked for required
        required:
          type: boolean
          description: Required
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        related_form_token:
          type: string
          description: Token of the related table; must be another table, and you need manage permission on it
        paired:
          type: boolean
          description: Two-way relation, on by default; when on, a reverse column is created in the related table
        related_label:
          type: string
          description: Name of the reverse column, used only when the reverse column is created; defaults to the name of this table
    GoodsItemUpdateInput:
      type: object
      title: GoodsItemUpdateInput
      additionalProperties: false
      description: A goods item; one with api_code is an existing item and keeps whatever it leaves out
      properties:
        name:
          type: string
          description: Goods name
        layout:
          type: string
          enum:
          - without_images
          - price_only
          - images
          - text_options
          description: Layout
        api_code:
          type: string
          description: Keeps the identity of the item on edit; when left out, an existing item is matched by name
        description:
          type: string
          description: Goods description
        position:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        price:
          type: number
          minimum: 0
        original_price:
          type: number
          minimum: 0
          description: Original price, shown struck through
        predefined_number:
          type: integer
          minimum: 0
          description: Default quantity
        fixed_number:
          type: boolean
          description: The quantity cannot be changed
        inventory:
          type: integer
          minimum: 0
          description: Stock; with specifications, set it on each sku instead
        inventory_reset:
          type: boolean
        min_purchase_quantity:
          type: integer
          minimum: 0
        max_purchase_quantity:
          type: integer
          minimum: 0
        dimensions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - options
            properties:
              api_code:
                type: string
                description: Keeps the identity on edit
              label:
                type: string
                description: Dimension name, such as `尺寸`
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - label
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                      description: Generated when left out; customized marks a custom amount option
          description: Specification dimensions
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - specification
            properties:
              specification:
                type: object
                additionalProperties:
                  type: string
                description: Keyed by dimension api_code or name; each value is an option value or name
              price:
                type: number
                minimum: 0
              original_price:
                type: number
                minimum: 0
              inventory:
                type: integer
                minimum: 0
              inventory_reset:
                type: boolean
              min_purchase_quantity:
                type: integer
                minimum: 0
              max_purchase_quantity:
                type: integer
                minimum: 0
          description: Specification combinations; specification must name one option for every dimension
        image_urls:
          type: array
          items:
            type: string
            format: uri
          description: Goods image URLs for layout=images
        image_base64s:
          type: array
          items:
            type: string
          description: Base64 goods images for layout=images
      dependentRequired:
        dimensions:
        - skus
        skus:
        - dimensions
      if:
        not:
          required:
          - api_code
      then:
        required:
        - name
        - layout
        allOf:
        - description: The price_only / text_options layouts require specifications
          if:
            properties:
              layout:
                enum:
                - price_only
                - text_options
          then:
            required:
            - dimensions
            - skus
        - description: The images layout needs at least one image
          if:
            properties:
              layout:
                const: images
          then:
            anyOf:
            - required:
              - image_urls
              properties:
                image_urls:
                  minItems: 1
            - required:
              - image_base64s
              properties:
                image_base64s:
                  minItems: 1
