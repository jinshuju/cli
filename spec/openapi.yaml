  "/forms/{form_token}/copy":
    post:
      tags:
      - Forms
      summary: Copy a form
      description: |
        Copies the form and returns the new form (same shape as GET /forms/{form_token}). The new form's creator is the calling user (the account owner for an account token).
        OAuth scope: forms
        - When the source form allows public copying (can_duplicated_in_public), the caller needs no access to the source form; otherwise a caller without access gets 404.
        - Returns 403 when the source form is frozen or its creator's account is disabled, with body `{ "errors": ..., "status_code": "form_forbidden" }` (not the common error shape).
        - `folder_token` takes a folder token or id; returns 404 when the folder does not exist or the caller lacks manage permission on it.
        - Returns 400 when copying fails (model validation does not pass).
      operationId: copyForm
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFormInput'
      responses:
        '200':
          description: The new form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Insufficient OAuth scope (error_description shape), or the source form or its creator is frozen (errors + status_code shape)
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
                - $ref: '#/components/schemas/FormFrozenError'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/folder":
    patch:
      tags:
      - Forms
      summary: Move a form into a folder
      description: |
        Moves the form into a folder, or out of one (pass null as `folder_token`); PUT is accepted too. The move affects only the calling user's folder placement.
        OAuth scope: forms
        - The request body must contain the `folder_token` key (its value may be null); otherwise 400.
        - `folder_token` takes only a folder token (not an id); returns 404 when the folder does not exist or the current user lacks manage permission on it.
        - The folder type (form / table) must match the form's type; otherwise 400.
        - To move a table, use `PATCH /tables/{table_token}/folder`.
      operationId: moveFormToFolder
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormFolderMoveInput'
      responses:
        '200':
          description: Move result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFolderMoveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/weixin_oauth_session":
    post:
      tags:
      - Forms
      summary: Exchange a WeChat authorization code for an openid
      description: |
        Exchanges the `code` returned by WeChat web authorization for the user's openid, through the WeChat Official Account the form has selected.
        When the form's WeChat authorization scope is userinfo, also returns `unionid` (when WeChat returns one) and `profile`.
        OAuth scope: write_entries
        - Returns 400 when the form has no WeChat Official Account configured or that account does not exist; returns 400 when `code` is missing.
        - Returns 502 when the exchange fails on the WeChat side (invalid code, etc.) or fetching the user info fails.
      operationId: createWeixinOauthSession
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormWeixinOauthSessionInput'
      responses:
        '200':
          description: Authorization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormWeixinOauthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The WeChat OAuth or user info call failed
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: The errmsg returned by WeChat, or "WeChat OAuth failed" / "WeChat userinfo failed"
  "/forms/{form_token}/views":
    get:
      tags:
      - Views
      summary: List a form's views
      description: 'Returns the views the caller can see on the form: views they created, and views whose visibility other cooperators set to cooperators; other users'' personal views are not returned. The order follows the caller''s own saved view order; views not in it are appended by position, then created_at. OAuth scope: forms'
      operationId: listFormViews
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: List of views
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: Number of views returned
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Views
      summary: Create a view on a form
      description: 'Creates a new view on the form, created by the caller; visibility defaults to cooperators when not passed, and position is the highest position among the currently visible views plus 1. Each user can have at most 100 views on one form; at the limit, returns 422 (View limit reached). When view_type is kanban and kanban_group_by_api_code is not passed, the server picks the grouping field; when kanban_hidden_groups is not passed, the __unset__ group is hidden by default; when prefer_columns is empty, the form''s default columns are used (at most 5 columns for a kanban view, serial_number included). Returns 422 when filter is invalid (not an array, unknown field, unsupported operator, invalid value). Returns 422 when model validation fails (e.g. name is empty or longer than 120 characters, or the grouping field does not support kanban grouping). Form views (view_type form): supported only on tables, otherwise 422; title defaults to the table name; without field_overrides, all fillable columns are selected in the current column order; published defaults to false (the fill link does not work while unpublished). title / description / published / field_overrides apply only to form views; using them on another type returns 422. Creating, updating or deleting a form view (including switching a view to or from a form view) requires the caller to hold a predefined role on the table that can add entries, otherwise 403; an account token is exempt. Returns 422 when a fill item''s column does not exist, cannot be a fill item, or sets a validation its column type does not support; the error message names the column''s api_code. OAuth scope: forms'
      operationId: createFormView
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FormViewInput'
              - type: object
                required:
                - name
      responses:
        '201':
          description: Created; returns the view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
  "/forms/{form_token}/views/{view_token}":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    - name: view_token
      in: path
      required: true
      description: View token
      schema:
        type: string
    get:
      tags:
      - Views
      summary: Show a view of a form
      description: 'Returns one view. Only views visible to the caller can be read (created by the caller or visible to cooperators); another user''s personal view returns 404 (View cannot be found). OAuth scope: forms'
      operationId: getFormView
      responses:
        '200':
          description: View details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Views
      summary: Update a view of a form
      description: 'Updates the view''s configuration; PUT is accepted too. Only the keys present in the request are updated: an empty array for filter clears the filters, and leaving filter out keeps them unchanged; when kanban_group_by_api_code changes and kanban_group_order / kanban_hidden_groups are not passed with it, those two lists reset to their defaults. Cooperators can change the configuration of a view visible to cooperators, but only the view''s creator can switch visibility, otherwise returns 403; a view whose view_scope is form cannot switch visibility. Returns 422 when filter is invalid or model validation fails. field_overrides replaces the fill item settings as a whole; form views have the same permission requirements and parameter limits as on create. OAuth scope: forms'
      operationId: updateFormView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormViewInput'
      responses:
        '200':
          description: Updated; returns the view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
    delete:
      tags:
      - Views
      summary: Delete a view of a form
      description: 'Deletes a view. Predefined views (predefined) and views whose view_scope is form cannot be deleted, and the deletion is also refused when it would leave the caller with no visible view; all of these return 422. Deleting a form view needs the same permission as creating one (otherwise 403); once it is deleted, its fill link stops working immediately, and this cannot be undone. OAuth scope: forms'
      operationId: deleteFormView
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: Token of the deleted view
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewUnprocessableError'
  "/forms/{form_token}/views/{view_token}/entries":
    get:
      tags:
      - Views
      summary: List a view's entries
      description: 'Returns the form''s entries under the view''s filters and sort rules, at most 50 per page. The returned fields are limited to those in the view''s prefer_columns (serial_number always included); when prefer_columns is empty, all pushable fields are returned. Sorting follows the view''s sort rules, with serial_number ascending appended when they do not include serial_number. Paginate with the next parameter (a row offset); next is null on the last page. Returns 400 when the view''s filters use an operator the query engine does not support. Only views visible to the caller are accessible, otherwise 404 (View cannot be found). OAuth scope: read_entries'
      operationId: listFormViewEntries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - name: view_token
        in: path
        required: true
        description: View token
        schema:
          type: string
      - name: next
        in: query
        required: false
        description: The next value from the previous page's response (a row offset, starting at 0); a negative value is treated as 0
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      responses:
        '200':
          description: Entry list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/entry_attachments":
    post:
      tags:
      - Uploads
      summary: Upload an entry attachment
      operationId: uploadEntryAttachment
      security:
      - {}
      - bearerAuth: []
      description: |
        Uploads a file ahead of time for a form's attachment field (or an attachment column in a table field) and returns the attachment ID; then, when creating / updating an entry, put that ID (or the upload token) into the matching field to bind it. An uploaded attachment that no entry references stays unused.
        Authenticate in one of two ways:
        1. Regular API credentials (a Bearer token).
        2. A one-time upload token `attachment_token` (instead of regular credentials): the token starts with `entry_att_tok_`, is valid for 30 minutes, can be used only once, and is bound to the form, field, column and file metadata. When the request carries `attachment_token`, regular credentials are not checked and the request acts as the token's user; returns 400 `attachment_token is invalid or expired; prepare upload again` when the token is invalid, expired, already used, its user has been deleted, or it does not match the requested form / field / column; also returns 400 when the uploaded file's name, Content-Type or byte size does not match the token.
        Returns 401 when there are neither credentials nor `attachment_token`.
        Send the file content in one of two ways: the `file` field of `multipart/form-data`; or a Base64 string in the `base64` (or `data`) field of a JSON / form-encoded body (a `data:<mime>;base64,` prefix is allowed), with `file_name` (or `filename`) and `content_type`. Base64 content cannot exceed 5 MB once decoded; larger returns 400 `attachment exceeds 5MB limit`, and a decoding failure returns 400 `base64 is invalid`; returns 400 `file or base64 is required` when neither is given.
        `field_api_code` must point to an attachment field or a table field; for a table field, `dimension_api_code` must also be passed and point to an attachment column in that table field, otherwise returns 400; returns 404 when the field or column does not exist.
        The file size is capped by the per-file limit set on the field (or column); a larger file returns 422, with the specific validation message in `error_description` (e.g. `文件超过了10 MB`); returns 422 `上传失败，请重试` when uploading to object storage fails (the server's wording is authoritative).
        Returns 404 `form cannot be found` when the form does not exist or is not accessible to the current identity.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - field_api_code
              properties:
                field_api_code:
                  type: string
                  description: api_code of the attachment field; for an attachment column in a table field, pass the table field's api_code
                dimension_api_code:
                  type: string
                  description: api_code of the attachment column in a table field; required when `field_api_code` is a table field
                attachment_token:
                  type: string
                  description: One-time upload token, starting with `entry_att_tok_`; when passed, it replaces the regular credentials
                file:
                  type: string
                  description: The file to upload; pass either this or `base64`
                  contentMediaType: application/octet-stream
                base64:
                  type: string
                  description: The file content as a Base64 string, optionally with a data URI prefix; pass either this or `file`
                data:
                  type: string
                  description: Alias of `base64`
                file_name:
                  type: string
                  description: File name for a Base64 upload; defaults to `attachment`
                filename:
                  type: string
                  description: Alias of `file_name`
                content_type:
                  type: string
                  description: MIME type for a Base64 upload; defaults to the one in the data URI prefix, otherwise `application/octet-stream`
              additionalProperties: false
          application/json:
            schema:
              $ref: '#/components/schemas/EntryAttachmentBase64Input'
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedEntryAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The attachment failed validation (for example, it exceeds the field's per-file size limit) or could not be stored
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: Why validation failed
  "/forms/{form_token}/import_files":
    post:
      tags:
      - Uploads
      summary: Upload an import file
      operationId: uploadImportFile
      security:
      - {}
      - bearerAuth: []
      description: |
        Uploads a spreadsheet file (`.xlsx` / `.xls` / `.csv`) for bulk-importing entries into the given form, and returns the import attachment ID; then pass it as `attachment_id` to "Import entries from an uploaded spreadsheet" (`POST /forms/{form_token}/entry_imports`) to start the import.
        Authenticate in one of two ways:
        1. Regular API credentials (a Bearer token).
        2. A one-time upload token `import_file_token` (instead of regular credentials): the token starts with `import_file_tok_`, is valid for 30 minutes, can be used only once, and is bound to the form and the file metadata. When the request carries `import_file_token`, regular credentials are not checked, and the request acts as the user the token belongs to; the uploaded file's original file name, Content-Type and byte size must match what the token recorded, otherwise returns 400. Returns 400 `import_file_token is invalid or expired; prepare upload again` when the token does not exist, has expired, has been used, or its user has been deleted; returns 400 `import_file_token was issued for another form; prepare upload again` when the token belongs to another form.
        Returns 401 when there are neither credentials nor an `import_file_token`.
        The request must be `multipart/form-data`, with the file in the `file` field; a missing file returns 400 `file is required`.
        The file size is capped by the plan's Excel import limit (in MB), and the extension must be xls / xlsx / csv; otherwise returns 422, with the validation details in `error_description` (with an upload token, the token stays usable, so the file can be uploaded again).
        Returns 404 `form cannot be found` when the form does not exist or is not accessible to the current caller.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                import_file_token:
                  type: string
                  description: One-time upload token, starting with `import_file_tok_`; when passed, it replaces the regular credentials
                file:
                  type: string
                  description: The xlsx / xls / csv file to import; with an upload token, its file name, Content-Type and size must match what the token recorded
                  contentMediaType: application/octet-stream
              additionalProperties: false
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedImportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The file failed validation (it exceeds the plan's import limit, or its extension is not supported)
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: Why validation failed
  "/forms/{form_token}/entry_imports":
    post:
      tags:
      - Entries
      summary: Import entries from an uploaded spreadsheet
      operationId: createEntryImport
      description: |
        Appends each row of a spreadsheet uploaded with "Upload an import file" as an entry of this form. Upload the file first to get the import attachment ID (`attachment_id`), then say here which column goes into which field.
        Problems that can be detected up front, such as the file, the plan's import limit, the header row and the column mapping, are checked before the job is created; a rejected import writes no entries. Error messages include the spreadsheet's actual layout (row and column range, and the header contents), so the request can be fixed and retried.
        Once validation passes, returns `201` and the entries are written in the background: `201` means the job has started, not finished; poll "Show an entry import job" for the result.
        - `attachment_id` must be an import file the current user uploaded for this form, otherwise returns 400 (the file cannot be found; upload it again); returns 400 when the file is not xls / xlsx / csv or cannot be read.
        - `columns` must not be empty; each item names the target field with `field_api_code`, and the source column with `column_label` (the header text, which must exactly match the header cell after trimming leading and trailing spaces) or `sheet_column_index` (the column number); when both are given, `sheet_column_index` wins.
        - The field must be one this form can import into; one field cannot map to several columns; when several header columns share a name, use `sheet_column_index` instead; the column number must be within the spreadsheet's column range.
        - `header_row_index` defaults to the first row of the spreadsheet, and there must be data rows below it.
        - Every required field of the form must have a column, otherwise returns 400 listing the missing fields.
        - `unique_field_code` names a field to deduplicate on: when a row's value for that field already exists in the form's entries, the row is skipped (counted in `skip_count`).
        - Returns 404 `form cannot be found` when the form does not exist or is not accessible to the current caller.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryImportInput'
      responses:
        '201':
          description: Import job created; entries are written in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryImportCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entry_imports/{id}":
    get:
      tags:
      - Entries
      summary: Show an entry import job
      operationId: getEntryImport
      description: |
        Returns the progress and result of an entry import job. While `status` is `pending` / `running`, the job is still in progress, and `processed_rows` and `total_rows` can be used to show progress;
        `success` / `failed` / `cancelled` are final states; `imported_count` / `skip_count` / `invalid_count` are the numbers of rows written, skipped and failing validation, `warnings` holds per-row notices, and `error_message` is why the job failed.
        A job can be read only through the form it imports into: when the id does not exist, is not a valid id, or belongs to another form, returns 404 `Import job not found for this form — check the id, and that it belongs to this form.`.
        Returns 404 `form cannot be found` when the form does not exist or is not accessible to the current caller.

        OAuth scope: write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/EntryImportId'
      responses:
        '200':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/form_image_attachments":
    post:
      tags:
      - Uploads
      summary: Upload a form image
      operationId: uploadFormImage
      security:
      - {}
      - bearerAuth: []
      description: |
        Uploads an image that belongs to the form itself (a picture choice image, a header image, a background image, one frame of the header carousel, the header image of the form's public query page, or an inline image in the form description / a field description), and returns the image attachment ID. The image is not bound to any form yet; it takes effect only when a form or theme references it later.
        Authenticate in one of two ways:
        1. Regular API credentials (a Bearer token). `image_type` must then say what the image is for, and can only be `header` (header image), `wallpaper` (background image), `opensearch_header` (public query page header image) or `description` (inline description image): pass the returned `attachment_id` to `header.header_image_attachment_id` / `wallpaper.background_image_attachment_id` of "Update a form's theme", or to `header.background_image.attachment_id` of "Update a public query"; `description` also returns the image address `url`, which goes into the `<img src>` of the form `description` or of a field's `notes`. When the form is saved, the image belongs to that form (at most 30 per form); images not used by any form within 7 days are cleaned up. Returns 400 `image_type must be one of: field_choice, header, wallpaper, carousel, opensearch_header, description.` when `image_type` is missing or not one of `field_choice` / `header` / `wallpaper` / `carousel` / `opensearch_header` / `description`; `field_choice` / `carousel` have nowhere that accepts an attachment ID, so they can only be uploaded with an upload token, otherwise returns 400.
        2. A one-time upload token `form_image_token` (instead of regular credentials): the token starts with `form_img_tok_`, is valid for 30 minutes, can be used only once, and has already recorded the image purpose (`field_choice` / `header` / `wallpaper` / `carousel` / `opensearch_header` / `description`; `image_type` is then ignored) and the file metadata; the uploaded file's original file name, Content-Type and byte size must match what the token recorded, otherwise returns 400. After a successful upload, do not use the returned `attachment_id` directly; instead reference the same token in a choice's `image_upload_token` in "Create a form" / "Edit a form", in `header.header_image_upload_token` / `wallpaper.background_image_upload_token` / `header.carousel_images[].image_upload_token` of "Update a form's theme", or in `header.background_image.image_upload_token` of "Update a public query"; for the `description` purpose nothing references the token, so use the returned `url` directly. Returns 400 `form_image_token is invalid or expired; prepare upload again` when the token does not exist, has expired, has been used, or its user has been deleted.
        Returns 401 when there are neither credentials nor a `form_image_token`. The request must be `multipart/form-data`, with the image binary in the `file` field; a missing file returns 400 `file is required`.

        OAuth scope: forms when `image_type` (or the purpose the token recorded) is field_choice, opensearch_header or description; form_setting otherwise
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                image_type:
                  type: string
                  enum:
                  - field_choice
                  - header
                  - wallpaper
                  - carousel
                  - opensearch_header
                  - description
                  description: What the image is for; without an upload token it is required and can only be header / wallpaper / opensearch_header / description; ignored with an upload token
                form_image_token:
                  type: string
                  description: One-time upload token, starting with `form_img_tok_`; when passed, it replaces the regular credentials
                file:
                  type: string
                  description: The image file; with an upload token, its file name, Content-Type and size must match what the token recorded
                  contentMediaType: application/octet-stream
              additionalProperties: false
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFormImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
