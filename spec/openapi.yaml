openapi: 3.1.0
info:
  title: Jinshuju API v1
  version: '1.0'
  description: |
    Jinshuju open API v1, for reading and writing forms, tables, entries, views, comments, public queries and other resources.
    For the product-side documentation see [Jinshuju Open Platform](https://open.jinshuju.net/api_v1).

    ## Request conventions
    - Base URL: `https://jinshuju.net/api/v1`; every path is relative to it.
    - Request headers: `Content-Type: application/json`, `Accept: application/json`, `Authorization` (see below).
    - Update endpoints use `PATCH` (only the keys present change); `PUT` on the same path is a compatibility alias, handled and validated as `PATCH`. For the entries resource, `PUT` (full replace) and `PATCH` (partial update) mean different things and are listed separately.
    - Responses are always JSON and carry `Access-Control-Allow-Origin: *`.
    - Query parameters declared with `content: application/json` (`filters`, `sort`, `metrics`, `dimensions`, `checks`) carry the JSON text of an array as one string: `JSON.stringify` the array and pass the result, not the array itself.
    - The schemas for field definitions (`FieldInput` and each `<Type>Input`, `FieldUpdateInput`, `FormCreateInput`, `TableCreateInput`, etc.) branch on the field `type` and carry conditional constraints.

    ## Authentication
    - **Bearer Token**: `Authorization: Bearer ACCESS_TOKEN`. Three kinds of token are supported:
      - Personal access token: acts as that user, on the forms they created or that are shared with them;
      - Account access token (Enterprise plan): acts across the account, on all of its forms. Endpoints then have no "current user", and create operations are recorded under the account owner;
      - OAuth 2.0 token: the endpoints it can call are limited by the token's scope; insufficient scope returns `403`. Each endpoint's description states the scope it needs
        (`forms` / `form_setting` / `read_entries` / `write_entries` / `submit_entries` / `read_contacts` / `users` / `public`).
    - An invalid or revoked token returns `401`; a plan without API v1 returns `402`.

    ## Rate limiting
    Requests are counted per account per hour: every token of the account (its members' personal access tokens, account access tokens and OAuth tokens) draws on one shared quota.
    The hourly quota comes from the account's plan, unless the account has a quota set individually:

    | Plan | `plan` code | Requests per hour |
    |---|---|---|
    | `免费版` | `free` | 100 |
    | `专业版` | `pro2` | 1000 |
    | `专业增强版` | `ent2` | 1000 |
    | `企业基础版` | `e10` | 20000 |
    | `企业协作版` | `e20` | 30000 |
    | `企业高级版` | `e30` | 50000 |
    | `商业合作版` | `en_cor` | 50000 |

    Every response to a request that sends `Authorization` carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`, so a caller can pace itself before the quota runs out.
    Over the quota returns `429` with `Retry-After`; the body (`RateLimitError`) gives the plan code, the limit, when the quota resets and a link to upgrade.

    ## Error format
    Business errors always return `{ "error_description": "..." }`; the HTTP status code gives the error category:
    `400` parameter or data validation failed, `401` not authenticated, `402` not supported by the plan, `403` no permission / quota used up / insufficient scope,
    `404` resource does not exist or is not accessible, `422` every item of a batch operation failed, `429` rate limit exceeded.

    ## Pagination
    List endpoints return `{ total, count, data, next }`. `next` being `null` means this is the last page; pass it back unchanged to get the next page.
    `skip` sets the starting row (from 0, at most 10000), for reading in parallel slices; `skip` and `next` cannot be passed together.
    Form, table and entry lists, and the "my submissions" lists, take `limit` for the page size (default 50, max 1000); view entry lists are fixed at 50 per page.
    The 小金商户 order / refund / payout lists are paged by page number: they return `page_info` (total, page, per_page, total_pages) and an array of records; `limit` defaults to and is capped at 50. `next` (the next page number) is present only when there is a next page; pass it back unchanged.

    ## Time and time zone
    System times such as `created_at` / `updated_at` are returned in UTC ISO 8601 (e.g. `2021-09-28T02:59:42.539Z`);
    date field values are formatted in Beijing time (UTC+8) to the field's precision (e.g. `2012-12-25` or `2012-12-25 12:13`), and are parsed as Beijing time when written.

    ## Input validation
    The server validates the path parameters, query parameters and JSON request body of every request against this document (except the multipart body of upload endpoints).
    - An invalid request returns `400` directly, with the response body `{ error_description, errors: [{ pointer, message, code }] }`; a request body that is not `application/json` returns `415`.
    - Keys not listed in a request body schema are errors (except the field values of entry writes, which the form's field definitions decide).
servers:
- url: https://jinshuju.net/api/v1
  description: Production
security:
- bearerAuth: []
tags:
- name: Forms
  description: 'Forms: list, structure, create and edit, plus field display rules, cooperators, copy, move and other related operations.'
- name: Form Settings
  description: 'Form settings: submission settings, access policy, Webhook, theme, closing rules, exam / evaluation scene settings.'
- name: Plugins
  description: Plugin center plugins (check-in for now). A plugin campaign is bound to one form, and only its creator can see and change it. The account must have enabled the plugin in the plugin center, or the request returns 402.
- name: Entries
  description: 'Form entries: list, query, create, update, delete and batch operations.'
- name: Tables
  description: 'Tables (kind=table): structure and entries; field types are limited to the column types tables support.'
- name: Views
  description: Form / table views (view filters, sort, column configuration) and reading entries through a view.
- name: Comments
  description: Entry comments.
- name: Fill
  description: 'Fill links: read the fill page (`/f/`, `/v/`) as a submitter and submit entries through it.'
- name: OpenSearch
  description: Public queries.
- name: Folders
  description: Folders.
- name: Predefined Choices Sets
  description: Predefined choice sets.
- name: Templates
  description: Using templates.
- name: Contacts
  description: Contacts.
- name: Account
  description: 'Current user and account: members, e-invoices, payment history, SMS signature review status.'
- name: Trade
  description: '小金商户: merchant and onboarding progress, payment orders, transaction statistics, refunds and payouts.'
- name: Uploads
  description: Uploading attachments, form images and import files.
- name: Utilities
  description: Utility endpoints.
paths:
  "/forms":
    get:
      tags:
      - Forms
      summary: List forms
      operationId: listForms
      description: |
        Returns the forms visible to the current identity (`kind=form`, excluding tables and quick payment forms). A personal token returns the forms the user created and those shared with them; an account token returns every form in the account.
        By default sorted by id descending (that is, by creation time descending), and `next` is the id of the first row of the next page; when `sort` is passed, rows are sorted by the given field and `next` becomes `row:<offset>`.
        50 per page by default, adjustable with `limit` (max 1000).
        - Each row carries `entries_count` (entry count) and `last_entry_created_at` (when the last entry was received), usable with `filters` / `sort`.
        - With `include_transactions=true`, forms bound to a payment account carry `transactions` payment statistics.

        OAuth scope: forms
      parameters:
      - $ref: '#/components/parameters/FormsQ'
      - $ref: '#/components/parameters/FormsFilters'
      - $ref: '#/components/parameters/FormsSort'
      - $ref: '#/components/parameters/FormsNext'
      - $ref: '#/components/parameters/FormsSkip'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/IncludeTransactions'
      responses:
        '200':
          description: Form list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Forms
      summary: Create a form
      operationId: createForm
      description: |
        Creates a form from a list of field definitions and returns the full form structure. `name` and `fields` are required.
        - `scene` sets the form's scene; exam / evaluation question types (such as `SingleSelect`, `FillInBlank`) can only be used in the scenes that support them.
        - `layout=card` (paged) does not support PageBreak, Matrix*, TableField, GoodsField, ESignatureField, FormAssociation, MultipleBlanksField or any kind of Widget field.
        - The folder named by `folder_token` must be manageable and of kind form; otherwise returns 404 / 400 respectively.
        - `setting` accepts only whitelisted keys (see `FormSettingWriteInput`); `setting.notification_rules` replaces, as a whole, the notification rules created through the API.
        - The returned form structure carries `url` (the public fill URL).

        OAuth scope: forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCreateInput'
      responses:
        '201':
          description: Created; returns the form structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The folder named by folder_token does not exist or cannot be managed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Forms
      summary: Show a form's structure
      operationId: getForm
      description: |
        Returns the form's name, `kind`, `scene`, public URL (`url`), description, field definitions and settings. Each element of `fields` is a single-key object `{ "<api_code>": {...} }`, in field order.
        Also answers for a table or a quick payment form token; `kind` says which it is.
        The following are included when the matching parameter is `true`:
        - `include_analytics`: each analysable field's definition carries `analytics`;
        - `include_theme`: carries `theme` (the form theme);
        - `include_field_rules`: carries `field_rules` (field display rules);
        - `include_extended_attributes`: carries `extended_attributes` (source-tracking links);
        - `include_transactions`: carries `transactions` (payment statistics) when the form is bound to a payment account.

        OAuth scope: forms
      responses:
        '200':
          description: Form structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: include_analytics
        in: query
        required: false
        description: Whether to include `analytics` on each analysable field (the aggregate functions available, whether it can be grouped by, the shape of its summary). Defaults to false.
        schema:
          type: boolean
          default: false
      - name: include_theme
        in: query
        required: false
        description: When `true`, includes `theme` (the form theme).
        schema:
          type: boolean
          default: false
      - name: include_field_rules
        in: query
        required: false
        description: When `true`, includes `field_rules` (field display rules, the same as the `data` of `GET /forms/{form_token}/field_rules`).
        schema:
          type: boolean
          default: false
      - name: include_extended_attributes
        in: query
        required: false
        description: When `true`, includes `extended_attributes` (source-tracking links, the same as the `data` of `GET /forms/{form_token}/extended_attributes`).
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/IncludeTransactions'
    patch:
      tags:
      - Forms
      summary: Edit a form
      operationId: updateForm
      description: |
        Edits a form partially; also accepts `PUT`. The request body must contain at least one of `name` / `description` / `fields` / `setting` / `field_rules`, otherwise returns 400.
        - `fields` is changed incrementally through four kinds of operation, `add` / `remove` / `update` / `update_choices`; fields, choices and api_codes not mentioned are all kept;
          `update[].type` changes a field's type in place, and a change that clears entry data must carry `confirm_data_loss: true`.
        - `field_rules` does `add` / `remove` / `update` on rules located by the `index` that `GET /forms/{form_token}/field_rules` returns.
        - `setting`, as on create, accepts only whitelisted keys.
        Returns the full updated form structure.

        OAuth scope: forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormUpdateInput'
      responses:
        '200':
          description: Updated; returns the form structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Entries
      summary: Create an entry (legacy path)
      operationId: createEntryLegacy
      deprecated: true
      description: |
        Legacy alias of `POST /forms/{form_token}/entries`, with identical behavior. New integrations should use the new path.

        OAuth scope: write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/EntryValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/fields/check":
    get:
      tags:
      - Forms
      summary: Check whether fields already hold data
      description: |
        Use before deleting a field or choice: checks in batch whether fields (or single choices of a field) already have submitted entries. Deleting a field or choice that still has entries deletes those entries with it, and they cannot be recovered.
        Matches the check the web editor runs before deleting.
        - Put every deletion target of one edit in the `checks` of a single call (at most 100, may span several fields); `results` matches `checks` one to one, in order.
        - When a target cannot be checked (for example, the field does not exist), its row returns `unavailable` with the reason; the other targets return as usual.
        - Returns 400 when `checks` is missing, empty, over 100, not a JSON array, or has an item that is not an object.

        OAuth scope: forms
      operationId: checkFormFieldData
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/FieldDataChecks'
      responses:
        '200':
          description: Per-item check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDataCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/fields/preview_convert":
    get:
      tags:
      - Forms
      summary: Preview a field type change
      description: |
        Use before changing a field's type (the field's `type` in PATCH /forms/{form_token}): changes no data, and counts, from the field's current entries, how many would be kept and how many cleared after the conversion.
        The conversion happens on the original field (api_code and data column unchanged), so only entry data is affected; matches the preview the web editor shows before converting.
        - Put every conversion of one edit in the `checks` of a single call (at most 20); `results` matches `checks` one to one, in order.
        - `supported=false` means the field cannot be converted to the target type, and the actual edit is refused too.
        - When converting multi-line text to a choice field such as single choice / multiple choice, also returns `choice_count`, the number of choices that would be generated from existing entries, and `choice_limit_exceeded`, whether that exceeds the choice limit (when it does, the conversion is refused rather than truncated).
        - When an item cannot be previewed (the field does not exist, `target_type` is not a type available to this form, etc.), its row returns `unavailable` with the reason; the other items return as usual.
        - Returns 400 when `checks` is missing, empty, over 20, not a JSON array, or has an item that is not an object.

        OAuth scope: forms
      operationId: previewFormFieldTypeChange
      parameters:
      - $ref: '#/components/parameters/FormToken'
      - $ref: '#/components/parameters/FieldTypeChangeChecks'
      responses:
        '200':
          description: Per-item preview results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeChangePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: List entries
      operationId: listEntries
      description: |
        Returns form entries page by page, 50 per page by default, set with `limit` (max 1000). Sorted by serial number ascending by default; `next` is the serial number of the first entry of the next page.
        - `filters` / `keyword` trigger a conditional query; `created_at` returns only entries created at or after that time (and sorts by creation time instead);
          in both these cases, and when `sort` is passed, `next` becomes a row offset.
        - `fields` returns only the given fields (the serial number is always returned).
        - Each entry is keyed by field api_code (a field with api_code_alias set is keyed by its alias); for the value shapes see `EntryData`.

        OAuth scope: read_entries
      parameters:
      - $ref: '#/components/parameters/EntriesFields'
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      - $ref: '#/components/parameters/EntriesSort'
      - $ref: '#/components/parameters/EntriesCreatedAt'
      - $ref: '#/components/parameters/EntriesNext'
      - $ref: '#/components/parameters/EntriesSkip'
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Entry list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Entries
      summary: Create an entry
      operationId: createEntry
      description: |
        Submits one entry keyed by field api_code (or api_code_alias). Unknown keys are ignored; when no valid key remains, returns 400, with `error_description` starting with `Entry attributes cannot be empty` and naming each dropped key (not a field of this form, or a signature / calculated field that cannot be written).
        - The form's field display rules and field validation still apply; a validation failure returns 400, and `error_description` is `{ "<api_code>": ["error"] }` serialized as a JSON string.
        - Mobile fields skip SMS verification; signature fields and calculated fields cannot be written.
        - Returns 403 when the form's entry count has reached the plan limit.
        - Attachment fields accept several forms of input; see `EntryInput`.

        OAuth scope: write_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryInput'
            example:
              field_1: 张三
              field_2: '13800000000'
              field_3:
              - 选项 A
              - 选项 B
              field_4: '2024-05-01'
      responses:
        '201':
          description: Created; returns the entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/EntryValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: The form's entry count has reached its limit (`Form has reached entries limit`), or the OAuth scope is insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries/count":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: Count entries
      operationId: countEntries
      description: |
        Returns the number of entries matching the filters, without the entries themselves. `filters` / `keyword` are the same as for `GET /forms/{form_token}/entries`; with neither, returns the total entry count of the form.
        A cooperator counts only the entries visible to their role.

        OAuth scope: read_entries
      parameters:
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      responses:
        '200':
          description: Entry count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries/aggregate":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: Aggregate entries
      operationId: aggregateEntries
      description: |
        Aggregates whole columns on the server over the entries matching the filters (sum, average, count, percentiles, etc.), optionally grouped by 1 to 2 fields. The response size depends only on the number of metrics and groups, not on the amount of data.
        - `metrics` is required, 1 to 20 items; the functions each field takes are in the `analytics.agg_funcs` returned by `GET /forms/{form_token}?include_analytics=true`.
        - `dimensions` is optional, at most 2 items; only fields whose `analytics.groupable` is true (single-value choice fields and date fields) can be grouped by, and a date field must specify `bucket`.
        - Without `dimensions`, `rows` has a single row; when grouped, one row per group, at most `limit` groups; `row_count` is the total number of groups, and `truncated` is true when there are more.
        - `filters` / `keyword` are the same as for the entry list, but `creator_id`, `serial_number` and association field conditions are not supported (returns 400).
        - Returns 400 when a field does not exist or is not readable by the caller, or a function or grouping does not apply to the field, and says which fields / functions / groupings are available.

        OAuth scope: read_entries
      parameters:
      - $ref: '#/components/parameters/AggregateMetrics'
      - $ref: '#/components/parameters/AggregateDimensions'
      - $ref: '#/components/parameters/AggregateLimit'
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      responses:
        '200':
          description: Aggregation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entries/summary":
    parameters:
    - $ref: '#/components/parameters/FormToken'
    get:
      tags:
      - Entries
      summary: Summarize entries
      operationId: summarizeEntries
      description: |
        Reads an overall summary of the form's entries in one call: an overview (matching count, added today) plus the distribution or numeric statistics of each analysable field. The response is only a few KB, regardless of the amount of data.
        - Each field returns a uniform structure by `kind`: choice fields give each choice's count and share, matrix fields are grouped by question, numbers give min / max / sum / average, dates give earliest / latest, text gives the distinct count.
        - By default includes every analysable field (fields whose `analytics.summarisable` is true, plus `created_at`), at most 60; fields beyond that are listed in `omitted_fields`, and `truncated` is true.
        - Returns 400 when a field named in `fields` is not analysable or not readable by the caller.
        - `filters` / `keyword` are the same as for the entry list, but `creator_id`, `serial_number` and association field conditions are not supported (returns 400).

