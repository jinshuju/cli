    CheckinCampaignCreateInput:
      type: object
      title: CheckinCampaignCreateInput
      description: Request body of POST /plugins/checkin/campaigns
      required:
      - form_token
      properties:
        form_token:
          type: string
          description: The form to turn check-in on for
        checkin_field_api_code:
          type: string
          description: Check-in field, a mobile, name, email, ID card or single-line text field; defaults to the first mobile field, then the first name field, so it is required when the form has neither. Cannot be changed afterwards
        name:
          type: string
          minLength: 1
          description: Campaign name; the form name by default
        display_field_api_code:
          type:
          - string
          - 'null'
          description: Field shown when verifying, not the check-in field; a mobile, name, email, ID card or single-line text field. null clears it
        enable_checkin_code:
          type: boolean
          default: true
          description: After submitting, go on to the check-in code page; registrants show the code on site. While on, check-in takes over the after-submit redirect and data push URL of the form, replacing any Webhook on it
        checkin_field_required_unique:
          type: boolean
          description: true makes the check-in field required and unique, so no registrant is left unable to check in
        date_settings:
          type: array
          description: Replaces the check-in times as a whole; an empty list means any time
          items:
            $ref: '#/components/schemas/CheckinDateSetting'
        geo_location:
          description: Sets the location limit; null lifts it
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckinGeoLocation'
      additionalProperties: false
    CheckinCampaignUpdateInput:
      type: object
      title: CheckinCampaignUpdateInput
      description: Request body of PATCH /plugins/checkin/campaigns/{id}; only the keys present are written
      properties:
        enabled:
          type: boolean
          description: false pauses check-in and unbinds it from the form; true turns it back on
        name:
          type: string
          minLength: 1
          description: Campaign name
        display_field_api_code:
          type:
          - string
          - 'null'
          description: Field shown when verifying, not the check-in field; a mobile, name, email, ID card or single-line text field. null clears it
        enable_checkin_code:
          type: boolean
          description: After submitting, go on to the check-in code page; registrants show the code on site. While on, check-in takes over the after-submit redirect and data push URL of the form, replacing any Webhook on it
        checkin_field_required_unique:
          type: boolean
          description: true makes the check-in field required and unique, so no registrant is left unable to check in
        date_settings:
          type: array
          description: Replaces the check-in times as a whole; an empty list means any time
          items:
            $ref: '#/components/schemas/CheckinDateSetting'
        geo_location:
          description: Sets the location limit; null lifts it
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckinGeoLocation'
