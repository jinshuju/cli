  "/billing_account/payment_histories":
    get:
      tags:
      - Account
      summary: List account payment history
      operationId: listBillingAccountPaymentHistories
      description: |
        Lists the current account's top-ups and spending on Jinshuju (account balance transactions such as buying plans, SMS, AI points and attachment storage), newest first.
        This is what the account itself spent; money received through payment forms is not included.
        Only an account admin can read it: a non-admin member gets 403 (`Only an account admin can read this.`); an account-level credential (no specific user) is treated as the account owner.
        There is no paging: `limit` defaults to 50 and is clamped to 1 to 1000; `total_records` is the number of matching records, `returned_records` the number returned this time.
        With `include_balance=true`, `current_balance` is included (account balance and the remaining quota of each item); when records are returned, `statistics` is included (counting only the returned records).
        OAuth scope: users
      parameters:
      - name: start_date
        in: query
        required: false
        description: Start date, inclusive, parsed in Beijing time (UTC+8) as 00:00 of that day, e.g. `2024-01-01`
        schema:
          type: string
        examples:
          firstDay:
            value: '2024-01-01'
      - name: end_date
        in: query
        required: false
        description: End date, inclusive, parsed in Beijing time (UTC+8) as 23:59:59 of that day, e.g. `2024-12-31`
        schema:
          type: string
        examples:
          lastDay:
            value: '2024-12-31'
      - name: verb
        in: query
        required: false
        description: |
          Only records of this type; the value is the record's `verb`. Possible types:
          `charge` (top-up), `coupons` (voucher), `plan_charge` (buy a plan), `plan_convert` (convert a plan), `plan_for_free`, `convert_to_pro2`, `expand_entries_charge`,
          `sms_charge` (buy SMS), `active_mail_charge` (buy emails), `ai_points_charge` (buy AI points), `storage_quota_charge` (buy attachment storage), `audio_quota_charge` (buy audio duration),
          `sub_account_charge` / `sub_account_for_free` (account members), `submitter_charge` / `submitter_for_free`, `weixin_account_charge` (buy WeChat Official Accounts),
          `app_charge` / `app_upgrade_charge` / `app_package_charge` (apps), `template_charge` (templates), `form_application_charge` / `form_application_upgrade_charge`,
          `cname_protocol_charge`, `hide_report_form_charge`, `show_alipay_charge`, `gd_portal_charge` / `gd_portal_customer_charge`, `other_charge`.
          Any other value gives an empty result.
        schema:
          type: string
        examples:
          smsCharge:
            value: sms_charge
      - name: limit
        in: query
        required: false
        description: Maximum number to return; defaults to 50, at most 1000 (a larger value counts as 1000, a value below 1 as 1)
        schema:
          type: integer
          default: 50
      - name: include_balance
        in: query
        required: false
        description: When `true`, `current_balance` is included. Defaults to false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountPaymentHistoriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/merchant":
    get:
      tags:
      - Trade
      summary: Show the 小金商户
      operationId: getTradeMerchant
      description: |
        Returns the current account's 小金商户 (the merchant Jinshuju collects payments for) and its onboarding progress: merchant profile, legal entity and contact details, balance, settlement details, payment channel authorization, freeze status, bound payment forms, and the URL for the next step.
        - When the account has no 小金商户 yet, it still returns 200: `merchant_stage` says how far the onboarding application has got, `merchant` / `subject` / `contact` / `balance` / `settlement` / `freeze` are null, and `channels` is an empty array.
        - An account that collects payments through its own WeChat Pay / Alipay merchant (direct connection) has no rate, settlement account, balance or onboarding status on Jinshuju, and none of these is given here.
        - Sensitive fields such as bank card numbers, mobile numbers, emails and ID numbers are masked by the rules of the product's "Fund account information" page: 4 characters are kept at each end (mobile numbers keep the first 3 and last 4), and the middle is replaced with `*`.
        - `payment_form_tokens` holds only the payment forms the current identity can access (quick payment forms included); with an account-level credential, it is computed for the account owner.
        - `balance` is null when the balance lookup fails; that does not mean the balance is 0.

        OAuth scope: users
      responses:
        '200':
          description: 小金商户 details and onboarding progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeMerchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/transactions":
    get:
      tags:
      - Trade
      summary: List payment orders
      operationId: listTradeTransactions
      description: |
        Lists the payment orders of the 小金商户 (orders customers place by paying on payment forms), newest order first. Only 小金商户 orders are included: orders collected through a direct connection, simulated-payment orders, and unpaid quick payment records are all left out.
        - The date range filters on order time, in Beijing time (UTC+8); `start_date` / `end_date` are both inclusive and must be passed together. Without them, it defaults to the last 90 days; with `order_no` and no dates, there is no time limit. `queried_range` in the response gives the range actually used (both ends null when there is no time limit).
        - Detail limits: the date range spans at most 90 days, and at most 200 orders match. Past either limit, no details are returned: `transactions` is null, `detail_limit` says why, and `stats` gives the transaction amount, paid count and order count for the range; narrow the range and query again.
        - Paging: `limit` is the page size (default and maximum 50), and `next` is a page number. When there is another page, the response carries `next` (the next page number); pass it back as is. `page_info.total` is the total number of matching orders.
        - Returns 404 when the account has no 小金商户.

        OAuth scope: users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - $ref: '#/components/parameters/TradePaidStatus'
      - $ref: '#/components/parameters/TradePaymentChannel'
      - $ref: '#/components/parameters/TradeFormToken'
      - name: order_no
        in: query
        required: false
        description: Exact lookup by order number, matching one of the transaction number (`trade_no`), the merchant order number (`merchant_out_trade_no`) or the Jinshuju order number (`out_trade_no`). Without dates, there is no time limit.
        schema:
          type: string
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      responses:
        '200':
          description: Payment orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeTransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/transactions/aggregate":
    get:
      tags:
      - Trade
      summary: Aggregate payment orders
      operationId: aggregateTradeTransactions
      description: |
        Totals the transaction amount, paid count and order count of the 小金商户 payment orders over a date range, optionally grouped by one dimension. Orders are counted as in "List payment orders" (only 小金商户 orders; no simulated payments and no unpaid quick payment records); the totals cover the whole range and are not bound by the detail limits.
        - The date range filters on order time, in Beijing time (UTC+8); both ends are inclusive and must be passed together. Without them, it defaults to the last 30 days. The range spans at most 366 days; a longer one returns 400.
        - `transactions_amount` (transaction amount): the amount of paid-type orders minus each order's successful refunds, counted on the day the order was placed; refunded and unpaid orders contribute 0. `transactions_count` (paid count): the number of paid, partially refunded and refunding orders. `orders_count` (order count): the number of all matching orders, unpaid included.
        - `group_by=time` groups by time: by day for a range under 90 days, by week from 90 days, by month from 365 days; `granularity` gives the granularity, and periods without orders are filled with zero. `paid_status` / `payment_channel` make one group per value; the group whose `payment_channel` is null holds orders that have not started payment. Under the same filters, the groups add up to the total.
        - Returns 404 when the account has no 小金商户.

        OAuth scope: users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - name: group_by
        in: query
        required: false
        description: Dimension to group by; only one dimension at a time. By default there is no grouping and only the total is returned. Any other value returns 400.
        schema:
          type: string
          enum:
          - time
          - paid_status
          - payment_channel
      - $ref: '#/components/parameters/TradePaidStatus'
      - $ref: '#/components/parameters/TradePaymentChannel'
      - $ref: '#/components/parameters/TradeFormToken'
      responses:
        '200':
          description: Payment order statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeTransactionAggregateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/refunds":
    get:
      tags:
      - Trade
      summary: List refunds
      operationId: listTradeRefunds
      description: |
        Lists the refunds the 小金商户 issued to customers, with statistics. Refunds are filtered and sorted newest first by the time they were issued, not by the order time or the time the refund arrived. Only a 小金商户 has refund records; an account collecting payments through a direct connection has no data here.
        - The date range is in Beijing time (UTC+8); both ends are inclusive and must be passed together. Without them, it defaults to the last 90 days; with `refund_no` and no dates, there is no time limit. `queried_range` gives the range actually used.
        - `include` decides what is returned: `both` (default) returns `stats` and `refunds` together, `stats` returns the statistics alone, `records` returns the records alone.
        - The detail limits are those of "List payment orders" (at most 90 days, 200 records): past them, `refunds` is null, `detail_limit` says why, and `stats` is returned as usual.
        - `stats`: the count and amount of all matching refunds, the count and amount per status, the number of distinct orders with a successful refund, and the trend by refund issue date (only when there is a date range; by day under 90 days, by week from 90 days, by month from 365 days, periods without refunds filled with zero). In the trend, order counts are deduplicated within each period, so the sum over periods can exceed the total order count.
        - Paging works as in "List payment orders"; with `include=stats`, `next` is not returned.
        - Returns 404 when the account has no 小金商户.

        OAuth scope: users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - name: status
        in: query
        required: false
        description: 'Keep only refunds in this state; records, statistics and trend are all filtered by it: `processing` (in progress), `success` (refunded), `error` (refund failed). Any other value returns 400.'
        schema:
          type: string
          enum:
          - processing
          - success
          - error
      - name: refund_no
        in: query
        required: false
        description: Exact lookup by refund number (`refund_no`). Without dates, there is no time limit.
        schema:
          type: string
      - $ref: '#/components/parameters/TradeInclude'
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      responses:
        '200':
          description: Refunds and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRefundListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/trade/payouts":
    get:
      tags:
      - Trade
      summary: List payouts
      operationId: listTradePayouts
      description: |
        Lists the payouts the 小金商户 made from its Jinshuju balance to its own bank account, with statistics. Payouts are filtered and sorted newest first by request time; each record carries the settlement date range the payout covers, but it cannot be filtered on. Only a 小金商户 has payout records; an account collecting payments through a direct connection has no data here.
        - The date range is in Beijing time (UTC+8); both ends are inclusive and must be passed together. Without them, it defaults to the last 90 days. `queried_range` gives the range actually used.
        - `include` decides what is returned: `both` (default) returns `stats` and `payouts` together, `stats` returns the statistics alone, `records` returns the records alone.
        - The detail limits are those of "List payment orders" (at most 90 days, 200 records): past them, `payouts` is null, `detail_limit` says why, and `stats` is returned as usual.
        - `stats`: the count and amount of all matching payouts, and the count and amount per status.
        - Paging works as in "List payment orders"; with `include=stats`, `next` is not returned.
        - For the balance awaiting payout and the settlement cycle, see "Show the 小金商户". Returns 404 when the account has no 小金商户.

        OAuth scope: users
      parameters:
      - $ref: '#/components/parameters/TradeStartDate'
      - $ref: '#/components/parameters/TradeEndDate'
      - name: status
        in: query
        required: false
        description: 'Keep only payouts in this state; records and statistics are both filtered by it: `processing` (in progress), `success` (paid out), `error` (payout failed). Any other value returns 400.'
        schema:
          type: string
          enum:
          - processing
          - success
          - error
      - $ref: '#/components/parameters/TradeInclude'
      - $ref: '#/components/parameters/TradePageLimit'
      - $ref: '#/components/parameters/TradePageNext'
      responses:
        '200':
          description: Payouts and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradePayoutListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/sms/audit_statuses":
    get:
      tags:
      - Account
      summary: Show SMS signature review status
      operationId: listSmsAuditStatuses
      description: |
        Lists the SMS signatures the current user applied for and the SMS templates under each signature, with review status and the reason a review failed, newest signature first.
        Returns only the current user's own signatures, not those of other members of the account; with an account-level credential, returns the account owner's signatures. Any member can call it; admin is not required.

        OAuth scope: users
      responses:
        '200':
          description: Review status of SMS signatures and templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMSAuditStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/jamr_v":
    get:
      tags:
      - Utilities
      summary: Verify redirect parameters
      operationId: verifyRedirectParams
      security: []
      description: |
        Lets the receiver of a "redirect to an external URL after submission" verify that the redirect parameters have not been tampered with. This endpoint needs no API credentials.
        When a form has redirect after submission turned on and "Fields to carry on redirect" configured, Jinshuju appends the values of the selected fields to the redirect URL, plus the signature parameter `jamr_h` (signed over the form token, the entry token and a 10-minute validity period). The receiver forwards the received `jamr_h` and all field parameters to this endpoint unchanged: the server verifies the signature, finds the form and entry, and compares the current value of each configured field with the passed parameter value (array values must be equal as a whole; other values are compared as strings).
        Returns 200 `{ status: "SUCCESS", message: "验证成功" }` when all match; 400 `{ status: "FAIL", message: "无效Token或者过期" }` when the `jamr_h` signature is invalid or expired; 400 `{ status: "FAIL", message: "验证失败" }` when the form / entry does not exist, a field value does not match, or a field parameter is missing. The message text follows the request language.
      parameters:
      - name: jamr_h
        in: query
        required: true
        description: Signature parameter carried in the redirect URL
        schema:
          type: string
      - name: serial_number
        in: query
        required: false
        description: Entry serial number carried in the redirect URL; present only when the form is set to carry that field
        schema:
          type: string
      responses:
        '200':
          description: Verification passed
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: e.g. `验证成功`
        '400':
          description: Signature invalid / expired, or a field value does not match
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    enum:
                    - FAIL
                  message:
                    type: string
                    description: "`无效Token或者过期` or `验证失败`"
  "/field_types":
    get:
      tags:
      - Forms
      summary: List field types
      description: |
        Returns every field type available when creating / editing a form (or table), with the validation switches and type-specific settings each type accepts, for building `type` and the type-specific parameters in `fields`.
        Kept in line with the types and parameters the create endpoints actually accept.

        OAuth scope: forms
      operationId: listFieldTypes
      parameters:
      - $ref: '#/components/parameters/FieldTypeKind'
      responses:
        '200':
          description: Field types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/field_types/{type}":
    parameters:
    - name: type
      in: path
      required: true
      description: Field type name (case-sensitive); one of the `type` values returned by `GET /field_types`, e.g. `TextField`, `RadioButton`.
      schema:
        type: string
        pattern: "^[A-Za-z]+$"
      example: NumberField
    get:
      tags:
      - Forms
      summary: Show a field type
      description: |
        Returns the validation switches and type-specific settings one field type accepts, shaped like one item of the `GET /field_types` list.
        Returns 404, listing the available types in `error_description`, when the type name does not exist or is not among the types available for `kind` (e.g. querying a type tables do not support with `kind=table`).

        OAuth scope: forms
      operationId: getFieldType
      parameters:
      - $ref: '#/components/parameters/FieldTypeKind'
      responses:
        '200':
          description: Field type details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTypeDescription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The type name does not exist or is not among the types available for `kind`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_description: 'Invalid field type: Nope. Allowed types: TextField, TextArea, NumberField, ...'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/count":
    get:
      tags:
      - Entries
      summary: Count entries across several forms
      operationId: countEntriesAcrossForms
      description: |
        Counts, in one call, the entries matching the filters in each of up to 10 forms / tables, plus their total.
        - A token that cannot be accessed (does not exist, or does not belong to the caller) does not fail the whole request; its row returns `unavailable` with the reason instead. The total adds up only the rows that could be counted.
        - Field api_codes mean different things in each form, so `filters` can use only the three form-independent conditions `created_at` / `updated_at` / `creator_id`; any other field returns 400.
        - `keyword` is not supported (passing it returns 400); to search several forms by keyword, use `GET /entries/search`.

        OAuth scope: read_entries
      parameters:
      - name: form_tokens
        in: query
        required: false
        description: 'Required. Tokens (ids also accepted) of the forms or tables to count, comma-separated (or repeat `form_tokens[]=`), 1 to 10 after deduplication; returns 400 when empty, and 400 when more than 10.

          '
        schema:
          type: string
        example: abc123,def456
      - name: filters
        in: query
        required: false
        description: Filters, a JSON string holding an array of ScopeCondition objects (`JSON.stringify` the array; do not pass the array itself), written like `filters` of `GET /forms/{form_token}/entries`, but `field` can only be `created_at` / `updated_at` / `creator_id`. Applied to each form separately.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ScopeCondition'
            example:
            - field: created_at
              operator: within_last
              value:
                unit: day
                "n": 7
      responses:
        '200':
          description: Entry counts per form, with the total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryCountBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/search":
    get:
      tags:
      - Entries
      summary: Search entries across forms
      operationId: searchEntriesAcrossForms
      description: |
        Runs one keyword as a full-text search across several forms / tables and returns, per form, the match count and some of the matching serial numbers (at most 50 per form), without entry content.
        - Search scope: the forms in `form_tokens` when given; otherwise every form and table the caller can access (for an account access token, every form and table in the account).
          Either way, `filters` then narrows the scope; unless `filters` specifies `entries_count`, only forms with entries are searched by default (`entries_count > 0`).
        - The scope holds at most 10 forms; beyond that it returns 400: narrow it with `filters`, or pass `form_tokens` directly.
        - Forms with no match are left out of the result; forms that cannot be accessed, where the caller's role does not allow reading entries, whose search timed out or whose search service did not respond are listed with `unavailable` giving the reason (this does not mean there was no match).

        OAuth scope: read_entries
      parameters:
      - name: keyword
        in: query
        required: true
        description: Search keyword (at most 200 characters); returns 400 when empty.
        schema:
          type: string
          maxLength: 200
      - name: form_tokens
        in: query
        required: false
        description: Tokens (ids also accepted) of the forms or tables to search, comma-separated (or repeat `form_tokens[]=`), at most 10 after deduplication. When omitted, every accessible form is searched.
        schema:
          type: string
        example: abc123,def456
      - name: filters
        in: query
        required: false
        description: |
          Filters on form attributes that narrow the search scope, a JSON string holding an array of ScopeCondition objects (`JSON.stringify` the array; do not pass the array itself), with the same fields as `filters` of `GET /forms` (`form_name` / `created_at` / `last_entry_created_at` / `entries_count`); conditions are combined with AND.
          Without an `entries_count` condition, `entries_count > 0` is appended automatically.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ScopeCondition'
            example:
            - field: last_entry_created_at
              operator: within_last
              value:
                unit: day
                "n": 30
      responses:
        '200':
          description: Matches per form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/entries/stats":
    get:
      tags:
      - Entries
      summary: Count submissions per form over a date range
      operationId: getEntryStats
      description: |
        Counts the submissions received within a date range by every form / table the caller can access (for an account access token, every form and table in the account): returns the total, and a list of the forms that received submissions, most submissions first.
        - Dates are in Beijing time (UTC+8); `from` / `to` are both inclusive.
        - It counts submissions as they happened: imported entries count on the day of the import, and deleted entries are not subtracted, so the result may differ from a count by entry `created_at`.
        - The list has at most `limit` rows; when there are more, `truncated` is true, and `total` and `forms_with_data` still cover every form.
        - With `by` (`day` / `week` / `month`), the response also carries `buckets`: one count of the same shape for each period in the range (periods with no submissions included); weeks start on Monday, and the first and last periods are clipped to the range. The range covers at most 92 days / 53 weeks / 24 months; beyond that it returns 400, suggesting a coarser granularity or dropping `by`.

        OAuth scope: read_entries
      parameters:
      - name: from
        in: query
        required: true
        description: Start date, inclusive, `YYYY-MM-DD`. Returns 400 when missing or unparseable.
        schema:
          type: string
        example: '2026-09-01'
      - name: to
        in: query
        required: false
        description: End date, inclusive, `YYYY-MM-DD`; defaults to today. Returns 400 when earlier than `from` or unparseable.
        schema:
          type: string
        example: '2026-09-07'
      - name: kind
        in: query
        required: false
        description: Count only forms (`form`) or only tables (`table`); by default both are counted. Any other value returns 400.
        schema:
          type: string
          enum:
          - form
          - table
      - name: by
        in: query
        required: false
        description: Split the counts by `day` / `week` / `month`; the response carries `buckets`. Any other value returns 400.
        schema:
          type: string
          enum:
          - day
          - week
          - month
      - name: limit
        in: query
        required: false
        description: Maximum number of forms in the list, at most 100; defaults to 100, or 10 per period when `by` is given. Values above 100 are treated as 100; values below 1 fall back to the default.
        schema:
          type: integer
      responses:
        '200':
          description: Submission counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/forms":
    get:
      tags:
      - Forms
      summary: List the forms I have submitted to
      operationId: listMyFilledForms
      description: |
        Returns the forms the current user has submitted entries to as a submitter (quick payment forms excluded), most recent submission first. These forms need not be created by or shared with the current user;
        each row gives the current user's own submission count and latest submission time, not the form's total entry count. Deleted forms do not appear in `data` (`total` still counts them).
        - Pagination: `next` is a row offset, passed back as is for the next page; `skip` and `next` cannot be combined. 50 rows per page by default, adjustable with `limit` (at most 1000).
        - An account access token has no "current user"; calling with one returns 400.

        OAuth scope: forms
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: Forms submitted to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFilledFormListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/forms/{form_token}/entries":
    get:
      tags:
      - Entries
      summary: List my entries in a form
      operationId: listMySubmittedEntries
      description: |
        Returns the entries the current user submitted to the given form, newest first. The form need not be created by or shared with the current user: only the user's own entries are returned,
        with only the fields the form makes public to submitters (hidden fields are neither returned nor usable for filtering or searching). Returns an empty list when the user has not submitted.
        - `fields` keeps only the given public fields; unknown or non-public api_codes are skipped (no error).
        - `filters` works as in the entry list, but cannot filter by `creator_id` (results are already limited to the user's own) or on non-public fields; doing so returns 400.
        - `keyword` searches only the user's own entries and is not subject to the form's entry-count limit.
        - Pagination: `next` is a row offset; `skip` and `next` cannot be combined. 50 rows per page by default, adjustable with `limit` (at most 1000).
        - An account access token has no "current user"; calling with one returns 400. Returns 404 when the form does not exist.

        OAuth scope: read_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: Form token (`token` from `GET /my/forms`); a 24-character hexadecimal form id is also accepted.
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: Return only these fields. A comma-separated string or an array parameter (`fields[]=`) of field api_codes; unknown or non-public fields are skipped. The serial number is always returned.
        schema:
          type: string
        example: field_1,field_2
      - $ref: '#/components/parameters/EntriesFilters'
      - $ref: '#/components/parameters/EntriesKeyword'
      - $ref: '#/components/parameters/EntriesIncludeLabels'
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/EntriesSkip'
      responses:
        '200':
          description: The current user's own entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubmittedEntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The form does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_description: Form not found — check the token.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/my/search":
    get:
      tags:
      - Entries
      summary: Search my entries
      operationId: searchMySubmittedEntries
      description: |
        Searches the current user's own entries across forms with one keyword (only fields the form makes public to submitters are searched), and returns the match count and serial numbers for each matching form.
        - `keyword` is required; returns 400 when empty.
        - By default, searches every form the current user has submitted to (quick payment forms excluded); `form_tokens` limits it to some of them, and tokens not in the user's submission history are ignored.
          Returns 400 when more than 20 forms are in the search; narrow them with `form_tokens`.
        - Forms with no match are left out of the result; when a form cannot be searched (e.g. the keyword is too long), that form returns `unavailable` with an explanation and the other forms return as usual.
        - At most 50 serial numbers are returned per form; `matched` is the form's actual total match count.
        - An account access token has no "current user"; calling with one returns 400.

        OAuth scope: read_entries
      parameters:
      - name: keyword
        in: query
        required: true
        description: Search keyword (at most 200 characters), fuzzy-matched in the form's public searchable fields.
        schema:
          type: string
          minLength: 1
      - name: form_tokens
        in: query
        required: false
        description: Search only these forms. Comma-separated form tokens, or an array parameter (`form_tokens[]=`).
        schema:
          type: string
        example: aBc123,dEf456
      responses:
        '200':
          description: Matches per form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/fill/f/{form_token}":
    get:
      tags:
      - Fill
      summary: Show a form's fill page
      operationId: getFillFormPage
      description: |
        Reads the fill page behind a fill link (`/f/<token>`): its title, description, the fields to fill in, and whether the current user can submit right now.
        The caller reads it as a submitter holding the link and needs no permission on the form or table; only what the fill page shows is returned.
        - `fields` lists the public fields in fill-page order, shaped like `fields` when reading a form; for a form view, column names, descriptions and required flags already follow the view's settings.
        - Submission is possible only when `status.key` is `open`; other values (such as `not_opened`, `closed`, `password_required`, `unauthorized`, `submission_prevented`,
          `fill_frequency_limited`: the current user has used up the submissions the fill page allows) are explained in `status.message`; when the page is not yet open or has closed on schedule, `status.open_info` gives the open period.
        - `blockers` lists requirements only the submitter can complete on the page (captcha, SMS verification, WeChat identity, payment, etc.); when it is not empty, submission is refused and the form must be filled in a browser.
        - `manageable` is returned only when the current user can already read the underlying form or table, and gives its token and name.
        - An account access token has no "current user"; calling with one returns 400.

        OAuth scope: submit_entries
      parameters:
      - name: form_token
        in: path
        required: true
        description: The token in the fill link `/f/<token>`.
        schema:
          type: string
      responses:
        '200':
          description: Fill page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The fill page does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
