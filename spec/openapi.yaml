        other_choice_required:
          type: boolean
          description: Choosing the "Other" choice requires the extra text; takes effect only on RadioButton / CheckBox / DropDown
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        rating_max:
          type: integer
          minimum: 1
        choices:
          type: array
