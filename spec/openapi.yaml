      schema:
        type: string
    patch:
      tags:
      - Comments
      summary: Update a comment on an entry
      description: 'Changes a comment''s content; PUT is accepted too. Only the comment''s author can edit it; not even a form admin can edit someone else''s comment; otherwise returns 400. content follows the same rules as on create (leading and trailing whitespace stripped, at most 2000 characters, mentioned users must be cooperators); the comment''s existing attachments stay unchanged. Returns 404 (comment cannot be found) when the comment does not belong to the entry. OAuth scope: read_entries'
      operationId: updateEntryComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
