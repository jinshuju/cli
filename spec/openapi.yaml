  "/forms/{form_token}/copy":
    post:
      tags:
      - Forms
      summary: Copy a form
      description: |
        Copies the form and returns the new form (same shape as GET /forms/{form_token}). The new form's creator is the calling user (the account owner for an account token).
        OAuth scope: forms
        - When the source form allows public copying (can_duplicated_in_public), the caller needs no access to the source form; otherwise a caller without access gets 404.
        - Returns 403 when the source form is frozen or its creator's account is disabled, with body `{ "errors": ..., "status_code": "form_forbidden" }` (not the common error shape).
        - `folder_token` takes a folder token or id; returns 404 when the folder does not exist or the caller lacks manage permission on it.
        - Returns 400 when copying fails (model validation does not pass).
      operationId: copyForm
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFormInput'
      responses:
        '200':
          description: The new form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          description: Insufficient OAuth scope or no manage permission for `with_notification_rules` (error_description shape), or the source form or its creator is frozen (errors + status_code shape)
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - error_description
                  properties:
                    error_description:
                      type: string
                - $ref: '#/components/schemas/FormFrozenError'
        '404':
          $ref: '#/components/responses/NotFound'
