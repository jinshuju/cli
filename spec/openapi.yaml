          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSetting'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Form Settings
      summary: 更新表单设置
      description: |
        增量更新表单设置，只写入请求中出现的键；同时接受 PUT。
        OAuth 令牌需要 scope：form_setting。
        - `submission_region_limited` / `submission_regions` 为付费功能，在此接口只读；写入请用「编辑表单」接口的 `setting`。
        - `manually_close_rule`、`by_time_range_close_rule`、`by_entries_close_rule`、`fill_frequency` 为嵌套对象，服务端以 nested attributes 方式创建或更新。
        - 保存成功返回 `{ "status": "ok" }`；模型校验失败返回 400，响应体为 `{ "errors": "...", "status": "failed" }`（与通用错误结构不同）。
      operationId: updateFormSetting
      parameters:
