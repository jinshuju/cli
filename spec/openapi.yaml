        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/queries":
    get:
      tags:
      - OpenSearch
      summary: List public queries
      description: 'Returns the public queries created by the current caller (an account access token counts as the account owner), newest first, with summary fields only. With form_token, returns only the queries under that form; returns 404 when form_token does not exist or the caller cannot access it, instead of ignoring the parameter. OAuth scope: forms'
      operationId: listOpensearchQueries
      parameters:
      - name: form_token
        in: query
        required: false
        description: Filter by form token
        schema:
          type: string
      responses:
        '200':
          description: Public query list
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - data
                properties:
                  count:
                    type: integer
                    description: Number of queries returned
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - OpenSearch
      summary: Create a public query
      description: 'Creates a public query on the form given by form_token, with the current caller as its creator. The caller must be able to manage the form: no access returns 404, read but not manage returns 403; a plan without the public query feature returns 402. Fields referenced in search_field_rules must be searchable fields of the form, and those in display_field_rules must be displayable fields; otherwise returns 400 listing the available api_code values. search_field_rules / display_field_rules, when passed, cannot be empty arrays; scope_conditions requires a plan that supports limiting the range of searchable entries. A preview image is generated asynchronously after saving. OAuth scope: forms'
      operationId: createOpensearchQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/OpensearchQueryInput'
              - type: object
                required:
                - form_token
                - name
                - display_field_rules
                properties:
                  form_token:
                    type: string
                    description: Token of the form the query belongs to (can also be passed as a query parameter)
      responses:
        '201':
          description: Created; returns the public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/queries/{query_token}":
    parameters:
    - name: query_token
      in: path
      required: true
      description: Public query token (an id is also accepted)
      schema:
        type: string
    get:
      tags:
      - OpenSearch
      summary: Show a public query
      description: 'Returns the public query details, including the search field rules and display field rules. The caller can read only queries it created; another user''s query returns 404 (opensearch query cannot be found). OAuth scope: forms'
      operationId: getOpensearchQuery
      responses:
        '200':
          description: Public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - OpenSearch
      summary: Update a public query
      description: 'Updates a public query the caller created; PUT is also accepted. Only the keys present in the request are updated. Returns 400 when the query''s form has been deleted. Field rules are validated as on create: referencing a field that cannot be searched / displayed, an empty rule array, an empty name and the like all return 400. An update does not check form manage permission or whether the plan includes public queries. OAuth scope: forms'
      operationId: updateOpensearchQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpensearchQueryInput'
      responses:
        '200':
          description: Updated; returns the public query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpensearchQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/opensearch/query_suggestions":
    get:
      tags:
      - OpenSearch
      summary: Suggest fields for a public query
      description: 'Returns the search fields and display fields a form offers for public queries, plus the recommended field api_code values, for building search_field_rules / display_field_rules. The caller must be able to manage the form: no access returns 404, read but not manage returns 403. Whether the plan includes public queries is not checked. OAuth scope: forms'
      operationId: listOpensearchQuerySuggestions
      parameters:
      - name: form_token
        in: query
        required: true
        description: Form token
        schema:
          type: string
      responses:
        '200':
          description: Field suggestions
          content:
            application/json:
              schema:
                type: object
                required:
                - form_token
                - search_fields
                - display_fields
                - recommend_search_fields
                - recommend_display_fields
                properties:
                  form_token:
                    type: string
                    description: Form token
                  search_fields:
                    type: array
                    description: Fields usable as search conditions
                    items:
                      $ref: '#/components/schemas/OpensearchQuerySuggestion'
                  display_fields:
                    type: array
                    description: Fields usable as display fields
                    items:
                      $ref: '#/components/schemas/OpensearchDisplayQuerySuggestion'
                  recommend_search_fields:
                    type: array
                    description: Recommended search field api_code values (name + mobile; empty when there is no mobile field)
                    items:
                      type: string
                  recommend_display_fields:
                    type: array
                    description: Recommended display field api_code values (excluding private fields, display-only fields and WeChat fields)
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/folders":
    get:
      tags:
      - Folders
