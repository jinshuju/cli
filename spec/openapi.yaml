        '404':
          $ref: '#/components/responses/NotFound'
  "/forms/{form_token}/notification_rules":
    get:
      tags:
      - Form Settings
      summary: List notification rules
      description: |
        Lists the form's notification rules, newest first, each with whether it can send right now.

        OAuth scope: form_setting
      operationId: listNotificationRules
      parameters:
      - $ref: '#/components/parameters/FormToken'
      responses:
        '200':
          description: Notification rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Form Settings
      summary: Create a notification rule
      description: |
        Creates a notification rule; the body follows the schema of its `approach`. The rule sends for matching entries from then on, using the SMS / email balance, and shows on the form's notification settings page. SMS and WeChat messages are reviewed when they are sent.
        - Saving an enabled `schedule_time` rule also schedules the entries already in the form whose send time is still ahead.

        OAuth scope: form_setting
      operationId: createNotificationRule
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - required:
                - approach
                properties:
                  approach:
                    type: string
                    enum:
                    - SMS
                    - EMAIL
                    - WEIXIN_ONETIME
                    - WXWORK
                    - DING_TALK
                    - WEBHOOK
              - oneOf:
                - $ref: '#/components/schemas/SMSNotificationRuleInput'
                - $ref: '#/components/schemas/EmailNotificationRuleInput'
                - $ref: '#/components/schemas/WeixinOnetimeNotificationRuleInput'
                - $ref: '#/components/schemas/WxworkNotificationRuleInput'
                - $ref: '#/components/schemas/DingTalkNotificationRuleInput'
                - $ref: '#/components/schemas/WebhookNotificationRuleInput'
                discriminator:
                  propertyName: approach
                  mapping:
                    SMS: "#/components/schemas/SMSNotificationRuleInput"
                    EMAIL: "#/components/schemas/EmailNotificationRuleInput"
                    WEIXIN_ONETIME: "#/components/schemas/WeixinOnetimeNotificationRuleInput"
                    WXWORK: "#/components/schemas/WxworkNotificationRuleInput"
                    DING_TALK: "#/components/schemas/DingTalkNotificationRuleInput"
                    WEBHOOK: "#/components/schemas/WebhookNotificationRuleInput"
      responses:
        '201':
          description: The notification rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The current plan does not include API v1, or does not include this approach (SMS is limited only by its balance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Forbidden: the OAuth token lacks the required scope, or the caller is not a manager of the form'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/notification_rules/{id}":
    get:
      tags:
      - Form Settings
