  "/forms/{form_token}/entry_attachments":
    post:
      tags:
      - Uploads
      summary: 上传数据附件
      operationId: uploadEntryAttachment
      security:
      - {}
      - bearerAuth: []
      - basicAuth: []
      description: |
        为表单的附件字段（或表格字段中的附件列）预先上传一个文件，返回附件 ID；之后在创建 / 更新数据时把该 ID（或上传令牌）填入对应字段即可完成绑定。上传后未被任何数据引用的附件处于未使用状态。
        鉴权方式二选一：
        1. 常规 API 凭证（HTTP Basic 的 api_key / api_secret，或 Bearer 令牌）。
        2. 一次性上传令牌 `attachment_token`（代替常规凭证）：令牌以 `entry_att_tok_` 开头，30 分钟内有效、只能使用一次，并绑定到表单、字段、列与文件元数据。请求中带有 `attachment_token` 时不再校验常规凭证，以令牌所属用户的身份访问；令牌无效、过期、已使用、所属用户已被删除，或与请求的表单 / 字段 / 列不一致时返回 400 `attachment_token is invalid or expired; prepare upload again`；上传文件的文件名、Content-Type、字节数与令牌不一致时同样返回 400。
        没有凭证也没有 `attachment_token` 时返回 401。
        文件内容二选一：`multipart/form-data` 的 `file` 字段；或 JSON / 表单中的 `base64`（亦可用 `data`）字段传 Base64 字符串（可带 `data:<mime>;base64,` 前缀），配合 `file_name`（亦可用 `filename`）与 `content_type`。Base64 方式解码后不能超过 5 MB，超过返回 400 `attachment exceeds 5MB limit`，解码失败返回 400 `base64 is invalid`；两者都没有时返回 400 `file or base64 is required`。
        `field_api_code` 必须指向附件字段或表格字段；指向表格字段时必须同时传 `dimension_api_code` 且指向该表格中的附件列，否则返回 400；字段或列不存在返回 404。
        文件大小受字段（或列）设置的单文件上限限制，超出时返回 422，`error_description` 为具体校验信息（如 `文件超过了10 MB`）；上传到对象存储失败时返回 422 `上传失败，请重试`（以服务端文案为准）。
        表单不存在或当前身份无权访问时返回 404 `form cannot be found`。

        OAuth 令牌需要 scope：write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - field_api_code
              properties:
                field_api_code:
                  type: string
                  description: 附件字段的 api_code；表格字段中的附件列则传表格字段的 api_code
                dimension_api_code:
                  type: string
                  description: 表格字段中附件列的 api_code，`field_api_code` 为表格字段时必填
                attachment_token:
                  type: string
                  description: 一次性上传令牌，以 `entry_att_tok_` 开头；传入时代替常规凭证
                file:
                  type: string
                  description: 要上传的文件；与 `base64` 二选一
                  contentMediaType: application/octet-stream
                base64:
                  type: string
                  description: 文件内容的 Base64 字符串，可带 data URI 前缀；与 `file` 二选一
                data:
                  type: string
                  description: 与 `base64` 等价的别名
                file_name:
                  type: string
                  description: Base64 方式的文件名，缺省为 `attachment`
                filename:
                  type: string
                  description: 与 `file_name` 等价的别名
                content_type:
                  type: string
                  description: Base64 方式的 MIME 类型，缺省取 data URI 前缀，否则为 `application/octet-stream`
              additionalProperties: false
          application/json:
            schema:
              $ref: '#/components/schemas/EntryAttachmentBase64Input'
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedEntryAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 附件未通过校验（如超过字段的单文件大小上限）或存储失败
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: 校验失败原因
  "/forms/{form_token}/import_files":
    post:
      tags:
      - Uploads
      summary: 上传导入文件
      operationId: uploadImportFile
      security:
      - {}
      - bearerAuth: []
      - basicAuth: []
      description: |
        上传一个用于批量导入数据的表格文件（`.xlsx` / `.xls` / `.csv`）到指定表单，返回导入附件 ID；随后把它作为 `attachment_id` 交给「从已上传的表格文件导入数据」（`POST /forms/{form_token}/entry_imports`）发起导入。
        鉴权方式二选一：
        1. 常规 API 凭证（HTTP Basic 的 api_key / api_secret，或 Bearer 令牌）。
        2. 一次性上传令牌 `import_file_token`（代替常规凭证）：令牌以 `import_file_tok_` 开头，30 分钟内有效、只能使用一次，并绑定到表单与文件元数据。请求中带有 `import_file_token` 时不再校验常规凭证，以令牌所属用户的身份访问；上传文件的原始文件名、Content-Type、字节数必须与令牌记录的一致，否则返回 400。令牌不存在、已过期、已使用，或所属用户已被删除时返回 400 `import_file_token is invalid or expired; prepare upload again`；令牌属于另一个表单时返回 400 `import_file_token was issued for another form; prepare upload again`。
        没有凭证也没有 `import_file_token` 时返回 401。
        请求必须为 `multipart/form-data`，字段 `file` 携带文件；缺少文件返回 400 `file is required`。
        文件大小受账号套餐的 Excel 导入上限（单位 MB）限制，扩展名须为 xls / xlsx / csv；不满足时返回 422，`error_description` 为具体校验信息（使用上传令牌时令牌保持可用，可重新上传）。
        表单不存在或当前身份无权访问时返回 404 `form cannot be found`。

        OAuth 令牌需要 scope：write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                import_file_token:
                  type: string
                  description: 一次性上传令牌，以 `import_file_tok_` 开头；传入时代替常规凭证
                file:
                  type: string
                  description: 待导入的 xlsx / xls / csv 文件；使用上传令牌时文件名、Content-Type、大小须与令牌记录的一致
                  contentMediaType: application/octet-stream
              additionalProperties: false
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedImportFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 文件未通过校验（超过套餐导入上限或扩展名不支持）
          content:
            application/json:
              schema:
                type: object
                required:
                - error_description
                properties:
                  error_description:
                    type: string
                    description: 校验失败原因
  "/forms/{form_token}/entry_imports":
    post:
      tags:
      - Entries
      summary: 从已上传的表格文件导入数据
      operationId: createEntryImport
      description: |
        把「上传导入文件」得到的表格文件逐行追加为该表单的数据。先上传文件拿到导入附件 ID（`attachment_id`），再在这里说明哪一列写入哪个字段。
        文件、套餐导入上限、表头行、列映射等能预先判断的问题都在创建任务之前校验，被拒绝的导入不会写入任何数据；错误信息会带上这份表格的实际布局（行列范围与表头内容），便于据此修正后重试。
        校验通过后返回 `201`，数据在后台写入：`201` 表示任务已开始而非已完成，用「获取数据导入任务」轮询结果。
        - `attachment_id` 必须是当前用户为该表单上传的导入文件，否则返回 400（找不到该文件，需重新上传）；文件不是 xls / xlsx / csv 或无法读取时返回 400。
        - `columns` 不能为空；每项用 `field_api_code` 指定目标字段，并用 `column_label`（表头文字，需与表头单元格去掉首尾空格后完全一致）或 `sheet_column_index`（列号）指定来源列，两者都给时以 `sheet_column_index` 为准。
        - 字段必须是该表单可导入的字段；同一字段不能对应多列；表头中有多列同名时必须改用 `sheet_column_index`；列号必须在表格的列范围内。
        - `header_row_index` 缺省为表格的第一行，且其下方必须还有数据行。
        - 表单的必填字段都必须有对应的列，否则返回 400 并列出缺少的字段。
        - `unique_field_code` 指定一个字段做去重：文件中该字段的值已存在于表单数据时，这一行会被跳过（计入 `skip_count`）。
        - 表单不存在或当前身份无权访问时返回 404 `form cannot be found`。

        OAuth 令牌需要 scope：write_entries
      parameters:
      - $ref: '#/components/parameters/FormToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryImportInput'
      responses:
        '201':
          description: 导入任务已创建，数据在后台写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryImportCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  "/forms/{form_token}/entry_imports/{id}":
    get:
      tags:
