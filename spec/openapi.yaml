  "/plugins/checkin/campaigns":
    get:
      tags:
      - Plugins
      summary: List check-in campaigns
      description: |
        Lists the check-in campaigns the caller created, newest first. With an account-level credential, returns the ones the account owner created.
        OAuth scope: form_setting
      operationId: listCheckinCampaigns
      parameters:
      - name: form_token
        in: query
        required: false
        schema:
          type: string
        description: Only the campaigns bound to this form
      - name: limit
        in: query
        required: false
        description: Page size
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/OffsetNext'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Check-in campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckinCampaign'
                  next:
                    type:
                    - integer
                    - 'null'
                    description: Pass back as `next` to get the next page; null on the last page
                required:
                - total
                - count
                - data
                - next
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Plugins
      summary: Create a check-in campaign
      description: |
        Turns check-in on for a form.
        - Refused while the after-submit step of the form is taken by something else (WeChat red envelope, lucky wheel, certificate, confirmation code, another plugin or the check-in code of another campaign, or an after-submit action other than the default message); the message names it, so turn that off first.
        - Only one check-in campaign is in effect on a form at a time; creating one turns off the one that was in effect.
        OAuth scope: form_setting
      operationId: createCheckinCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinCampaignCreateInput'
      responses:
        '201':
          description: The check-in campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCampaign'
        '400':
          description: 'Invalid parameters, including: the form has something check-in cannot work with, as when picking it in the web app (the message names what to turn off first), or it has no mobile or name field to check in with'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
