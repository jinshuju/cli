    FieldRule:
      type: object
      description: 一条字段显示规则
      required:
      - index
      - targets
      - targets_display_mode
      - operator
      - conditions
      properties:
        index:
          type: integer
          description: 0 起始位置，用于 PATCH /forms/{form_token} 更新或删除规则
        targets:
          type: array
          description: 受控字段的 api_code；targets_display_mode 为 abort 时固定为 ["DYNAMIC_TARGETS"]
          items:
            type: string
        targets_display_mode:
          type: string
          enum:
          - show
          - abort
          description: show 满足条件时显示目标字段；abort 满足条件时终止填写
        operator:
          type: string
          enum:
          - or
          - and
          description: 多个条件之间的逻辑关系
        conditions:
          type: array
          items:
            type: object
            required:
            - trigger
            - comparator
            - value
            properties:
              trigger:
                type: string
                description: 触发字段 api_code
              comparator:
                type: string
                enum:
                - equal
                - none_in
                - between
                - like
                - not_like
                description: equal 表示"包含任一"（历史原因）
              value:
                description: 条件值：选项 api_code 数组、数值范围 [min, max] 或文本，取决于触发字段类型
    ExtendedAttribute:
      type: object
