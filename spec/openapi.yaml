          Nps: "#/components/schemas/NpsInput"
          Department: "#/components/schemas/DepartmentInput"
          Grade: "#/components/schemas/GradeInput"
      oneOf:
      - $ref: '#/components/schemas/TextFieldInput'
      - $ref: '#/components/schemas/TextAreaInput'
      - $ref: '#/components/schemas/NumberFieldInput'
      - $ref: '#/components/schemas/EmailFieldInput'
      - $ref: '#/components/schemas/MobileFieldInput'
      - $ref: '#/components/schemas/IdCardFieldInput'
      - $ref: '#/components/schemas/NameFieldInput'
      - $ref: '#/components/schemas/RadioButtonInput'
      - $ref: '#/components/schemas/CheckBoxInput'
      - $ref: '#/components/schemas/DropDownInput'
      - $ref: '#/components/schemas/DateTimeFieldInput'
      - $ref: '#/components/schemas/RatingFieldInput'
      - $ref: '#/components/schemas/TableFieldInput'
      - $ref: '#/components/schemas/TelephoneFieldInput'
      - $ref: '#/components/schemas/AddressFieldInput'
      - $ref: '#/components/schemas/AttachmentFieldInput'
      - $ref: '#/components/schemas/GeoFieldInput'
      - $ref: '#/components/schemas/LinkFieldInput'
      - $ref: '#/components/schemas/NpsFieldInput'
      - $ref: '#/components/schemas/TimeFieldInput'
      - $ref: '#/components/schemas/SortFieldInput'
      - $ref: '#/components/schemas/ESignatureFieldInput'
      - $ref: '#/components/schemas/AudioFieldInput'
      - $ref: '#/components/schemas/CascadeDropDownInput'
      - $ref: '#/components/schemas/LikertFieldInput'
      - $ref: '#/components/schemas/MatrixFieldInput'
      - $ref: '#/components/schemas/MatrixScaleFieldInput'
      - $ref: '#/components/schemas/GoodsFieldInput'
      - $ref: '#/components/schemas/FormulaFieldInput'
      - $ref: '#/components/schemas/ReservationFieldInput'
      - $ref: '#/components/schemas/FormAssociationInput'
      - $ref: '#/components/schemas/ImageRadioButtonInput'
      - $ref: '#/components/schemas/ImageCheckBoxInput'
      - $ref: '#/components/schemas/SectionBreakInput'
      - $ref: '#/components/schemas/PageBreakInput'
      - $ref: '#/components/schemas/WidgetButtonInput'
      - $ref: '#/components/schemas/WidgetContactInput'
      - $ref: '#/components/schemas/WidgetMapInput'
      - $ref: '#/components/schemas/WidgetMarqueeInput'
      - $ref: '#/components/schemas/SingleSelectInput'
      - $ref: '#/components/schemas/MultiSelectInput'
      - $ref: '#/components/schemas/ImageSingleSelectInput'
      - $ref: '#/components/schemas/ImageMultiSelectInput'
      - $ref: '#/components/schemas/TrueOrFalseInput'
      - $ref: '#/components/schemas/DropDownSelectInput'
      - $ref: '#/components/schemas/FillInBlankInput'
      - $ref: '#/components/schemas/ShortAnswerInput'
      - $ref: '#/components/schemas/FillInNumberInput'
      - $ref: '#/components/schemas/RatingInput'
      - $ref: '#/components/schemas/NpsInput'
      - $ref: '#/components/schemas/DepartmentInput'
      - $ref: '#/components/schemas/GradeInput'
      title: FieldInput
    ChoiceInput:
      type: object
      title: ChoiceInput
      additionalProperties: false
      description: A choice; value and name mean the same, give either
      anyOf:
      - required:
        - value
      - required:
        - name
      properties:
        value:
          type: string
          description: Choice label
        name:
          type: string
          description: Same as value
        api_code:
          type: string
          description: The choice api_code; generated by the server when left out, and keeps the identity of the choice on edit
        quota:
          type: integer
          minimum: 1
          description: Maximum number of places; leave out for no limit
        operand_value:
          type: number
          description: Numeric value of the choice
        selected:
          type: boolean
          description: Selected by default
        is_other:
          type: boolean
          description: Make this the "Other" choice (choosing it shows a text box); its text is kept as written. A choice whose text is exactly `其他` or `其它` needs no flag. Only for RadioButton / CheckBox / DropDown
    DimensionInput:
      type: object
      title: DimensionInput
      additionalProperties: false
      description: A column of a MatrixField or TableField
      required:
      - type
      - label
      properties:
        type:
          type: string
          enum:
          - TextField
          - TextArea
          - MobileField
          - CheckBox
          - DropDown
          - NumberField
          - DateTimeField
          - TimeField
          - AttachmentField
          - IdCardField
          - EmailField
          description: Column type
        label:
          type: string
          pattern: "\\S"
          description: Column name
        api_code:
          type: string
        cid:
          type: string
        required:
          type: boolean
          description: Required
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceInput'
          description: Choices of a choice column
    StatementInput:
      type: object
      title: StatementInput
      additionalProperties: false
      required:
      - label
      properties:
        label:
          type: string
          pattern: "\\S"
          description: Statement text
        api_code:
          type: string
          description: Keeps the identity on edit
    GoodsItemInput:
      type: object
      title: GoodsItemInput
      additionalProperties: false
      description: A goods item
      required:
      - name
      - layout
      properties:
        name:
          type: string
          description: Goods name
        layout:
          type: string
          enum:
          - without_images
          - price_only
          - images
          - text_options
          description: Layout
        api_code:
          type: string
          description: Keeps the identity of the item on edit; when left out, an existing item is matched by name
        description:
          type: string
          description: Goods description
        position:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        price:
          type: number
          minimum: 0
        original_price:
          type: number
          minimum: 0
          description: Original price, shown struck through
        predefined_number:
          type: integer
          minimum: 0
          description: Default quantity
        fixed_number:
          type: boolean
          description: The quantity cannot be changed
        inventory:
          type: integer
          minimum: 0
          description: Stock; with specifications, set it on each sku instead
        inventory_reset:
          type: boolean
        min_purchase_quantity:
          type: integer
          minimum: 0
        max_purchase_quantity:
          type: integer
          minimum: 0
        dimensions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - options
            properties:
              api_code:
                type: string
                description: Keeps the identity on edit
              label:
                type: string
                description: Dimension name, such as `尺寸`
              options:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - label
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                      description: Generated when left out; customized marks a custom amount option
          description: Specification dimensions
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - specification
            properties:
              specification:
                type: object
                additionalProperties:
                  type: string
                description: Keyed by dimension api_code or name; each value is an option value or name
              price:
                type: number
                minimum: 0
              original_price:
                type: number
                minimum: 0
              inventory:
                type: integer
                minimum: 0
              inventory_reset:
                type: boolean
              min_purchase_quantity:
                type: integer
                minimum: 0
              max_purchase_quantity:
                type: integer
                minimum: 0
          description: Specification combinations; specification must name one option for every dimension
        image_urls:
          type: array
          items:
            type: string
            format: uri
          description: Goods image URLs for layout=images
        image_base64s:
          type: array
          items:
            type: string
          description: Base64 goods images for layout=images
      dependentRequired:
        dimensions:
        - skus
        skus:
        - dimensions
      allOf:
      - description: The price_only / text_options layouts require specifications
        if:
          properties:
            layout:
              enum:
              - price_only
              - text_options
        then:
          required:
          - dimensions
          - skus
      - description: The images layout needs at least one image
        if:
          properties:
            layout:
              const: images
        then:
          anyOf:
          - required:
            - image_urls
            properties:
              image_urls:
                minItems: 1
          - required:
            - image_base64s
            properties:
              image_base64s:
                minItems: 1
    ReservationItemInput:
      type: object
      title: ReservationItemInput
      additionalProperties: false
      description: A reservation item
      required:
      - name
      properties:
        name:
          type: string
        api_code:
          type: string
          description: Keeps the identity of the item on edit; when left out, an existing item is matched by name
        description:
          type: string
        position:
          type: integer
          minimum: 0
        hidden:
          type: boolean
        selected:
          type: boolean
        payable:
          type: boolean
          description: Requires payment (depends on the plan and the price of each time slot)
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        quota_setting:
          type: object
          description: Quota settings, branched on type
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - by_day_repeat_weekly
              - by_time_range_repeat_daily
          discriminator:
            propertyName: type
            mapping:
              by_day_repeat_weekly: "#/components/schemas/ReservationByDayQuotaInput"
              by_time_range_repeat_daily: "#/components/schemas/ReservationByTimeRangeQuotaInput"
          oneOf:
          - $ref: '#/components/schemas/ReservationByDayQuotaInput'
          - $ref: '#/components/schemas/ReservationByTimeRangeQuotaInput'
    FormSettingWriteInput:
      type: object
      description: |
        The `setting` used when creating / editing a form. Only the keys below are accepted; other keys are ignored. A write describes the resulting state: omitted keys keep their current values, and `null` clears a key.
        - Passing only `success_message` automatically sets `success_message_style` to `text`; passing only `success_message_rich_text` sets it to `rich_text`.
        - `submission_region_limited=true` requires a plan that includes "Submission region limit" and at least one item in `submission_regions`.
        - `merchant_account_id` (小金商户) cannot be bound together with `wxpay_account_id` / `alipay_account_id`; a newly passed payment account must belong to the current account, and once bound, `payment_way` becomes `third_party` automatically.
        - `notification_rules` replaces all notification rules created through the API as a whole (`[]` clears them); rules created in the desktop UI are not affected.
      properties:
        success_message:
          type: string
        success_message_rich_text:
          type: string
        success_message_style:
          type: string
          enum:
          - text
          - rich_text
        entry_submit_mode:
          type: string
          enum:
          - show_message
          - redirect
          - reports
          - exam_score
        success_redirect_url:
          type: string
        success_redirect_fields:
          type: array
          items:
            type: string
        open_entry_action:
          type: string
          enum:
          - hide
          - view
          - edit
        open_entry_message:
          type: string
        open_entry_cancel_reservation:
          type: boolean
        show_serial_number_on_success:
          type: boolean
        show_submit_again:
          type: boolean
        hide_login_and_signup:
          type: boolean
        show_close_count_down:
          type: boolean
        show_form_before_open:
          type: boolean
        manually_close_rule:
          type:
          - object
          - 'null'
          properties:
            closed:
              type: boolean
          additionalProperties: false
        by_time_range_close_rule:
          type:
          - object
          - 'null'
          properties:
            start_time:
              type: string
              format: date-time
            end_time:
              type: string
              format: date-time
          additionalProperties: false
        by_entries_close_rule:
          type:
          - object
          - 'null'
          properties:
            limit:
              type: integer
          additionalProperties: false
        fill_frequency:
          type:
          - object
          - 'null'
          description: Accepts only `condition` `fill_type` `cycle_period` `limited_time` `cycles_per_period` `limited_field_api_codes`
          properties:
            fill_type:
              type: string
              enum:
              - unlimited
              - once
              - repeatable
              - repeatable_by_day
              - custom_repeatable
            condition:
              type: string
              enum:
              - by_weixin
              - by_ip
              - by_device
              - by_fields
            cycle_period:
              type: string
              enum:
              - every_hour
              - every_day
              - every_week
              - every_month
            cycles_per_period:
              type: integer
              minimum: 1
              maximum: 1000
            limited_time:
              type: integer
            limited_field_api_codes:
              type: array
              items:
                type: string
          additionalProperties: false
        show_field_number:
          type: boolean
        password_required:
          type: boolean
        access_password:
          type: string
        allowed_audience:
          type: string
          enum:
          - public
          - internal
          - private
          - weixin_qiye_followers_only
          - weixin_followers_only
          - submitter_only
          - gd_user_only
        weixin_limited:
          type: boolean
        submission_region_limited:
          type: boolean
        submission_regions:
          type: array
          items:
            type: string
        merchant_account_id:
          type:
          - string
          - 'null'
        wxpay_account_id:
          type:
          - string
          - 'null'
        alipay_account_id:
          type:
          - string
          - 'null'
        notification_rules:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRuleInput'
        daily_repeat_close_rule:
          $ref: '#/components/schemas/DailyRepeatCloseRuleInput'
      additionalProperties: false
    NotificationRuleInput:
      type: object
      required:
      - approach
      - url
      properties:
        approach:
          type: string
          enum:
          - WXWORK
          - DING_TALK
          - WEBHOOK
          description: Notification channel (case-insensitive)
        url:
          type: string
          format: uri
          description: Bot / webhook URL
        content:
          type: string
          description: Notification content template
        trigger_scope:
          type: string
          default: all_new
        mentioned_mobile_list:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
      additionalProperties: false
    FormUpdateInput:
      type: object
      description: Contains at least one of `name` / `description` / `fields` / `setting` / `field_rules`
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        setting:
          $ref: '#/components/schemas/FormSettingWriteInput'
        fields:
          type: object
          description: Incremental field operations; they take effect only when at least one sub-key is non-empty
          properties:
            add:
              type: array
              description: Fields to add; each may carry `position` (0-based) to set where it is inserted, otherwise it is appended at the end
              items:
                anyOf:
                - $ref: '#/components/schemas/FieldInput'
                - $ref: '#/components/schemas/TableColumnInput'
            remove:
              type: array
              description: api_codes of the fields to remove; returns 400 when one does not exist
              items:
                type: string
            update:
              type: array
              items:
                $ref: '#/components/schemas/FieldUpdateInput'
            update_choices:
              type: array
              items:
                $ref: '#/components/schemas/ChoiceUpdateInput'
          additionalProperties: false
        field_rules:
          $ref: '#/components/schemas/FieldRuleOperations'
      additionalProperties: false
    FieldUpdateInput:
      type: object
      title: FieldUpdateInput
      additionalProperties: false
      description: Changes an existing field found by api_code, touching only the keys given. A type-specific attribute is accepted only on a type it applies to (the target type when the type changes); a wrong one is refused with the list of settings that type takes
      required:
      - api_code
      properties:
        api_code:
          type: string
          description: api_code of the field to change
        type:
          type: string
          enum:
          - TextField
          - TextArea
          - NumberField
          - EmailField
          - MobileField
          - IdCardField
          - NameField
          - RadioButton
          - CheckBox
          - DropDown
          - DateTimeField
          - RatingField
          - TableField
          - TelephoneField
          - AddressField
          - AttachmentField
          - GeoField
          - LinkField
          - NpsField
          - TimeField
          - SortField
          - ESignatureField
          - AudioField
          - CascadeDropDown
          - LikertField
          - MatrixField
          - MatrixScaleField
          - GoodsField
          - FormulaField
          - ReservationField
          - FormAssociation
          - ImageRadioButton
          - ImageCheckBox
          - SectionBreak
          - PageBreak
          - WidgetButton
          - WidgetContact
          - WidgetMap
          - WidgetMarquee
          description: Change the field to this type, keeping its api_code and entries and converting the values; a change that would clear data needs confirm_data_loss
        confirm_data_loss:
          type: boolean
          description: Accept that the type change clears data
        label:
          type: string
          description: Field label
        notes:
          type:
          - string
          - 'null'
          description: Field notes
        private:
          type: boolean
          description: Hidden field; a hidden field is not checked for required
        required:
          type: boolean
          description: Required
        unique:
          type: boolean
          description: Refuse duplicate values; takes effect only on TextField / NameField / EmailField / MobileField / TelephoneField / IdCardField / LinkField / FormAssociation / TextArea / NumberField
        other_choice_required:
          type: boolean
          description: Choosing the "Other" choice requires the extra text; takes effect only on RadioButton / CheckBox / DropDown
        position:
          type: integer
          minimum: 0
          description: Target position of the field in the form, from 0; appended at the end by default
        rating_max:
          type: integer
          minimum: 1
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CascadeChoiceInput'
          description: Accepted only for CascadeDropDown, or when a text field changes to a choice type; otherwise use update_choices
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DimensionInput'
          description: Replaces the whole list
        statements:
          type: array
          items:
            $ref: '#/components/schemas/StatementInput'
          description: Replaces the whole list; carry api_code to keep the identity of an item
        goods_items:
          type: array
          items:
            $ref: '#/components/schemas/GoodsItemUpdateInput'
          description: Replaces the whole list; carry api_code to keep the identity of an item. An existing item keeps whatever it leaves out, so a reorder lists just the api_codes in the new order
        reservation_items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItemInput'
          description: Replaces the whole list; carry api_code to keep the identity of an item
        display_field_api_codes:
          type: array
          maxItems: 20
          items:
            type: string
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnswerInput'
          description: Replaces all the answers
        answer_setting_mode:
          type: string
          enum:
          - absolute
          - partial_absolute
          - relative
        answer_explanation:
          type: string
        calculable:
          type: boolean
          description: Give each choice a numeric value; when on, every (leaf) choice must carry operand_value
        choices_layout:
          type: string
          description: How the choices are laid out
        random_choices:
          type: boolean
          description: Shuffle the choices each time the form opens
        minimum_length:
          type: integer
          minimum: 0
          description: Minimum number of choices; for a LikertField with likert_choice_style=multiple, the minimum per statement
        maximum_length:
          type: integer
          minimum: 0
          description: Maximum number of choices; for a LikertField with likert_choice_style=multiple, the maximum per statement
        predefined_value:
          description: 'Default value: a string for text fields, a date string matching the precision or today / yesterday / tomorrow for DateTimeField, an {"hour", "minute"} object for TimeField, an address object for AddressField'
        placeholder:
          type: string
          description: Placeholder text
        sms_verification:
          type: boolean
          description: Verify the number by SMS (this also turns on the image captcha)
        range_min:
          type: number
          description: Minimum value, inclusive
        range_max:
          type: number
          description: Maximum value, inclusive
        precision:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 14
          - type: string
            enum:
            - month
            - day
            - minute
            - second
          description: Decimal places for NumberField / FormulaField; a precision value for DateTimeField
        display_precision:
          type: integer
          minimum: 0
          description: Decimal places shown
        display_as_percentage:
          type: boolean
          description: Show as a percentage; cannot be combined with thousands_separator
        thousands_separator:
          type: boolean
          description: Show a thousands separator; cannot be combined with display_as_percentage
        currency_symbol:
          type: string
          description: Currency symbol
        currency_symbol_position:
          type: string
          enum:
          - prefix
          - suffix
          description: Where the currency symbol goes
        icon_type:
          type: string
          enum:
          - none
          - number-2
          - dollar1
          - cny1
          - formula-2
          - date-2
          - sum
          - text
          - text2
          description: Field icon
        changeable:
          type: object
          description: 'Which levels of the AddressField can be changed: keys province / city / district / street, boolean values'
          additionalProperties:
            type: boolean
        enable_auto_position:
          type: boolean
          description: Fill in the address from the device location when the form first opens
        max_size:
          type: integer
          minimum: 1
          maximum: 500
          description: Maximum size of one file, in MB
        max_file_quantity:
          type: integer
          minimum: 1
          description: Maximum number of files
        media_type:
          type: object
          additionalProperties: false
          description: 'Allowed file types: type is one preset group, whose extensions x-groups lists, or custom with the extensions listed in value. To allow several groups, write type=custom with the union of their extensions in value'
          x-groups:
            doc:
            - txt
            - pdf
            - doc
            - docx
            - xls
            - xlsx
            - ppt
            - pptx
            - wps
            - rtf
            - hlp
            image:
            - jpg
            - jpeg
            - png
            - gif
            - bmp
            - psd
            - tif
            - heic
            - heif
            video:
            - mkv
            - mp4
            - avi
            - swf
            - wmv
            - rmvb
            - mov
            - mpg
            audio:
            - mp3
            - flac
            - ape
            - wma
            - wav
            - aac
            - m4a
            - au
            - ram
            - mmf
            - aif
            compress:
            - rar
            - zip
            - 7z
            - gz
            - arj
            - z
          properties:
            type:
              type: string
              enum:
              - unlimited
              - doc
              - image
              - video
              - audio
              - compress
              - custom
            value:
              type: array
              items:
                type: string
              description: Lowercase extensions, without the dot
          if:
            properties:
              type:
                const: custom
            required:
            - type
          then:
            required:
            - value
            properties:
              value:
                minItems: 1
        mobile_camera_only:
          type: boolean
          description: On mobile, only a photo taken with the camera; picking from the photo library is not allowed
        minimum_ratings_display_text:
          type: string
          description: Text shown at the lowest rating
        maximum_ratings_display_text:
          type: string
          description: Text shown at the highest rating
        include_second:
          type: boolean
          description: Include seconds
        max_duration:
          type: integer
          minimum: 1
          maximum: 5
          description: Maximum recording length, in minutes
        levels:
          type: integer
          minimum: 2
          description: Number of levels of the cascading drop-down; every choice path must reach this depth
        choice_filterable:
          type: boolean
          description: Allow filtering the choices
        horizontal_on_mobile:
          type: boolean
          description: Lay out horizontally on mobile
        likert_choice_style:
          type: string
          enum:
          - single
          - multiple
          description: One choice (single) or several (multiple) per statement
        advanced_feature:
          type: boolean
          description: Turn on the advanced features
        unit:
          type: string
          maxLength: 2
          description: Unit of quantity, at most 2 characters
        collapse_on_mobile:
          type: boolean
          description: Collapse the goods list on mobile
        columns_on_mobile:
          type: integer
          minimum: 1
          description: Goods per row on mobile
        formula_display:
          type: string
          description: The formula as HTML; refer to a field as <gd-field data-cid="..."> or <gd-field data-api-code="...">
        result_display_type:
          type: string
          enum:
          - string
          - numeric
          - datetime
          description: How the result is shown
        result_display_as_date:
          type: boolean
          description: Older spelling of result_display_type=datetime
        allow_multiple_items:
          type: boolean
          description: One submission can book several items
        item_allow_multiple_reservations:
          type: boolean
          description: One item can be booked for several time slots
        allow_multiple_number:
          type: boolean
          description: Several places can be booked in one time slot
        use_daily_time_range:
          type: boolean
          description: Use a daily time slot table
        associated_form_token:
          type: string
          description: Token of the associated form
        associated_field_api_codes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
          description: api_code of the association key fields
        privacy_safe:
          type: boolean
          description: Show the associated fields with privacy masking everywhere
        allow_reverse_association:
          type: boolean
          description: Show the reverse association on the associated form
        reverse_display_field_api_codes:
          type: array
          items:
            type: string
          description: api_code of the fields the reverse association shows
        related_form_token:
          type: string
          description: Token of the related table; must be another table, and you need manage permission on it
        paired:
          type: boolean
          description: Two-way relation, on by default; when on, a reverse column is created in the related table
        related_label:
          type: string
          description: Name of the reverse column, used only when the reverse column is created; defaults to the name of this table
        show_split_line:
          type: boolean
          description: Show a divider line
        show_part_description:
          type: boolean
          description: Collapse the description when it is long
        disable_previous_page:
          type: boolean
          description: Hide the "Previous" button
        previous_page_text:
          type: string
          description: Text of the "Previous" button
        next_page_text:
          type: string
          description: Text of the "Next" button
        count_down:
          type: integer
          minimum: 0
          description: Seconds the "Next" button stays locked; 0 means not locked
        buttons_number:
          type: integer
          minimum: 1
          description: Number of buttons; must equal the length of buttons
        fixed_to_bottom:
          type: boolean
          description: Pin the button bar to the bottom of the page
        widget_max_images_number:
          type: integer
          minimum: 1
          description: Maximum number of images shown; at least the length of widget_images
        phones:
          type: array
          description: Contact phone numbers
          items:
            type: object
            required:
            - phone
            additionalProperties: false
            properties:
              phone:
                type: string
        nav_address:
          type: string
          description: Address text used for navigation
        longitude:
          type: number
          description: Longitude
        latitude:
          type: number
          description: Latitude
        value:
          type: string
          description: Value shown
        localizable_on_mobile:
          type: boolean
          description: On mobile, allow opening the location in a map
        lines:
          type: integer
          minimum: 1
          description: Number of scrolling lines
        entries_init_number:
          type: integer
          minimum: 0
          description: Submission count to start from
        entries_number_visible:
          type: boolean
          description: Show the submission count
        marquee_data_type:
          type: string
          enum:
          - fake
          - real
          description: 'Data source: fake for generated data, real for real entries'
      allOf:
      - description: display_as_percentage and thousands_separator cannot both be true
        not:
          properties:
            display_as_percentage:
              const: true
            thousands_separator:
              const: true
          required:
          - display_as_percentage
          - thousands_separator
      - description: With calculable=true, every choice needs an operand_value
        if:
          properties:
            calculable:
              const: true
          required:
          - calculable
        then:
          properties:
            choices:
              items:
                required:
                - operand_value
    ChoiceUpdateInput:
      type: object
      required:
      - field_api_code
      description: Incremental changes to the choices of a choice field (or of a choice column in a matrix / table field); returns 400 when the field does not exist or does not support choices
      properties:
        field_api_code:
          type: string
        add:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceInput'
        remove:
          type: array
