            city:
              type:
              - string
              - 'null'
    ThemeInput:
      type: object
      description: Request body of PATCH /forms/{form_token}/theme; contains at least one theme operation key
      properties:
        primary_color:
          type: string
          description: Theme color of the buttons and of selected choices, e.g. "#FBBF24"
        secondary_color:
          type: string
          deprecated: true
          description: Deprecated; not shown on the form.
        dominant_color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: |-
            The color the form's text sits on, as a 6-digit hex color, e.g. "#1E3A8A". Only whether it is light (WCAG relative luminance above 0.179) or dark matters: a dark one puts the form in dark mode and turns the header, field label and choice text white, a light one turns them black.
            Pass it whenever you change `wallpaper` or `form_container.background_color`; otherwise the form keeps its current light or dark look. Work it out from what shows behind the text: on a card layout, the page background color or the main color of the background image; on other layouts, the form container's color, mixed with the page background as far as the container is see-through. If you cannot see the background image, leave `dominant_color` out rather than guess.
        wallpaper:
          type: object
          description: Page background, either a color or an image; setting only one of them removes the other, along with the preset background image that comes with the theme template
          properties:
            background_color:
              type: string
            background_image_url:
              type: string
              description: The server fetches this URL and uses it as the background image
            background_image_attachment_id:
              type:
              - string
              - 'null'
              description: attachment_id returned by "Upload a form image" (image_type=wallpaper); an empty string removes the current background image. Lower priority than background_image_url
          additionalProperties: false
        header:
          type: object
          description: Header
          properties:
            type:
              type: string
              enum:
              - none
              - text
              - image
              - carousel
              description: When omitted, follows what is passed with it, `image` for a header image and `carousel` for `carousel_images`
            text:
              type: string
              description: Header text
            background_color:
              type: string
            text_style:
              type: object
              description: Text style; keys use underscores (e.g. font_size, text_align) and are merged into the existing style
              additionalProperties:
                type: string
            header_image_url:
              type: string
              description: The server fetches this URL and uses it as the header image
            header_image_base64:
              type: string
              description: Base64-encoded header image; takes precedence over header_image_url
            carousel_images:
              type: array
              minItems: 1
              maxItems: 5
              description: Carousel images; replaced as a whole and shown in array order
              items:
                type: object
                description: Provide one of image_url / attachment_id
                properties:
                  image_url:
                    type: string
                  attachment_id:
                    type: string
                    description: An existing carousel image of this form, or the `attachment_id` returned by "Upload a form image" (image_type carousel)
                additionalProperties: false
            header_image_attachment_id:
              type:
              - string
              - 'null'
              description: attachment_id returned by "Upload a form image" (image_type=header); an empty string removes the current header image. Lowest priority
          additionalProperties: false
        typography:
          type: object
          description: Typography; keys use underscores and are merged into the existing style. A color given here wins over the one `dominant_color` sets
          properties:
            form_header:
              type: object
              additionalProperties:
                type: string
            field_label:
              type: object
              additionalProperties:
                type: string
            choice_style:
              type: object
              additionalProperties:
                type: string
          additionalProperties: false
        form_container:
          type: object
          properties:
            background_color:
              type: string
            border_color:
              type: string
              description: Border color of the form container, e.g. "#E5E7EB"
            border_width:
              type: string
              description: Border width of the form container, e.g. "1px"
          additionalProperties: false
        submit_button:
          type: object
          description: Buttons; color and font size apply to every button on the form
          properties:
            background_color:
              type: string
              deprecated: true
              description: Deprecated alias of `primary_color`; use `primary_color`.
            color:
              type: string
            font_size:
              type: string
              description: e.g. "16px"
          additionalProperties: false
        generate_header_image:
          type: object
          description: Generates a header image with AI and sets it as the header image; uses AI points
          properties:
            prompt:
              type: string
              description: Prompt for the image; when omitted, AI writes one from the form's content
          additionalProperties: false
      additionalProperties: false
    FormTheme:
      type: object
      description: Response after the theme is updated
      required:
      - form_token
      - primary_color
      - secondary_color
      - dominant_color
      - wallpaper
      - header
      - typography
      - form_container
