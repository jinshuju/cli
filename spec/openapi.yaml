    ViewUnprocessableError:
      type: object
      required:
      - error_description
      properties:
        error_description:
          type: string
          description: 错误说明，多个校验错误以逗号拼接
    FormViewSortRule:
      type: object
      required:
      - api_code
      properties:
        api_code:
          type: string
          description: 排序字段 api_code
        order:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: 排序方向
    FormViewFilterCondition:
      type: object
      required:
      - field
      - operator
      properties:
        field:
          type: string
          description: 字段 api_code（也接受 api_code / trigger 作为键名）
        operator:
          type: string
          description: 运算符，与数据列表 filters 相同：eq、ne、any_in、none_in、between、not_between、null、not_null、gte、gt、lte、lt、like、not_like、match、within_last； 别名 start / end / equal / not_equal 分别等价于 gte / lte / eq / ne。每种字段支持的子集以服务端为准。 选项类字段的 eq / ne 保存时会转为 any_in / none_in 且值转为数组。
        value:
          description: '条件值，类型随字段与运算符而定：between 为两元素数组；within_last 为 {"unit": "day", "n": 30}（unit 可为 minute / day / week / month）； 选项类字段可传选项 api_code 或选项文本，"null" 表示未填写；null / not_null 无需 value。'
    FormView:
      type: object
      required:
      - token
      - name
      - view_type
      - position
      - predefined
      - visibility
      - view_scope
      - prefer_columns
      - sorted_columns
      - kanban_group_by_api_code
      - kanban_card_title_api_code
      - kanban_group_order
      - kanban_hidden_groups
      - grid_frozen_boundary_api_code
      - sort
      - filter
      - created_at
      - updated_at
      properties:
        token:
          type: string
          description: 视图 token
        name:
          type: string
          description: 视图名称
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: 视图类型；form 为表单视图（对外填写页，仅表格支持）
        position:
          type: integer
          description: 排序位置
        predefined:
          type: boolean
          description: 是否为预置视图（不可删除）
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: 可见性，cooperators 对全部协作者可见，personal 仅创建者可见
        view_scope:
          type: string
          enum:
          - user
          - form
          description: 视图归属，form 表示属于表单本身（不可删除、不可切换可见性）
        prefer_columns:
          type: array
          description: 显示的字段 api_code 列表
          items:
            type: string
        sorted_columns:
          type: array
          description: 列显示顺序，按 position 升序
          items:
            type: object
            required:
            - api_code
            - position
            properties:
              api_code:
                type: string
                description: 字段 api_code
              position:
                type: integer
                description: 列位置，从 1 开始
        kanban_group_by_api_code:
          type:
          - string
          - 'null'
          description: 看板分组字段 api_code
        kanban_card_title_api_code:
          type:
          - string
          - 'null'
          description: 看板卡片标题字段 api_code，未设置时由服务端根据 prefer_columns 推算
        kanban_group_order:
          type: array
          description: 看板分组显示顺序（分组选项 api_code，__unset__ 表示未设置分组）
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: 隐藏的看板分组（同 kanban_group_order 的取值）
          items:
            type: string
        grid_frozen_boundary_api_code:
          type:
          - string
          - 'null'
          description: 表格视图冻结列边界字段 api_code
        sort:
          type: array
          description: 排序规则
          items:
            type: object
            required:
            - api_code
            - order
            properties:
              api_code:
                type: string
                description: 排序字段 api_code
              order:
                type: string
                enum:
                - asc
                - desc
                description: 排序方向
        filter:
          type: array
          description: 筛选条件，无筛选时为空数组
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        title:
          type:
          - string
          - 'null'
          description: 填写页标题（仅表单视图返回）
        description:
          type:
          - string
          - 'null'
          description: 填写页描述（仅表单视图返回）
        published:
          type: boolean
          description: 是否已发布；未发布时填写链接不可用（仅表单视图返回）
        fill_url:
          type: string
          format: uri
          description: 对外填写链接（仅表单视图返回）
        fill_items:
          type: array
          description: 填写页上勾选的填写项，按填写页顺序，值为生效值（仅表单视图返回）
          items:
            $ref: '#/components/schemas/FormViewFillItem'
    FormViewInput:
      type: object
      description: 创建 / 更新视图的请求体，只有出现的键会被更新
      properties:
        name:
          type: string
          maxLength: 120
          description: 视图名称，不能为空
        view_type:
          type: string
          enum:
          - grid
          - kanban
          - stats
          - form
          description: 视图类型，创建时默认 grid；form 为表单视图（对外填写页），仅表格支持
        visibility:
          type: string
          enum:
          - cooperators
          - personal
          description: 可见性，创建时默认 cooperators；更新时只有创建者可切换
        prefer_columns:
          type: array
          description: 显示的字段 api_code 列表
          items:
            type: string
        kanban_group_by_api_code:
          type: string
          description: 看板分组字段 api_code，必须是支持看板分组的字段
        kanban_card_title_api_code:
          type: string
          description: 看板卡片标题字段 api_code
        kanban_group_order:
          type: array
          description: 看板分组显示顺序，元素须为非空且不重复的字符串
          items:
            type: string
        kanban_hidden_groups:
          type: array
          description: 隐藏的看板分组，元素须为非空且不重复的字符串；传空数组表示显示全部分组
          items:
            type: string
        sort:
          type: array
          description: 排序规则，整体替换
          items:
            $ref: '#/components/schemas/FormViewSortRule'
        sorted_columns:
          type: array
          description: 列显示顺序，整体替换，position 按数组顺序从 1 生成
          items:
            type: object
            required:
            - api_code
            properties:
              api_code:
                type: string
                description: 字段 api_code
            additionalProperties: false
        filter:
          type: array
          description: 筛选条件数组，整体替换；传空数组清空筛选；不是数组时返回 422
          items:
            $ref: '#/components/schemas/FormViewFilterCondition'
        title:
          type: string
          maxLength: 120
          description: 填写页标题，不能为空；创建时缺省为表格名称。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
        description:
          type:
          - string
          - 'null'
          description: 填写页描述。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
        published:
          type: boolean
          description: 是否发布填写页，创建时缺省 false。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
        field_overrides:
          type: array
          description: 填写项配置，整体替换；创建时不传则按当前列顺序勾选全部可填写的列。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
          items:
            $ref: '#/components/schemas/FormViewFieldOverrideInput'
        cid:
          type: string
          description: 客户端标识，随实时变更广播透传（以服务端实现为准）
      additionalProperties: false
    EntryCommentMention:
      type: object
      required:
      - user_id
      - user_name
      properties:
        user_id:
          type: string
          description: 被提及用户 id
        user_name:
          type: string
          description: 被提及用户在提及时的显示名
    EntryCommentAttachment:
      type: object
      required:
      - id
      - file_name
      - content_type
      - file_size
      - url
      properties:
        id:
          type: string
          description: 附件 id
        file_name:
          type: string
          description: 文件名
        content_type:
          type:
          - string
          - 'null'
          description: MIME 类型
        file_size:
          type: integer
          description: 文件大小（字节）
        url:
          type: string
          description: 下载地址（私有链接，带时效签名）
    EntryComment:
      type: object
      description: 数据评论。每条评论最多 3 个附件，单个不超过 5 MB，允许的扩展名：jpg、jpeg、png、bmp、webp、heic、doc、docx、xls、xlsx、csv、ppt、pptx、pdf、txt、mp4、mov。
      required:
      - id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: 评论 id
        content:
          type: string
          description: 评论内容，提及以 @[<user_id>] 形式出现；仅有附件时可能缺省
        creator:
          type: object
          description: 评论者；评论者信息缺失时缺省
          required:
          - id
          - name
          properties:
            id:
              type: string
              description: 用户 id
            name:
              type: string
              description: 用户显示名，账号已删除时为「账号已注销」类占位文案
        parent_id:
          type: string
          description: 被回复的评论 id，非回复时缺省
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        mentions:
          type: array
          description: 被提及的协作者，无提及时缺省
          items:
            $ref: '#/components/schemas/EntryCommentMention'
        attachments:
          type: array
          description: 附件，按上传时间升序，无附件时缺省
          items:
            $ref: '#/components/schemas/EntryCommentAttachment'
    EntryCommentInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
          description: 评论内容，去除首尾空白后不能为空；用 @[<user_id>] 提及协作者（user_id 为 24 位十六进制）
        parent_id:
          type: string
          description: 回复的父评论 id，必须属于同一条数据；仅创建时读取
      additionalProperties: false
    OpensearchSearchFieldSetting:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: 查询字段 api_code，必须是表单可查询的字段
        field_label:
          type:
          - string
          - 'null'
          description: 对外显示的字段标签，为空时用字段原标签
        fuzzy:
          type: boolean
          default: false
          description: 是否模糊匹配
        sms_verification:
          type: boolean
          default: false
          description: 是否需要短信验证（仅对手机字段生效）
    OpensearchSearchFieldRule:
      type: object
      required:
      - search_field_settings
      properties:
        operand:
          type: string
          enum:
          - and
          - or
          default: and
          description: 规则内各查询字段的组合方式
        search_field_settings:
          type: array
          minItems: 1
          description: 查询字段设置，不能为空
          items:
            $ref: '#/components/schemas/OpensearchSearchFieldSetting'
    OpensearchDisplayFieldRule:
      type: object
      required:
      - field_api_code
      properties:
        field_api_code:
          type: string
          description: 展示字段 api_code，必须是表单可展示的字段
        field_label:
          type:
          - string
          - 'null'
          description: 对外显示的字段标签，为空时用字段原标签
        editable:
          type: boolean
          default: false
          description: 查询者是否可在结果页编辑该字段
        protected:
          type: boolean
          default: false
          description: 是否隐私保护（脱敏显示，仅对支持隐私保护的字段生效）
        highlight:
          type:
          - object
          - 'null'
          description: 高亮设置，未设置时为 null
          properties:
            color:
              type:
              - string
              - 'null'
              description: 高亮颜色
            position:
              type: integer
              default: 999
              description: 高亮排序位置
    OpensearchQuerySummary:
      type: object
      required:
      - token
      - url
      - name
      - enabled
      - form_token
      - created_at
      - searches_count
      - views_count
      properties:
        token:
          type: string
          description: 对外查询 token
        url:
          type: string
          description: 对外查询公开访问地址（/os/{token}，使用账户子域名或自定义域名）
        name:
          type: string
          description: 名称
        enabled:
          type: boolean
          description: 是否启用
        form_token:
          type:
          - string
          - 'null'
          description: 所属表单 token，表单已删除时为 null
        created_at:
          type: string
          format: date-time
          description: 创建时间
        searches_count:
          type: integer
          description: 累计查询次数
        views_count:
          type: integer
          description: 累计访问次数
    OpensearchQuery:
      allOf:
      - $ref: '#/components/schemas/OpensearchQuerySummary'
      - type: object
        required:
        - description
        - status
        - search_field_rules
        - display_field_rules
        - messages
        - default_messages
        - search_button
        - allow_to_export_results
        - header
        - updated_at
        properties:
          description:
            type:
            - string
            - 'null'
            description: 说明文字
          status:
            type: string
            enum:
            - active
            - entries_count_limited
            - form_not_found
            description: 状态：active 可用；entries_count_limited 表单数据量超过套餐对外查询上限；form_not_found 表单已删除
          search_field_rules:
            type: array
            description: 查询字段规则
            items:
              allOf:
              - $ref: '#/components/schemas/OpensearchSearchFieldRule'
              - type: object
                required:
                - operand
          display_field_rules:
            type: array
            description: 展示字段规则
            items:
              allOf:
              - $ref: '#/components/schemas/OpensearchDisplayFieldRule'
              - type: object
                required:
                - field_label
                - editable
                - protected
                - highlight
          messages:
            type:
            - object
            - 'null'
            description: 已保存的提示文案原始值，未自定义时为空对象或 null
            properties:
              has_result:
                type: string
                description: 查到结果时的提示
              no_result:
                type: string
                description: 未查到结果时的提示
          default_messages:
            type: object
            description: 合并产品默认文案后的提示文案（按表单语言）
            required:
            - has_result
            - no_result
            properties:
              has_result:
                type: string
                description: 查到结果时的提示
              no_result:
                type: string
                description: 未查到结果时的提示
          search_button:
            type: object
            description: 查询按钮设置，未设置时为空对象
            properties:
              text:
                type: string
                description: 按钮文字
              color:
                type: string
                description: 按钮颜色
          allow_to_export_results:
            type: boolean
            description: 是否允许查询者导出结果
          header:
            type: object
            description: 页头设置
            required:
            - background_image
            properties:
              background_image:
                type:
                - object
                - 'null'
                description: 页头背景图，未设置时为 null
                required:
                - attachment_id
                - position_x
                - position_y
                - image_url
                properties:
                  attachment_id:
                    type: string
                    description: 背景图附件 id
                  position_x:
                    type:
                    - number
                    - 'null'
                    description: 背景图横向位置
                  position_y:
                    type:
                    - number
                    - 'null'
                    description: 背景图纵向位置
                  image_url:
                    type:
                    - string
                    - 'null'
                    description: 背景图地址
          updated_at:
            type: string
            format: date-time
            description: 更新时间
    OpensearchQueryInput:
      type: object
      description: 创建 / 更新对外查询的请求体，只有出现的键会被更新
      properties:
        form_token:
          type: string
          description: 仅创建时使用：所属表单的 token（也可作为 query 参数传递）
        name:
          type: string
          description: 名称，不能为空
        description:
          type: string
          description: 说明文字
        enabled:
          type: boolean
          description: 是否启用
        search_field_rules:
          type: array
          minItems: 1
          description: 查询字段规则，整体替换；传入时不能为空数组，每条规则的 search_field_settings 不能为空
          items:
            $ref: '#/components/schemas/OpensearchSearchFieldRule'
        display_field_rules:
          type: array
          minItems: 1
          description: 展示字段规则，整体替换；传入时不能为空数组
          items:
            $ref: '#/components/schemas/OpensearchDisplayFieldRule'
        search_button:
          type: object
          description: 查询按钮设置，只读取 text 与 color
          properties:
            text:
              type: string
              description: 按钮文字
            color:
              type: string
              description: 按钮颜色
          additionalProperties: false
        messages:
          type: object
          description: 提示文案，只读取 has_result 与 no_result；缺省的键使用产品默认文案
          properties:
            has_result:
              type: string
              description: 查到结果时的提示
            no_result:
              type: string
              description: 未查到结果时的提示
          additionalProperties: false
        allow_to_export_results:
          type: boolean
          description: 是否允许查询者导出结果
        header:
          type: object
          description: 页头设置，只读取 background_image 的 attachment_id、image_upload_token、position_x、position_y（以服务端实现为准）
          properties:
            background_image:
              type: object
              properties:
                attachment_id:
                  type: string
                  description: 背景图附件 id，由「上传表单图片」（`POST /form_image_attachments`，`image_type=opensearch_header`）返回
                image_upload_token:
                  type: string
                  description: 代替 attachment_id：以 `form_image_token`（用途为 opensearch_header）上传后，直接传这个令牌。令牌须已上传、未过期、属于调用者且用途为 opensearch_header，否则返回 400
                position_x:
                  type: number
                  description: 背景图横向位置
                position_y:
                  type: number
                  description: 背景图纵向位置
              additionalProperties: false
          additionalProperties: false
        extra_configurable_setting:
          type: object
          description: 额外设置（以服务端实现为准）
          properties:
            show_exam_correct_answer:
              type: boolean
              description: 是否显示考试正确答案
            show_exam_explanation:
              type: boolean
              description: 是否显示考试解析
          additionalProperties: false
        scope_conditions:
          type: array
          description: 限定可查询数据范围的条件，需要套餐支持，否则返回 400；每项只读取 trigger、operator、value、group_index、scope_attr
          items:
            type: object
            properties:
              trigger:
                type: string
                description: 触发字段 api_code
              operator:
                type: string
                description: 运算符（以服务端实现为准）
              value:
                description: 条件值
              group_index:
                type: integer
                description: 条件分组序号，同组为 and，不同组为 or
              scope_attr:
                type: string
                description: 条件作用的属性（以服务端实现为准）
            additionalProperties: false
      additionalProperties: false
    OpensearchQuerySuggestion:
