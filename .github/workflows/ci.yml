name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents and CLI bins
        shell: bash
        run: |
          set -euo pipefail

          packed_tgz="$(npm pack --json | node -e "let s = ''; process.stdin.on('data', d => s += d).on('end', () => process.stdout.write(JSON.parse(s)[0].filename))")"
          prefix="$(mktemp -d)"

          npm install -g "./${packed_tgz}" --prefix "${prefix}"

          test -x "${prefix}/bin/jinshuju"
          test -x "${prefix}/bin/jsj"
          test -f "${prefix}/lib/node_modules/@jinshuju/cli/dist/cli-bin.js"

          "${prefix}/bin/jinshuju" --help
          "${prefix}/bin/jsj" --help
